<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Areo Workspace | סיכונים</title>
<!--
תבנית קנונית v3 (14.10.2026) של דוח הסיכונים: Areo Workspace | סיכונים, הדוח הקצר (6 עד 8 עמודי A4, בלי נספח הציטוטים).
בהדפסה אין position:fixed: סימון החיסיון מודפס בתיבות השוליים של @page (בראש ובתחתית כל עמוד), ופס הסימון שבראש הדוח נשאר בזרימה הרגילה.
כללי התבנית (מחייבים, ראו SKILL.md ו-references/risk-register-schema.md):
1. התבנית עיוורת ללקוח: אפס שמות, אפס דוגמאות ענפיות. כל התוכן מגיע מהזרקת הנתונים בלבד.
2. קובץ risk-register.json הוא מקור האמת. ה-HTML הוא תצוגה לקריאה ולהדפסה, בלי כפתורי החלטה ובלי ייצוא החלטות.
3. דו-לשוני: display_language במטא קובע he (RTL) או en (LTR). אין טקסט קשיח מחוץ למילון L ולתוויות שבכל פרק.
4. המבנה קבוע: עמוד ראשון, פרקים 1 עד 5 ונספח ציטוטים מילוליים.
5. אפס תלות ברשת: גופני מערכת עבריים בלבד, בלי טעינת גופן מהרשת, בלי ספריות חיצוניות ובלי שום בקשה לכתובת חיצונית. הלוגו הוא תמונה מוטמעת.
סכמת הנתונים מוגדרת רק ב-references/risk-register-schema.md, ברשימת "חוזה השדות". אין כאן עותק שלה, כדי שלא יהיו שני מקורות.
מציין המיקום להזרקה מופיע פעם אחת בלבד בקובץ, בשורת const DATA.
ההערה נסגרת בשורה הבאה. בלי הסגירה כל הקובץ נבלע בהערה, והדוח מוצג כעמוד ריק.
-->
<style>
:root{
  color-scheme: dark;
  --bg:#0E1016; --surface:#151923; --surface2:#1A1F2B;
  --ink:#F2F4F7; --ink2:#DDE1E8; --muted:#8B93A3; --faint:#6A7383;
  --line:#252B37; --line2:#2F3646;
  --brand:#2FE6A6; --brand2:#0DA678;
  --grad:linear-gradient(120deg,#2FE6A6,#0DA678);
  --gradm:linear-gradient(120deg,#2FE6A6,#0DA678);
  --mint:#2FE6A6; --mint2:#0DA678; --navy:#F2F4F7;
  --accent:#2FE6A6; --accent-soft:rgba(47,230,166,.12);
  --green:#2FE6A6; --green-bg:rgba(47,230,166,.10); --green-line:rgba(47,230,166,.32);
  --yellow:#FFC44D; --yellow-bg:rgba(255,196,77,.10); --yellow-line:rgba(255,196,77,.32);
  --red:#FF7A7A; --red-bg:rgba(255,122,122,.10); --red-line:rgba(255,122,122,.32);
  --blue:#8B93A3; --blue-bg:rgba(139,147,163,.10);
  --r:14px; --r2:10px;
  --ease:cubic-bezier(.16,1,.3,1);
  --serif:"Segoe UI",Arial,"Arial Hebrew","Noto Sans Hebrew",David,sans-serif;
  --sh:0 1px 2px rgba(0,0,0,.30), 0 8px 28px rgba(0,0,0,.35);
  --shl:0 26px 70px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",Arial,"Arial Hebrew","Noto Sans Hebrew",David,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
html[dir="rtl"] body{direction:rtl;text-align:right}
html[dir="ltr"] body{direction:ltr;text-align:left}
.app{display:flex;min-height:100vh}
aside{width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--side),var(--side2));color:#cfcde8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{padding:22px 20px 16px;border-bottom:1px solid var(--side-line)}
.logo .mark{display:flex;align-items:center;gap:10px}
.logo .cube{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand1),var(--brand2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px}
.logo b{color:#fff;font-size:16px;font-weight:800}
.logo small{display:block;font-size:11px;color:#8f8cb5;margin-top:2px}
.nav{flex:1;padding:14px 12px;overflow-y:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;font-family:inherit;font-size:13.5px;font-weight:600;color:#b9b6dd;background:none;border:none;border-radius:11px;padding:10px 12px;cursor:pointer;transition:.15s;position:relative}
html[dir="rtl"] .nav button{text-align:right}
html[dir="ltr"] .nav button{text-align:left}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(139,92,246,.28),rgba(79,70,229,.18));color:#fff}
.nav .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.1);border-radius:99px;padding:2px 8px}
.nav .cnt.alert{background:var(--red);color:#fff}
.side-foot{padding:13px 16px;border-top:1px solid var(--side-line);font-size:10.5px;line-height:1.7;color:#8f8cb5}
main{flex:1;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:13px 26px;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.topbar h1{font-size:17px;font-weight:800}
.topbar .sub{font-size:12px;color:var(--muted)}
.stamp{font-size:11px;color:var(--brand-ink);background:var(--brand-soft);border-radius:99px;padding:5px 12px;font-weight:600;white-space:nowrap}
.warnband{background:#fff7ed;border-bottom:1px solid #fed7aa;color:#9a3412;font-size:12px;font-weight:600;padding:7px 26px;display:flex;gap:14px;flex-wrap:wrap}
.content{padding:22px 26px 48px;max-width:1150px;width:100%;margin:0 auto}
section.view{display:none}
section.view.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:19px 21px;margin-bottom:15px}
.card h3{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3::before{content:"";width:8px;height:8px;border-radius:3px;background:linear-gradient(135deg,var(--brand1),var(--brand2))}
.card h3 small{font-weight:500;color:var(--muted);font-size:11.5px}
.rtable td.num{white-space:nowrap;width:44px}
.rtable .q{color:var(--muted);font-size:11.5px}
.rtable tr{page-break-inside:avoid}
.sep{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin-bottom:15px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;transition:.15s;border-inline-start:4px solid transparent}
.kpi:hover{transform:translateY(-2px)}
.kpi b{font-size:22px;font-weight:800;display:block;line-height:1.15}
.kpi span{font-size:11.5px;color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;background:#fafafe;border:1px dashed var(--line);border-radius:12px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:99px;padding:3px 10px}
.chip.crit{background:var(--red-bg);color:var(--red)}
.chip.high{background:rgba(255,160,77,.14);color:#FFA04D}
@media print{.chip.high{background:#FDEDDC;color:#9A4A0B}}
.chip.med{background:var(--yellow-bg);color:#8a6d0b}
.chip.low{background:var(--green-bg);color:var(--green)}
.chip.gray{background:var(--gray-bg);color:#5a5f77}
.chip.brand{background:var(--brand-soft);color:var(--brand-ink)}
.bars .row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.bars .nm{flex:0 0 34%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bars .tr{flex:1;height:18px;background:var(--gray-bg);border-radius:99px;overflow:hidden}
.bars .fl{height:100%;border-radius:99px}
.bars .sc{flex:0 0 58px;font-weight:800;font-size:12px}
.legend{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.7}
.matrix{display:grid;grid-template-columns:auto repeat(5,1fr);gap:5px;max-width:640px}
.matrix .ax{display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--muted);font-weight:700;padding:4px}
.matrix .cell{min-height:62px;border-radius:10px;padding:5px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;cursor:pointer;border:2px solid transparent}
.matrix .cell:hover{border-color:var(--brand2)}
.matrix .cell.selected{border-color:var(--ink)}
.matrix .dot{min-width:22px;height:22px;border-radius:99px;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.15);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters button,.filters select{font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;cursor:pointer;color:var(--muted)}
.filters button.on{border-color:var(--brand2);color:var(--brand2);background:var(--brand-soft)}
.riskcard{border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden}
.riskcard>.head{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;flex-wrap:wrap;background:var(--surface)}
.riskcard>.head:hover{background:#fafaff}
.riskcard .nm{font-weight:700;font-size:13.5px;flex:1;min-width:180px}
.riskcard .body{display:none;padding:14px 16px;border-top:1px solid var(--line);background:#fcfcff;font-size:12.5px;line-height:1.75}
.riskcard.open .body{display:block}
.fld{margin-bottom:10px}
.fld b{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
.wording{background:#f2f0fd;border:1px solid #ddd6fa;border-radius:10px;padding:10px 12px;position:relative;font-size:12.5px}
.copybtn{font-family:inherit;font-size:11px;font-weight:700;border:none;background:var(--brand2);color:#fff;border-radius:8px;padding:5px 11px;cursor:pointer;margin-top:8px}
.copybtn.ok{background:var(--green)}
.decide{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:10px}
.decide button{font-family:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--muted)}
.decide button.on{border-color:var(--brand2);color:var(--brand-ink);background:var(--brand-soft)}
sup.ref{color:var(--brand2);font-weight:800;cursor:pointer;font-size:10px;margin-inline-start:2px}
.combo{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.combo .pair{display:flex;gap:0;align-items:stretch;flex-wrap:wrap;margin:9px 0}
.combo .side{flex:1;min-width:190px;background:var(--red-bg);border:1px solid #f6c9c9;border-radius:12px;padding:10px 12px;font-size:12.5px}
.combo .lnk{flex:0 0 42px;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:900;font-size:18px}
.combo .why{font-size:12.5px;line-height:1.7;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:9px 12px}
.mirror{display:grid;grid-template-columns:1fr 46px 1fr;gap:8px;align-items:stretch;margin-bottom:11px}
.mirror .box{border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.65;border:1px solid var(--line)}
.mirror .down{background:var(--brand-soft)}
.mirror .up.gap{background:var(--red-bg);border-color:#f6c9c9}
.mirror .mid{display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:900}
.mirror .cap{font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:3px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:11px;color:var(--muted);font-weight:700;padding:7px 9px;border-bottom:2px solid var(--line)}
html[dir="rtl"] th{text-align:right} html[dir="ltr"] th{text-align:left}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
.foot{border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:9px;background:var(--surface);font-size:12.5px}
.foot.hl{border-color:var(--brand2);box-shadow:0 0 0 3px var(--brand-soft)}
.foot .q{background:#fafafe;border-inline-start:3px solid var(--brand1);padding:7px 11px;border-radius:8px;margin-top:6px;line-height:1.7}
.notice{background:var(--brand-soft);border:1px solid #ddd6fa;color:var(--brand-ink);border-radius:12px;padding:11px 14px;font-size:12.5px;line-height:1.7;margin-bottom:14px}
.btn{font-family:inherit;font-size:13px;font-weight:700;border:none;background:var(--brand2);color:#fff;border-radius:11px;padding:10px 18px;cursor:pointer}
.btn.sec{background:var(--gray-bg);color:var(--ink)}
.lensgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.lens{border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;transition:.15s;background:var(--card)}
.lens:hover{transform:translateY(-2px);border-color:var(--brand2)}
.lens .nm{font-size:13px;font-weight:800;margin-bottom:7px}
.lens .bar{height:7px;border-radius:99px;background:var(--gray-bg);overflow:hidden;margin-bottom:7px}
.lens .bar i{display:block;height:100%;border-radius:99px}
.lens .st{font-size:11.5px;color:var(--muted);line-height:1.6}
.defect{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:11px;background:var(--surface)}
.defect .loc{display:grid;grid-template-columns:1fr 40px 1fr;gap:8px;align-items:stretch;margin:9px 0}
.defect .loc .box{background:var(--gray-bg);border-radius:11px;padding:9px 12px;font-size:12px;line-height:1.6}
.defect .loc .vs{display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--red);font-size:15px}
.defect .single{background:var(--gray-bg);border-radius:11px;padding:9px 12px;font-size:12px;margin:9px 0}
.scen{border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden;background:var(--surface)}
.scen.silent{border-color:#f0b8a8;box-shadow:0 0 0 3px var(--red-bg)}
.scen>.head{display:flex;gap:10px;align-items:center;padding:12px 15px;cursor:pointer;flex-wrap:wrap}
.scen>.head:hover{background:#fafaff}
.scen .body{display:none;padding:14px 16px;border-top:1px solid var(--line);background:#fcfcff;font-size:12.5px;line-height:1.75}
.scen.open .body{display:block}
.silentbox{background:var(--red-bg);border:1px solid #f0c5b8;border-radius:11px;padding:10px 13px;margin:9px 0}
.keepbox{background:var(--green-bg);border:1px solid #c3e4cf;border-radius:11px;padding:10px 13px;margin:9px 0}
.tier{border-inline-start:3px solid var(--brand1);padding:6px 11px;margin:7px 0;background:#faf9ff;border-radius:0 9px 9px 0;font-size:12.5px}
.ext{border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:11px;background:var(--surface)}
.ext .prot{border-radius:11px;padding:9px 12px;margin:8px 0;font-size:12.5px}
.ext .prot.none{background:var(--red-bg);border:1px solid #f0c5b8}
.ext .prot.partial{background:var(--yellow-bg);border:1px solid #ecdca8}
.ext .prot.full{background:var(--green-bg);border:1px solid #c3e4cf}
.expo{display:flex;gap:14px;flex-wrap:wrap;background:#fbfbfe;border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin:9px 0;font-size:12px}
.expo div b{display:block;font-size:10.5px;color:var(--muted);font-weight:700}
.arrow{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.scorepill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800}
@media print{
 aside,.topbar .stamp,.filters,.decide,.copybtn,#v-export .btn{display:none!important}
 .warnband{display:flex!important;position:static!important;background:#fff!important;color:#9a3412!important;border:0;border-bottom:1px solid #fed7aa;padding:0 0 6px;margin:0 0 10px}
 body{background:var(--surface)}
 .content{padding:0!important;max-width:none}
 section.view{display:none!important}
 section.view.print{display:block!important}
 .card{box-shadow:none;border:1px solid #ccc;break-inside:auto;page-break-inside:auto}
 .card h3,.ptitle{break-after:avoid;page-break-after:avoid}
 .rtable tr,.combo,.fld,.tier,.kpis{break-inside:avoid;page-break-inside:avoid}
 thead{display:table-header-group}
 section.view.print[data-v="sources"]{break-before:page;page-break-before:always}
}
.ptitle{display:none}
@media print{.ptitle{display:block;font-size:15px;font-weight:800;margin:4px 0 8px}}
#preSend td:nth-child(1){width:17%}#preSend td:nth-child(2){width:51%}#preSend td:nth-child(3){width:17%}

/* Print never depends on the screen: every chapter is printed whichever tab was open, with no animation,
   and nothing kept in the browser changes it. A4 with fixed margins, so the page count does not depend on the printer.
   The 6 to 8 page target counts page one and chapters 1 to 5; the quotes appendix is printed but not counted. */
@page{size:A4;margin:14mm 12mm 16mm}
@media print{
 :root{color-scheme:light}
 html,body{background:#fff!important}
 .app,main{display:block!important;min-height:0!important}
 section.view.print,section.view.print.on{display:block!important;animation:none!important;opacity:1!important;transform:none!important}
 section.view:not(.print){display:none!important}
}

/* Print: a dark page is unusable on paper, and these documents get printed. */
@media print{
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F4F6F8;
    --ink:#0E1016; --ink2:#252B37; --muted:#5B6472; --faint:#8B93A3;
    --line:#D7DBE0; --line2:#C3C9D2;
    --brand:#0B8C66; --brand2:#0B8C66;
    --accent:#0B8C66; --accent-soft:#E8F7F1;
    --green:#0F7A55; --green-bg:#E8F7F1; --green-line:#BCE5D5;
    --yellow:#8A6A12; --yellow-bg:#FBF3DE; --yellow-line:#E8D6A8;
    --red:#B3423A; --red-bg:#FBEAE8; --red-line:#EFC7C2;
    --sh:none; --shl:none;
  }
  body{background:#fff;color:#0E1016}
  .side,.drawer,button,.no-print{display:none !important}
}

/* Client's own logo. The deliverable belongs to the client's legal department;
   Areo's mark stays as the maker's mark, beside it and never in place of it. */
.client-logo{display:none;max-height:34px;max-width:190px;width:auto;height:auto;
  object-fit:contain;margin-inline-end:14px;flex:0 0 auto}
.client-logo.on{display:block}
@media print{.client-logo{max-height:28px}}
.areo-brand{margin-inline-start:auto;display:flex;align-items:center;gap:8px;
  padding-inline-start:12px;opacity:.85}
.areo-brand .areo-cap{display:none}
.areo-wm{font-family:"Segoe UI",Arial,"Arial Hebrew",system-ui,sans-serif;font-weight:700;
  font-size:15px;letter-spacing:-.01em;color:#F2F4F7;direction:ltr;line-height:1}
.areo-wm .sfx{color:var(--muted);font-weight:400}
.areo-wm b{color:var(--brand);font-weight:700}
.areo-cap{font-size:11px;color:var(--faint);letter-spacing:.01em}
@media print{.area-brand,.areo-brand{border-top-color:#D7DBE0}
  .areo-wm{color:#0E1016}.areo-wm b{color:#0B8C66}}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="logo"><div class="mark"><div class="cube">A</div><div><b>Areo Workspace</b><small id="brandSub"></small></div></div></div>
 <nav class="nav" id="nav"></nav>
 <div class="side-foot" id="sideFoot"></div>
<img class="client-logo" id="clientLogo" alt="">
    <div class="areo-brand">
      <span class="areo-wm">Areo<span class="sfx">Legal</span><b>.</b></span>
      <span class="areo-cap">הופק באמצעות AreoLegal</span>
    </div>
  </aside>
<main>
 <div class="warnband" id="warnband"></div>
 <div class="topbar"><div><h1 id="vTitle"></h1><div class="sub" id="vSub"></div></div><div class="stamp" id="stamp" style="margin-inline-start:auto"></div></div>
 <div class="content" id="content">
  <section class="view print" data-v="overview">

 el.innerHTML=`<table class="rtable"><thead><tr>${T.h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${DEFECTS.map(d=>{const ls=d.locations||[];
  return `<tr><td class="num"><b>${d._no}</b></td><td><b>${esc(d.topic||d.title||'')}</b><div class="legend">${esc(lab(L.defT,d.type))}</div></td><td>${cell(ls[0])}</td><td>${cell(ls[1])}</td><td>${esc(lab(T.pr,d.prevails||'none'))}${d.prevails_basis?`<div class="legend">${esc(d.prevails_basis)}</div>`:''}</td><td>${esc(d.risk_created||'')}${(d.risk_ids||[]).length?`<div class="legend">${esc(T.rk)}: ${NOS(d.risk_ids).join(', ')}</div>`:''}</td><td>${esc(d.proposed_fix||'')}${refsHtml(d._refs)}</td></tr>`;}).join('')}</tbody></table>`;
 el.addEventListener('click',e=>{const sup=e.target.closest('sup.ref');if(sup)showRef(sup.dataset.ref);});
})();

/* ===== chapter 4: critical risks in detail (critical only, up to five) ===== */
(function(){
 const el=document.getElementById('critical');
 const C=RISKS.filter(r=>sevOf(r)==='crit').slice(0,5);
 const T=LANG==='en'?{none:"No risk was rated critical.",what:"What will happen",why:"Why the agreement does not protect us",cost:"What it may cost",dir:"Treatment direction",src:{contract:"from the agreement",client:"as provided by the client"},nocost:"There is no amount in the agreement or from the client to calculate from"}:{none:"אף סיכון לא דורג קריטי.",what:"מה יקרה",why:"למה ההסכם לא מגן",cost:"כמה זה עלול לעלות",dir:"כיוון טיפול",src:{contract:"מתוך ההסכם",client:"לפי מסירת הלקוח"},nocost:"אין בהסכם או מהלקוח סכום לחישוב"};
 if(!C.length){el.innerHTML=`<div class="card"><div class="empty">${esc(T.none)}</div></div>`;return;}
 el.innerHTML=C.map(r=>{const cd=r.critical_detail||{};const am=((r.exposure||{}).amount)||{};
  const ok=am.value!=null&&(am.source==='contract'||am.source==='client');
  const amt=ok?`${esc(money(am.value,am.currency))}${am.text?' '+esc(am.text):''} (${esc(lab(T.src,am.source))}${am.source_ref?', '+esc(am.source_ref):''})${am.calc?`<div class="legend">${esc(am.calc)}</div>`:''}`:esc(T.nocost);
  return `<div class="card"><h3><span class="chip crit">${esc(L.lvl.crit)}</span> ${r._no}. ${esc(r.name||'')}</h3>
  <div class="fld"><b>${esc(T.what)}</b>${esc(cd.what_happens||r.scenario||'')}</div>
  <div class="fld"><b>${esc(T.why)}</b>${esc(cd.why_not_protected||'')}${refsHtml(r._refs)}</div>
  <div class="fld"><b>${esc(T.cost)}</b>${amt}</div>
  <div class="tier"><b>${esc(T.dir)}:</b> ${esc(r.treatment_direction||'')}</div></div>`;}).join('');
 el.addEventListener('click',e=>{const s=e.target.closest('sup.ref');if(s)showRef(s.dataset.ref);});
})();

/* ===== chapter 5: not checked and missing ===== */
(function(){
 const el=document.getElementById('notChecked');
 const T=LANG==='en'?{h:"Not checked and missing",ann:"Annexes not provided",as:"Assumptions the client should confirm",oth:"Topics that need another function",web:"What was checked online, and when",dd:"This check is not a substitute for full financial due diligence.",none:"None.",th:["#","Official source","What was taken from it","Link","Date"]}:{h:"מה לא נבדק ומה חסר",ann:"נספחים שלא נמסרו",as:"הנחות שהלקוח צריך לאשר",oth:"נושאים שדורשים בדיקה של גורם אחר",web:"מה נבדק ברשת ומתי",dd:"הבדיקה אינה תחליף לבדיקת נאותות פיננסית מלאה.",none:"אין.",th:["#","מקור רשמי","מה נלקח ממנו","קישור","תאריך"]};
 const miss=(M.annexes_missing||[]), asm=(S.assumptions||[]), oth=(S.not_checked||[]), src=(RESEARCH.sources_checked||[]);
 const ul=a=>a.length?`<ul style="margin:4px 0 10px;padding-inline-start:18px;font-size:13px;line-height:1.7">${a.join('')}</ul>`:`<div class="legend" style="margin-bottom:10px">${esc(T.none)}</div>`;
 const href=u=>/^https?:\/\//i.test(String(u||''))?esc(u):'';
 const link=(u,t)=>{const h=href(u);return h?`<a href="${h}" target="_blank" rel="noopener noreferrer" style="word-break:break-all">${esc(t||u)}</a>`:esc(t||'');};
 el.innerHTML=`<h3>${esc(T.h)}</h3>`+
  `<b>${esc(T.ann)}</b>`+ul(miss.map(x=>`<li>${esc(x)}</li>`))+
  `<b>${esc(T.as)}</b>`+ul(asm.map(x=>`<li>${esc(x)}</li>`))+
  `<b>${esc(T.oth)}</b>`+ul(oth.map(x=>`<li><b>${esc(x.who||'')}</b>: ${esc(x.item||'')}${x.why?' ('+esc(x.why)+')':''}</li>`))+
  (src.length?`<b>${esc(T.web)}</b><table class="rtable" style="margin:4px 0 10px"><thead><tr>${T.th.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${src.map((x,i)=>`<tr><td class="num"><b>${i+1}</b></td><td>${esc(x.source||'')}</td><td>${esc(x.taken||x.subject||'')}${x.finding?`<div class="legend">${esc(x.finding)}</div>`:''}</td><td>${link(x.url,x.url)}</td><td>${esc(fmtD(x.date))}</td></tr>`).join('')}</tbody></table>`+`<div class="legend">${esc(T.dd)}</div>`:'');
})();

/* ===== chapter 3: combinations, chains and neutralizers ===== */
(function(){
 const el=document.getElementById('combos');
 if(!COMBOS.length){el.innerHTML=`<div class="card"><div class="empty">${esc(L.emptyCombos)}</div></div>`;return;}
 const TY=LANG==='en'?{combination:"Combination",chain:"Chain",neutralizer:"Neutralizing clause"}:{combination:"צירוף",chain:"שרשרת",neutralizer:"סעיף נטרול"};
 const T=LANG==='en'?{cl:"Clauses",why:"Why together it is worse",neu:"The protection it cancels",fix:"The one fix that breaks it",rk:"Risks"}:{cl:"הסעיפים",why:"למה יחד זה גרוע מכל אחד לבדו",neu:"ההגנה שמתבטלת בפועל",fix:"התיקון האחד ששובר את הצירוף",rk:"סיכונים"};
 el.innerHTML=COMBOS.map(c=>`<div class="combo"><h3 style="font-size:14px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="chip ${c.type==='neutralizer'?'crit':'high'}">${esc(lab(TY,c.type||'combination'))} ${c._no}</span>${esc(T.cl)}: ${esc((c.clauses||[]).join(c.type==='chain'?' ← ':' + '))}</h3>
  <div class="why"><b>${esc(T.why)}:</b> ${esc(c.why_together||c.why_dangerous_together||'')}${refsHtml(c._refs)}</div>
  ${c.neutralizes?`<div class="fld" style="margin-top:8px"><b>${esc(T.neu)}</b>${esc(c.neutralizes)}</div>`:''}
  <div class="tier"><b>${esc(T.fix)}:</b> ${esc(c.breaking_fix||'')}</div>
  ${(c.risk_ids||[]).length?`<div class="legend">${esc(T.rk)}: ${NOS(c.risk_ids).join(', ')}</div>`:''}</div>`).join('');
 el.addEventListener('click',e=>{const s=e.target.closest('sup.ref');if(s)showRef(s.dataset.ref);});
})();
/* ===== vague terms, back-to-back gaps and the mitigation plan are no longer screens: each such finding is a risk in chapter 1 ===== */
/* ===== chapter 5: research figures ===== */
(function(){
 const el=document.getElementById('notChecked'); const R=RESEARCH||{};
 const src=R.sources_checked||[], log=R.search_log||[], raw=R.raw_copies||[], conf=R.confidence||[];
 if(!el||(!src.length&&!log.length)) return;
 const T=LANG==='en'?{q:"Queries sent",o:"Pages opened and saved",f:"Facts taken from official sources",s:"Official sources used",blk:"Blocked or not loaded",mid:"Medium confidence (source no.)",at:"Research date"}:{q:"שאילתות שנשלחו",o:"דפים שנפתחו ונשמרו",f:"עובדות שנלקחו ממקורות רשמיים",s:"מקורות רשמיים שונים",blk:"נחסם או לא נטען",mid:"ודאות בינונית (מספר המקור)",at:"תאריך המחקר"};
 const facts=src.length, bodies=new Set(src.map(x=>String(x.source||'').trim()).filter(Boolean)).size;
 const blk=log.filter(x=>x.result==='blocked').length;
 const idx={}; src.forEach((x,i)=>{idx[x.id]=i+1;});
 const mid=conf.filter(c=>c.label==='medium').map(c=>`${idx[c.source_id]||'?'}${c.why?' ('+esc(c.why)+')':''}`);
 const last=log.map(x=>String(x.at||'').split('T')[0]).filter(Boolean).sort().pop();
 el.insertAdjacentHTML('beforeend',`<div class="legend">${esc(T.q)}: ${log.length}. ${esc(T.o)}: ${raw.length}. ${esc(T.f)}: ${facts}. ${esc(T.s)}: ${bodies}.${blk?' '+esc(T.blk)+': '+blk+'.':''}${mid.length?' '+esc(T.mid)+': '+mid.join('; ')+'.':''}${last?' '+esc(T.at)+': '+esc(fmtD(last))+'.':''}</div>`);
})();
/* ===== sources ===== */
document.getElementById('t_sources').textContent=L.nav.sources;
(function(){
 const el=document.getElementById('sources');
 const T=LANG==='en'?{n:"#",d:"Document and clause",q:"Verbatim text",s:"Summary of an internal document, not a quote"}:{n:"מספר",d:"מסמך וסעיף",q:"הנוסח המילולי",s:"תמצית ממסמך פנימי, לא ציטוט"};
 el.innerHTML=FOOTS.length?`<table class="rtable"><thead><tr><th>${esc(T.n)}</th><th>${esc(T.d)}</th><th>${esc(T.q)}</th></tr></thead><tbody>${FOOTS.map(f=>`<tr class="foot" id="foot-${f.n}"><td class="num"><b>${f.n}</b></td><td>${esc(f.agreement||'')}${f.clause?', '+esc(f.clause):''}${f.anchor_type==='internal_summary'?`<div class="legend">${esc(T.s)}</div>`:''}</td><td>${esc(f.quote||'')}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${esc(L.emptySources)}</div>`;
})();
function showRef(n){go('sources');const t=document.getElementById('foot-'+n);if(t){document.querySelectorAll('.foot').forEach(f=>f.classList.remove('hl'));t.classList.add('hl');t.scrollIntoView({block:'center'});}}
document.getElementById('content').addEventListener('click',e=>{const s=e.target.closest('sup.ref');if(s&&!e.target.closest('#register,#combos,#b2b,#plan'))showRef(s.dataset.ref);});
/* ===== export ===== */
(function(){
 const el=document.getElementById('exportView');
 const T=LANG==='en'?{h:"Print",n:"Printing gives the full short report: page one, chapters 1 to 5 and the quotes appendix.",b:"Print the report"}:{h:"הדפסה",n:"ההדפסה כוללת את הדוח המלא והקצר: העמוד הראשון, פרקים 1 עד 5 ונספח הציטוטים.",b:"הדפסת הדוח"};
 el.innerHTML=`<div class="card"><h3>${esc(T.h)}</h3><div class="notice">${esc(T.n)}</div><button class="btn" id="btnPrint">${esc(T.b)}</button></div>`;
 document.getElementById('btnPrint').addEventListener('click',()=>window.print());
})();
go('overview');
/* Print: each chapter opens with its title, so a printed page is never a table without a heading. */
document.querySelectorAll('section.view.print').forEach(s=>{const k=s.dataset.v;if(['register','defects','combos','critical'].includes(k)&&L.nav[k])s.insertAdjacentHTML('afterbegin',`<h2 class="ptitle">${esc(L.nav[k])}</h2>`);});

/* Client logo: a data URI carried on the payload, so the page stays
   self-contained and the CSP never sees an external request. */
(function clientLogo(){
  try{
    var src = ((DATA.meta || {}).branding || {}).logo;
    if (!src || !/^data:image\//.test(String(src))) return;   // only an embedded image; a file path is never loaded
    var el = document.getElementById('clientLogo');
    if (!el) return;
    el.src = src;
    el.alt = ((DATA.meta || {}).company) || '';
    el.classList.add('on');
  }catch(e){}
})();
</script>

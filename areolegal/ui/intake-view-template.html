    return;
  }
}
function addFiles(list) {
  list.forEach(function (f) {
    if (files.some(function (x) { return x.file.name === f.name && x.file.size === f.size; })) return;
    var rec = { file: f, words: 0, state: 'reading' }; files.push(rec); savedPath = null;
    readFile(f).then(function (t) { rec.text = t; rec.words = t.split(/\s+/).filter(Boolean).length; rec.state = rec.words ? 'ok' : 'empty'; }, function () { rec.state = EXT.test(f.name) ? 'unread' : 'empty'; }).then(function () { upload(rec); drawFiles(); });
  });
  drawFiles();
}

function wire() {
  $('#ix-theme').onclick = function () {
    var t = de.dataset.theme === 'light' ? 'dark' : 'light'; de.dataset.theme = t;
    try { localStorage.setItem('areo-theme', t); } catch (e) {}
    $('#ix-theme').innerHTML = icon(t === 'light' ? 'moon' : 'sun');
  };
  $$('[data-btn]').forEach(function (b) { b.onclick = function () { var x = D.buttons[+b.dataset.btn]; sendToChat(x.label, x.message); }; });
  $$('[data-card]').forEach(function (b) { b.onclick = function () { var x = D.extra.cards[+b.dataset.card]; sendToChat(x.title, x.message); }; });
  if ($('#ix-drop')) {
  var dz = $('#ix-drop'), inp = $('#ix-input');
  var open = function () { inp.click(); };
  
  inp.onchange = function () { addFiles(Array.prototype.slice.call(inp.files)); inp.value = ''; };
  var dirInp = $('#ix-dir');
  $('#ix-pickfiles').onclick = open;
  $('#ix-pickdir').onclick = function () { dirInp.click(); };
  dirInp.onchange = function () {   // תיקייה שלמה: רק סוגי המסמכים שנתמכים, עם הנתיב היחסי
    var all = Array.prototype.slice.call(dirInp.files), keep = all.filter(function (f) { return EXT.test(f.name); });
    if (all.length && keep.length < all.length) { var n = $('#ix-note'); if (n) n.textContent = (X.dirSkipped || 'דילגנו על קבצים שאינם מסמכים: ') + (all.length - keep.length); }
    addFiles(keep); dirInp.value = '';
  };
  dz.ondragover = function (e) { e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = function () { dz.classList.remove('over'); };
  dz.ondrop = function (e) { e.preventDefault(); dz.classList.remove('over'); dropped(e.dataTransfer).then(addFiles); };
  }
}
document.addEventListener('pointermove', function (e) {
  var t = e.target.closest && e.target.closest('.spot'); if (!t) return;
  var r = t.getBoundingClientRect(); t.style.setProperty('--mx', (e.clientX - r.left) + 'px'); t.style.setProperty('--my', (e.clientY - r.top) + 'px');
});

render();
/* יכולת room נטענת אחרי הציור: העמוד עובד גם בלעדיה */
try {
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('room').then(function (r) {
      if (!r || typeof r.sendToClaudeSession !== 'function') return;
      room = r;
      return Promise.resolve(r.canSendToClaudeSession()).then(function (m) { roomMode = m; }, function () { roomMode = 'off'; });
    }).catch(function () {});
  }
} catch (e) {}
window.__ix = { addFiles: addFiles, state: function () { return { roomMode: roomMode, files: files.length }; } };
})();
</script>
<script>
/* AREO-FX:BEGIN מנוע האפקטים של Areo: זהה בייט לבייט בכל התבניות. מפעיל את האפקטים שה-KIT מגדיר:
   אורורה מאחורי כל .hero, כניסה מדורגת לכרטיסים, מונים מתגלגלים, הקלדה, אדווה בלחיצה, זרקור, כפתור מגנטי.
   שקט לגמרי כשהמשתמש ביקש פחות תנועה, ולעולם לא משאיר תוכן שקוף (גיבוי בטיימר). */
(function () {
  'use strict';
  if (window.__areoFx) return; window.__areoFx = 1;
  var still = function () { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  var BLOBS = [[.82, .1, '#2FE6A6', .5], [.62, .9, '#0DA678', .38], [.12, .2, '#E08A66', .26], [.35, .55, '#7C5CE6', .16]];
  function aurora(host) {
    if (host.querySelector(':scope > canvas.aur') || /jsdom/i.test(navigator.userAgent || '')) return;
    var cv = document.createElement('canvas'); cv.className = 'aur'; cv.setAttribute('aria-hidden', 'true'); cv.style.maxHeight = 'none'; cv.style.height = '100%'; host.insertBefore(cv, host.firstChild);
    var ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return;
    var draw = function (t) {
      var dpr = window.devicePixelRatio || 1, w = cv.width = Math.max(1, cv.offsetWidth * dpr), h = cv.height = Math.max(1, cv.offsetHeight * dpr);
      ctx.clearRect(0, 0, w, h);
      var light = document.documentElement.dataset.theme === 'light';
      ctx.globalCompositeOperation = light ? 'multiply' : 'screen';
      BLOBS.forEach(function (b, i) {
        var cx = (b[0] + Math.sin(t / 2600 + i * 1.7) * .08) * w, cy = (b[1] + Math.cos(t / 3100 + i) * .12) * h, rad = Math.max(w, h) * (.42 + i * .04);
        var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad), a = Math.round((light ? b[3] * .45 : b[3]) * 255).toString(16);
        g.addColorStop(0, b[2] + (a.length < 2 ? '0' + a : a)); g.addColorStop(1, b[2] + '00'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      });
    };
    var loop = function (ts) { draw(ts); if (!still() && document.body.contains(cv)) requestAnimationFrame(loop); };
    draw(0); if (!still()) requestAnimationFrame(loop);
  }
  function countUp(el) {
    var txt = (el.textContent || '').trim(); if (!/^\d{1,6}$/.test(txt)) return;
    var to = +txt; if (!to || still()) return;
    var t0 = 0, d = 1100, fmt = function (v) { return String(v); };
    var f = function (t) { if (!t0) t0 = t; var p = Math.min(1, (t - t0) / d); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 4)))); if (p < 1) requestAnimationFrame(f); };
    el.textContent = '0'; requestAnimationFrame(f); setTimeout(function () { el.textContent = fmt(to); }, d + 400);
  }
  function typeIn(el) {
    if (still()) return;
    var full = el.innerHTML, tokens = full.match(/<[^>]+>|&[^;\s]+;|[^<&]/g) || [], i = 0, out = '', stop = false;
    var done = function () { stop = true; el.innerHTML = full; el.classList.remove('typing'); };
    el.classList.add('typing'); el.addEventListener('click', done, { once: true });
    var step = function () { if (stop) return; var n = 0; while (i < tokens.length && n < 3) { out += tokens[i]; if (tokens[i].charAt(0) !== '<') n++; i++; } el.innerHTML = out; if (i < tokens.length) setTimeout(step, 14); else done(); };
    el.innerHTML = ''; step(); setTimeout(done, 9000);
  }
  var SEL = '.hero,.card,.tile,.stat,.ix-ag,.ix-tile,.alert';
  function apply() {
    var heroes = document.querySelectorAll('.hero'); for (var i = 0; i < heroes.length; i++) aurora(heroes[i]);
    var els = Array.prototype.filter.call(document.querySelectorAll(SEL), function (e) { return !e.dataset.fxr && !e.closest('[hidden]') && !e.closest('.drawer'); });
    els.forEach(function (e, k) { e.dataset.fxr = '1'; if (still()) return; e.classList.add('rv'); e.style.setProperty('--d', Math.min(k * 45, 700) + 'ms'); });
    var shown = false, show = function () { if (shown) return; shown = true; els.forEach(function (e) { e.classList.add('in'); }); };
    requestAnimationFrame(function () { requestAnimationFrame(show); }); setTimeout(show, 140);
    Array.prototype.forEach.call(document.querySelectorAll('.statn,.tile .v,[data-count]'), function (e) { if (e.dataset.fxc) return; e.dataset.fxc = '1'; countUp(e); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-fx-type]'), function (e) { if (e.dataset.fxt) return; e.dataset.fxt = '1'; typeIn(e); });
  }
  document.addEventListener('pointerdown', function (e) {
    var b = e.target.closest && e.target.closest('.btn,.tile,.navi,.chip-btn,[data-card]'); if (!b || still()) return;
    var r = b.getBoundingClientRect(), s = Math.max(r.width, r.height), sp = document.createElement('span');
    sp.className = 'ripple'; sp.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' + (e.clientX - r.left - s / 2) + 'px;top:' + (e.clientY - r.top - s / 2) + 'px';
    if (getComputedStyle(b).position === 'static') b.style.position = 'relative'; b.style.overflow = 'hidden'; b.appendChild(sp); setTimeout(function () { sp.remove(); }, 650);
  });
  document.addEventListener('pointermove', function (e) {
    var t = e.target.closest && e.target.closest('.card,.tile,.stat,.ix-ag'); if (!t || still()) return;
    var r = t.getBoundingClientRect(); t.style.setProperty('--mx', (e.clientX - r.left) + 'px'); t.style.setProperty('--my', (e.clientY - r.top) + 'px');
    if (!t.classList.contains('spot')) t.classList.add('spot');
  });
  var tm = null;
  var run = function () { clearTimeout(tm); tm = setTimeout(apply, 30); };

/* AREO-FX:END */
</script>

<style>
/* Layout: side menu with the playbook picker on top, one calm content column beside it; on a phone the menu becomes a scrolling strip */

}
:root[data-areo="light"],:root[data-theme="light"]:not([data-areo="dark"]){

  --aurora:#0B8C66; --aurora-ink:#FFFFFF; --aurora-soft:#E1F5EC;
  --g:#0F9D6E; --g-soft:#E7F6EF; --y:#B07A06; --y-soft:#FBF3DF; --r:#C93434; --r-soft:#FCEBEB;
  --legal:#4A30A8; --legal-soft:#EFEAFD; --clay:#B4552F; --clay-soft:#FBEDE5;
  --c1:#0B8C66; --c2:#2F6FC6; --c3:#6B4FD8; --c0:#C6D3CD;
  --fab-bg:#10221C; --fab-ink:#F4F7F5; --fab-orb:#08140F; --paper:#FFFFFF; --hl:rgba(15,157,110,.42);

}
:root[data-size="lg"]{font-size:18px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.6}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
aside{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}

.picker{position:relative}

.pickbtn .car{color:var(--faint)}
.menu{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;padding:6px;z-index:30;box-shadow:0 12px 32px rgba(0,0,0,.35)}

.menu button:hover{background:var(--raised)}
.menu .sub{font-size:12.5px;color:var(--mist)}

.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-inline-start:3px solid transparent;border-radius:10px;padding:8px 10px;color:var(--mist);font:inherit;font-size:15px;cursor:pointer}

.col{max-width:1180px;margin:0;display:flex;flex-direction:column;gap:14px}

h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:26px;font-weight:700}h2{font-size:19px;font-weight:600}h3{font-size:16px;font-weight:600}
.lead{margin:0;color:var(--mist);max-width:64ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mist)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.draft{background:var(--y-soft);color:var(--y)}.pill.ok{background:var(--g-soft);color:var(--g)}.pill.wait{background:var(--legal-soft);color:var(--legal)}.pill.crit{background:var(--r-soft);color:var(--r)}
.hero{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(110% 140% at 100% 0%,var(--aurora-soft) 0%,transparent 55%),radial-gradient(80% 120% at 0% 100%,rgba(75,134,216,.10) 0%,transparent 60%),var(--panel)}
.hero .eb{font-size:12.5px;font-weight:700;color:var(--aurora);letter-spacing:.12em}
.hero h1{font-size:28px}
.metas{display:flex;flex-wrap:wrap;gap:8px}
.meta{font-size:13.5px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.meta b{font-variant-numeric:tabular-nums}
.stats5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:700px){.stats5{grid-template-columns:repeat(2,1fr)}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.charts{grid-template-columns:1fr}}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chart h3{font-size:15.5px}

.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{font-family:var(--body);fill:var(--mist);font-size:12px}
.chart svg .val{fill:var(--ink);font-weight:700}
.chart svg .big{fill:var(--ink);font-family:var(--display);font-size:26px;font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mist)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:center}
.hl{font-size:13.5px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htrack{display:block;min-width:0}
.hfill{display:flex;gap:2px;height:26px;min-width:28px}
.seg{display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:12.5px;font-weight:700;min-width:22px;font-variant-numeric:tabular-nums}
.donutwrap{display:flex;gap:16px;align-items:center}
.donutwrap svg{max-width:150px;flex:0 0 150px}
.donutwrap .legend{flex-direction:column;gap:8px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--aurora)}
.mix{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px}.mix i{display:block}
ul.notes{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
ul.notes li::marker{color:var(--faint)}
.btn{border:0;border-radius:12px;padding:10px 18px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--aurora);color:var(--aurora-ink)}.btn.primary:hover{filter:brightness(1.06)}
.btn.soft{background:var(--raised);color:var(--ink);border:1px solid var(--line-strong)}
.btn.small{padding:7px 14px;font-size:14px}
.linkbtn{background:none;border:0;color:var(--aurora);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;padding:2px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.search input,.ask textarea{width:100%;background:var(--panel);border:1px solid var(--line-strong);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;font-size:1.05rem;outline:none}
.ask textarea{min-height:70px;resize:vertical}
.search input:focus,.ask textarea:focus{border-color:var(--aurora);box-shadow:0 0 0 3px var(--aurora-soft)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--aurora-soft);border-color:var(--aurora);color:var(--aurora);font-weight:600}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}
.item{display:flex;gap:12px;align-items:center;text-align:start;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 18px;color:var(--ink);font:inherit;cursor:pointer}
.item:last-child{border-bottom:0}.item:hover{background:var(--raised)}
.item .txt{flex:1;min-width:0}.item b{display:block;font-size:16px}
.item .gp{display:block;font-size:14px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
mark{background:var(--aurora-soft);color:var(--ink);border-radius:3px}
.chev{color:var(--faint);font-size:18px}
.empty{padding:20px;color:var(--mist);text-align:center}
.lane{border-radius:16px;padding:16px 18px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:10px;border-inline-start:4px solid var(--c)}
.lane.g{--c:var(--g)}.lane.y{--c:var(--y)}.lane.r{--c:var(--r)}
.lane .ln{font-size:13px;font-weight:700;color:var(--c)}
.lane .pos{font-size:16.5px;font-weight:600}.lane.g .pos{font-size:18px}
.clause{background:var(--raised);border-radius:12px;padding:12px 14px;font-size:15px}
.fx,.basis{font-size:13.5px;color:var(--mist)}
details{border:1px solid var(--line);border-radius:14px;background:var(--panel)}
details summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";float:left;color:var(--faint)}details[open] summary::after{content:"-"}
details .in{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.ev{border-inline-start:2px solid var(--line-strong);padding-inline-start:12px}
.ev .src{font-size:13px;color:var(--mist)}.ev q{display:block;font-size:14.5px}
.decide{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qa{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.qa b{display:block}.qa .rec{font-size:14px;color:var(--mist);margin-top:4px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px;background:var(--panel)}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mist);font-weight:600;font-size:13px;background:var(--raised)}tr:last-child td{border-bottom:0}
td.diff{background:var(--y-soft)}
.answer{border-inline-start:4px solid var(--aurora)}
/* Ask: a dark capsule with a slowly turning traffic-light ring; answers come back as ruling cards, not chat bubbles */
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:calc(22px + env(safe-area-inset-left,0px));z-index:40;display:flex;align-items:center;gap:12px;padding:7px 20px 7px 8px;border-radius:999px;border:1.5px solid transparent;background:linear-gradient(var(--fab-bg),var(--fab-bg)) padding-box,conic-gradient(from var(--spin),var(--g),var(--y),var(--r),var(--g)) border-box;color:var(--fab-ink);font:inherit;cursor:pointer;box-shadow:0 14px 36px rgba(0,0,0,.32),0 2px 6px rgba(0,0,0,.2);animation:spin 9s linear infinite;transition:transform .2s ease}
.fab:hover{transform:translateY(-2px)}
@keyframes spin{to{--spin:360deg}}
.fab .fl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:start}

.orb{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:var(--fab-orb);display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.orb i{width:6px;height:6px;border-radius:50%;animation:blink 2.4s ease-in-out infinite}
.orb i:nth-child(1){background:var(--g)}.orb i:nth-child(2){background:var(--y);animation-delay:.3s}.orb i:nth-child(3){background:var(--r);animation-delay:.6s}
@keyframes blink{0%,60%,100%{opacity:1;transform:none}30%{opacity:.35;transform:scale(.7)}}
.orb.sm{width:30px;height:30px;gap:3px}.orb.sm i{width:5px;height:5px}

@keyframes pop{from{transform:translateY(10px) scale(.97)}}
.askp header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 12px;background:var(--fab-bg);color:var(--fab-ink)}
.askp .ah{display:flex;gap:11px;align-items:center}
.askp header b{font-family:var(--serif);font-size:18px;font-weight:700;display:block;line-height:1.2}

.askp .x{background:rgba(255,255,255,.08);border:0;color:inherit;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1}
.tri{display:flex;height:3px}.tri i{flex:1}.tri i:nth-child(1){background:var(--g)}.tri i:nth-child(2){background:var(--y)}.tri i:nth-child(3){background:var(--r)}
.msgs{flex:1;overflow:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:16px}
.msgs>*{flex-shrink:0}
.msgs{min-height:0;overscroll-behavior:contain}
.intro .iq{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.25}
.intro p{margin:6px 0 0;color:var(--mist);font-size:14.5px}
.cases{display:flex;flex-direction:column}
.cases button{display:flex;gap:12px;align-items:baseline;text-align:start;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;color:var(--ink);font:inherit;font-size:14.5px;cursor:pointer}

<script>
(function(){
'use strict';
/* the client's playbooks, from Areo-נתונים (lib/app/policy_view.py): {company, current, books:[{key,type,label,family,side,status,status_label,updated,rules,built,data}]} */
var P=/*__AREO_POLICY__*/null;
var EMPTY={company:'',family:'',side:'',docs:0,date:'',approver:null,deal:'',suff:'',limits:[],notObserved:[],seg:{status:'',checked:[]},segs:[],qs:[],cov:{units:0,topic:0,tech:0,by:[]},status:{label:'',approved:0,total:0,open_questions:[]},src:{},com:{fields:[],rows:[]},rules:[]};
function fill(d){var o={};d=d||{};for(var k in EMPTY)o[k]=(d[k]==null)?EMPTY[k]:d[k];for(var j in d)if(!(j in o))o[j]=d[j];o.rules=(o.rules||[]).map(function(r){r.L=r.L||{};['green','yellow','red'].forEach(function(k){var L=r.L[k];if(!L||!L.p){r.L[k]={};return}['ev','crit','steps','lr'].forEach(function(f){if(!Array.isArray(L[f]))L[f]=[]})});r.rel=r.rel||[];r.relx=r.relx||[];return r});return o}
var BOOKS=((P&&P.books)||[]).filter(function(b){return b&&b.data}).map(function(b){var d=fill(b.data),n=d.rules.length;return {id:b.key,key:b.key,type:b.type||b.key,name:b.label||b.family||b.key,family:b.family||'',side:b.side||'',sub:(b.side?b.side+' · ':'')+(n===1?'נושא אחד':n+' נושאים'),built:b.built!==false,data:d}});

var D=BOOKS.length?BOOKS[CUR].data:fill(null);

try{var th=localStorage.getItem('areo-theme');if(th)document.documentElement.setAttribute('data-areo',th);var sz=localStorage.getItem('areo-size');if(sz)document.documentElement.setAttribute('data-size',sz)}catch(e){}

loadSent();
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function lanesOf(r){return ['green','yellow','red'].filter(function(k){return r.L[k]&&r.L[k].p})}
function isOk(r,k){var key=r.id+k;if(S.chg[key]&&S.dec[key]!=='ok')return false;return r.L[k].ok||S.dec[key]==='ok'}
function waiting(){var w=[];D.rules.forEach(function(r){lanesOf(r).forEach(function(k){if(!isOk(r,k))w.push([r,k])})});return w}
function counts(){var t=0,ok=0;D.rules.forEach(function(r){lanesOf(r).forEach(function(k){t++;if(isOk(r,k))ok++})});return {t:t,ok:ok}}
function topicWaiting(r){return lanesOf(r).some(function(k){return !isOk(r,k)})}
function norm(s){return String(s||'').toLowerCase()}
function words(q){return norm(q).split(/[\s,.?!:;"']+/).filter(function(w){return w.length>1&&['של','את','מה','לגבי','שלנו','אנחנו','על','עם','לא','או','זה','יש','האם','כמה','איך','הוא','היא','אם'].indexOf(w)<0})}
function hay(r){return norm([r.t,r.why,r.cp].concat(lanesOf(r).map(function(k){return r.L[k].p+' '+r.L[k].cl})).join(' '))}
function hit(r,q){if(!q)return true;return hay(r).indexOf(norm(q))>=0}
function hl(text,q){var t=esc(text);if(!q)return t;var i=norm(text).indexOf(norm(q));if(i<0)return t;return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length))}

function lcsMark(a,b){/* marks tokens of b that are not in the LCS with a; returns [{t,d}] and the changed runs on both sides */
  var n=a.length,m=b.length,T=[];for(var i=0;i<=n;i++){T.push(new Array(m+1).fill(0))}
  for(i=n-1;i>=0;i--)for(var j=m-1;j>=0;j--)T[i][j]=a[i]===b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  var out=[],ra=[],rb=[],ca='',cb='';i=0;j=0;
  var cl=function(v){return v.trim().replace(/[.,;:]+$/,'')};var flush=function(){if(cl(ca))ra.push(cl(ca));if(cl(cb))rb.push(cl(cb));ca='';cb=''};var nxt=function(arr,k){return arr[k]||''};
  while(i<n&&j<m){if(a[i]===b[j]){if(/^\d+$/.test(ca.trim())&&/^\d+$/.test(cb.trim())){ca+=' '+a[i];cb+=' '+b[j]}flush();out.push({t:b[j],d:0});i++;j++}else if(T[i+1][j]>=T[i][j+1]){ca+=(ca?' ':'')+a[i];i++}else{cb+=(cb?' ':'')+b[j];out.push({t:b[j],d:1});j++}}
  while(i<n){ca+=(ca?' ':'')+a[i];i++}while(j<m){cb+=(cb?' ':'')+b[j];out.push({t:b[j],d:1});j++}flush();
  return {out:out,ra:ra,rb:rb};
}
function cmpModel(r){

    rows.push({s:s,k:hitk,e:ev,i:idx,q:ev?stripNo(ev.q):''})});
  var have=rows.filter(function(x){return x.q}),cnt={};have.forEach(function(x){cnt[x.q]=(cnt[x.q]||0)+1});
  var base=have.length?have.slice().sort(function(a,b){return cnt[b.q]-cnt[a.q]})[0].q:'';
  var uniq=Object.keys(cnt).length,vals=[];
  rows.forEach(function(x){if(!x.q)return;if(x.q===base){x.base=true;x.marks=[{t:x.q,d:0}];return}
    var d=lcsMark(toks(base),toks(x.q));x.marks=d.out;d.ra.forEach(function(v){if(vals.indexOf(v)<0)vals.unshift(v)});d.rb.forEach(function(v){if(vals.indexOf(v)<0)vals.push(v)})});

}

  if(saved){delete S.sent[k];n++}});S.savedNote=n;if(n)saveSent()}

  loadSent();cleanSent();S.saved=pickSaved();CH=[];closeAsk();closeDrawer();render();window.scrollTo(0,0)}

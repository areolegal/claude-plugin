<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>Areo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;500;600;700&family=Assistant:wght@400;600;700&family=Poppins:wght@400;700&display=swap">
<style>
/* One thin bar above the three existing apps; all three stay loaded, a tab only brings one forward.
   "היום" is the only screen of the bar's own: a summary that reads the three screens and links into them. */
:root{--bg:#F4F7F5;--panel:#FFFFFF;--raised:#F0F3F6;--line:#DBE4E0;--ink:#10221C;--mist:#4F615A;--faint:#7A8A84;
  --accent:#0B8C66;--accent-soft:#E1F5EC;--legal:#4A30A8;--legal-soft:#EFEAFD;--warn:#B07A06;--warn-soft:#FBF3DF;--risk:#C93434;--risk-soft:#FCEBEB;
  --display:'Rubik','Assistant',system-ui,sans-serif;--body:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;--mark:'Poppins','Assistant',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--panel:#14171f;--raised:#1b1f29;--line:#272d3a;--ink:#eef1f5;--mist:#9aa3b2;--faint:#6b7486;
  --accent:#2fe6a6;--accent-soft:rgba(47,230,166,.12);--legal:#b6a3ff;--legal-soft:rgba(167,139,250,.14);--warn:#f2b45c;--warn-soft:rgba(242,180,92,.1);--risk:#f2676c;--risk-soft:rgba(242,103,108,.1);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f14;--panel:#14171f;--raised:#1b1f29;--line:#272d3a;--ink:#eef1f5;--mist:#9aa3b2;--faint:#6b7486;
  --accent:#2fe6a6;--accent-soft:rgba(47,230,166,.12);--legal:#b6a3ff;--legal-soft:rgba(167,139,250,.14);--warn:#f2b45c;--warn-soft:rgba(242,180,92,.1);--risk:#f2676c;--risk-soft:rgba(242,103,108,.1);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
button{font:inherit;color:inherit}
.shell{height:100%;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:0;overflow-x:auto;white-space:nowrap}
/* the logo sits above the screens' sidebar (250px, same as inside); the menu starts where the sidebar ends */
.brandcell{flex:none;align-self:stretch;display:flex;align-items:center;margin-block:-6px;padding-inline-start:max(20px,env(safe-area-inset-right,0px));margin-inline-end:8px}
@media (min-width:901px){.brandcell{width:250px;border-inline-end:1px solid var(--line);margin-inline-end:14px;padding-inline-end:10px}
  body.closed .brandcell{width:64px;padding-inline:6px;justify-content:center;gap:2px}
  body.closed .brand .b2,body.closed .brand .b3{display:none}
  body.closed .sidebtn{margin-inline-start:0}}
.sidebtn{margin-inline-start:auto;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--mist);border-radius:8px;cursor:pointer}
.sidebtn:hover{background:var(--raised);color:var(--ink)}
.sidebtn svg{width:18px;height:18px}
@media (max-width:900px){body.closed .sidebtn{margin-inline-start:10px}}
/* inside a negotiation document there is no sidebar: the logo cell stops pretending to sit above one */
@media (min-width:901px){body.focus .brandcell{width:auto;border-inline-end:0}}
body.focus .sidebtn{display:none}
/* editing a document: the menu steps away until the arrow leads back to the deals */
body.focus .tab{display:none}
.brand{font-family:var(--mark);font-weight:700;font-size:19px;letter-spacing:-.3px;direction:ltr}
.brand .b3{color:var(--mist);font-weight:400}.brand b{color:var(--accent)}
.tab{border:0;background:transparent;color:var(--mist);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.tab .n{display:inline-block;min-width:18px;margin-inline-start:6px;padding:0 5px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:700;text-align:center}
.tab .n:empty{display:none}
.tab .n.late{background:var(--risk-soft);color:var(--risk)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.how{margin-inline-start:auto;border:1px dashed var(--legal);background:var(--legal-soft);color:var(--legal);font-weight:600;border-radius:999px;padding:5px 14px;cursor:pointer}
.how.ab{margin-inline-start:0}
.how.ab b{font-weight:700}
.iconbtn{flex:none;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;cursor:pointer}
.iconbtn svg{width:18px;height:18px}
.stage{flex:1;position:relative;min-height:0;background:var(--bg)}
.stage iframe,.stage .today{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden;opacity:0}
.stage iframe.on.ready,.stage .today.on{visibility:visible;opacity:1}
/* building a playbook: the playbook steps open over the policy screen, inside the system */
.stage iframe.pbx{z-index:5}.stage iframe.pbx.on{visibility:visible;opacity:1}
@media (prefers-reduced-motion:no-preference){.stage iframe.on.ready,.stage .today.on{transition:opacity .12s ease-out}}
.wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mist);font-size:14px}

/* היום: same frame as the three screens, a 250px sidebar and a working area */
.today{overflow:auto;display:grid;grid-template-columns:250px minmax(0,1fr)}
@media (max-width:900px){.today{grid-template-columns:1fr}}
@media (min-width:901px){body.closed .today{grid-template-columns:64px minmax(0,1fr)}
  body.closed .tside{padding:16px 8px;align-items:center}
  body.closed .tside .tco,body.closed .tside .lbl,body.closed .tside .foot,body.closed .jump .jl,body.closed .jump .cnt{display:none}
  body.closed .jump{width:44px;justify-content:center;padding:9px}}
@media (max-width:900px){body.closed .tside{display:none}}
.tside{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:start;min-height:100%}
@media (max-width:900px){.tside{position:static;flex-direction:row;flex-wrap:wrap;border-inline-end:0;border-bottom:1px solid var(--line);min-height:0}}
.tside .lbl{font-size:13.5px;color:var(--accent);font-weight:600;padding:0 6px 8px}
@media (max-width:900px){.tside .lbl{display:none}}
.jump{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:8px 10px;text-align:start;color:var(--mist);cursor:pointer;font-size:15px}
.jump:hover{background:var(--raised);color:var(--ink)}
.jump svg{width:17px;height:17px;flex:0 0 auto}
.jump .cnt{margin-inline-start:auto;font-size:12px;font-weight:700;border-radius:999px;padding:0 7px;background:var(--raised)}
.jump .cnt.w{background:var(--warn-soft);color:var(--warn)} .jump .cnt.r{background:var(--risk-soft);color:var(--risk)}
.tside .foot{margin-top:auto;font-size:12.5px;color:var(--faint);padding:10px 6px 0}
@media (max-width:900px){.tside .foot{display:none}}
.tmain{padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
@media (min-width:901px){.tmain{padding-inline:32px}}
.tcol{max-width:980px;display:flex;flex-direction:column;gap:18px}
.hello .eb{font-size:13px;font-weight:700;color:var(--accent)}
.hello h1{font-family:var(--display);font-size:30px;margin:4px 0 6px;line-height:1.2;text-wrap:balance}
.hello p{margin:0;color:var(--mist);font-size:16px;max-width:62ch}
/* "אחיד": the same frame as the three screens */
.crumbrow{display:flex;align-items:center;min-height:34px;margin-bottom:-8px;font-size:13.5px;color:var(--mist)}
.tco{font-size:13px;color:var(--mist);padding:0 6px 8px}
body:not(.loose) .tmain{padding-block:18px 60px}
@media (min-width:901px){body:not(.loose) .tmain{padding-inline:24px}}
body:not(.loose) .tcol{max-width:1180px}
body:not(.loose) .hello{border:1px solid var(--line);border-radius:20px;padding:20px 22px;background:radial-gradient(110% 140% at 100% 0%,var(--accent-soft) 0%,transparent 55%),var(--panel)}
body:not(.loose) .hello h1{font-size:27px}
body:not(.loose) .tside .lbl{display:none}
body.loose .crumbrow,body.loose .tco{display:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.blk.wide{grid-column:1/-1}
.blk h2{font-family:var(--display);font-size:16.5px;margin:0 0 4px;display:flex;gap:8px;align-items:center}
.blk h2 .c{font-family:var(--mark);font-size:13px;color:var(--mist);font-weight:400}
.blk h2 .from{margin-inline-start:auto;font-family:var(--body);font-size:12.5px;color:var(--faint);font-weight:400}
.it{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;border-radius:10px;padding:9px 8px;text-align:start;cursor:pointer}
.it:hover{background:var(--raised)}
.it .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.it .dot.w{background:var(--warn)} .it .dot.r{background:var(--risk)} .it .dot.g{background:var(--accent)} .it .dot.l{background:var(--legal)}
.it .t{display:flex;flex-direction:column;min-width:0;flex:1}
.it .t b{font-size:15px;font-weight:600}
.it .t span{font-size:13.5px;color:var(--mist)}
.it .when{font-size:13px;color:var(--mist);white-space:nowrap;text-align:end;font-variant-numeric:tabular-nums}
.it .when.r{color:var(--risk);font-weight:700} .it .when.w{color:var(--warn);font-weight:600}
.it .go{color:var(--faint);font-size:13px}
.empty{color:var(--faint);font-size:14px;padding:8px}
/* Ask Areo: a launcher in the bar, and a full-height panel on the side away from the sidebar */
.newbtn2{margin-inline-start:auto}
/* phone: the bar keeps the tabs and the two main buttons; the buttons keep only their icon */
@media (max-width:900px){.today>.tside{display:none}}
@media (max-width:700px){.bar{flex-wrap:wrap;row-gap:2px;overflow:visible;padding-bottom:4px}.bar .tab{order:5}.bar .tab:first-of-type{margin-inline-start:6px}.bar .how{display:none}.newbtn2 span,.askbtn span{display:none}.newbtn2,.askbtn{padding:0 9px!important}.brand .b3{display:none}.tab{padding:6px 10px}}
.askbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:linear-gradient(135deg,var(--accent-soft),var(--legal-soft));color:var(--ink);font-weight:700;border-radius:999px;padding:6px 14px 6px 12px;cursor:pointer;white-space:nowrap}
.askbtn svg{width:16px;height:16px;color:var(--accent)}
.askbtn:hover,.askbtn[aria-expanded="true"]{border-color:var(--accent)}
#how{margin-inline-start:0}
.askp{position:fixed;top:calc(var(--bar-h,47px) + env(safe-area-inset-top,0px));bottom:0;left:0;z-index:7;width:min(440px,100%);display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);box-shadow:16px 0 40px rgba(0,0,0,.12);padding-left:env(safe-area-inset-left,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-reduced-motion:no-preference){.askp:not([hidden]){animation:askin .2s ease-out}@keyframes askin{from{transform:translateX(-28px);opacity:0}to{transform:none;opacity:1}}}
.askhd{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.mark{flex:none;width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--legal));color:var(--panel)}
.mark svg{width:17px;height:17px}
.askhd .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.askhd .t b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.askhd .t small{font-size:12px;color:var(--mist)}
.hbtn{flex:none;width:32px;height:32px;border:0;background:none;color:var(--mist);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.hbtn:hover,.hbtn[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.hbtn svg{width:18px;height:18px}
.askbody{flex:1;min-height:0;overflow:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:18px}
.welcome{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.welcome .mark{width:46px;height:46px;border-radius:14px}
.welcome .mark svg{width:24px;height:24px}
.welcome h3{font-family:var(--display);font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
.welcome p{margin:0;color:var(--mist);font-size:14px;line-height:1.6}
.sugs{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.sug{display:flex;align-items:center;gap:11px;text-align:start;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;cursor:pointer;font-size:14px;line-height:1.45;color:var(--ink)}
.sug:hover{border-color:var(--accent);background:var(--accent-soft)}
.sug .si{flex:none;width:30px;height:30px;border-radius:9px;background:var(--raised);display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}
.sug .si svg{width:16px;height:16px}
.sug small{display:block;color:var(--faint);font-size:12px;margin-top:1px}
.mq{align-self:flex-start;max-width:86%;background:var(--accent-soft);border-radius:16px 16px 6px 16px;padding:9px 13px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.ma{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.ma .txt{font-size:14.5px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere;padding-top:3px}
.ma .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--mist)}
.chip:hover{color:var(--ink);border-color:var(--mist)}
.chip.go{border-color:var(--accent);color:var(--accent)}
.ma .note{font-size:12.5px;color:var(--faint);margin-top:6px;line-height:1.5}
.think{display:flex;flex-direction:column;gap:9px;padding-top:6px}
.think .st{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mist)}
.dots{display:inline-flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.35}
.sk{height:9px;border-radius:6px;background:linear-gradient(90deg,var(--raised) 20%,var(--line) 50%,var(--raised) 80%);background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){
  .dots i{animation:dot 1.1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes dot{40%{opacity:1;transform:translateY(-2px)}}
  .sk{animation:sh 1.4s infinite linear}@keyframes sh{from{background-position:100% 0}to{background-position:-100% 0}}}
.hist{display:flex;flex-direction:column;gap:2px}
.hist h4{margin:6px 10px 6px;font-size:12.5px;color:var(--faint);font-weight:700}
.hrow{display:flex;flex-direction:column;align-items:stretch;text-align:start;border:0;background:none;border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--ink);min-width:0}
.hrow:hover,.hrow.on{background:var(--raised)}
.hrow b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow span{font-size:12px;color:var(--faint)}
.hempty{color:var(--faint);font-size:14px;padding:10px}
.newchat{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);background:none;border-radius:12px;padding:9px 12px;color:var(--accent);font-weight:700;cursor:pointer;margin-bottom:6px}
.newchat svg{width:16px;height:16px}
.composer{flex:none;padding:10px 12px 12px;border-top:1px solid var(--line)}
.cbox{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:16px;background:var(--bg);padding:6px}
.cbox:focus-within{border-color:var(--accent)}
.cbox textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14.5px;line-height:1.5;padding:6px 8px;max-height:140px;outline:none}
.send{flex:none;width:34px;height:34px;border:0;border-radius:11px;background:var(--accent);color:var(--panel);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.send svg{width:17px;height:17px}
.send:disabled{opacity:.35;cursor:default}
.send.stop{background:var(--ink);color:var(--panel)}
.cfoot{font-size:11.5px;color:var(--faint);padding:6px 4px 0}
/* ---------- הגדרות ---------- */
/* the sidebar of "מבט על" and the settings stays put while the page scrolls */
@media (min-width:901px){.today>.tside{height:calc(100vh - var(--bar-h,47px));min-height:0;overflow:auto}}
.gear.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.settings .sec{scroll-margin-top:16px}
.settings .blk>p.lead{margin:0 0 6px;color:var(--mist);font-size:14px;line-height:1.6}
.settings .dim{font-size:12.5px;color:var(--faint);font-weight:400}
.fhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 8px}
.fhead .meta{font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}.fhead .meta b{color:var(--ink);font-weight:600}
.fhead .act{display:flex;gap:6px}
.ftable{display:flex;flex-direction:column;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);margin-bottom:6px}
.fr{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(110px,auto) 64px;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:8px}
.fr:hover{background:var(--raised)}
.fr>svg{width:16px;height:16px;color:var(--mist)}
.fr .fn{font-weight:600;font-size:14.5px;min-width:0}
.fr .fn small{display:block;font-weight:400;font-size:12.5px;color:var(--faint)}
.fr .fc{font-size:13px;color:var(--mist);text-align:start;display:flex;gap:8px;align-items:center;justify-content:flex-start}
.lnk{background:none;border:0;padding:2px 0;font:inherit;font-size:13px;color:var(--faint);cursor:pointer;justify-self:end}
.lnk:hover{color:var(--accent);text-decoration:underline}.lnk.danger:hover{color:var(--risk)}
.flist{display:flex;flex-direction:column;border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:10px;margin:4px 0 2px}
.fi{display:grid;grid-template-columns:16px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 10px;font-size:14px}
.fi+.fi{border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.fi svg{width:15px;height:15px;color:var(--mist)}
.fi .fn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .fc{font-size:12.5px;color:var(--faint)}
.sbtn.sm{padding:2px 8px;font-size:12px;font-weight:500;color:var(--mist)}
.settings .subh{font-size:14.5px;margin:14px 0 2px;font-family:var(--display)}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:4px 0 8px}
.src{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.src .h{display:flex;align-items:center;gap:8px;font-weight:700}
.src .h svg{width:17px;height:17px;color:var(--accent);flex:none}
.src .path{font-size:13px;color:var(--mist)}
.src .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.src .meta b{color:var(--ink);font-weight:600}
.src .act{margin-top:2px;display:flex;gap:6px}
.sbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}
/* first run: three steps, each with its own button */

function thinking(on){

/* "אחרי": the steps say what Areo actually reads for this question: the same data that goes into the question */
const STOPW=new Set(['שלנו','עושים','ביקשו','לשנות','סכם','סכמים','עמדה','מדיניות','אפשר','לחברה','חברה','צריך']);
const stem=w=>{w=w.replace(/["'׳״.,?!:()]/g,'');if(w.length>4&&w[0]==='ו')w=w.slice(1);if(w.length>4&&w[0]==='ה')w=w.slice(1);return w};

function policyTopic(q,pt){
  const qs=new Set(wordsOf(q));let best='',score=0;
  (String(pt).match(/^\[[^\]]+\]/gm)||[]).forEach(h=>{const t=h.slice(1,-1),n=wordsOf(t).filter(w=>qs.has(w)).length;if(n>score){score=n;best=t}});
  return best;
}
const andN=(n,one,many)=>n===1?'ו'+one:'ו-'+n+' '+many;
function clmCtx(){if(!HASCLM)return null;try{const w=FRAMES.clm&&FRAMES.clm.contentWindow;return w&&w.__areoCtx?w.__areoCtx():null}catch(e){return null}}
function plan(q){
  const N=read('nego'),P0=read('policy'),P=P0&&!P0.empty?P0:null,cc=clmCtx(),steps=[];
  if(N){const open=N.deals.filter(d=>d.st!=='signed'&&d.round).length;steps.push('קורא '+nn(open,'עסקה פתוחה אחת','עסקאות פתוחות')+' במשא ומתן')}
  if(cc) steps.push('עובר על '+nn(cc.agreements.length,'הסכם אחד בתוקף','הסכמים בתוקף')+' '+andN(cc.deadlines.length,'מועד אחד','מועדים'));
  const names=[].concat(N?N.deals.map(d=>d.cp):[],cc?cc.agreements.map(a=>a.cp):[]).filter(Boolean);
  const cp=names.find(n=>{const w=String(n).replace(/["׳״']/g,'').split(/\s+/)[0];return w.length>=3&&q.replace(/["׳״']/g,'').includes(w)});
  if(cp) steps.push('מתמקד ב'+cp);
  let pt='';try{const w=FRAMES.policy.contentWindow;pt=w.__areoPolicyText?String(w.__areoPolicyText()):''}catch(e){}
  /* the policy's own topic that shares the most words with the question ("תקרת האחריות" finds "הגבלת אחריות") */
  const topic=policyTopic(q,pt);
  steps.push(topic?'פותח במדיניות את "'+topic+'"':'פותח את המדיניות'+(P&&P.book?' "'+P.book+'"':''));
  steps.push('כותב תשובה עם שם ההסכם והסעיף');
  return steps;
}
function welcomeAfter(){
  const N=read('nego'),P0=read('policy'),P=P0&&!P0.empty?P0:null,cc=clmCtx(),bits=[];
  if(N) bits.push(nn(N.deals.filter(d=>d.st!=='signed'&&d.round).length,'עסקה פתוחה אחת','עסקאות פתוחות'));
  if(cc) bits.push(nn(cc.agreements.length,'הסכם אחד בתוקף','הסכמים בתוקף'));
  const src=bits.length?bits.join(', ')+(P&&P.book?' והמדיניות "'+P.book+'"':''):'';
  return ['שאלה על הסכם, מועד או עמדה במדיניות',src?'התשובה נשענת על '+src+', ומציינת את ההסכם והסעיף שממנו היא באה.':'התשובה נשענת על מה שיש במסכים, ומציינת את ההסכם והסעיף שממנו היא באה.'];
}
function localFallback(q,why){
  let txt='';try{const w=FRAMES.policy&&FRAMES.policy.contentWindow;txt=w&&w.__areoLocal?w.__areoLocal(q):''}catch(e){}
  return {content:txt||'לא הצלחתי לענות על זה עכשיו.',note:why};
}
async function ask(q){
  q=String(q||'').trim();if(!q||ASKCTL)return;
  VIEW='chat';
  let c=chat();
  if(!c){c={id:String(Date.now()),title:q.length>48?q.slice(0,48)+'…':q,at:Date.now(),tab:current(),turns:[]};CHATS.unshift(c);CUR=c.id}
  c.turns.push({role:'user',content:q});const a={role:'assistant',content:'',pending:true};c.turns.push(a);
  askin.value='';askin.style.height='';
  if(!SAMPLE){Object.assign(a,localFallback(q,'תשובה מהמדיניות בלבד. כדי לענות מכל המסכים, Areo צריכה אישור לשאול את Claude.'),{pending:false});saveChats();drawAsk();return}
  PLAN=LOOK==='o0'?plan(q):[];

  const cx=ctx();
  const turns=[{role:'user',content:rules(cx.company)+'\n\nהנתונים:\n'+cx.text}].concat(c.turns.filter(x=>!x.pending&&x.content&&!x.note).slice(-9).map(x=>({role:x.role,content:x.content})));
  try{
    const res=await SAMPLE(turns,{modelTier:'quick',cache:false,signal:ASKCTL.signal,onText:u=>{if(!a.content)thinking(false);a.content=u.text;drawAsk()}});
    a.content=res.text;
  }catch(e){
    const code=e&&e.code;
    if(code==='cancelled'){a.content=(e.text||'');a.note='נעצר.'}
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){SAMPLE=null;Object.assign(a,localFallback(q,'תשובה מהמדיניות בלבד, כי לא ניתן אישור לשאול את Claude.'))}
    else if(code==='rate_limited'){a.content=e.text||'';a.note='יותר מדי שאלות ברצף. אפשר לנסות שוב בעוד רגע.'}
    else {a.content=e&&e.text||'';a.note='התשובה נקטעה. אפשר לשאול שוב.'}
  }
  thinking(false);a.pending=false;ASKCTL=null;c.at=Date.now();saveChats();drawAsk();
}
function setBarH(){document.documentElement.style.setProperty('--bar-h',document.querySelector('.bar').offsetHeight+'px')}
function openAskp(){setBarH();askp.hidden=false;askbtn.setAttribute('aria-expanded','true');drawAsk();setTimeout(()=>askin.focus(),40)}
function closeAskp(){askp.hidden=true;askbtn.setAttribute('aria-expanded','false')}
askbtn.addEventListener('click',()=>askp.hidden?openAskp():closeAskp());
document.getElementById('askx').addEventListener('click',closeAskp);
document.getElementById('asknew').addEventListener('click',()=>{if(ASKCTL)return;CUR=null;VIEW='chat';drawAsk();askin.focus()});
askhist.addEventListener('click',()=>{VIEW=VIEW==='history'?'chat':'history';drawAsk()});
asksend.addEventListener('click',()=>{if(ASKCTL){ASKCTL.abort();return}ask(askin.value)});
askin.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!ASKCTL)ask(askin.value)}});
askin.addEventListener('input',()=>{askin.style.height='';askin.style.height=Math.min(askin.scrollHeight,140)+'px';asksend.disabled=!ASKCTL&&!askin.value.trim()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!askp.hidden)closeAskp()});
document.addEventListener('keydown',askKey);
window.addEventListener('resize',setBarH);
msgs.addEventListener('click',e=>{
  const s=e.target.closest('[data-sug]');if(s){ask(s.dataset.sug);return}
  const o=e.target.closest('[data-open-tab]');if(o){location.hash=o.dataset.openTab;return}
  const n=e.target.closest('[data-newchat]');if(n){CUR=null;VIEW='chat';drawAsk();askin.focus();return}
  const h=e.target.closest('[data-chat]');if(h){CUR=h.dataset.chat;VIEW='chat';drawAsk();return}
  const cp=e.target.closest('[data-copy]');if(cp){const c=chat(),x=c&&c.turns[+cp.dataset.copy];if(!x)return;const txt=splitOpen(x.content).body;
    const done=()=>{cp.lastChild.textContent='הועתק'};try{navigator.clipboard.writeText(txt).then(done,()=>{})}catch(err){}}
});
window.addEventListener('hashchange',()=>{if(!askp.hidden)drawAsk()});

applyTheme();
applyLook();
/* the open tab loads first, the rest right after it, in the background; "היום" needs all three */
const first=current();
const order=APPS[first]?[first].concat(KEYS.filter(k=>k!==first)):KEYS.slice();
make(order[0]);
sync();
if(SH.start==='setup')openFlow('setup');
/* a system that never went through the opening: once the screens are loaded and nothing is in it yet, the opening steps open by themselves */
else if(!SH.start&&location.hash!=='#playbook'){let tries=0;const chk=()=>{tries++;let done=false;try{done=localStorage.getItem('areo-onboard-done')==='1'}catch(e){}
  if(done||PBX)return;const N=read('nego'),P0=read('policy'),C=HASCLM?read('clm'):null;
  if(!(ready('nego')&&ready('policy')&&(!HASCLM||ready('clm')))){if(tries<40)setTimeout(chk,250);return}
  /* any activity (a deal, a playbook, a signed agreement): the regular overview, never the opening */
  const active=(N&&N.deals.length)||(P0&&!P0.empty)||(C&&(C.tasks.length||C.review||(C.ags&&C.ags.length)));
  if(active){try{localStorage.setItem('areo-onboard-done','1')}catch(e){}return}
  openFlow('setup')};setTimeout(chk,400)}
else if(SH.start==='playbook'||location.hash==='#playbook')window.__areoBuildPlaybook();
else if(SH.start==='draft')setTimeout(()=>{try{openNew()}catch(e){}},300);
else if(SH.start==='nego'){location.hash='nego';const f=FRAMES.nego,go=()=>{try{f.contentWindow.__areoNewDraft&&f.contentWindow.__areoNewDraft()}catch(e){}};
  if(f&&f.classList.contains('ready'))go();else if(f)f.addEventListener('load',()=>setTimeout(go,150),{once:true})}
setTimeout(()=>order.slice(1).forEach(make),APPS[first]?400:0);
</script>

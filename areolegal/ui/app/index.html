<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body><title>Areo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&family=David+Libre:wght@400;500;700&display=swap">
<style>
/* The system: a right sidebar for the three screens and the overview, the screens in frames beside it.
   Look (Neil, 10.11): light monochrome, the Areo green only where Areo speaks or a thing matches the policy. */
:root{
  --bg:#FAFAFA;--panel:#FFFFFF;--sub:#F3F3F3;--hover:#F7F7F7;--line:#EBEBEB;--line2:#DCDCDC;--line3:#E6E6E6;
  --ink:#171717;--ink2:#4D4D4D;--ink3:#8F8F8F;--g:#0B8C66;--gs:#EAF5F0;--gs2:#F2F8F5;--gs3:#EDF6F2;--gsh:#DFF0E8;
  --gb:#CFE7DC;--gb2:#A9D6C2;--gt:#0A6E50;--gt2:#3D5C50;--amber:#D98A1C;--at:#8A4B05;--ats:#FDF8EE;--atb:#F0D9AE;--atp:#FDF1E1;
  --red:#C8242F;--rt:#A01D27;--rs:#FCF1F2;--mark:#FFF1A8;--mid:#C9C9C9;--mid2:#D6D6D6;--hover2:#EDEDED;--inkh:#2E2E2E;--onink:#FFFFFF;
  --r1:6px;--r2:4px;--r3:3px;
  --ui:'Google Sans','Noto Sans Hebrew',system-ui,sans-serif;
  /* the old names, for the few lines that still read them */
  --accent:var(--g);--mist:var(--ink2);--faint:var(--ink3);--raised:var(--sub);
  color-scheme:light}
:root[data-theme="dark"]{--bg:#111214;--panel:#1A1B1E;--sub:#25262A;--hover:#212226;--line:#2C2D31;--line2:#3B3C41;--ink:#ECECEC;--ink2:#B9B9B9;--ink3:#8B8B8B;
  --g:#2FB98A;--gs:#15291F;--amber:#E2A042;--red:#E5555E;--mark:#5C4A00;--mid:#4A4B50;
  --onink:#111214;--gt:#5AD3A8;--gt2:#A9CFC1;--at:#EDB565;--rt:#F08A91;--ats:#2A2215;--atb:#4A3A1E;--atp:#3A2A12;--gb:#21503F;--gb2:#2E6E57;--gs2:#13231D;--gs3:#173027;--gsh:#1C3B30;--rs:#2B1719;--line3:#34353A;--hover2:#2A2B2F;--mid2:#45464B;--inkh:#D4D4D4;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{margin:0;font-family:var(--ui);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:500}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.mut{color:var(--ink3)}

/* ---------- the frame: sidebar + stage ---------- */
.shell{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr)}
.side{height:100%;min-height:0;overflow-y:auto;border-inline-end:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:2px;padding:18px 12px 14px;padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:calc(18px + env(safe-area-inset-top,0px))}
.logo{display:flex;align-items:center;gap:6px;padding:0 4px 16px}
.brand{direction:ltr;display:inline-flex;align-items:baseline;gap:0;color:var(--ink);font-size:23px;line-height:1;letter-spacing:-.4px;margin-inline-end:auto;white-space:nowrap}
.brand .wm{height:24px;width:auto;display:block;align-self:center}
.brand .b3{color:var(--ink3);font-weight:400;font-size:19px;margin-left:3px}
.brand .b4{width:6px;height:6px;border-radius:50%;background:var(--g);margin-left:2px;align-self:flex-end;margin-bottom:3px}
.brand .ic{display:none;width:30px;height:30px}
:root[data-theme="dark"] .brand .wm path{fill:var(--ink)}
.sidebtn{flex:none;width:28px;height:28px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--ink3);border-radius:var(--r2);cursor:pointer}
.sidebtn:hover{background:var(--sub);color:var(--ink)}
.sidebtn svg{width:16px;height:16px}
.nv{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r2);color:var(--ink2);font-size:13.5px;cursor:pointer;border:0;background:none;width:100%;text-align:start;white-space:nowrap}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nv .ct{margin-inline-start:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nv .ct:empty{display:none}
.nv .ct.w{color:var(--at)}.nv .ct.late{color:var(--rt)}
.nv.on{background:var(--sub);color:var(--ink);font-weight:500}
.nv.on::before{content:"";position:absolute;inset-inline-start:-12px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--g)}
.side .sep{height:1px;background:var(--line);margin:10px 10px;flex:none}
.side .newb{margin:4px 0 0;justify-content:center}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px}
.org{padding:6px 10px;display:flex;flex-direction:column;min-width:0}
.org b{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org span{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.org:empty,.org b:empty,.org span:empty{display:none}
/* the rail: by choice, between phone and wide screens, and inside a negotiation document */
@media (min-width:861px){
  body.closed .shell{grid-template-columns:60px minmax(0,1fr)}
  body.closed .side{padding-inline:8px;align-items:center}
  body.closed .logo{flex-direction:column;padding:2px 0 12px;gap:8px}
  body.closed .brand{margin:0}
  body.closed .brand>:not(.ic){display:none}body.closed .brand .ic{display:block}
  body.closed .nv{font-size:0;gap:0;justify-content:center;padding:9px;width:40px}
  body.closed .nv .ct{display:none}
  body.closed .nv.on::before{inset-inline-start:-8px}
  body.closed .newb{font-size:0;gap:0;width:40px;padding:0;justify-content:center}
  body.closed .org{display:none}
  body.closed .sep{width:28px;margin-inline:auto}
  body.closed .foot{align-items:center;width:100%}}
@media (prefers-reduced-motion:no-preference){.shell{transition:grid-template-columns .2s cubic-bezier(.2,.8,.2,1)}}
.stage{position:relative;min-width:0;min-height:0;height:100%;background:var(--bg)}
.stage iframe,.stage .today{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);visibility:hidden;opacity:0}
.stage iframe.on.ready,.stage .today.on{visibility:visible;opacity:1}
/* building a playbook: the playbook steps open over the policy screen, inside the system */
.stage iframe.pbx{z-index:5}.stage iframe.pbx.on{visibility:visible;opacity:1}
@media (prefers-reduced-motion:no-preference){.stage iframe.on.ready,.stage .today.on{transition:opacity .12s ease-out}}
.stage>.wait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:13.5px}
/* phone: the sidebar becomes a bar on top */
@media (max-width:860px){
  .shell{display:flex;flex-direction:column}
  .side{flex:none;height:auto;flex-direction:row;align-items:center;gap:2px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));padding-top:calc(8px + env(safe-area-inset-top,0px));border-inline-end:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .logo{padding:0 4px 0 10px}.brand{font-size:20px}.brand .wm{height:20px}.brand .b3{display:none}
  .sidebtn{display:none}
  .nv{width:auto;padding:6px 10px}
  .nv.on::before{inset-inline-start:10px;inset-inline-end:10px;top:auto;bottom:-9px;width:auto;height:2px}
  .nv svg,.nv .ct,.side .sep{display:none}
  .side .newb{margin:0 6px 0 0;flex:none}
  .side .foot{display:flex;flex-direction:row;margin:0;padding:0;border:0}
  .side .foot .org{display:none}
  .side .foot .gear svg{display:block}.side .foot .gear{font-size:0;gap:0;padding:7px}
  .stage{flex:1}}

/* ---------- common ---------- */
.main{min-width:0;padding-block:28px 96px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%}
@media (max-width:860px){.main{padding-block:20px 88px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph .k{font-size:12.5px;color:var(--ink3)}
.ph h1{font-size:26px;line-height:1.2;margin-top:2px;text-wrap:balance}
.ph .sub{font-size:13.5px;color:var(--ink2);margin-top:4px;max-width:72ch}
.ph .sub .lat{color:var(--rt)}
.row-acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:32px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--panel);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.btn.pri:hover{background:var(--inkh)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--sub);color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.025)}
.phd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:500;font-size:13.5px}
.phd>span:first-child{display:flex;align-items:center;gap:8px}
.phd .m{font-weight:400;color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.hacts{display:flex;align-items:center;gap:14px}.hacts .btn.sm{height:26px;font-weight:500}
.lnk{background:none;border:0;padding:0;color:var(--ink2);font-size:12.5px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;font-weight:400}
.lnk:hover{color:var(--ink);text-decoration-color:var(--ink)}
.lnk.danger{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dot,var(--ink3));flex:none}
.pill.dec{--dot:var(--amber)} .pill.ok{--dot:var(--g)} .pill.red{--dot:var(--red);color:var(--rt)} .pill.ink{--dot:var(--ink)} .pill.wait{--dot:var(--mid)}
.empty{padding:22px 16px;text-align:center;color:var(--ink3);font-size:13px}
.g2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1080px){.g2{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.prog{height:4px;border-radius:2px;background:var(--sub);overflow:hidden}
.prog i{display:block;height:100%;background:var(--g);border-radius:2px;transition:width .3s}
.tcount{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 6px;margin-inline-start:7px;border-radius:9px;background:var(--sub);color:var(--ink3);font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}

/* ---------- מבט על ---------- */
.today{overflow:auto}
.kpis{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);box-shadow:0 1px 2px rgba(0,0,0,.025)}
.kpi{padding:16px 18px;border:0;border-inline-start:1px solid var(--line);background:none;text-align:start;cursor:pointer;min-width:0}
.kpi:first-child{border-inline-start:0}
.kpi:hover{background:var(--hover)}
.kpi .v{font-size:28px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;min-width:0}
.kpi .v small{font-size:12px;font-weight:500;color:var(--gt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v small.r{color:var(--rt)}
.kpi .l{font-size:12.5px;color:var(--ink2);margin-top:5px}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(odd){border-inline-start:0}.kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}.kpis[style*="--n:2"] .kpi{border-bottom:0}.kpis[style*="--n:3"] .kpi:nth-child(3){grid-column:1/-1}}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;width:100%;text-align:start;color:var(--ink)}
.li:last-child{border-bottom:0}
.li:hover{background:var(--hover)}
.li.static{cursor:default}.li.static:hover{background:none}
.li .nm{display:flex;flex-direction:column;min-width:0}
.li .nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .nm span{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .w{font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:52px;text-align:end}
.li .w:empty{min-width:0}
.li.more .nm span{color:var(--ink2);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.dt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;min-width:0}
.day{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:var(--r2);padding:3px 0;line-height:1.15}
.day b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.day span{font-size:10.5px;color:var(--ink3)}
.act{padding:10px 16px;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;font-size:13px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .w{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.act small{display:block;color:var(--ink3);font-size:12px}
.htask{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.phd+.htask{border-top:0}
.hmain{display:flex;flex-direction:column;gap:1px;border:0;background:none;text-align:start;padding:0;cursor:pointer;font:inherit;color:inherit;min-width:0}
.hmain b{font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hmain span{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmain:hover b{text-decoration:underline}
.hwhen{font-size:12px;color:var(--ink3);white-space:nowrap}.hwhen.soon{color:var(--at)}.hwhen.r{color:var(--rt)}
.cb{width:18px;height:18px;border-radius:var(--r3);border:1.5px solid var(--line2);background:var(--panel);cursor:pointer;display:grid;place-items:center;padding:0}
.cb:hover{border-color:var(--ink3)}
.cb.on{background:var(--g);border-color:var(--g)}
.cb.on::after{content:"";width:9px;height:5px;border:2px solid var(--onink);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.polb{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.polb .t{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2)}.polb .t b{font-weight:500;color:var(--ink)}
.polb small{font-size:12.5px;color:var(--ink3)}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.phd+.drow{border-top:0}
.drow .nm{display:flex;flex-direction:column;gap:2px;min-width:0}.drow .nm b{font-weight:500;font-size:14px}.drow .nm span{font-size:12.5px;color:var(--ink3)}
.dst{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--at);white-space:nowrap}
.dst.ok{color:var(--gt)}.dst.r{color:var(--rt)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.dst.ok .pulse{background:var(--g)}.dst.r .pulse{background:var(--red)}
@media (prefers-reduced-motion:no-preference){.pulse.on{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}}
@media (max-width:860px){.drow{grid-template-columns:1fr;gap:6px}}
@media (max-width:560px){.li{grid-template-columns:minmax(0,1fr) auto}.li .w{display:none}.act{grid-template-columns:1fr;gap:2px}}
/* first run: three steps, each with its own button */
.welcome{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.welcome h2{font-size:16px}
.welcome .wl{color:var(--ink2);font-size:13.5px}
.wsteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r2)}
.wsteps li{display:flex;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.wsteps li:first-child{border-top:0}
.wsteps .n{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;border:1px solid var(--line2);color:var(--ink2)}
.wsteps li.ok .n{background:var(--g);border-color:var(--g);color:var(--onink)}

@media (max-width:560px){.wsteps li{flex-wrap:wrap}.wsteps .ac{width:100%;justify-content:flex-start;padding-inline-start:38px}}

/* ---------- הגדרות ---------- */

.sjump:hover{background:var(--hover);color:var(--ink)}
.sjump svg,.sfr>svg,.priv svg,.ski svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scol{display:flex;flex-direction:column;gap:14px;min-width:0}
.ssec{padding:18px 20px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.sh2 h2{font-size:17px;display:flex;align-items:center}.sh2 p{font-size:13px;color:var(--ink2);margin-top:2px}
.sfh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink3)}.sfh b{font-weight:500;color:var(--ink)}
.sfh .chips{display:flex;gap:6px;flex-wrap:wrap}
.ftab{border:1px solid var(--line);border-radius:var(--r2)}
.sfr{display:grid;grid-template-columns:18px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);color:var(--ink2)}
.sfr:first-child{border-top:0}
.sfn{display:flex;flex-direction:column;color:var(--ink);font-size:13.5px;min-width:0}.sfn small{font-size:12px;color:var(--ink3)}
.sfc{font-size:13px;color:var(--ink2)}
.subh{font-size:13.5px;font-weight:500;margin-top:6px}.subh .mut{font-weight:400;font-size:12.5px}
.srows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.srow:last-child{border-bottom:0}

</style></head><body><title>Areo משא ומתן</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Areo family. Home = the deals; a deal = one working screen: queue of changes, the agreement on paper, one focused panel */
:root{
  --night:#0d0f14; --panel:#14171f; --raised:#1b1f29; --line:#272d3a; --line-strong:#353c4c;
  --ink:#eef1f5; --mist:#9aa3b2; --faint:#6b7486;
  --aurora:#2fe6a6; --aurora-ink:#06231a; --aurora-soft:rgba(47,230,166,.12);
  --g:#38d39f; --g-soft:rgba(56,211,159,.10); --y:#f2b45c; --y-soft:rgba(242,180,92,.10); --r:#f2676c; --r-soft:rgba(242,103,108,.10);
  --legal:#b6a3ff; --legal-soft:rgba(167,139,250,.14);
  --desk:#090b0f; --paper:#FBFAF6; --paper-ink:#1d2027; --paper-mist:#6a6f7a; --paper-line:#e7e3d8;
  --ins:#0a7a58; --ins-bg:rgba(10,122,88,.09); --del:#b3261e; --canvas:#1a1d24; --rev:#c00000; --sel:rgba(47,230,166,.18);
  --display:'Rubik','Assistant',system-ui,sans-serif; --body:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mark:'Poppins','Assistant',sans-serif; --legaltype:'Frank Ruhl Libre','David','Times New Roman',serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --night:#F4F7F5; --panel:#FFFFFF; --raised:#F0F3F6; --line:#DBE4E0; --line-strong:#C6D3CD;
  --ink:#10221C; --mist:#4F615A; --faint:#7A8A84;
  --aurora:#0B8C66; --aurora-ink:#FFFFFF; --aurora-soft:#E1F5EC;
  --g:#0F9D6E; --g-soft:#E7F6EF; --y:#B07A06; --y-soft:#FBF3DF; --r:#C93434; --r-soft:#FCEBEB;
  --legal:#4A30A8; --legal-soft:#EFEAFD; --desk:#E3E9E6; --canvas:#E6E8EB; --sel:rgba(11,140,102,.13); color-scheme:light}}
:root[data-theme="light"]{
  --night:#F4F7F5; --panel:#FFFFFF; --raised:#F0F3F6; --line:#DBE4E0; --line-strong:#C6D3CD;
  --ink:#10221C; --mist:#4F615A; --faint:#7A8A84;
  --aurora:#0B8C66; --aurora-ink:#FFFFFF; --aurora-soft:#E1F5EC;
  --g:#0F9D6E; --g-soft:#E7F6EF; --y:#B07A06; --y-soft:#FBF3DF; --r:#C93434; --r-soft:#FCEBEB;

*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
html.locked,html.locked body{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:26px;font-weight:700}h2{font-size:19px;font-weight:600}h3{font-size:16.5px;font-weight:600}
p{margin:0}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.app>aside{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.wordmark{font-family:var(--mark);font-weight:700;font-size:20px;direction:ltr;text-align:right;letter-spacing:-.3px;padding:0 6px}
.product{font-size:13.5px;color:var(--aurora);font-weight:600;padding:0 6px;margin-top:-10px}
.product small{font-size:12px;font-weight:500;color:var(--mist)}
.sect{font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.4px;padding:0 6px;margin-bottom:-8px}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-inline-start:3px solid transparent;border-radius:10px;padding:8px 10px;color:var(--mist);font-size:15px;cursor:pointer}
.nv svg{width:17px;height:17px;flex:0 0 auto}
.nv:hover{background:var(--raised);color:var(--ink)}
.nv[aria-current="page"]{background:var(--aurora-soft);color:var(--aurora);font-weight:600;border-inline-start-color:var(--aurora)}
.nv .cnt{margin-inline-start:auto;font-size:12px;font-weight:700;background:var(--raised);color:var(--mist);border-radius:999px;padding:0 8px;line-height:20px}
.side-deals{display:flex;flex-direction:column;gap:2px}
.sd{display:grid;grid-template-columns:10px 1fr;gap:8px;align-items:center;width:100%;text-align:start;background:none;border:0;border-inline-start:3px solid transparent;border-radius:10px;padding:7px 10px;cursor:pointer}
.sd:hover{background:var(--raised)}
.sd[aria-current="page"]{background:var(--aurora-soft);border-inline-start-color:var(--aurora)}
.sd b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.sd span{display:block;font-size:12.5px;color:var(--mist);line-height:1.35}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:0 0 auto}

.newbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--line-strong);border-radius:12px;padding:9px;background:none;color:var(--aurora);font-weight:600;cursor:pointer}
.newbtn:hover{border-color:var(--aurora);background:var(--aurora-soft)}
.newbtn svg{width:16px;height:16px}
.xlinks{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.xlink{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--ink);text-decoration:none;font-size:14px}
.xlink:hover{border-color:var(--aurora)}.xlink small{display:block;color:var(--mist);font-size:12px}
.asidefoot{font-size:12px;color:var(--faint);padding:0 6px}
main{padding:18px 22px 60px;min-width:0}
.col{max-width:1180px;display:flex;flex-direction:column;gap:18px}
.iconbtn{height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer;font-size:14px}
.iconbtn svg{width:17px;height:17px}.iconbtn:disabled{opacity:.4;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:8px 16px;font-weight:600;cursor:pointer;font-size:15px;white-space:nowrap;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--aurora);color:var(--aurora-ink)}.btn.primary:hover{filter:brightness(1.06)}
.btn.soft{background:var(--raised);border-color:var(--line-strong);color:var(--ink)}.btn.soft:hover{border-color:var(--aurora)}
.btn.ghost{background:none;border-color:var(--line-strong);color:var(--ink)}.btn.ghost:hover{border-color:var(--aurora)}
.btn.legal{background:var(--legal);color:#fff}
.btn.small{padding:5px 12px;font-size:14px}
.btn.big{padding:11px 18px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.42;cursor:default;filter:none}
.linkbtn{background:none;border:0;padding:0;color:var(--aurora);cursor:pointer;font-weight:600;font-size:14px}
.lead{color:var(--mist);max-width:72ch}
.muted{color:var(--mist)}.faint{color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cardh small{color:var(--mist);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap;line-height:21px}
.pill.g{background:var(--g-soft);color:var(--g)}.pill.y{background:var(--y-soft);color:var(--y)}.pill.r{background:var(--r-soft);color:var(--r)}
.pill.w{background:var(--legal-soft);color:var(--legal)}.pill.n{background:var(--raised);color:var(--mist)}.pill.a{background:var(--aurora-soft);color:var(--aurora)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.g{background:var(--g)}.dot.y{background:var(--y)}.dot.r{background:var(--r)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line-strong);background:none;border-radius:999px;padding:2px 11px;font-size:13.5px;cursor:pointer;color:var(--mist)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--night);border-color:var(--ink);font-weight:600}
.homehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dropstrip{display:flex;align-items:center;gap:16px;border:2px dashed var(--line-strong);border-radius:16px;padding:16px 20px;cursor:pointer;background:none;width:100%;text-align:start;transition:border-color .2s,background .2s}
.dropstrip:hover,.dropstrip.over{border-color:var(--aurora);background:var(--aurora-soft)}
.dropstrip .ic{width:44px;height:44px;border-radius:12px;background:var(--aurora-soft);color:var(--aurora);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.dropstrip .ic svg{width:24px;height:24px}
.dropstrip b{display:block;font-family:var(--display);font-size:17px;font-weight:600}
.dropstrip .t span{color:var(--mist);font-size:14.5px}
.group{display:flex;flex-direction:column;gap:10px}
.grouph{display:flex;align-items:center;gap:10px}
.grouph h2{font-size:17px}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.dcard{display:flex;flex-direction:column;gap:12px;text-align:start;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;cursor:pointer;width:100%}
.dcard:hover{border-color:var(--aurora)}
.dcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dcard h3{font-size:18px}
.dcard .sub{font-size:13.5px;color:var(--mist)}
.dcard .state{font-size:14.5px;font-weight:600}
.meter{display:flex;gap:3px;height:6px}
.meter i{flex:1;border-radius:3px;background:var(--line-strong)}
.meter i.ok{background:var(--aurora)}.meter i.w{background:var(--legal)}.meter i.y{background:var(--y)}.meter i.th{background:var(--faint)}
.dcard .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.empty{border:1px dashed var(--line-strong);border-radius:16px;padding:16px 18px;color:var(--mist);font-size:14.5px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:start;font-size:12.5px;color:var(--mist);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--raised)}
.dhead{display:flex;flex-direction:column;gap:12px}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.back{background:none;border:0;padding:0;color:var(--mist);cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.back:hover{color:var(--aurora)}
.dtitle{display:flex;flex-direction:column;gap:4px}
.dfacts{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mist);font-size:14px}
.dfacts b{color:var(--ink);font-weight:600}
.dact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rounds{display:flex;gap:6px;flex-wrap:wrap}
.rchip{border:1px solid var(--line-strong);background:var(--panel);border-radius:10px;padding:4px 12px;font-size:13.5px;cursor:pointer;color:var(--mist);display:flex;gap:6px;align-items:center}
.rchip[aria-pressed="true"]{border-color:var(--aurora);color:var(--ink);font-weight:600}
.rchip small{color:var(--faint);font-weight:500}
.progress{display:flex;flex-direction:column;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
.ptext{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--mist)}
.ptext b{color:var(--ink)}
.psegs{display:flex;gap:3px}
.psegs button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line-strong);cursor:pointer;padding:0}
.psegs button.ok{background:var(--aurora)}.psegs button.w{background:var(--legal)}.psegs button.y{background:var(--y)}.psegs button.th{background:var(--faint)}
.psegs button.on{outline:2px solid var(--ink);outline-offset:2px}
.banner{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;border-radius:14px;padding:10px 14px;border:1px solid var(--y);background:var(--y-soft);font-size:14.5px}
.banner.sent{border-color:var(--line-strong);background:var(--raised)}
.banner.ok{border-color:var(--aurora);background:var(--aurora-soft)}
.wbgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start;margin-top:16px}
@media (max-width:1240px){.wbgrid{grid-template-columns:minmax(0,1fr) 350px;gap:18px}}
@media (max-width:980px){.wbgrid{grid-template-columns:minmax(0,1fr)}}
.queue{position:sticky;top:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 28px);overflow:hidden}
.qh{padding:12px 12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.qlist{overflow:auto;padding:6px}
.qi{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:start;width:100%;text-align:start;background:none;border:0;border-radius:10px;padding:8px;cursor:pointer}
.qi:hover{background:var(--raised)}
.qi.on{background:var(--aurora-soft)}
.qi .n{font-family:var(--display);font-size:13px;font-weight:600;color:var(--mist);text-align:center;border-radius:7px;line-height:22px;background:var(--raised)}
.qi.done .n{background:var(--aurora);color:var(--aurora-ink)}
.qi b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.qi span{display:block;font-size:12.5px;color:var(--mist);line-height:1.35}
.qi .st{font-size:11.5px;font-weight:700;border-radius:999px;padding:0 7px;line-height:19px;white-space:nowrap;margin-top:2px}
.st.w{background:var(--legal-soft);color:var(--legal)}.st.y{background:var(--y-soft);color:var(--y)}.st.th{background:var(--raised);color:var(--mist)}
.center{display:flex;flex-direction:column;gap:10px;min-width:0}
.ptools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:4px 12px;font-size:14px;color:var(--mist);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.legend{display:flex;gap:12px;font-size:13px;color:var(--mist);flex-wrap:wrap;align-items:center}
.desk{background:var(--desk);border-radius:18px;padding:18px clamp(8px,1.6vw,26px);min-width:0}
.paper{background:var(--paper);color:var(--paper-ink);max-width:800px;margin:0 auto;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 16px 44px -26px rgba(0,0,0,.4);padding:clamp(20px,3.4vw,52px) clamp(18px,3.4vw,52px) 60px;font-family:var(--legaltype);font-size:16.5px;line-height:1.85;position:relative}
.paper .hdr{display:flex;justify-content:space-between;gap:10px;font-family:var(--body);font-size:12px;color:var(--paper-mist);border-bottom:1px solid var(--paper-line);padding-bottom:10px;margin-bottom:22px}
.pp{position:relative;border-radius:6px;padding:3px 10px;margin:0 -10px;transition:background .2s}
.pp[data-d]{cursor:pointer}
.pp[data-d]:hover{background:rgba(0,0,0,.035)}

.pp.title{text-align:center;font-weight:700;font-size:23px;margin-bottom:6px}
.pp.head{font-weight:700;margin-top:16px}
.pp .num{position:absolute;inset-inline-end:-40px;top:6px;font-family:var(--body);font-size:11px;font-weight:700;border-radius:7px;min-width:22px;text-align:center;line-height:20px;background:#d9d5ca;color:#3a3d44}
.pp .num.ok{background:#0a7a58;color:#fff}.pp .num.w{background:#6a4fd0;color:#fff}.pp .num.y{background:#c98a10;color:#fff}.pp .num.th{background:#9aa0a8;color:#fff}

.paper del{color:var(--del);text-decoration:line-through;text-decoration-thickness:1.5px}

.pp.newp{border-inline-start:2px solid var(--ins)}
.cm{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:5px;background:#f3e3a6;color:#5b4a0b;vertical-align:3px;margin-inline-start:4px}
.cm svg{width:11px;height:11px}

.ih{padding:13px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;position:sticky;top:0;background:var(--panel);z-index:2}

/* ===== mono: the Areo look (light monochrome, Areo green only where Areo speaks or a decision matches the policy). The shell sets data-look="mono" ===== */
html[data-look="mono"]:root{
  --bg:#FAFAFA;--panel:#FFFFFF;--sub:#F3F3F3;--hover:#F7F7F7;--line:#EBEBEB;--line2:#DCDCDC;--line3:#E6E6E6;
  --ink:#171717;--ink2:#4D4D4D;--ink3:#8F8F8F;--g:#0B8C66;--gs:#EAF5F0;--gs2:#F2F8F5;--gs3:#EDF6F2;--gsh:#DFF0E8;--gb:#CFE7DC;--gb2:#A9D6C2;--gt:#0A6E50;--gt2:#3D5C50;
  --amber:#D98A1C;--at:#8A4B05;--ats:#FDF8EE;--atb:#F0D9AE;--atp:#FDF1E1;--red:#C8242F;--rt:#A01D27;--rs:#FCF1F2;--mark:#FFF1A8;--mid:#C9C9C9;--mid2:#D6D6D6;--hover2:#EDEDED;--inkh:#2E2E2E;--onink:#FFFFFF;
  --r1:6px;--r2:4px;--r3:3px;
  --ui:'Google Sans','Noto Sans Hebrew',system-ui,sans-serif;--doc:'David Libre','Noto Serif Hebrew',David,serif;
  /* the screen's own names, on the same values */
  --night:var(--bg);--raised:var(--sub);--line-strong:var(--line2);--mist:var(--ink2);--faint:var(--ink3);
  --aurora:var(--g);--aurora-ink:var(--onink);--aurora-soft:var(--gs);--g-soft:var(--gs);--y:var(--amber);--y-soft:var(--atp);--r:var(--red);--r-soft:var(--rs);
  --legal:var(--ink);--legal-soft:var(--sub);--desk:var(--hover2);--canvas:var(--hover2);--paper:var(--panel);--paper-ink:var(--ink);--paper-mist:var(--ink3);--paper-line:var(--line);
  --ins:var(--g);--ins-bg:transparent;--del:var(--red);--rev:var(--red);--sel:var(--gs3);
  --display:var(--ui);--body:var(--ui);--legaltype:var(--doc);
  color-scheme:light}
html[data-look="mono"][data-theme="dark"]:root{
  --bg:#111214;--panel:#1A1B1E;--sub:#25262A;--hover:#212226;--line:#2C2D31;--line2:#3B3C41;--line3:#34353A;
  --ink:#ECECEC;--ink2:#B9B9B9;--ink3:#8B8B8B;--g:#2FB98A;--gs:#15291F;--gs2:#13231D;--gs3:#173027;--gsh:#1C3B30;--gb:#21503F;--gb2:#2E6E57;--gt:#5AD3A8;--gt2:#A9CFC1;
  --amber:#E2A042;--at:#EDB565;--ats:#2A2215;--atb:#4A3A1E;--atp:#3A2A12;--red:#E5555E;--rt:#F08A91;--rs:#2B1719;--mark:#5C4A00;--mid:#4A4B50;--mid2:#45464B;--hover2:#2A2B2F;--inkh:#D4D4D4;--onink:#111214;
  color-scheme:dark}
html[data-look="mono"] body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[data-look="mono"] :is(h1,h2,h3){font-family:var(--ui);font-weight:500}
html[data-look="mono"] :focus-visible{outline:2px solid var(--g);outline-offset:2px}
html[data-look="mono"] .num,html[data-look="mono"] .ptext,html[data-look="mono"] .statusbar{font-variant-numeric:tabular-nums}

/* no sub-sidebar: the shell holds the main menu; this screen's places sit at the top of the page (home = all the deals, the drop strip = a draft you received) */
html[data-look="mono"] body .app{display:block!important;grid-template-columns:minmax(0,1fr)!important}
html[data-look="mono"] body .app>aside{display:none!important}
html[data-look="mono"] main{padding:28px 32px 72px;padding-left:max(32px,env(safe-area-inset-left,0px));min-width:0}
html[data-look="mono"] body[data-view="deal"] main{padding:18px 24px 24px;padding-left:max(24px,env(safe-area-inset-left,0px))}
html[data-look="mono"] .col{max-width:1240px;gap:20px}

/* buttons, links, chips, pills */
html[data-look="mono"] .btn{height:32px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--panel);color:var(--ink);font-size:13px;font-weight:500;gap:7px;filter:none}

html[data-look="mono"] :is(.btn.primary,.btn.legal):hover{background:var(--inkh);border-color:var(--inkh)}
html[data-look="mono"] .btn.soft{background:var(--panel);border-color:var(--line2);color:var(--ink)}
html[data-look="mono"] .btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}

html[data-look="mono"] .iconbtn{width:32px;min-width:32px;height:32px;padding:0;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);color:var(--ink2);font-size:13px}
html[data-look="mono"] .iconbtn:hover{color:var(--ink);background:var(--hover)}
html[data-look="mono"] .iconbtn svg{width:15px;height:15px}
html[data-look="mono"] .chip{height:28px;padding:0 11px;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center}

html[data-look="mono"] .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--onink);font-weight:500}
html[data-look="mono"] .pill{background:none;border:0;padding:0;border-radius:0;font-size:12px;font-weight:400;color:var(--ink2);gap:6px;line-height:1.5}
html[data-look="mono"] .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dot,var(--ink3));flex:none}
html[data-look="mono"] :is(.pill.g,.pill.a){--dot:var(--g)}html[data-look="mono"] .pill.y{--dot:var(--amber)}html[data-look="mono"] .pill.r{--dot:var(--red);color:var(--red)}html[data-look="mono"] .pill.n{--dot:var(--mid)}html[data-look="mono"] .pill.w{--dot:var(--ink)}html[data-look="mono"] .pill.f{--dot:var(--ink2);border:0}
html[data-look="mono"] .dcard .chips .pill{font-size:11.5px;padding:2px 8px;border-radius:var(--r3);background:var(--sub);color:var(--ink2)}
html[data-look="mono"] .dcard .chips .pill::before{display:none}
html[data-look="mono"] .dcard .chips .pill.y{background:var(--atp);color:var(--at)}
html[data-look="mono"] .muted{color:var(--ink2)}html[data-look="mono"] .faint{color:var(--ink3)}
html[data-look="mono"] .lead{color:var(--ink2);font-size:13.5px;margin-top:4px}
html[data-look="mono"] .empty{border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);padding:24px 16px;text-align:center;color:var(--ink3);font-size:13px}
html[data-look="mono"] .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);box-shadow:0 1px 2px rgba(0,0,0,.025);padding:16px}
html[data-look="mono"] .card h2{font-size:16px}html[data-look="mono"] .card h3{font-size:14.5px}
html[data-look="mono"] .cardh small{color:var(--ink3);font-size:12.5px}
html[data-look="mono"] :is(.dot){width:8px;height:8px}html[data-look="mono"] .dot.g{background:var(--g)}html[data-look="mono"] .dot.y{background:var(--amber)}html[data-look="mono"] .dot.r{background:var(--red)}
html[data-look="mono"] .note{background:var(--sub);border-radius:var(--r2);color:var(--ink2);font-size:13px}

html[data-look="mono"] #toast{background:var(--ink);color:var(--onink);border-radius:var(--r2);font-size:13.5px;font-weight:400;padding:10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);max-width:calc(100% - 32px)}

html[data-look="mono"] .segtip{background:var(--ink);color:var(--onink);border-radius:var(--r2);font-weight:400;box-shadow:0 4px 12px rgba(0,0,0,.12)}

/* home: the header, what now, the drop strip, the two columns, the signed agreements */

const pos=x=>x.op==='insert_paragraph'?x.after_para+.5:x.para;
function prepRound(deal,r){

function headOf(r,i){for(let j=i;j>=0;j--){const p=r.paras[j];if(p&&p.k==='head')return String(p.t||'').replace(/^[\d.\s‏]+/,'').trim()}return ''}

  const pre=rkey(d,r)+'__'+MINE,ids=new Set();
  Object.keys(S.marks).forEach(k=>{if(k.indexOf(pre)!==0)return;const m=S.marks[k];if(m&&m.user&&!m.dropped)ids.add(+k.slice(pre.length))});
  if(S.pend&&S.pend.k===rkey(d,r))ids.add(S.pend.para);
  return [...ids].filter(i=>r.paras[i]&&r.paras[i].k!=='tbl').sort((a,b)=>a-b).map(i=>({id:MINE+i,op:'replace',para:i,new_text:r.paras[i].t,mine:true,topic:headOf(r,i),
    summary:'שינוי שלכם בסבב הזה',plain_effect:'שינוי שיזמתם בסבב הזה. הוא נכנס להסכם בעקוב אחר שינויים, כמו התיקונים של Areo.'}));
}
function syncRound(d,r){
  r.byPara={};r.inserts={};
  r.decisions.forEach(x=>{if(x.op==='insert_paragraph')(r.inserts[x.after_para]=r.inserts[x.after_para]||[]).push(x);else r.byPara[x.para]=x});
  let mine=[];try{mine=mineDecs(d,r).filter(x=>!isReal(r.byPara[x.para]))}catch(e){/* before the state is loaded */}
  mine.forEach(x=>{r.byPara[x.para]=x});
  r.changes=r.decisions.filter(isReal).concat(mine).sort((a,b)=>pos(a)-pos(b));
}

/* ---------- text ---------- */
function words(s){return String(s).split(/(\s+)/).filter(x=>x!=='')}
function diff(a,b){
  const A=words(a),B=words(b),n=A.length,m=B.length,T=Array.from({length:n+1},()=>new Int16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)T[i][j]=A[i]===B[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  let out=[];let i=0,j=0;const push=(k,t)=>{const l=out[out.length-1];if(l&&l.k===k)l.t+=t;else out.push({k,t})};
  while(i<n&&j<m){if(A[i]===B[j]){push('=',A[i]);i++;j++}else if(T[i+1][j]>=T[i][j+1]){push('-',A[i]);i++}else{push('+',B[j]);j++}}
  while(i<n)push('-',A[i++]);while(j<m)push('+',B[j++]);
  out=out.map(x=>(x.k!=='='&&!x.t.trim())?{k:'=',t:x.t}:x);
  // read like a lawyer marks up: a word or two left standing between changes joins the change,
  // and each run of changes becomes one deletion followed by one insertion
  const res=[];let del='',ins='';const flush=()=>{if(del)res.push({k:'-',t:del});if(ins)res.push({k:'+',t:ins});del='';ins=''};
  out.forEach((s,k)=>{
    if(s.k==='='){const nx=out[k+1],w=s.t.trim();if((del||ins)&&nx&&nx.k!=='='&&(!w||(w.split(/\s+/).length<=2&&w.length<14))){del+=s.t;ins+=s.t;return}flush();const l=res[res.length-1];if(l&&l.k==='=')l.t+=s.t;else res.push({k:'=',t:s.t})}
    else if(s.k==='-')del+=s.t;else ins+=s.t;
  });
  flush();
  // a clause mostly rewritten: their text out, ours in, keeping the shared clause number
  const same=res.filter(s=>s.k==='=').reduce((t,s)=>t+s.t.replace(/\s/g,'').length,0);
  if(a.replace(/\s/g,'').length>40&&same<0.5*a.replace(/\s/g,'').length){
    const pa=a.match(/^\d+(\.\d+)*\s+/),pb=b.match(/^\d+(\.\d+)*\s+/),p=pa&&pb&&pa[0]===pb[0]?pa[0]:'';
    return (p?[{k:'=',t:p}]:[]).concat([{k:'-',t:a.slice(p.length)},{k:'+',t:' '+b.slice(p.length)}]);
  }
  return res;
}
const segHtml=segs=>segs.map(s=>s.k==='='?esc(s.t):s.k==='-'?'<del>'+esc(s.t)+'</del>':'<ins>'+esc(s.t)+'</ins>').join('');
function fallbackText(r,x){if(x.op!=='replace')return null;const ru=(x.rule_ids||[]).map(id=>rule(id,r)).find(z=>z&&z.yellow_steps&&z.yellow_steps.length);if(!ru)return null;const num=((r.paras[x.para]||{}).t||'').match(/^\d+(\.\d+)?\s/);return (num?num[0]:'')+ru.yellow_steps[0]}
function newTextOf(r,x,d){
  const m=mark(x.id,d,r);if(m.choice==='theirs')return null;
  if(m.text!=null)return m.text;
  if(m.choice==='fallback'&&fallbackText(r,x))return fallbackText(r,x);
  if(x.op==='insert_paragraph')return x.text||x.new_text||x.new||'';
  if(x.op==='delete_paragraph')return '';
  const orig=(r.paras[x.para]||{}).t||'';
  if(x.op==='replace')return x.new_text||x.new||orig;
  if(x.op==='replace_span')return x.old&&orig.includes(x.old)?orig.replace(x.old,x.new||''):orig;
  return orig;
}
function where(r,x){
  const pn=x.op==='insert_paragraph'?x.n:(r.paras[x.para]||{}).n;
  if(pn)return 'סעיף '+String(pn).replace(/\.$/,'')+(x.op==='insert_paragraph'?' (חדש)':'');
  const t=x.op==='insert_paragraph'?(x.text||x.new_text||''):((r.paras[x.para]||{}).t||'');
  const m=t.match(/^(\d+(\.\d+)?)\s/);
  if(x.op==='insert_paragraph')return m?'סעיף '+m[1]+' (חדש)':'סעיף חדש';
  if(m)return 'סעיף '+m[1];
  return x.para===0?'כותרת ההסכם':'המבוא';
}

/* one word for the eye: where a change stands. The user is the lawyer, so deciding is approving */

  const m=mark(x.id,d,r);

function counts(d,r){
  r=r||latest(d);const ch=r.changes.filter(x=>!(x.mine&&!mark(x.id,d,r).user)),c={all:ch.length,reviewed:0,flag:0,asks:0};

}

function sideScroller(){const sd=document.querySelector('.side');if(!sd)return null;const it=sd.querySelector('.items');return scrollsY(it)?it:scrollsY(sd)?sd:null}

  if(keep){const sc=sideScroller(),cv=document.querySelector('.canvas');if(sc&&keep[0]!=null)sc.scrollTop=keep[0];if(cv&&keep[1]!=null)cv.scrollTop=keep[1]}

function segTip(x,d,r){const s=stOf(x,d,r),m=mark(x.id,d,r);return (r.changes.indexOf(x)+1)+' · '+(x.topic||where(r,x))+' · '+(s==='th'?'קיבלנו את הנוסח שלהם':s==='y'?'שאלה פתוחה':s==='open'?'עוד לא הוחלט':m.choice==='fallback'?'ירדנו לעמדת נסיגה':'השארנו את התיקון')}
function side(d,r,c,locked){
  const F=[['all','הכול'],['todo','נשארו'],['f','שיקול דעת']];
  const list=r.changes.filter(x=>{const s=stOf(x,d,r);return S.qf==='all'||x.id===S.sel||(S.qf==='todo'?s==='open'||s==='y':x.lawyer)});
  const left=c.all-c.reviewed;
  let top='<div class="sh"><div class="sht"><b>'+(left?'נשארו '+left+' מתוך '+c.all:'כל השינויים הוכרעו')+'</b><span class="chips">'+F.map(([f,t])=>'<button class="chip" data-qf="'+f+'" aria-pressed="'+(S.qf===f)+'">'+t+'</button>').join('')+'</span></div>'+
    '<div class="psegs">'+r.changes.map(x=>{const s=stOf(x,d,r);return '<button class="'+(s==='open'?'':s)+(x.id===S.sel?' on':'')+'" data-go="'+x.id+'" aria-label="'+esc(x.topic||where(r,x))+'" data-tip="'+esc(segTip(x,d,r))+'"'+'></button>'}).join('')+'</div>';
  if(!locked&&c.asks){const a=r.changes.find(z=>z.ask&&!answered(z.id,d,r));top+='<button class="qline" data-go="'+a.id+'" title="'+esc(a.ask.gap||'')+'">'+(c.asks===1?'שאלה פתוחה אחת':c.asks+' שאלות פתוחות')+': '+esc(a.topic||where(r,a))+'</button>'}
  else if(!locked&&!left)top+='<div class="qdone"><span>הכול הוחלט. נשארו הקבצים, המייל והשליחה.</span><button class="btn primary small" data-finish>לסיים את הסבב</button></div>';
  top+='</div>';
  return '<aside class="side" aria-label="השינויים בסבב">'+top+'<div class="items">'+(list.length?list.map(x=>item(d,r,x,locked)).join(''):'<p class="faint" style="padding:14px;font-size:14px">'+(S.qf==='todo'?'לא נשאר כלום. אפשר לסיים את הסבב.':'אין כאן כלום.')+'</p>')+'</div></aside>';
}
function item(d,r,x,locked){
  const s=stOf(x,d,r),n=r.changes.indexOf(x)+1,on=x.id===S.sel,m=mark(x.id,d,r),dec=m.reviewed||m.choice||x.mine;
  const pill=s==='y'?'<span class="st y">שאלה פתוחה</span>':s==='th'?'<span class="st th">הנוסח שלהם</span>':s==='open'&&x.lawyer?'<span class="st f">שיקול דעת</span>':'';
  let h='<div class="item s-'+s+(on?' on':'')+(s==='ok'?' done':'')+'"><button class="ihd" data-go="'+x.id+'" aria-expanded="'+on+'"><span class="n">'+(s==='ok'||s==='th'?'✓':n)+'</span><span class="tt"><b>'+esc(x.topic||where(r,x))+'</b><span>'+esc(where(r,x))+(THEIR[x.their_track]&&on?' · הנוסח שלהם '+THEIR[x.their_track]:'')+'</span></span>'+pill+'</button>';
  if(!on)return h+'</div>';
  const ru=(x.rule_ids||[]).map(id=>rule(id,r)).filter(Boolean)[0],orig=x.op==='insert_paragraph'?'':((r.paras[x.para]||{}).t||''),nt=newTextOf(r,x,d),changed=x.op!=='accept';
  h+='<div class="ibd">';
  if(x.ask&&!answered(x.id,d,r)&&!locked)h+='<div class="ask"><b>שאלה עסקית פתוחה</b><span>'+esc(x.ask.gap)+'</span><span class="muted">Areo ממליצה: '+esc(x.ask.rec)+'</span><div class="chips"><button class="btn primary small" data-answer="'+x.id+'" data-val="apply">להשאיר את הסעיף</button><button class="btn soft small" data-answer="'+x.id+'" data-val="drop">להוריד אותו</button></div></div>';
  if(focusOn())h+='<div class="diff">'+(changed?(nt==null?'<span style="color:var(--paper-mist)">נשאר הנוסח שלהם:</span> '+esc(orig):x.op==='insert_paragraph'?'<ins>'+esc(nt)+'</ins>':segHtml(diff(orig,nt))):esc(orig))+'</div>';
  h+='<p class="why">'+esc(x.concession?'ויתור מתוכנן: '+x.concession:(x.plain_effect||x.summary||''))+(x.position_effect?'<span class="sm">'+esc(x.position_effect)+'</span>':'')+'</p>';
  if(!locked){
    if(x.lawyer&&!dec)h+='<div class="flag">'+IC.info+'<span><b>דורש את שיקול דעתכם.</b> '+FLAGWHY(x)+'</span></div>';
    if(dec&&!(x.mine&&m.text==null)){const lab=x.mine?'השינוי שלכם נכנס להסכם':m.choice==='theirs'?'קיבלנו את הנוסח שלהם':m.choice==='fallback'?'ירדנו לעמדת הנסיגה':m.text!=null?'השארנו, עם הנוסח שערכתם':x.concession?'הוויתור מקובל':'השארנו את התיקון';h+='<div class="decided'+(m.choice==='theirs'?' th':'')+'"><span>'+IC.check+' '+lab+(m.at?'<span class="areo-by">הוכרע'+(m.by?' על ידי '+esc(m.by):'')+', '+fmtDate(m.at)+'</span>':'')+'</span>'+(x.mine?'':'<button class="linkbtn" data-undo="'+x.id+'">לשנות</button>')+'</div>';
      /* the decision stays on screen; moving on is the lawyer's click */
      const nx=nextOpen(d,r,x);h+='<div class="gonext">'+(nx?'<button class="btn primary big" data-go="'+nx.id+'">לסעיף הבא: '+esc(nx.topic||where(r,nx))+IC.down+'</button>':'<button class="btn primary big" data-finish>לסיים את הסבב</button>')+'</div>'}
    else if(!dec){const fb=fallbackText(r,x);h+='<div class="decide-row"><button class="btn primary big" data-keep="'+x.id+'">'+IC.check+(x.concession?'הוויתור מקובל':'להשאיר את שלנו')+'</button>'+(changed?'<div class="alt"><button class="btn soft small" data-choice="theirs" data-id="'+x.id+'">לקבל את שלהם</button><button class="btn soft small" data-choice="fallback" data-id="'+x.id+'" '+(fb?'':'disabled title="אין במדיניות עמדת נסיגה לסעיף הזה"')+'>עמדת נסיגה</button></div>':'')+'</div>'}
  }
  const acc=(k,title,peek,body)=>'<details class="acc" data-acc="'+k+'"'+(S.acc.has(k)?' open':'')+'><summary><span>'+title+'</span>'+(peek?'<small>'+esc(peek)+'</small>':'')+'</summary><div class="accb">'+body+'</div></details>';
  let more='';
  if(changed){
    const b=bubbleOf(x,d,r);
    more+=acc('bubble','ההערה לצד השני',nt==null?'אין, קיבלתם את הנוסח שלהם':b.slice(0,46)+(b.length>46?'...':''),nt==null?'':'<textarea id="bubble" data-bubble="'+x.id+'" '+(locked?'readonly':'')+' aria-label="ההערה לצד השני">'+esc(b)+'</textarea>'+(locked?'':'<div class="tone" data-tonebar>'+[['softer','רך יותר'],['firmer','תקיף יותר'],['shorter','קצר יותר'],['english','באנגלית']].map(([k,t])=>'<button data-tone="'+k+'">'+IC.spark+t+'</button>').join('')+'</div>'));
    more+=acc('edit','לערוך את הנוסח','','<textarea id="newtext" class="doc" data-edit="'+x.id+'" dir="rtl" '+(locked?'readonly':'')+' aria-label="הנוסח שלנו">'+esc(nt==null?orig:nt)+'</textarea>'+(locked?'':'<div class="editacts"><button class="btn primary small" data-saveedit="'+x.id+'">לשמור</button>'+(x.mine||m.text!=null?'<button class="btn soft small" data-dropedit="'+x.id+'">לבטל את השינוי</button>':'')+'<span class="faint">טקסט בלבד. נכנס להסכם ולקובץ ה-Word כשלוחצים לשמור או יוצאים מהשדה.</span></div>'));
  }
  if(x.internal_comment||(x.reserve||[]).length)more+=acc('inner','פנימי, לא נשלח','',(x.internal_comment?'<p>'+esc(x.internal_comment)+'</p>':'')+((x.reserve||[]).length?'<p><b>שמור בצד לסבב הבא:</b> '+esc(x.reserve.join('; '))+'</p>':''));
  more+=acc('policy','המדיניות',ru?ru.title:'אין עמדה במדיניות',ru?[['g','ירוק',ru.green],['y','צהוב',ru.yellow],['r','אדום',ru.red]].filter(z=>z[2]).map(z=>'<div class="lv'+(x.offered_now&&TRACK[x.offered_now]&&TRACK[x.offered_now][0]===z[0]?' cur':'')+'"><b><span class="dot '+z[0]+'"></span>'+z[1]+'</b><span>'+esc(z[2])+'</span></div>').join('')+(ru.basis?'<span class="faint" style="font-size:13px">'+esc(ru.basis)+'</span>':''):'<p class="muted">ההצעה היא שיקול הדעת המקצועי של Areo, ולכן היא מסומנת כדורשת את שיקול דעתכם.</p>');
  more+=acc('ask','לשאול את Areo','','<div class="askbox"><form data-ask="'+x.id+'"><input id="askq" placeholder="שאלה על הסעיף הזה" autocomplete="off" aria-label="שאלה"><button class="btn primary small" type="submit">לשאול</button></form><div class="a" id="askout" hidden></div></div><div class="sugg">'+['מה הסיכון אם נקבל את הנוסח שלהם?','מה הם צפויים לטעון?','איך להציג את זה בשיחה?'].map(q=>'<button data-sugg="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div>');
  return h+'<div class="accs">'+more+'</div></div></div>';
}
/* like accept / reject in Word: two small buttons on the change itself */
function hovHtml(d,r,x,locked){
  if(locked||S.mode==='theirs'||x.op==='accept')return '';
  const m=mark(x.id,d,r);if(m.reviewed||m.choice||x.mine)return '';
  return '<span class="hov"><button class="ours" data-keep="'+x.id+'" title="להשאיר את התיקון שלנו" aria-label="להשאיר את התיקון שלנו">'+IC.check+'<span>להשאיר שלנו</span></button><button class="theirs" data-choice="theirs" data-id="'+x.id+'" title="לקבל את הנוסח שלהם" aria-label="לקבל את הנוסח שלהם">'+IC.x+'<span>לקבל שלהם</span></button></span>';
}

/* a signed negotiation: what came out of it, and the text */
function vSigned(d){
  const H=d.history,RES={'עמדנו':'g','פשרה':'y','ויתרנו':'r'};
  return '<div class="col"><div class="dhead"><button class="back" data-home>'+IC.back+'כל העסקאות</button><div class="dtop"><div class="dtitle"><h1>'+esc(d.counterparty)+'</h1><div class="dfacts"><span>'+esc(d.type)+'</span><span>אתם: <b>'+esc(d.role||'')+'</b></span><span>נחתם <b>'+fmtDate(d.signed)+'</b></span>'+(H?'<span>'+nn(H.rounds,'סבב אחד','סבבים')+'</span>':'')+'</div></div><div class="dact">'+themeBtn+'<a class="btn ghost" href="https://claude.ai/artifact/B9aE9vGyCo39hN6ghQT54N" target="_blank" rel="noopener">בניהול חוזים ↗</a></div></div></div>'+
  (H?'<section class="card"><div class="cardh"><h2>מה יצא מהמשא ומתן</h2><small>'+fmtDate(H.from)+' עד '+fmtDate(H.signed)+'</small></div><div class="outcomes">'+H.points.map(p=>'<div class="oc"><div class="cardh"><b>'+esc(p.t)+'</b><span class="pill '+(RES[p.res]||'n')+'">'+esc(p.res)+'</span></div><p>'+esc(p.r)+'</p></div>').join('')+'</div></section>':'<div class="empty">אין תיעוד של המשא ומתן על ההסכם הזה. הוא נחתם לפני ש-Areo הייתה איתכם, ונשמר כאן לצורך השוואה.</div>')+
  ((d.kc||[]).length?'<section class="card"><h2>הסעיפים העיקריים מול המדיניות</h2><div class="tblwrap"><table><tbody>'+d.kc.map(k=>'<tr><td><b>'+esc(k.label)+'</b><div class="faint" style="font-size:12.5px">'+esc(k.clause||'')+'</div></td><td class="muted">'+esc(k.summary)+'</td><td>'+(k.policy==='match'?'<span class="pill g">לפי המדיניות</span>':'<span class="pill y">חורג</span>')+'</td></tr>').join('')+'</tbody></table></div></section>':'')+
  '<div class="desk"><article class="paper" dir="rtl"><div class="hdr"><span>'+esc(d.file||'')+'</span><span>חתום</span></div>'+(d.paras||[]).map(p=>'<div class="pp '+p.k+'">'+esc(p.t)+'</div>').join('')+'</article></div></div>';
}

/* ---------- overlays ---------- */
function openOverlay(html){const kind=S.overlay,prev=document.querySelector('#overlay .scrim, #overlay .drawer'),st=prev&&prev.dataset.kind===kind?prev.scrollTop:0;document.documentElement.classList.add('locked');$('#overlay').innerHTML=html;const nw=document.querySelector('#overlay .scrim, #overlay .drawer');if(nw){nw.dataset.kind=kind||'';if(st)nw.scrollTop=st}}
function closeOverlay(){if(NR.ctl)try{NR.ctl.abort()}catch(e){}$('#overlay').innerHTML='';document.documentElement.classList.remove('locked');S.overlay=null}
function about(){
  const d=dl(),r=rd();S.overlay='about';
  const plan=(r.strategy||'').split(/\.\s+/).map(s=>s.trim()).filter(Boolean);

  (plan.length?'<section class="card"><h3>התוכנית לסבב</h3><ol style="margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px">'+plan.map(s=>'<li>'+esc(s.replace(/\.$/,''))+'.</li>').join('')+'</ol></section>':'')+
  ((r.their_changes||[]).length?'<section class="card"><h3>מה הם שינו מאז הסבב הקודם</h3>'+r.their_changes.map(t=>'<p style="font-size:14.5px">'+esc(t.summary)+'</p>').join('')+'</section>':'')+
  ((r.concessions||[]).length?'<section class="card"><h3>ויתור מתוכנן</h3>'+r.concessions.map(c=>'<p style="font-size:14.5px"><b>'+esc(c.topic)+'.</b> <span class="muted">'+esc(c.reason)+'</span></p>').join('')+'</section>':'')+
  ((r.open_items||[]).length?'<section class="card"><div class="cardh"><h3>פתוחים לפני החתימה</h3><small>לא עוצרים את השליחה</small></div><div>'+r.open_items.map((it,i)=>{const k=rkey(d,r)+'__item'+i,done=!!S.bags.items[k];return '<label class="lrow" style="cursor:pointer"><span style="'+(done?'text-decoration:line-through;color:var(--faint)':'')+'">'+esc(it.item)+'<small>'+esc(it.owner_department||'')+(it.due_date?' · עד '+fmtDate(it.due_date):'')+'</small></span><input type="checkbox" data-item="'+k+'" '+(done?'checked':'')+'></label>'}).join('')+'</div></section>':'')+
  (R.length?'<section class="card"><div class="cardh"><h3>מול המדיניות</h3><small>'+esc(r.playbook||'')+'</small></div><div>'+R.map(ru=>{const z=res[ru.result]||['n',''];return '<div class="lrow"><span>'+esc(ru.title)+'<small>'+esc(ru.green||'')+'</small></span>'+(z[1]?'<span class="pill '+z[0]+'">'+z[1]+'</span>':'<span></span>')+'</div>'}).join('')+'</div></section>':'')+
  (r.files&&r.files.received?'<button class="btn soft" data-dlreceived>'+IC.dl+'להוריד את הטיוטה שקיבלתם</button>':'')+'</aside>');
}

  const s2=(flagged.length?'<div>'+flagged.map(x=>{const m=mark(x.id),dec=m.reviewed||m.choice;return '<div class="lrow"><span>'+esc(x.topic)+' · '+esc(where(r,x))+'<small>'+FLAGWHY(x)+'</small></span>'+(dec?'<span class="pill g">הוחלט</span>':'<button class="btn soft small" data-go="'+x.id+'" data-close>לעבור עליו</button>')+'</div>'}).join('')+'</div>':'<span class="muted" style="font-size:14px">כל השינויים נשענים על עמדות מאושרות במדיניות.</span>')+(unrev>0?'<span class="faint" style="font-size:13.5px">עוד '+nn(unrev,'שינוי אחד','שינויים')+' שנשענים על המדיניות לא עברתם. הם ייכנסו כפי ש-Areo הציעה.</span>':'');
  const s3='<div class="files">'+file('work','קובץ העבודה','כל השינויים, ההערות לצד השני וההערות הפנימיות. לא נשלח.',true)+file('send','העותק לשליחה','השינויים וההערות לצד השני בלבד.',ok)+'</div>';
  const subj=(S.bags.subject&&S.bags.subject[rkey(d,r)])||(d.type+' - '+(d.company||'')+' - סבב '+r.n);
  const s4='<label class="fld"><span>אל: כתובת המייל של הצד השני</span><input id="mto" type="email" dir="ltr" placeholder="name@company.co.il" value="'+esc(contactOf(d))+'" data-contact="'+d.id+'__contact"><small class="faint" style="font-size:12.5px">ככה Areo יודעת לזהות את התשובה שלהם כשהיא מגיעה.</small></label>'+'<label class="fld"><span>נושא</span><span class="cprow"><input id="msubj" value="'+esc(subj)+'"><button class="btn soft small" data-copysubj>'+IC.copy+'להעתיק</button></span></label>'+
    '<textarea id="email" style="min-height:150px" aria-label="מייל הליווי">'+esc(S.email[rkey(d,r)]!=null?S.email[rkey(d,r)]:defaultEmail(d,r))+'</textarea>'+
    '<div class="chips"><button class="btn soft small" data-copyemail>'+IC.copy+'להעתיק את התוכן</button><button class="btn soft small" data-email>'+IC.spark+'Areo תנסח</button></div>'+

      if(z.op==='insert_after')return Object.assign(b,{op:'insert_paragraph',after_para:z.para,text:dash(z.new)});

      return Object.assign(b,{op:'replace',para:z.para,new_text:dash(z.new)})});
    paras.forEach(p=>{if(!decisions.some(z=>z.para===p.i&&z.op!=='insert_paragraph'))decisions.push({id:'K'+p.i,op:'accept',para:p.i,reason:'לא שונה'})});
    const round={source:'page',received:new Date().toISOString().slice(0,10),received_file:NR.file,tender:det.tender,missing_annexes:(NR.annex||[]).slice(),paper:det.paper==='ours'?'הנייר שלכם, עם ההערות שלהם':'הנייר של '+det.counterparty,playbook:R.length?base.rounds[0].playbook:'',strategy:dash(out.strategy),their_changes:(out.their_changes||[]).map(t=>({para:t.para,summary:dash(t.summary)})),open_items:[],concessions:[],rules:R,paras,decisions};
    let d;
    if(prevDeal){d=prevDeal;round.n=latest(d).n+1;d.rounds.push(prepRound(d,round))}
    else d=addDeal({id:'deal_'+Date.now().toString(36),counterparty:det.counterparty,type:det.type,role:det.our_role,company:COMPANY,author:S.who||(base&&base.author)||'',rounds:[Object.assign({n:1},round)]});
    saveDeal(d);closeOverlay();openDeal(d.id);toast('סבב '+latest(d).n+' מוכן: '+nn(latest(d).changes.length,'שינוי אחד','שינויים'));
  }catch(e){NR.step='confirm';NR.det=Object.assign({},NR.det,{note:sampleErr(e)});renderNew()}
}

/* ---------- Areo writes ---------- */
async function rewrite(x,tone){
  const ta=$('#bubble');if(!ta)return;const sample=await sampler();if(!sample){toast('Claude לא זמין בעמוד הזה');return}
  const d=dl(),r=rd(),T={softer:'Make it warmer and more collaborative, same substance.',firmer:'Make it firmer and more decisive, still courteous.',shorter:'Make it much shorter: one or two sentences.',english:'Translate it to clear legal English. Keep defined terms.'}[tone];
  const bar=document.querySelector('[data-tonebar]');bar&&bar.querySelectorAll('button').forEach(b=>b.disabled=true);
  const before=ta.value;ta.value='כותבים...';
  try{const {text}=await sample('Rewrite this comment to the counterparty in a contract negotiation. '+T+' '+(tone==='english'?'':STYLE)+' Reply with the comment only.\n\nClause after our change: '+(newTextOf(r,x,d)||'')+'\nWhat changed: '+(x.summary||'')+'\nComment: '+before,{modelTier:'quick',onText:({text})=>{ta.value=dash(text)}});ta.value=dash(text).trim();setMark(x.id,{bubble:ta.value});toast('ההערה עודכנה')}
  catch(e){ta.value=before;toast(sampleErr(e))}
  finally{bar&&bar.querySelectorAll('button').forEach(b=>b.disabled=false)}
}
async function askAreo(x,q){
  const out=$('#askout');if(!out||!q)return;out.hidden=false;const sample=await sampler();
  if(!sample){out.textContent='Claude לא זמין בעמוד הזה.';return}
  const d=dl(),r=rd(),ru=(x.rule_ids||[]).map(id=>rule(id,r)).filter(Boolean)[0];
  out.textContent='חושבים...';
  try{await sample('You are Areo, a senior Israeli commercial lawyer advising '+COMPANY+' ('+(d.role||'')+') in a negotiation with '+d.counterparty+'. Answer in 3-6 short sentences, practical, no case law, no invented facts. '+STYLE+'\n\nTheir clause: '+(x.op==='insert_paragraph'?'(none, we add a new clause)':((r.paras[x.para]||{}).t||''))+'\nOur version: '+(newTextOf(r,x,d)||'(we accept theirs)')+'\nWhy: '+(x.internal_comment||x.reason||'')+(ru?'\nPolicy: green '+ru.green+'; yellow '+(ru.yellow||'')+'; red '+(ru.red||''):'\nNo policy position for this clause.')+'\n\nQuestion: '+q,{onText:({text})=>{out.textContent=dash(text)}})}
  catch(e){out.textContent=e&&e.text?dash(e.text):sampleErr(e)}
}
async function writeEmail(){
  const ta=$('#email'),sample=await sampler();if(!sample){toast('Claude לא זמין בעמוד הזה');return}
  const d=dl(),r=rd(),ch=r.changes.filter(x=>x.op!=='accept'&&mark(x.id).choice!=='theirs');
  ta.value='כותבים...';
  try{const {text}=await sample('Write a short cover email from '+(S.who||d.author||'our lawyer')+' at '+COMPANY+' to '+d.counterparty+', sending back our tracked-changes draft of the '+d.type+'. Name the 3 most important changes in plain words and invite a call on the hardest one. '+STYLE+' Reply with the email only.\n\nChanges:\n'+ch.map(x=>'- '+where(r,x)+': '+(x.summary||'')).join('\n'),{modelTier:'quick',onText:({text})=>{ta.value=dash(text)}});ta.value=dash(text).trim();S.email[rkey(d,r)]=ta.value}
  catch(e){ta.value=defaultEmail(d,r);toast(sampleErr(e))}
}

/* ---------- moving around ---------- */
function openDeal(id){S.deal=id;S.view='deal';S.round=null;S.sel=null;S.tab='bubble';S.qf='all';render();scrollTo(0,0)}
function go(id,scroll){S.sel=id;S.view='deal';S._scroll=scroll!==false;S._side=true;render()}
/* the next change still waiting for the lawyer, after this one (and from the top when the end is reached) */
function nextOpen(d,r,x){const i=r.changes.indexOf(x);const rest=r.changes.slice(i+1).concat(i>0?r.changes.slice(0,i):[]);return rest.find(z=>{const s=stOf(z,d,r);return s==='open'||s==='y'})||null}
/* a decision stays on its change: the result shows, and the button to the next one */
function afterDecide(id){const d=dl(),r=rd(),x=r&&r.changes.find(z=>z.id===id);S.sel=id;S._side=true;render();toast(x&&nextOpen(d,r,x)?'נשמר. ההסכם עודכן.':'נשמר. אין עוד שינויים שמחכים להכרעה.')}
/* the wording of a change, edited in the panel (plain text): into the round's marks, like every decision */
function saveEdit(id,v){
  const d=dl(),r=d&&rd(),x=r&&r.changes.find(z=>z.id===id);if(!x)return;
  if(x.mine){const orig=(r.paras[x.para]||{}).t||'';if(String(v).trim()===orig.trim()){dropEdit(id);return}setMark(id,{user:true,dropped:false,text:v,reviewed:true});S.pend=null}
  else{const m=mark(id);setMark(id,{text:v,choice:m.choice==='theirs'?null:m.choice,reviewed:true})}
  S.sel=id;render();toast('הנוסח עודכן בהסכם.');
}
function dropEdit(id){
  const d=dl(),r=d&&rd(),x=r&&r.changes.find(z=>z.id===id);if(!x)return;
  if(x.mine){if(mark(id).user)setMark(id,{user:false,dropped:true,text:null});S.pend=null;S.sel=null;render();toast('השינוי בוטל.');return}
  setMark(id,{text:null});render();toast('הנוסח חזר להצעה של Areo.');
}
/* double click: on a comment balloon opens the comment to the other side, on the text opens its wording.
   Read from the click count, since the first click already redraws the page */
function onDbl(e){
  const d=dl(),r=d&&rd();if(!r||S.view!=='deal')return;
  const locked=r!==latest(d)||!!sentAt(d,r),clear=()=>{try{getSelection().removeAllRanges()}catch(x){}};
  const bal=e.target.closest('.bal[data-d]');
  if(bal){const x=r.changes.find(z=>z.id===bal.dataset.d);if(!x)return;clear();S.sel=x.id;S.acc=new Set(['bubble']);if(S.qf!=='all')S.qf='all';render();
    scrollToAcc('bubble');const ta=$('#bubble');if(ta&&!ta.readOnly){ta.focus({preventScroll:true});ta.setSelectionRange(ta.value.length,ta.value.length)}return}
  const pp=e.target.closest('.page .pp');if(!pp||S.mode==='send')return;
  if(locked){toast('הסבב הזה לקריאה בלבד.');return}
  let id=pp.dataset.d;
  if(!id){const i=+pp.dataset.pi,p=r.paras[i];if(isNaN(i)||!p||p.k==='tbl'||p.k==='title')return;const ex=r.byPara[i];if(isReal(ex))id=ex.id;else{S.pend={k:rkey(d,r),para:i};id=MINE+i}}
  clear();S.sel=id;S.acc=new Set(['edit']);if(S.qf!=='all')S.qf='all';render();
  scrollToAcc('edit');const ta=document.querySelector('[data-edit="'+id+'"]');if(ta&&!ta.readOnly){ta.focus({preventScroll:true});ta.setSelectionRange(ta.value.length,ta.value.length)}
}
document.addEventListener('click',e=>{
  const t=e.target;if(!t.closest||!t.closest('.page'))return;
  if(t.closest('button')){if(e.detail<2)S._btnAt=Date.now();return}
  if(e.detail!==2)return;e.stopPropagation();
  if(Date.now()-(S._btnAt||0)<700)return;
  onDbl(e);
},true);
/* a click on "לשמור" or "לבטל" leaves the text field first: that is not a save of its own */
document.addEventListener('pointerdown',e=>{S._editBtn=!!(e.target.closest&&e.target.closest('[data-saveedit],[data-dropedit]'))},true);
function rerenderOverlay(){if(S.overlay==='finish')finish();else if(S.overlay==='about')about()}

document.addEventListener('click',async e=>{
  if(e.target.id==='scrim'&&S.overlay){if(S.overlay!=='new'||NR.step!=='read')closeOverlay();return}
  const t=e.target.closest('button,a,tr.click,.dcard,.pp[data-d],.bal,.drop,label.opt');if(t&&t.tagName==='A'&&!t.dataset.close)return;if(!t)return;
  const ds=t.dataset,d=dl(),r=d&&rd();
  if(S.vm&&!t.closest('.vm')){S.vm=false;if(!('mode' in ds)&&!('focus' in ds)){render()}}
  if(t.tagName==='A')return;
  if('close' in ds&&!('go' in ds)){closeOverlay();return}
  if('home' in ds){S.view='home';render();scrollTo(0,0);return}
  if('newround' in ds){e.stopPropagation();openNew(ds.newround||null);return}
  if(t.id==='drop'){$('#file').click();return}
  if(t.id==='go'){runRead();return}
  if(t.id==='stop'){if(NR.ctl)NR.ctl.abort();return}
  if('deal' in ds){const inner=e.target.closest('[data-newround]');if(inner){openNew(inner.dataset.newround||null);return}openDeal(ds.deal);return}
  if('theme' in ds){const h=document.documentElement,dark=h.dataset.theme?h.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;h.dataset.theme=dark?'light':'dark';return}
  if('about' in ds){about();return}
  if('finish' in ds){finish();return}
  if('round' in ds){S.round=+ds.round;S.sel=null;render();return}
  if('viewmenu' in ds){S.vm=!S.vm;render();return}
  if('mode' in ds){S.mode=ds.mode;S.focus=false;S.vm=false;local();render();return}
  if('focus' in ds){S.focus=ds.focus==='1';S.vm=false;render();scrollTo(0,0);return}
  if('qf' in ds){S.qf=ds.qf;render();return}
  if('tab' in ds){S.tab=ds.tab;render();return}
  if('go' in ds){if('close' in ds)closeOverlay();go(ds.go);return}
  if('newcomment' in ds){S.acc.add('bubble');render();const ta=$('#bubble');if(ta){ta.focus();ta.scrollIntoView({block:'nearest'})}return}
  if((t.classList.contains('pp')||t.classList.contains('bal'))&&ds.d){S.sel=ds.d;S._side=true;render();return}
  if('step' in ds){const i=r.changes.findIndex(x=>x.id===S.sel)+(+ds.step);if(r.changes[i])go(r.changes[i].id);return}
  if('keep' in ds){setMark(ds.keep,{reviewed:true});afterDecide(ds.keep);return}
  if('choice' in ds){const cid=ds.id||S.sel;setMark(cid,{choice:ds.choice,text:null,reviewed:true});afterDecide(cid);return}
  if('saveedit' in ds){S._editBtn=false;const ta=document.querySelector('[data-edit="'+ds.saveedit+'"]');if(ta)saveEdit(ds.saveedit,ta.value);return}
  if('dropedit' in ds){S._editBtn=false;dropEdit(ds.dropedit);return}
  if('undo' in ds){setMark(ds.undo,{choice:null,text:null,reviewed:false});render();return}
  if('tone' in ds){const x=r.changes.find(z=>z.id===S.sel);if(x)rewrite(x,ds.tone);return}
  if('sugg' in ds){const x=r.changes.find(z=>z.id===S.sel);$('#askq').value=ds.sugg;if(x)askAreo(x,ds.sugg);return}
  if('answer' in ds){setBag('answers',K(ds.answer),ds.val);if(ds.val==='drop')setMark(ds.answer,{choice:'theirs',reviewed:true});else setMark(ds.answer,{choice:mark(ds.answer).choice==='theirs'?null:mark(ds.answer).choice,reviewed:true});render();rerenderOverlay();toast(ds.val==='drop'?'הסעיף יורד מהטיוטה':'הסעיף נשאר');return}
  if('approve' in ds){const w=($('#who')&&$('#who').value.trim())||S.who||d.author||'עורך הדין';S.who=w;local();setMark(ds.approve,{approved:true,by:w});render();rerenderOverlay();toast('אושר בידי '+w);return}
  if('approveall' in ds){const w=($('#who')&&$('#who').value.trim())||S.who||d.author||'עורך הדין';S.who=w;local();r.changes.filter(x=>x.lawyer&&!mark(x.id).approved&&mark(x.id).choice!=='theirs').forEach(x=>setMark(x.id,{approved:true,by:w}));render();rerenderOverlay();toast('הכול אושר בידי '+w);return}
  if('unapprove' in ds){setMark(ds.unapprove,{approved:false});render();return}
  if('build' in ds){t.disabled=true;try{const bytes=await buildDocx(d,r,ds.build);const nm=ds.build==='work'?sendName(d,r).replace(/\.docx$/,' - קובץ עבודה.docx'):sendName(d,r);if(await saveFile(nm,bytes))toast('הקובץ נשמר')}catch(err){toast('לא הצלחנו לבנות את הקובץ')}t.disabled=false;return}
  if('dlreceived' in ds){const f=r.files.received,bin=atob(f.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);if(await saveFile(f.name,u))toast('הקובץ נשמר');return}
  if('email' in ds){writeEmail();return}
  if('unsend' in ds){const dd=DEALS.find(x=>x.id===ds.unsend);if(dd){const lr=latest(dd);setBag('sent',rkey(dd,lr)+'__sent',null);setBag('expect',rkey(dd,lr)+'__expect',null);delete S.replies[dd.id];render();toast('הסבב חזר אליכם. אפשר להמשיך לעבוד עליו')}return}
  if('permmanage' in ds){openPerms();return}
  if('mailapprove' in ds){approveMail(t);return}
  if('outlook' in ds){outlookOpen(t);return}
  if('gsend' in ds){gmailSend(t);return}
  if('cancelsend' in ds){S.confirmSend=false;finish();return}
  if('openreply' in ds){const dd=DEALS.find(x=>x.id===ds.openreply);if(dd){S.deal=dd.id;openReply(dd)}return}
  if('mailrefresh' in ds){S.mail=null;loadMail();return}
  if('copysubj' in ds){const v=$('#msubj').value;try{await navigator.clipboard.writeText(v);toast('הנושא הועתק')}catch(err){$('#msubj').select();toast('סמנו והעתיקו')}return}
  if('copyemail' in ds){const v=$('#email').value;try{await navigator.clipboard.writeText(v);toast('הועתק')}catch(err){$('#email').select();toast('סמנו והעתיקו')}return}
  if('marksent' in ds){const ex=$('#expect');if(ex&&ex.value)setBag('expect',rkey(d,r)+'__expect',ex.value);setBag('sent',rkey(d,r)+'__sent',new Date().toISOString());closeOverlay();S.view='home';render();scrollTo(0,0);toast('נשלח. העסקה עברה לעמודה "לתגובת הצד שכנגד"');return}
});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-ask]');if(!f)return;e.preventDefault();const x=rd().changes.find(z=>z.id===f.dataset.ask),q=$('#askq').value.trim();if(x&&q)askAreo(x,q)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file')onFile(t.files[0]);
  if(t.dataset.item){setBag('items',t.dataset.item,t.checked);about()}
  if(t.dataset.bubble){setMark(t.dataset.bubble,{bubble:t.value});toast('ההערה נשמרה')}
  if(t.dataset.edit&&!S._editBtn)saveEdit(t.dataset.edit,t.value);
  if(t.id==='email'){S.email[rkey(dl(),rd())]=t.value}
  if(t.dataset.contact){setBag('contact',t.dataset.contact,t.value.trim());S.confirmSend=false;ensureWatch();if(S.overlay==='finish')finish()}
  if(t.id==='msubj'){setBag('subject',rkey(dl(),rd()),t.value)}
  if(t.id==='who'){S.who=t.value.trim();local()}
  if(t.dataset.due){setBag('due',t.dataset.due,t.value);render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.overlay){if(S.overlay!=='new'||NR.step!=='read')closeOverlay();return}
  if(e.target.closest('input,textarea,select'))return;
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.dcard,#drop')){e.preventDefault();e.target.click();return}
  if(S.view==='deal'&&!S.overlay&&(e.key==='ArrowDown'||e.key==='ArrowUp')){const r=rd();if(!r)return;const i=r.changes.findIndex(x=>x.id===S.sel)+(e.key==='ArrowDown'?1:-1);if(r.changes[i]){e.preventDefault();go(r.changes[i].id)}}
});
/* the deal bar and the Review ribbon stay put while the agreement scrolls under them */
function measureBars(){const b=document.querySelector('.dbar');if(b)document.documentElement.style.setProperty('--dbar-h',b.offsetHeight+'px');stuck()}
function stuck(){const b=document.querySelector('.dbar'),rb=document.querySelector('.ribbon');if(b)b.classList.toggle('stuck',scrollY>4);if(rb&&b)rb.classList.toggle('stuck',rb.getBoundingClientRect().top<=b.getBoundingClientRect().bottom+1)}
addEventListener('scroll',stuck,{passive:true});
addEventListener('resize',()=>measureBars());
/* crossing the phone width redraws the deal: one change at a time on a phone, the agreement beside the list elsewhere */
try{const mq=matchMedia('(max-width:700px)'),f=()=>{if(S.focus==null&&S.view==='deal')render()};mq.addEventListener?mq.addEventListener('change',f):mq.addListener(f)}catch(e){}
/* Word keeps comment balloons in the margin, level with their text, and never lets them push the text */
function layoutBalloons(){
  const pg=document.querySelector('.page.withmk'),col=pg&&pg.querySelector('.mkcol');if(!col)return;
  if(getComputedStyle(col).display==='none')return;
  const base=pg.getBoundingClientRect().top;let last=0;
  col.querySelectorAll('.bal').forEach(b=>{const p=pg.querySelector('.pp[data-d="'+b.dataset.for+'"]');if(!p)return;const top=Math.max(p.getBoundingClientRect().top-base,last+8);b.style.top=top+'px';last=top+b.offsetHeight});
  pg.style.minHeight=(last+40)+'px';
}
addEventListener('resize',()=>layoutBalloons());
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layoutBalloons());
let segT;
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('.psegs button[data-tip]');if(!b)return;clearTimeout(segT);segT=setTimeout(()=>{const bar=b.parentElement;let tip=bar.querySelector('.segtip');if(!tip){tip=document.createElement('div');tip.className='segtip';bar.appendChild(tip)}tip.textContent=b.dataset.tip;const bw=bar.clientWidth,tw=Math.min(tip.offsetWidth,bw),c=b.offsetLeft+b.offsetWidth/2;tip.style.left=Math.max(0,Math.min(bw-tw,c-tw/2))+'px';tip.classList.add('on')},700)});
document.addEventListener('mouseout',e=>{const b=e.target.closest&&e.target.closest('.psegs button[data-tip]');if(!b)return;clearTimeout(segT);const t=b.parentElement.querySelector('.segtip');if(t)t.classList.remove('on')});
document.addEventListener('toggle',e=>{const t=e.target;if(t.dataset&&t.dataset.acc){if(t.open)S.acc.add(t.dataset.acc);else S.acc.delete(t.dataset.acc)}},true);
const dz=e=>e.target.closest&&e.target.closest('#drop,#dropstrip');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const z=dz(e);if(z){e.preventDefault();z.classList.add('over')}}));
document.addEventListener('dragleave',e=>{const z=dz(e);if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=dz(e);if(!z)return;e.preventDefault();z.classList.remove('over');const f=e.dataTransfer.files[0];if(z.id==='dropstrip')openNew(null);onFile(f)});
document.documentElement.dir='rtl';document.documentElement.lang='he';
render();
loadMail();

<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}
.areo-by{display:none}
</style></head><body><title>ניהול חוזים (CLM)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&family=David+Libre:wght@400;500;700&display=swap">
<style>
/* Same family as the playbook Workspace: side menu, one calm column, tables over charts */
:root{
  --night:#0d0f14; --panel:#14171f; --raised:#1b1f29; --line:#272d3a; --line-strong:#353c4c;
  --ink:#eef1f5; --mist:#9aa3b2; --faint:#6b7486;
  --aurora:#2fe6a6; --aurora-ink:#06231a; --aurora-soft:rgba(47,230,166,.12);
  --g:#38d39f; --g-soft:rgba(56,211,159,.10); --y:#f2b45c; --y-soft:rgba(242,180,92,.10); --r:#f2676c; --r-soft:rgba(242,103,108,.10);
  --legal:#b6a3ff; --legal-soft:rgba(167,139,250,.14);
  --display:'Rubik','Assistant',system-ui,sans-serif; --body:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif; --mark:'Poppins','Assistant',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --night:#F4F7F5; --panel:#FFFFFF; --raised:#F0F3F6; --line:#DBE4E0; --line-strong:#C6D3CD;
  --ink:#10221C; --mist:#4F615A; --faint:#7A8A84;
  --aurora:#0B8C66; --aurora-ink:#FFFFFF; --aurora-soft:#E1F5EC;
  --g:#0F9D6E; --g-soft:#E7F6EF; --y:#B07A06; --y-soft:#FBF3DF; --r:#C93434; --r-soft:#FCEBEB;
  --legal:#4A30A8; --legal-soft:#EFEAFD; color-scheme:light}}
:root[data-theme="light"]{
  --night:#F4F7F5; --panel:#FFFFFF; --raised:#F0F3F6; --line:#DBE4E0; --line-strong:#C6D3CD;
  --ink:#10221C; --mist:#4F615A; --faint:#7A8A84;
  --aurora:#0B8C66; --aurora-ink:#FFFFFF; --aurora-soft:#E1F5EC;
  --g:#0F9D6E; --g-soft:#E7F6EF; --y:#B07A06; --y-soft:#FBF3DF; --r:#C93434; --r-soft:#FCEBEB;
  --legal:#4A30A8; --legal-soft:#EFEAFD; color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button{font:inherit}
.app{display:block;min-height:100%}
.app>aside{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.wordmark{font-family:var(--mark);font-weight:700;font-size:20px;direction:ltr;text-align:right;letter-spacing:-.3px;padding:0 6px}
.wordmark span{color:var(--mist);font-weight:400}
.product{font-size:13.5px;color:var(--aurora);font-weight:600;padding:0 6px;margin-top:-10px}
.product .clmtag{font-family:var(--mark);font-size:11px;font-weight:600;color:var(--mist);margin-inline-start:2px}
.co{font-size:13px;color:var(--mist);padding:0 6px;margin-top:-12px}
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.switch a,.switch b{display:block;text-align:center;border-radius:9px;padding:6px 4px;font-size:14px;text-decoration:none}
.switch a{color:var(--mist)}.switch a:hover{color:var(--ink)}
.switch b{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-inline-start:3px solid transparent;border-radius:10px;padding:9px 10px;color:var(--mist);font-size:15px;cursor:pointer}
.nv:hover{background:var(--raised);color:var(--ink)}
.nv[aria-current="page"]{background:var(--aurora-soft);color:var(--aurora);font-weight:600;border-inline-start-color:var(--aurora)}
.nv .cnt{margin-inline-start:auto;font-size:12px;font-weight:700;background:var(--raised);color:var(--mist);border-radius:999px;padding:0 8px;line-height:20px;font-variant-numeric:tabular-nums}
.nv .cnt.w{background:var(--legal-soft);color:var(--legal)}.nv .cnt.r{background:var(--r-soft);color:var(--r)}
.xlink{margin-top:auto;display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none}
.xlink:hover{border-color:var(--aurora)}.xlink b{display:block;font-size:14.5px}.xlink small{display:block;font-size:12.5px;color:var(--mist)}
.xlink svg{width:17px;height:17px;color:var(--mist);flex:0 0 auto}
.asidefoot{font-size:12.5px;color:var(--faint);padding:0 6px;display:flex;flex-direction:column;gap:2px}
main{padding:18px 22px 60px;min-width:0}
.col{max-width:1160px;display:flex;flex-direction:column;gap:16px}
.bar0{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-size:13.5px;color:var(--mist)}
.tools{display:flex;gap:8px;align-items:center}
.iconbtn{height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer;font-size:14px}
.iconbtn svg{width:17px;height:17px}
.find{display:flex;align-items:center;gap:8px;height:38px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:0 12px;min-width:260px}
.find:focus-within{border-color:var(--aurora)}
.find input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:14.5px}
.find svg{width:16px;height:16px;color:var(--mist)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:26px;font-weight:700}h2{font-size:19px;font-weight:600}h3{font-size:16px;font-weight:600}
.lead{margin:0;color:var(--mist);max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cardh small{color:var(--mist);font-size:13px}
.ledger{display:flex;flex-wrap:wrap;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line)}
.ledger button{flex:1 1 120px;text-align:start;background:none;border:0;border-inline-start:1px solid var(--line);padding:12px 16px 10px;color:var(--ink);cursor:pointer}
.ledger button:first-child{border-inline-start:0;padding-inline-start:2px}
.ledger button:hover b{color:var(--aurora)}
.ledger b{display:block;font-family:var(--display);font-size:32px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.ledger b.r{color:var(--r)}.ledger b.w{color:var(--legal)}
.ledger span{font-size:13px;color:var(--mist)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap}
.pill.g{background:var(--g-soft);color:var(--g)}.pill.y{background:var(--y-soft);color:var(--y)}.pill.r{background:var(--r-soft);color:var(--r)}
.pill.w{background:var(--legal-soft);color:var(--legal)}.pill.n{background:var(--raised);color:var(--mist)}
.btn{border:0;border-radius:11px;padding:9px 16px;font-size:14.5px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--aurora);color:var(--aurora-ink)}
.btn.soft{background:var(--raised);color:var(--ink);border:1px solid var(--line-strong)}
.btn.small{padding:6px 12px;font-size:13.5px}
.linkbtn{background:none;border:0;color:var(--aurora);font-size:14px;font-weight:600;cursor:pointer;padding:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:transparent;color:var(--ink);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--aurora-soft);border-color:var(--aurora);color:var(--aurora);font-weight:600}
.chip small{color:var(--mist);font-weight:400;margin-inline-start:2px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:720px}
th,td{text-align:start;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mist);font-weight:600;font-size:13px;background:var(--raised);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--raised)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;font-size:13px;color:var(--mist)}
tr.child td:first-child{padding-inline-start:30px}
tr.child td:first-child::before{content:"";display:inline-block;width:10px;height:10px;border-inline-start:1.5px solid var(--line-strong);border-bottom:1.5px solid var(--line-strong);margin-inline-end:6px;transform:translateY(-3px)}
.muted{color:var(--mist)}.faint{color:var(--faint)}
/* Tasks */
.grp{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--mist);margin:6px 2px 0}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grp.r{color:var(--r)}
.task{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.task.crit{border-inline-start:3px solid var(--y)}.task.late{border-inline-start:3px solid var(--r)}
.task.done{opacity:.6}
.when{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--raised);border-radius:10px;padding:6px 4px;text-align:center;line-height:1.2}
.when b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.when small{font-size:12px;color:var(--mist)}
.when.r b{color:var(--r)}
.tmain{min-width:0;display:flex;flex-direction:column;gap:3px}
.tmain .t{font-weight:700;font-size:15.5px}
.tmain .a{font-size:13.5px;color:var(--mist)}
.tmain .act{font-size:14.5px}
.tside{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:170px}
.ddb{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:5px 10px;color:var(--ink);font-size:13.5px;cursor:pointer;text-align:start}
.ddb:hover,.ddb[aria-expanded=true]{border-color:var(--aurora)}
.ddb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddb small{color:var(--mist);font-size:12px}
.av{flex:0 0 24px;height:24px;border-radius:50%;background:var(--aurora-soft);color:var(--aurora);font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--display)}
.av.b{background:var(--legal-soft);color:var(--legal)}
.sd{flex:0 0 9px;height:9px;border-radius:50%;background:var(--faint)}
.sd.c2{background:#4b86d8}.sd.y{background:var(--y)}.sd.g{background:var(--g)}.sd.r{background:var(--r)}.sd.w{background:var(--legal)}
.field .ddb{min-height:42px;font-size:14.5px}
.mail{width:230px;max-width:45%;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;color:var(--ink);font:inherit;font-size:13.5px;text-align:left}
.mail:focus{border-color:var(--aurora);outline:none}
.rd .av{flex:0 0 28px;height:28px}
.pop{position:fixed;z-index:80;min-width:240px;max-width:min(360px,92vw);max-height:min(360px,60vh);overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.08);padding:6px}
.pop .it{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:9px;padding:8px 10px;color:var(--ink);text-align:start;cursor:pointer;font-size:14px}
.pop .it:hover,.pop .it:focus-visible{background:var(--raised);outline:none}
.pop .it .tx{flex:1;min-width:0}.pop .it .tx small{display:block;color:var(--mist);font-size:12px;line-height:1.3}
.pop .it[aria-selected=true]{font-weight:700}
.pop .ck{color:var(--aurora);font-weight:700;width:14px;text-align:center}
.pop .sep{font-size:12px;color:var(--faint);font-weight:700;padding:8px 10px 3px}
.pop .sep:first-child{padding-top:4px}
.tmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mist)}
.more{font-size:13.5px}
.more summary{cursor:pointer;color:var(--aurora);font-weight:600;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more .in{margin-top:8px;display:flex;flex-direction:column;gap:6px}
q.quote,.quote{display:block;border-inline-start:2px solid var(--line-strong);padding-inline-start:10px;color:var(--ink);font-size:14px;quotes:none}
.quote small{display:block;color:var(--mist);font-size:12.5px}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:7px;padding:5px 12px;color:var(--mist);cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
/* Renewal timeline */
.tl{display:flex;flex-direction:column;gap:10px}
.tlh,.tlr{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center}
.tlh .ax{display:grid;grid-template-columns:repeat(12,1fr);font-size:12px;color:var(--mist)}
.tlr .nm{font-size:14px;line-height:1.3}.tlr .nm small{display:block;color:var(--mist);font-size:12.5px}
.track{position:relative;height:26px;background:var(--raised);border-radius:7px}
.track .run{position:absolute;top:8px;height:10px;border-radius:5px;background:color-mix(in srgb,var(--aurora) 35%,transparent)}
.track .win{position:absolute;top:4px;height:18px;border-radius:5px;background:var(--y-soft);border:1.5px solid var(--y)}
.track .dl{position:absolute;top:0;bottom:0;width:2px;background:var(--r)}
.track .now{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink);opacity:.5}
.tlkey{display:flex;gap:16px;font-size:12.5px;color:var(--mist);flex-wrap:wrap}
.tlkey i{display:inline-block;width:14px;height:9px;border-radius:3px;margin-inline-end:6px;vertical-align:0}
/* Policy */
.pt{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(70px,.5fr));gap:8px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 6px;color:var(--ink);text-align:start;cursor:pointer}
.pt:hover{background:var(--raised)}
.pt.h{cursor:default;font-size:13px;color:var(--mist);font-weight:600;border-bottom-color:var(--line-strong)}
.pt.h:hover{background:none}
.pt .c{text-align:center;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.pt .c.zero{color:var(--faint);font-family:var(--body);font-size:14px}
.pt .c.r{color:var(--r)}.pt .c.g{color:var(--g)}
.pt .nm small{display:block;font-size:12.5px;color:var(--mist)}
.dev{border:1px solid var(--line);border-inline-start:3px solid var(--r);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.dev .vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dev .vs small{display:block;font-size:12px;font-weight:700;color:var(--mist)}
@media (max-width:640px){.dev .vs{grid-template-columns:1fr}}
/* Approve */
.rv{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rv.ok{opacity:.62}
.rv .opts{display:flex;gap:8px;flex-wrap:wrap}
.rv .done{font-size:13.5px;color:var(--g);font-weight:600}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--raised);border-radius:12px;padding:10px 14px;font-size:14px}
.who input{background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:6px 10px;color:var(--ink);font:inherit;font-size:14px}
/* Readiness */
.rd{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.rd:last-child{border-bottom:0}
.rd i{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12.5px;font-weight:700}
.rd i.ok{background:var(--g-soft);color:var(--g)}.rd i.no{background:var(--y-soft);color:var(--y)}
.rd .x{flex:1;min-width:0}.rd b{display:block;font-size:14.5px}.rd span{font-size:13px;color:var(--mist)}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(640px,100%);background:var(--night);border-inline-start:1px solid var(--line-strong);z-index:51;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.35)}
.dh{padding:16px 20px 0;display:flex;flex-direction:column;gap:8px;background:var(--panel);border-bottom:1px solid var(--line)}
.dh .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.backlink{align-self:flex-start;background:none;border:0;color:var(--aurora);font-size:14px;font-weight:600;cursor:pointer;padding:0}
.dh .x{background:var(--raised);border:1px solid var(--line-strong);color:var(--ink);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px;flex:0 0 auto}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 12px;color:var(--mist);cursor:pointer;font-size:14.5px;white-space:nowrap}
.tabs button[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--aurora)}
.db{flex:1;overflow:auto;padding:18px 20px 30px;display:flex;flex-direction:column;gap:12px}
.db>*{flex-shrink:0}
.db{overscroll-behavior:contain}
html.locked,html.locked body{overflow:hidden}
.scrim{overscroll-behavior:contain;touch-action:none}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--mist)}.kv dd{margin:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px}
.field input,.field textarea{background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit;font-size:14.5px}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.field{font-weight:600}.field input,.field textarea,.field .ddb{font-weight:400}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--night);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.saved{font-size:12.5px;color:var(--g);font-weight:600}
.hero{border-radius:20px;border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(110% 140% at 100% 0%,var(--aurora-soft) 0%,transparent 55%),var(--panel)}
.hero .eb{font-size:12.5px;font-weight:700;color:var(--aurora)}
.hero h1{font-size:27px}
.next{display:flex;flex-direction:column}
.nx{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;color:var(--ink);text-align:start;cursor:pointer;width:100%}
.nx:last-child{border-bottom:0}.nx:hover{background:var(--raised)}
.nx .d{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;text-align:center}
.nx .d small{display:block;font-family:var(--body);font-size:12px;color:var(--mist)}
.nx .d.r{color:var(--r)}
.nx b{display:block;font-size:14.5px}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:760px){.pf{grid-template-columns:1fr}}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}

/* ===== Areo look (mono): light monochrome, the Areo green only where Areo speaks or marks a match ===== */
html:root[data-look="mono"]{
  --bg:#FAFAFA;--panel:#FFFFFF;--sub:#F3F3F3;--hover:#F7F7F7;--line:#EBEBEB;--line2:#DCDCDC;--line3:#E6E6E6;
  --ink:#171717;--ink2:#4D4D4D;--ink3:#8F8F8F;--g:#0B8C66;--gs:#EAF5F0;--gs2:#F2F8F5;--gs3:#EDF6F2;--gsh:#DFF0E8;--gb:#CFE7DC;--gb2:#A9D6C2;--gt:#0A6E50;--gt2:#3D5C50;
  --amber:#D98A1C;--at:#8A4B05;--ats:#FDF8EE;--atb:#F0D9AE;--atp:#FDF1E1;--red:#C8242F;--rt:#A01D27;--rs:#FCF1F2;--mark:#FFF1A8;--mid:#C9C9C9;--mid2:#D6D6D6;--hover2:#EDEDED;--inkh:#2E2E2E;--onink:#FFFFFF;
  --r1:6px;--r2:4px;--r3:3px;--ui:'Google Sans','Noto Sans Hebrew',system-ui,sans-serif;
  --night:var(--bg);--raised:var(--sub);--line-strong:var(--line2);--mist:var(--ink2);--faint:var(--ink3);--aurora:var(--g);--aurora-ink:var(--onink);--aurora-soft:var(--gs);
  --g-soft:var(--gs);--y:var(--amber);--y-soft:var(--ats);--r:var(--red);--r-soft:var(--rs);--legal:var(--at);--legal-soft:var(--atp);--display:var(--ui);--body:var(--ui);
  --pf1:var(--ink);--pf2:var(--ink2);--pf3:var(--mid);--pf4:var(--line2);color-scheme:light}
html:root[data-look="mono"][data-theme="dark"]{--bg:#111214;--panel:#1A1B1E;--sub:#25262A;--hover:#212226;--line:#2C2D31;--line2:#3B3C41;--ink:#ECECEC;--ink2:#B9B9B9;--ink3:#8B8B8B;
  --g:#2FB98A;--gs:#15291F;--amber:#E2A042;--red:#E5555E;--mark:#5C4A00;--mid:#4A4B50;
  --onink:#111214;--gt:#5AD3A8;--gt2:#A9CFC1;--at:#EDB565;--rt:#F08A91;--ats:#2A2215;--atb:#4A3A1E;--atp:#3A2A12;--gb:#21503F;--gb2:#2E6E57;--gs2:#13231D;--gs3:#173027;--gsh:#1C3B30;--rs:#2B1719;--line3:#34353A;--hover2:#2A2B2F;--mid2:#45464B;--inkh:#D4D4D4;color-scheme:dark}
html[data-look="mono"] body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
html[data-look="mono"] :is(h1,h2,h3){font-family:var(--ui);font-weight:500}
html[data-look="mono"] :focus-visible{outline:2px solid var(--g);outline-offset:2px}
html[data-look="mono"] .app{display:block}
html[data-look="mono"] .app>main{padding:28px 32px 72px}
html[data-look="mono"] .col{max-width:1240px;gap:20px}
html[data-look="mono"] .vbody{gap:16px}
html[data-look="mono"] .lead{font-size:13.5px;color:var(--ink2);line-height:1.6;max-width:72ch}
html[data-look="mono"] .muted{color:var(--ink2)}html[data-look="mono"] .faint{color:var(--ink3)}
html[data-look="mono"] .empty{padding:20px 16px;text-align:center;color:var(--ink3);font-size:13px}
html[data-look="mono"] .hint{font-size:12.5px;color:var(--ink3)}
/* head */
html[data-look="mono"] .ph h1{font-size:26px;line-height:1.2}
html[data-look="mono"] .ph .sub{font-size:13.5px;color:var(--ink2);margin-top:4px}
html[data-look="mono"] .ph .foot{font-size:12px;color:var(--ink3);margin-top:2px;gap:4px 12px}
html[data-look="mono"] .iconbtn{height:32px;min-width:32px;padding:0 8px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--panel);color:var(--ink2)}
html[data-look="mono"] .iconbtn:hover{background:var(--hover);color:var(--ink)}
html[data-look="mono"] .iconbtn svg{width:16px;height:16px}
/* tabs (page and drawer) */
html[data-look="mono"] .tabs{display:flex;flex-direction:row;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
html[data-look="mono"] .tabs::-webkit-scrollbar{display:none}
html[data-look="mono"] .tabs>button{display:inline-flex;align-items:center;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:9px 12px;font-size:13.5px;color:var(--ink3);cursor:pointer;white-space:nowrap;font-weight:400}
html[data-look="mono"] .tabs>button:hover{color:var(--ink)}
html[data-look="mono"] .tabs>button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
html[data-look="mono"] .tcount{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 6px;margin-inline-start:7px;border-radius:9px;background:var(--sub);color:var(--ink3);font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1}
html[data-look="mono"] .tabs>button[aria-pressed=true] .tcount{background:var(--line3);color:var(--ink)}
html[data-look="mono"] .tcount.w,html[data-look="mono"] .tabs>button[aria-pressed=true] .tcount.w{background:var(--atp);color:var(--at)}
html[data-look="mono"] .tcount.r,html[data-look="mono"] .tabs>button[aria-pressed=true] .tcount.r{background:var(--rs);color:var(--rt)}
/* panels */
html[data-look="mono"] :is(.panel,.card){background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);box-shadow:0 1px 2px rgba(0,0,0,.025);min-width:0}
html[data-look="mono"] .card:not(.panel){padding:16px 18px;gap:12px}
html[data-look="mono"] .card.panel{padding:0;gap:0;display:block}
html[data-look="mono"] .phd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:500;font-size:13.5px}
html[data-look="mono"] .phd .m{font-weight:400;color:var(--ink3);font-size:12.5px}
html[data-look="mono"] .phd .tcount{margin-inline-start:6px}
html[data-look="mono"] .cardh h2{font-size:16px}html[data-look="mono"] .cardh h3,html[data-look="mono"] .db h3{font-size:14.5px;font-weight:500}
html[data-look="mono"] .sech{font-size:17px}
html[data-look="mono"] .pin{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
/* buttons and links */
html[data-look="mono"] .btn{height:32px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--panel);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none}
html[data-look="mono"] .btn:hover{background:var(--hover)}
html[data-look="mono"] .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--onink)}
html[data-look="mono"] .btn.primary:hover{background:var(--inkh)}
html[data-look="mono"] .btn.small{height:28px;padding:0 10px;font-size:12.5px}
html[data-look="mono"] .btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
html[data-look="mono"] .btn.ghost:hover{background:var(--sub);color:var(--ink)}
html[data-look="mono"] .btn.danger{color:var(--red)}
html[data-look="mono"] .btn svg{width:14px;height:14px}
html[data-look="mono"] .row-acts .btn.small{height:32px;padding:0 12px;font-size:13px}
html[data-look="mono"] :is(.linkbtn,.lnk,.backlink){background:none;border:0;padding:0;color:var(--ink2);font-size:12.5px;font-weight:400;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;white-space:nowrap}
html[data-look="mono"] :is(.linkbtn,.lnk,.backlink):hover{color:var(--ink);text-decoration-color:var(--ink)}
html[data-look="mono"] .backlink{margin-bottom:4px}
/* pills: a dot and quiet text */
html[data-look="mono"] .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:400;color:var(--ink2);white-space:nowrap;background:none;padding:0;border-radius:0}
html[data-look="mono"] .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--dot,var(--ink3));flex:none}
html[data-look="mono"] .pill.g{--dot:var(--g)}html[data-look="mono"] .pill.y,html[data-look="mono"] .pill.w{--dot:var(--amber)}html[data-look="mono"] .pill.n{--dot:var(--mid)}
html[data-look="mono"] .pill.r{--dot:var(--red);color:var(--red)}
/* chips */
html[data-look="mono"] .chips{gap:6px}
html[data-look="mono"] .chip{height:28px;padding:0 11px;border-radius:var(--r2);border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;font-weight:400}
html[data-look="mono"] .chip:hover{border-color:var(--line2);color:var(--ink)}
html[data-look="mono"] .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--onink);font-weight:400}
html[data-look="mono"] .chip small{font-weight:500;opacity:.6;color:inherit;margin:0}
html[data-look="mono"] .chip .sw{display:inline-block;width:9px;height:9px;border-radius:2px}
html[data-look="mono"] .chip.sm{height:26px;padding:0 9px;font-size:12px}
html[data-look="mono"] .flagrow{gap:6px;font-size:12.5px}
/* search with magnifier */
html[data-look="mono"] .tsearch{height:32px;width:240px;max-width:100%;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel)}
html[data-look="mono"] .tsearch:focus-within{border-color:var(--g);box-shadow:0 0 0 3px rgba(11,140,102,.12)}
html[data-look="mono"] .tsearch svg{width:14px;height:14px;color:var(--ink3)}
html[data-look="mono"] .tsearch input{font-size:13px;height:100%;padding:0}
html[data-look="mono"] .tsearch input::-webkit-search-cancel-button{opacity:.5}
/* KPIs */
html[data-look="mono"] .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);box-shadow:0 1px 2px rgba(0,0,0,.025)}
html[data-look="mono"] .kpi{padding:16px 18px;border:0;border-inline-start:1px solid var(--line);background:none;text-align:start;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
html[data-look="mono"] .kpi:first-child{border-inline-start:0}
html[data-look="mono"] .kpi:hover{background:var(--hover)}
html[data-look="mono"] .kpi .v{font-size:28px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;min-width:0}
html[data-look="mono"] .kpi .v.r{color:var(--red)}html[data-look="mono"] .kpi .v.w{color:var(--at)}
html[data-look="mono"] .kpi .v small{font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-look="mono"] .kpi .l{font-size:12.5px;color:var(--ink2);margin-top:5px}
/* two columns */
html[data-look="mono"] .grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
/* portfolio */
html[data-look="mono"] .pf{display:grid;grid-template-columns:1fr 1fr;gap:0}
html[data-look="mono"] .pfb{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center;padding:18px 20px}
html[data-look="mono"] .pfb+.pfb{border-inline-start:1px solid var(--line)}
html[data-look="mono"] .pfb svg{width:150px;height:150px}
html[data-look="mono"] .pfb .seg{fill:none;stroke-width:13;cursor:pointer;transition:opacity .15s}
html[data-look="mono"] .pfb .seg:hover,html[data-look="mono"] .pfb .seg:focus-visible{opacity:.75;outline:none;stroke-width:13}
html[data-look="mono"] .pfb .trk{fill:none;stroke-width:13;stroke:var(--sub)}
html[data-look="mono"] .pfb .big{font:500 22px var(--ui);fill:var(--ink);text-anchor:middle}
html[data-look="mono"] .pfb .cap{font:400 9.5px var(--ui);fill:var(--ink3);text-anchor:middle}
html[data-look="mono"] .pfl{display:flex;flex-direction:column;gap:1px;min-width:0}
html[data-look="mono"] .pft{font-weight:500;font-size:13px;margin-bottom:6px}
html[data-look="mono"] .pli{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:9px;align-items:center;padding:5px 6px;margin:0;border:0;background:none;border-radius:var(--r3);font-size:13px;color:var(--ink2);text-align:start}
html[data-look="mono"] button.pli{cursor:pointer}
html[data-look="mono"] button.pli:hover{background:var(--hover);color:var(--ink)}
html[data-look="mono"] button.pli:hover span{color:var(--ink)}
html[data-look="mono"] .pli i{width:10px;height:10px;border-radius:2px}
html[data-look="mono"] .pli b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
html[data-look="mono"] .pli.zero{opacity:.45}
html[data-look="mono"] .pfl small{font-size:12px;color:var(--ink3);margin-top:6px}
/* next up */
html[data-look="mono"] .li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
html[data-look="mono"] .li:last-child{border-bottom:0}
html[data-look="mono"] .li:hover{background:var(--hover)}
html[data-look="mono"] .dt{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;border:0;background:none;padding:0;text-align:start;cursor:pointer;color:var(--ink);font:inherit;min-width:0}
html[data-look="mono"] .day{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:var(--r2);padding:3px 0;line-height:1.15;background:var(--panel)}
html[data-look="mono"] .day b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
html[data-look="mono"] .day span{font-size:10.5px;color:var(--ink3)}
html[data-look="mono"] .day.r b{color:var(--red)}
html[data-look="mono"] .li .nm{display:flex;flex-direction:column;min-width:0}
html[data-look="mono"] .li .nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-look="mono"] .li .nm span{font-size:12.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-look="mono"] .dt:hover .nm b{text-decoration:underline}
/* what is missing */
html[data-look="mono"] .miss .rd{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 16px;border-bottom:1px solid var(--line)}
html[data-look="mono"] .miss .rd i{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--atp);color:var(--at);display:grid;place-items:center;font-size:12px;font-weight:600}
html[data-look="mono"] .miss .rd b{font-weight:500;display:block;font-size:13.5px}
html[data-look="mono"] .miss .rd span{font-size:12.5px;color:var(--ink3)}
html[data-look="mono"] .miss .ready{font-size:12.5px;color:var(--ink3);padding:10px 16px 14px;margin:0}
/* drafts */
html[data-look="mono"] .drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
html[data-look="mono"] .phd+.drow{border-top:0}
html[data-look="mono"] .drow .nm{display:flex;flex-direction:column;gap:2px;min-width:0}
html[data-look="mono"] .drow .nm b{font-weight:500;font-size:14px}
html[data-look="mono"] .drow .nm span,html[data-look="mono"] .dwhen{font-size:12.5px;color:var(--ink3)}
html[data-look="mono"] .dst{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--at);white-space:nowrap}
html[data-look="mono"] .dst.ok{color:var(--gt)}html[data-look="mono"] .dst.r{color:var(--red)}
html[data-look="mono"] .dst svg{width:13px;height:13px;color:var(--g)}
html[data-look="mono"] .pulse{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:clmpulse 1.4s ease-in-out infinite}
html[data-look="mono"] .pulse.still{animation:none}
@keyframes clmpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@media (prefers-reduced-motion:reduce){html[data-look="mono"] .pulse{animation:none}}
/* tables */
html[data-look="mono"] .tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel)}
html[data-look="mono"] table{font-size:13.5px;min-width:720px}
html[data-look="mono"] th{font-weight:500;color:var(--ink3);font-size:12px;background:none;padding:9px 16px;border-bottom:1px solid var(--line)}
html[data-look="mono"] td{padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
html[data-look="mono"] td .sub{font-size:12.5px;color:var(--ink3)}
html[data-look="mono"] tbody tr.click:hover td{background:var(--hover)}
html[data-look="mono"] tr.child td:first-child::before{border-color:var(--line2)}
html[data-look="mono"] tr.ended td{color:var(--ink3)}
html[data-look="mono"] td .pill{margin-inline-start:6px}
/* timeline */
html[data-look="mono"] .tl{padding:6px 0;gap:0}
html[data-look="mono"] .tlh,html[data-look="mono"] .tlr{display:grid;grid-template-columns:190px minmax(0,1fr);gap:14px;align-items:center;padding:0 16px}
html[data-look="mono"] .tlh{padding-bottom:6px;border-bottom:1px solid var(--line)}
html[data-look="mono"] .tlh .ax{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
html[data-look="mono"] .tlr{padding-block:7px;border-bottom:1px solid var(--line)}
html[data-look="mono"] .tlr:hover{background:var(--hover)}
html[data-look="mono"] .tlr .nm{display:flex;flex-direction:column;font-size:13px;font-weight:500;min-width:0;line-height:1.35}
html[data-look="mono"] .tlr .nm small{font-weight:400;font-size:11.5px;color:var(--ink3)}
html[data-look="mono"] .track{position:relative;height:22px;border-radius:0;background:repeating-linear-gradient(to left,transparent 0,transparent calc(100%/12 - 1px),var(--line) calc(100%/12 - 1px),var(--line) calc(100%/12))}
html[data-look="mono"] .track>span{position:absolute;top:5px;height:12px}
html[data-look="mono"] .track .run{background:var(--line3);border-radius:2px}
html[data-look="mono"] .track .win{background:var(--mark);border:1px solid #D9B100;border-radius:2px}
html[data-look="mono"] .track .dl{width:3px;top:2px;height:18px;background:var(--red);border-radius:1px}
html[data-look="mono"] .track .now{width:2px;top:0;bottom:auto;height:22px;background:var(--g);opacity:1}
html[data-look="mono"] .tlkey{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
html[data-look="mono"] .tlkey span{display:flex;align-items:center;gap:7px}
html[data-look="mono"] .tlkey i{width:14px;height:10px;border-radius:2px;margin:0}
html[data-look="mono"] .k-run{background:var(--line3)}html[data-look="mono"] .k-win{background:var(--mark);border:1px solid #D9B100}
html[data-look="mono"] .tlkey .k-dl{background:var(--red);width:3px}html[data-look="mono"] .tlkey .k-now{background:var(--g);width:2px}
/* policy topics: an accordion */
html[data-look="mono"] .pt{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(120px,1fr) 64px 64px 72px;gap:14px;align-items:center;padding:10px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start;cursor:pointer;font-size:13.5px;color:var(--ink)}
html[data-look="mono"] .pt:hover{background:var(--hover)}
html[data-look="mono"] .pt.h{cursor:default;font-size:12px;color:var(--ink3);font-weight:500;padding-block:8px}
html[data-look="mono"] .pt.h:hover{background:none}
html[data-look="mono"] .pt .nm{display:flex;flex-direction:column;font-weight:500;min-width:0}
html[data-look="mono"] .pt .nm small{font-weight:400;font-size:12px;color:var(--ink3)}
html[data-look="mono"] .ptn{display:inline-flex;align-items:center;gap:0}
html[data-look="mono"] .pchev{stroke:var(--ink3)}
html[data-look="mono"] .pt.on{background:var(--gs3);box-shadow:inset -3px 0 0 var(--g)}
html[data-look="mono"] .pt.on .pchev{stroke:var(--ink)}
html[data-look="mono"] .pt .c{text-align:center;font:inherit;font-size:13.5px;font-variant-numeric:tabular-nums}
html[data-look="mono"] .pt .c.g{color:var(--ink)}html[data-look="mono"] .pt .c.r{color:var(--red);font-weight:500}
html[data-look="mono"] .pt .c.zero{color:var(--ink3);font-size:13px;font-weight:400}
html[data-look="mono"] .stk{display:flex;gap:2px;height:8px}
html[data-look="mono"] .stk i{display:block;height:100%;border-radius:1px}
html[data-look="mono"] .stk .sm{background:var(--g)}html[data-look="mono"] .stk .sd2{background:var(--red)}html[data-look="mono"] .stk .sn{background:var(--line2)}
html[data-look="mono"] .ptx{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 16px;gap:10px}
html[data-look="mono"] .ptx:last-child{border-bottom:0}
html[data-look="mono"] .ptxh{font-size:12.5px;color:var(--ink3)}
html[data-look="mono"] .panel.dev{border:1px solid var(--line);border-inline-start:1px solid var(--line);border-radius:var(--r1);padding:0;gap:0;display:block;background:var(--panel)}
html[data-look="mono"] .panel.dev .phd{border:0;padding-bottom:4px}
html[data-look="mono"] .panel.dev .vs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 16px;border:1px solid var(--line);border-radius:var(--r2)}
html[data-look="mono"] .panel.dev .vs>div{padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
html[data-look="mono"] .panel.dev .vs>div+div{border-inline-start:1px solid var(--line);background:var(--bg)}
html[data-look="mono"] .panel.dev .vs small{font-size:11.5px;font-weight:400;color:var(--ink3)}
html[data-look="mono"] .panel.dev .vs small.rl{margin-top:6px}
html[data-look="mono"] .panel.dev .vs b{font-weight:500}
html[data-look="mono"] .panel.dev .vs q{display:block;background:none;font-family:var(--ui);font-size:12.5px;color:var(--ink2);quotes:none;margin-top:4px;line-height:1.6;border:0;padding:0}
html[data-look="mono"] .panel.dev .vs span{font-size:13px}
html[data-look="mono"] .panel.dev .tmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;font-size:12.5px;color:var(--ink2)}
html[data-look="mono"] .dev0{border:1px solid var(--line);border-radius:var(--r1);background:var(--panel);padding:12px 14px}
/* tasks */
html[data-look="mono"] .ttools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
html[data-look="mono"] .tfl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
html[data-look="mono"] div.seg{display:flex;border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden;width:max-content;max-width:100%;padding:0;gap:0;background:var(--panel)}
html[data-look="mono"] div.seg button{border:0;border-radius:0;background:var(--panel);padding:0 12px;height:30px;font-size:13px;cursor:pointer;color:var(--ink2);box-shadow:none;font-weight:400;white-space:nowrap}
html[data-look="mono"] div.seg button+button{border-inline-start:1px solid var(--line2)}
html[data-look="mono"] div.seg button[aria-pressed=true]{background:var(--ink);color:var(--onink);font-weight:400}
html[data-look="mono"] .tgh{font-size:13px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:0;margin:4px 0 -6px}
html[data-look="mono"] .tgh::after{content:none}
html[data-look="mono"] .tgh.r{color:var(--rt)}
html[data-look="mono"] .tlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r1);background:var(--panel)}
html[data-look="mono"] .task{display:grid;grid-template-columns:86px minmax(0,1fr) 180px;gap:16px;padding:14px 16px;border:0;border-top:1px solid var(--line);border-radius:0;align-items:start;background:none}
html[data-look="mono"] .task:first-child{border-top:0}
html[data-look="mono"] .tlist>.task{border-radius:0}
html[data-look="mono"] div.seg>button{border-radius:0}
html[data-look="mono"] .task.late{box-shadow:inset -3px 0 0 var(--red);border-inline-start:0}
html[data-look="mono"] .task.crit{box-shadow:inset -3px 0 0 var(--amber);border-inline-start:0}
html[data-look="mono"] .task.done{opacity:1}
html[data-look="mono"] .task.done .tt{color:var(--ink3);text-decoration:line-through}
html[data-look="mono"] .twhen{display:flex;flex-direction:column;gap:2px}
html[data-look="mono"] .twhen b{font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
html[data-look="mono"] .twhen small{font-size:12px;color:var(--ink3)}
html[data-look="mono"] .twhen.soon small{color:var(--at)}html[data-look="mono"] .task.late .twhen small{color:var(--rt)}
html[data-look="mono"] .tmain{display:flex;flex-direction:column;gap:3px;min-width:0}
html[data-look="mono"] .ttl{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
html[data-look="mono"] .tt{font-weight:500;font-size:14px;border:0;background:none;padding:0;text-align:start;font-family:inherit;color:inherit;cursor:pointer}
html[data-look="mono"] .tt:hover{text-decoration:underline}
html[data-look="mono"] .ta{font-size:12.5px;color:var(--ink3)}
html[data-look="mono"] .tact{font-size:13px;color:var(--ink2);line-height:1.55}
html[data-look="mono"] .tmore{font-size:13px}
html[data-look="mono"] .tmore summary{font-size:12.5px;color:var(--ink2);cursor:pointer;margin-top:4px;font-weight:400;list-style:revert}
html[data-look="mono"] .tmore .in{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:13px;line-height:1.55}
html[data-look="mono"] .tmore .in p{margin:0}html[data-look="mono"] .tmore .in b{font-weight:500}
html[data-look="mono"] .quote{display:block;padding:8px 10px;border-inline-start:2px solid var(--line2);background:var(--bg);font-family:'David Libre','Noto Serif Hebrew',serif;font-size:14px;color:var(--ink);quotes:none}
html[data-look="mono"] .quote small{display:block;font-family:var(--ui);font-size:11.5px;color:var(--ink3);font-weight:400}
html[data-look="mono"] .saved{font-size:12px;color:var(--ink3);font-weight:400}
html[data-look="mono"] .tside{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
html[data-look="mono"] .tacts{display:flex;gap:14px;padding-inline-start:2px}
html[data-look="mono"] .tgrp{border:1px solid var(--line);border-radius:var(--r1);background:var(--panel)}
html[data-look="mono"] .tgrp>summary{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink2);display:flex;align-items:center;list-style:none}
html[data-look="mono"] .tgrp>summary::-webkit-details-marker{display:none}
html[data-look="mono"] .tgrp>summary::before{content:"";width:6px;height:6px;border-inline-end:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:rotate(45deg);margin-inline-end:10px;transition:transform .15s}
html[data-look="mono"] .tgrp[open]>summary::before{transform:rotate(-135deg)}
html[data-look="mono"] .tgrp .tlist{border:0;border-top:1px solid var(--line);border-radius:0}
html[data-look="mono"] .db .tlist .task{grid-template-columns:70px minmax(0,1fr) 160px;gap:12px}
/* the pickers in rows and drawers (own buttons; the list opens fixed on the page, never clipped) */
html[data-look="mono"] .ddb{width:100%;height:32px;min-height:0;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line2);border-radius:var(--r2);background:var(--panel);font:inherit;font-size:13px;color:var(--ink);cursor:pointer;text-align:start;box-shadow:none}
html[data-look="mono"] .ddb:hover{border-color:var(--mid)}
html[data-look="mono"] .ddb[aria-expanded=true],html[data-look="mono"] .ddb:focus-visible{border-color:var(--g);box-shadow:0 0 0 3px rgba(11,140,102,.12);outline:none}
html[data-look="mono"] .ddb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-look="mono"] .ddb small{color:var(--ink3);font-size:12px}
html[data-look="mono"] .ddb .chev{transition:transform .15s;stroke:var(--ink3)}
html[data-look="mono"] .ddb[aria-expanded=true] .chev{transform:rotate(180deg)}
html[data-look="mono"] .field .ddb{height:36px;min-height:0;font-size:13.5px}
html[data-look="mono"] .sd{flex:0 0 7px;height:7px;background:var(--mid)}
html[data-look="mono"] .sd.c2{background:var(--ink2)}html[data-look="mono"] .sd.y,html[data-look="mono"] .sd.w{background:var(--amber)}html[data-look="mono"] .sd.g{background:var(--g)}html[data-look="mono"] .sd.r{background:var(--red)}
html[data-look="mono"] .av{flex:0 0 22px;height:22px;background:var(--sub);color:var(--ink2);font:500 10.5px var(--ui)}

<script>
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','he');
/* The client's data is placed here by lib/app/clm_view.py, from Areo-נתונים/clm-data.json. Every field may be missing:
   the page fills the gaps with empty values and never shows a sample. */
function areoData(x){
  x=(x&&typeof x==='object')?x:{};
  const arr=v=>Array.isArray(v)?v:[],obj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
  const m=obj(x.meta);
  return {files:obj(x.files),texts:obj(x.texts),docAccess:Object.assign({mode:'local',baseUrl:''},obj(x.docAccess)),flags:arr(x.flags),
    negotiations:arr(x.negotiations),cpinfo:obj(x.cpinfo),emails:obj(x.emails),
    meta:{company:m.company||'',built:m.built||'',files:m.files||0,folders:arr(m.folders)},
    types:arr(x.types).map(t=>Object.assign({code:'',label:'',playbook:null},t,{owner:obj(t&&t.owner)})),
    agreements:arr(x.agreements).filter(a=>a&&a.id).map(a=>Object.assign({title:'',cp:'',type:'',docs:[],kc:[],not_found:[],flags:[]},a,
      {docs:arr(a.docs),kc:arr(a.kc),not_found:arr(a.not_found),flags:arr(a.flags)})),
    tasks:arr(x.tasks).filter(t=>t&&t.id),review:arr(x.review).filter(r=>r&&r.id).map(r=>Object.assign({},r,{options:arr(r.options)})),
    readiness:arr(x.readiness),lead:arr(x.lead),topics:obj(x.topics),playbook_name:x.playbook_name||''};
}
const D=areoData(/*__AREO_CLM__*/null);
const EMPTY=!D.agreements.length&&!D.negotiations.length;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const pd=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const days=s=>s?Math.round((pd(s)-TODAY)/864e5):null;
const ISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAYS=ISO(TODAY);
const nn=(n,one,many)=>n===1?one:n+' '+many;
const fmt=s=>{if(!s)return '';const d=pd(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()};
const AG=Object.fromEntries(D.agreements.map(a=>[a.id,a]));
const TY=Object.fromEntries(D.types.map(t=>[t.code,t]));
function ty(code){return TY[code]||{code:code||'',label:code||'',playbook:null,owner:{}}}
const STATUSES=['חדש','בטיפול','ממתין לגורם אחר','נדחה עד מועד','הוסלם','הושלם','בוטל'];
/* State: in the page store when there is one (shared, with name and time), otherwise in this browser */
const KEY='areo-clm:'+(D.meta.company||'');
let S={status:{},owner:{},decided:{},edit:{},manual:[],who:'',view:'overview',mine:false,tview:'list',people:[],emails:{},typeOwner:{},aowner:{},astate:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let DB=null,RQDB=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mark(kind,id,value){
  const rec={value,by:S.who||'',at:new Date().toISOString()};
  S[kind][id]=rec;persist();
  if(DB){try{DB.collection('marks').doc(kind+'__'+id).set(Object.assign({kind,id},rec))}catch(e){}}
}
(async()=>{try{if(window.claude&&claude.use){DB=await claude.use('db');if(DB){try{DB.collection('settings').onSnapshot(sn=>{(sn.docs||[]).forEach(d=>{const x=d.data?d.data():d;if(x&&x.people){S.people=x.people;S.emails=x.emails||{};S.typeOwner=x.typeOwner||{};S.aowner=x.aowner||{};if(x.docBase!=null)S.docBase=x.docBase}});persist();render()},()=>{})}catch(e){}DB.collection('marks').onSnapshot(sn=>{(sn.docs||[]).forEach(d=>{const x=d.data?d.data():d;if(x&&S[x.kind])S[x.kind][x.id]={value:x.value,by:x.by,at:x.at}});persist();render()},()=>{});
  /* manual tasks the team added, from the shared store */
  try{DB.collection('manual').onSnapshot(sn=>{const L=(sn.docs||[]).map(d=>d.data?d.data():d).filter(x=>x&&x.id);if(!L.length)return;const m={};(S.manual||[]).forEach(t=>{m[t.id]=t});L.forEach(x=>{m[x.id]=x});S.manual=Object.values(m);persist();render()},()=>{})}catch(e){}
  /* the new-agreement requests the system's top page keeps (kind draft_new) */
  try{DB.collection('requests').onSnapshot(sn=>{RQDB=(sn.docs||[]).map(d=>Object.assign({id:d.id},d.data?d.data():d));refreshDrafts()},()=>{RQDB=null})}catch(e){}}}}catch(e){}})();

/* People and owners: the default comes from the agreement type (set in setup), the page can change it per item */
function owner(a){const t=ty(a.type)||{};return Object.assign({},t.owner||{},S.typeOwner[a.type]||{},(a.id&&S.aowner&&S.aowner[a.id])||{})}
const ASTATES=['בתוקף','הסתיים','בוטל בהסכמה','הוחלף בהסכם חדש'];
/* The repository's own state (agreement_state) is the default; a mark made on the page wins */
const DSTATE={ended:'הסתיים',ended_early:'הסתיים',replaced:'הוחלף בהסכם חדש'};
function aState(a){const m=S.astate&&S.astate[a.id];return m?m.value:(DSTATE[a.state]||'בתוקף')}
function ended(a){return aState(a)!=='בתוקף'}
/* The team is just the people named as owners, with an email for reminders. No accounts: names and emails stay in the folder */
function people(){return [...new Set(D.types.flatMap(t=>{const o=owner({type:t.code});return [o.lawyer,o.business,o.backup]}).concat(Object.keys(D.emails||{}),S.people||[]).filter(Boolean))]}
function emailOf(p){return (S.emails&&p in S.emails)?S.emails[p]:((D.emails||{})[p]||'')}
const okMail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||'');
function saveTeam(){persist();if(DB){try{DB.collection('settings').doc('team').set({people:S.people,emails:S.emails,typeOwner:S.typeOwner,aowner:S.aowner,docBase:S.docBase||'',by:S.who||'',at:new Date().toISOString()})}catch(e){}}}
/* Opening the source document (the playbook's four docAccess modes): a cloud folder address opens it in Word;
   the file from the folder opens by relative path; a shared page cannot reach the computer, so it shows the path */
function docBase(){return (S.docBase!=null&&S.docBase!=='')?S.docBase:((D.docAccess||{}).baseUrl||'')}
function docLinks(path){const base=docBase(),isWord=/\.docx?$/i.test(path);
  if(base){const web=base.replace(/ /g,'%20').replace(/\/?$/,'/')+path.split('/').map(encodeURIComponent).join('/');return {word:isWord?'ms-word:ofe|u|'+web:'',web}}
  if(location.protocol==='file:')return {local:'../'+path.split('/').map(encodeURIComponent).join('/')};
  return {}}
function fileIcon(p){const pdf=/\.pdf$/i.test(p),ext=pdf?'PDF':'DOCX';
  return '<svg class="ficon '+(pdf?'pdf':'doc')+'" viewBox="0 0 32 40" aria-hidden="true"><path class="pg" d="M4 2h16l8 8v26a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path class="fold" d="M20 2v6a2 2 0 0 0 2 2h6"/><text x="15" y="30">'+ext+'</text></svg>'}
function docBtns(path){const L=docLinks(path);
  if(L.web)return (L.word?'<a class="btn primary small" href="'+esc(L.word)+'">פתיחה ב-Word</a>':'')+'<a class="btn '+(L.word?'soft':'primary')+' small" href="'+esc(L.web)+'" target="_blank" rel="noopener">'+(L.word?'בדפדפן':'פתיחה')+'</a>';
  if(L.local)return '<a class="btn primary small" href="'+esc(L.local)+'">פתיחה</a>';
  return '<button class="btn soft small" data-copypath="'+esc(path)+'">העתקת הנתיב</button>'}
function readerDrawer(id,q){showD('read:'+id,'להסכם המלא',()=>_reader(id,q))}
/* The page never carries the agreement itself. Without the full text, the reader shows the passages quoted from it */
function quotesOf(id){const seen={},out=[];const add=(t,c)=>{t=String(t||'').trim();if(!t||seen[t])return;seen[t]=1;out.push({t,c:c||''})};
  ((AG[id]||{}).kc||[]).forEach(k=>add(k.quote,k.clause));allTasks().filter(t=>t.agr===id).forEach(t=>add(t.quote,t.clause));
  D.review.filter(r=>r.agr===id).forEach(r=>add(r.quote,r.clause));return out}
function _reader(id,q){
  const a=AG[id];if(!a)return;const full=(D.texts||{})[id]||[],P=full.length?full:quotesOf(id),doc=(a.docs||[])[0]||{};let hi=-1;
  if(!full.length&&q&&!P.some(p=>p.t===q))P.unshift({t:q,c:''});
  if(q){const key=q.replace(/\s+/g,' ').slice(0,36);hi=P.findIndex(p=>p.t.replace(/\s+/g,' ').indexOf(key)>=0)}
  const L=docLinks(doc.path||'');
  drawer('<div class="dh"><div class="top"><div><span class="muted" style="font-size:13px">'+esc(a.number)+' · '+esc(doc.file||'')+'</span><h2>'+esc(a.title)+'</h2></div><button class="x" data-close aria-label="סגירה">×</button></div>'+
   '<div class="rbar">'+(doc.orig?'<button class="btn soft small" data-dl="'+esc(doc.orig)+'" data-fn="'+esc(doc.file)+'">הורדת הקובץ המקורי</button>':'')+(L.word?'<a class="btn soft small" href="'+esc(L.word)+'">לפתוח ב-Word</a>':'')+(hi>=0?'<button class="linkbtn" data-jumphl>חזרה לסעיף המסומן</button>':'')+'</div></div>'+
   '<div class="db">'+(!full.length?'<div class="note2">כאן מוצגים רק הסעיפים שצוטטו מההסכם. ההסכם המלא נשאר בתיקייה שלכם'+(doc.path?': <bdi>'+esc(doc.path)+'</bdi>':'')+'.</div>'+(doc.path?'<div class="rbar">'+docBtns(doc.path)+'</div>':''):'')+
   (P.length?'':'<p class="muted">לא צוטטו סעיפים מההסכם הזה.</p>')+
   '<article class="paper" dir="rtl" lang="he">'+P.map((p,i)=>'<p'+(i===hi?' class="hl" id="hl"':'')+(i===0&&full.length?' class="ttl"':'')+'>'+(p.c&&p.t.indexOf(p.c)!==0?'<span class="pc">'+esc(p.c)+'</span> ':'')+esc(p.t)+'</p>').join('')+'</article></div>');
  const h=$('#hl');if(h)setTimeout(()=>h.scrollIntoView({block:'center'}),30);

  '</div></section>';

/* ---------- Agreements ---------- */
function policyOf(a){const k=a.kc||[];if(!ty(a.type).playbook)return ['n','אין פלייבוק'];if(!k.length)return ['n','לא הושווה'];const d=k.filter(x=>x.policy==='differs').length;return d?['r',d+' סטיות']:['g','תואם']}

   (m&&m.by?'<span class="saved">'+esc(st)+' · '+esc(m.by)+(m.at?'<span class="areo-by">, '+new Date(m.at).toLocaleDateString('he-IL')+'</span>':'')+'</span>':'')+

/* ---------- Renewal timeline: the next 12 months ---------- */
function vTimeline(){return '<p class="lead">ההסכמים לפי מועד הסיום, ב-12 החודשים הקרובים: חלון ההחלטה על חידוש, והמועד האחרון בהסכם.</p>'+timeline()}
function timeline(){
  const start=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),end=new Date(start);end.setMonth(end.getMonth()+12);
  const span=end-start,pos=d=>Math.max(0,Math.min(100,(pd(d)-start)/span*100));
  const months=[...Array(12)].map((_,i)=>{const d=new Date(start);d.setMonth(d.getMonth()+i);return (d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)});
  const rows=D.agreements.filter(a=>!a.parent&&a.end).sort((x,y)=>x.end.localeCompare(y.end)).map(a=>{
    const ts=D.tasks.filter(t=>t.agr===a.id&&t.renewal&&t.date&&days(t.date)>=0);
    const s=a.signed&&pd(a.signed)>start?pos(a.signed):0,e=pos(a.end);
    return '<button type="button" class="tlr" data-agr="'+a.id+'"><span class="nm">'+esc(a.cp)+'<small>'+esc(ty(a.type).label)+' · עד '+fmt(a.end)+'</small></span><span class="track"><span class="run" style="inset-inline-start:'+s+'%;width:'+Math.max(1,e-s)+'%"></span>'+
     ts.map(t=>'<span class="win" title="'+esc(t.label)+'" style="inset-inline-start:'+pos(t.act_by||t.date)+'%;width:'+Math.max(1.2,pos(t.date)-pos(t.act_by||t.date))+'%"></span><span class="dl" title="'+esc(t.label+' '+fmt(t.date))+'" style="inset-inline-start:'+pos(t.date)+'%"></span>').join('')+
     '<span class="now" style="inset-inline-start:'+pos(TODAYS)+'%"></span></span></button>'}).join('');
  return '<section class="card panel tlp"><div class="tl"><div class="tlh"><span></span><div class="ax">'+months.map(m=>'<span>'+m+'</span>').join('')+'</div></div>'+(rows||'<p class="empty">אין הסכמים עם מועד סיום.</p>')+'</div>'+
   '<div class="tlkey"><span><i class="k-run"></i>תקופת ההסכם</span><span><i class="k-win"></i>חלון להחלטה על חידוש</span><span><i class="k-dl"></i>המועד האחרון בהסכם</span><span><i class="k-now"></i>היום</span></div></section>'+
   '<p class="hint">לחיצה על הסכם פותחת את הפרטים שלו.</p>';
}

function vPolicy(){

  const row=r=>{const on=sel===r,tot=(r.match+r.differs+r.none)||1,tp=D.topics[r.rule]||{};

     '<span class="c g'+(r.match?'':' zero')+'">'+(r.match||'אין')+'</span><span class="c r'+(r.differs?'':' zero')+'">'+(r.differs||'אין')+'</span><span class="c'+(r.none?'':' zero')+'">'+(r.none||'אין')+'</span></button>'+
     (on?'<div class="ptx"><div class="ptxh">'+(devs.length?(devs.length===1?'סטייה אחת':devs.length+' סטיות')+' בנושא הזה':'אין סטיות בנושא הזה.')+'</div>'+devs.map(({a,k})=>devCard(a,k)).join('')+'</div>':'')};
  return '<p class="lead">כל הסכם חתום מושווה לעמדות שבפלייבוק, סעיף אחר סעיף. סטייה היא סעיף שנחתם מעבר למה שהמדיניות מאפשרת היום. לחיצה על נושא פותחת את הסטיות שלו.</p>'+
  '<section class="card panel ptopics"><div class="phd"><span>לפי נושא בפלייבוק</span><span class="m">'+esc(D.playbook_name)+'</span></div><div>'+
   '<div class="pt h"><span>נושא</span><span class="stkh">תואם · סוטה · לא הושווה</span><span class="c">תואם</span><span class="c">סוטה</span><span class="c">לא הושווה</span></div>'+
   (list.length?list.map(row).join(''):'<p class="empty">עוד אין סעיפים שהושוו לפלייבוק.</p>')+

/* ---------- Drawers ---------- */
/* While a drawer is open the page behind it stays still: only the drawer scrolls */
/* Drawer history: a drawer opened from inside another one gets "back" to the one before it, not only × */
let DSTACK=[],DCUR=null,DBACK=false;
function showD(key,label,fn){
  const open=!!$('#layer .drawer');
  if(!open)DSTACK=[];
  else if(DCUR&&!DBACK&&DCUR.key!==key){if(DCUR.key==='nt'||DCUR.key.indexOf('te:')===0){ntKeep();const id=NT.id;DCUR.fn=()=>_nt(NT.agr,null,true,id)}DSTACK.push(DCUR)}
  DBACK=false;DCUR={key,label,fn};fn();
}
function goBack(){const p=DSTACK.pop();if(!p){closeDrawer();return}DBACK=true;showD(p.key,p.label,p.fn)}
function drawer(html){const prev=DSTACK[DSTACK.length-1];if(prev)html=html.replace('<div class="dh">','<div class="dh"><button type="button" class="backlink" data-back>→ חזרה '+esc(prev.label)+'</button>');
  $('#layer').innerHTML='<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true">'+html+'</aside>';document.documentElement.classList.add('locked')}
function closeDrawer(){DSTACK=[];DCUR=null;$('#layer').innerHTML='';document.documentElement.classList.remove('locked')}
function agrDrawer(id,tab){showD('agr:'+id,'להסכם',()=>_agrDrawer(id,tab))}

   and the rest opens on request */
const RENEW={auto:'אוטומטי',option:'באופציה',mutual:'בהסכמת הצדדים'};
function aStatus(a){if(ended(a))return ['n',aState(a)];const n=nextTask(a);
  if(n&&n.renewal&&days(n.act_by||n.date)<=60)return ['y','בחלון החלטה על חידוש'];if(a.end&&days(a.end)<0)return ['n','התקופה הסתיימה'];return ['g','בתוקף']}
function lifeBar(a){
  const s=a.signed,e=a.end;if(!s||!e)return '';const tot=pd(e)-pd(s),now=Math.max(0,Math.min(1,(TODAY-pd(s))/tot));
  const n=nextTask(a),np=n&&(n.act_by||n.date)?Math.max(0,Math.min(1,(pd(n.act_by||n.date)-pd(s))/tot)):null;
  return '<div class="life"><div class="ltrack"><span class="lfill" style="width:'+(now*100)+'%"></span>'+(np!=null?'<span class="lmark" style="inset-inline-start:'+(np*100)+'%" title="'+esc(n.label)+'"></span>':'')+'</div>'+
   '<div class="llab"><span>נחתם '+fmt(s)+'</span>'+(np!=null&&np>.18&&np<.82?'<span class="lmid" style="inset-inline-start:'+(np*100)+'%">להחליט עד '+fmt(n.act_by||n.date)+'</span>':'')+'<span>עד '+fmt(e)+'</span></div></div>'}
function aHistory(a){
  const ev=[];const add=(m,txt)=>{if(m&&m.at)ev.push({at:m.at,by:m.by,txt})};
  add(S.astate[a.id],'מצב ההסכם: '+aState(a));
  allTasks().filter(t=>t.agr===a.id).forEach(t=>{add(S.status[t.id],t.label+': '+status(t));add(S.owner[t.id],t.label+': אחראי '+personOf(taskOwner(t)).name)});
  D.review.filter(r=>r.agr===a.id).forEach(r=>add(S.decided[r.id],'אושר: '+(S.decided[r.id]||{}).value));

function saveTask(){
  ntKeep();const t=allTasks().find(x=>x.id===NT.id);if(!t)return closeDrawer();
  const l=(NT.l||'').trim(),d=NT.d||'',x=(NT.x||'').trim();
  if(!l){toast('חסר נושא למשימה.');$('#nt-l')&&$('#nt-l').focus();return}
  const at=new Date().toISOString();
  if(t.manual){
    if(!NT.agr){toast('חסר הסכם.');return}
    const nt=Object.assign({},t,{label:l,agr:NT.agr,date:d||null,act_by:d||null,action:x});
    S.manual=(S.manual||[]).map(m=>m.id===t.id?nt:m);persist();
    if(DB){try{DB.collection('manual').doc(t.id).set(Object.assign({},nt,{by:S.who,at}))}catch(e){}}
  }else{
    const o=D.tasks.find(y=>y.id===t.id)||{},v={};
    if(l!==(o.label||''))v.label=l;if(x!==(o.action||''))v.action=x;if(d&&d!==(o.act_by||o.date||''))v.act_by=d;
    const cur=(S.edit[t.id]||{}).value||{};if(JSON.stringify(cur)!==JSON.stringify(v))mark('edit',t.id,v);
  }
  if(NT.owner&&NT.owner!==taskOwner(t))mark('owner',t.id,NT.owner);
  const was=status(t);if(NT.st&&NT.st!==was)mark('status',t.id,NT.st);
  render();if(DSTACK.length)goBack();else closeDrawer();
  toast(NT.st!==was&&['הושלם','בוטל'].includes(NT.st)?'המשימה עודכנה ועברה ל"סגורות".':'המשימה עודכנה.');
}
function delTask(id){
  const t=(S.manual||[]).find(x=>x.id===id);if(!t)return;
  S.manual=S.manual.filter(x=>x.id!==id);delete S.status[id];delete S.owner[id];persist();
  if(DB){try{DB.collection('manual').doc(id).delete()}catch(e){}}
  render();if(DSTACK.length)goBack();else closeDrawer();toast('המשימה נמחקה.');
}

    else if(['alaw','abiz','abak'].includes(k)){const f={alaw:'lawyer',abiz:'business',abak:'backup'}[k];S.aowner[id]=Object.assign({},S.aowner[id]||{},{[f]:full})}
    else if(k==='ntowner')NT.owner=full;
    saveTeam();toast(em?'נוסף':'נוסף, בלי מייל: לא יקבל תזכורות');
    goBack();render()}
  else if(act==='addagr'){drawer('<div class="dh"><div class="top"><h2>הוספת הסכם</h2><button class="x" data-close aria-label="סגירה">×</button></div><div style="height:12px"></div></div><div class="db">'+
     '<p style="margin:0">הסכמים נכנסים ללוח מהתיקיות שלכם. כדי להוסיף הסכם, שמרו את הקובץ החתום באחת מהן:</p><div class="flagrow">'+D.meta.folders.map(f=>'<span class="pill n">'+esc(f)+'</span>').join('')+'</div>'+
     '<p class="muted" style="font-size:14px;margin:0">אחר כך לחצו "לעדכן את המאגר". ההסכם ייקרא, יקבל משימות ויושווה לפלייבוק.</p>'+
     '<div style="display:flex;gap:10px"><button class="btn primary" data-act="clmbuild">לעדכן את המאגר</button><button class="btn soft" data-close>סגירה</button></div></div>')}
  else if(act==='clmbuild'){let ok=false;try{ok=!!(window.parent&&window.parent!==window&&window.parent.__areoAsk&&window.parent.__areoAsk({label:'ניהול חוזים: לעדכן את המאגר',kind:'areo_clm_request',action:EMPTY?'build':'update'}))}catch(e){}
    toast(ok?'Areo מעדכנת את המאגר. הלוח יתעדכן כשהיא תסיים.':'כדי לעדכן את המאגר, כתבו ל-Areo: ניהול חוזים')}
  else if(act==='timeline'){S.view='timeline';persist();closeDrawer();render();scrollTo(0,0)}
  else if(act==='savetask')saveTask();
  else if(act==='ready'){let ok=false;try{ok=!!(window.parent&&window.parent!==window&&window.parent.__areoBuildPlaybook&&window.parent.__areoBuildPlaybook())}catch(e){}if(!ok)toast('לבניית פלייבוק: לשונית מדיניות, "לבנות פלייבוק"')}
});
document.addEventListener('change',e=>{
  const t=e.target;
});
/* the folded task groups remember whether they are open */
document.addEventListener('toggle',e=>{const g=e.target;if(g&&g.dataset&&g.dataset.tg)TOPEN[g.dataset.tg]=g.open},true);
document.addEventListener('input',e=>{
  if(e.target.id==='q'||e.target.id==='tq'){const id=e.target.id;S[id]=e.target.value;const pos=e.target.selectionStart;if(S.view==='overview')S.view='agreements';render();const i=$('#'+id);if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(x){}}}
  if(e.target.id==='who'){S.who=e.target.value;persist()}
  if(e.target.dataset&&e.target.dataset.docbase!==undefined){S.docBase=e.target.value.trim();clearTimeout(saveTeam.h);saveTeam.h=setTimeout(saveTeam,500)}
  if(e.target.dataset&&e.target.dataset.email!==undefined){S.emails[e.target.dataset.email]=e.target.value.trim();clearTimeout(saveTeam.h);saveTeam.h=setTimeout(saveTeam,500)}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('path[role=button]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
  const p=$('#pop');
  if(p){const its=[...p.querySelectorAll('.it')],k=its.indexOf(document.activeElement);
    if(e.key==='Escape'){const b=openPop.btn;closePop();b&&b.focus();e.preventDefault();return}
    if(e.key==='ArrowDown'){(its[k+1]||its[0]).focus();e.preventDefault();return}
    if(e.key==='ArrowUp'){(its[k-1]||its[its.length-1]).focus();e.preventDefault();return}
    if(e.key==='Tab'){closePop();return}}
  if(e.key==='Escape')closeDrawer()});
window.addEventListener('scroll',e=>{const t=e.target;if(t&&t.closest&&t.closest('#pop'))return;closePop()},true);window.addEventListener('resize',()=>closePop());
try{const th=localStorage.getItem('areo_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
render();
/* for the system's overview ("המשימות שלך"): the same task store, the same records with name and time */
window.__areoTaskStatus=function(id,st){try{if(!allTasks().some(t=>t.id===id))return false;mark('status',id,st||'הושלם');render();return true}catch(e){return false}};
window.__areoOpenTask=function(id){try{S.view='tasks';persist();render();if(id)editTaskDrawer(id);else newTaskDrawer('');return true}catch(e){return false}};
</script>

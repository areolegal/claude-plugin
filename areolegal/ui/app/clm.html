<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}
.areo-by{display:none}
</style></head><body><title>ניהול חוזים (CLM)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;500;600;700&family=Poppins:wght@400;700&display=swap">
<style>
/* Same family as the playbook Workspace: side menu, one calm column, tables over charts */
:root{
  --night:#0d0f14; --panel:#14171f; --raised:#1b1f29; --line:#272d3a; --line-strong:#353c4c;
  --ink:#eef1f5; --mist:#9aa3b2; --faint:#6b7486;
  --aurora:#2fe6a6; --aurora-ink:#06231a; --aurora-soft:rgba(47,230,166,.12);
  --g:#38d39f; --g-soft:rgba(56,211,159,.10); --y:#f2b45c; --y-soft:rgba(242,180,92,.10); --r:#f2676c; --r-soft:rgba(242,103,108,.10);
  --legal:#b6a3ff; --legal-soft:rgba(167,139,250,.14);
  --display:'Rubik','Assistant',system-ui,sans-serif; --body:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif; --mark:'Poppins','Assistant',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --night:#F4F7F5; --panel:#FFFFFF; --raised:#F0F3F6; --line:#DBE4E0; --line-strong:#C6D3CD;
  --ink:#10221C; --mist:#4F615A; --faint:#7A8A84;
  --aurora:#0B8C66; --aurora-ink:#FFFFFF; --aurora-soft:#E1F5EC;
  --g:#0F9D6E; --g-soft:#E7F6EF; --y:#B07A06; --y-soft:#FBF3DF; --r:#C93434; --r-soft:#FCEBEB;
  --legal:#4A30A8; --legal-soft:#EFEAFD; color-scheme:light}}
:root[data-theme="light"]{
  --night:#F4F7F5; --panel:#FFFFFF; --raised:#F0F3F6; --line:#DBE4E0; --line-strong:#C6D3CD;
  --ink:#10221C; --mist:#4F615A; --faint:#7A8A84;
  --aurora:#0B8C66; --aurora-ink:#FFFFFF; --aurora-soft:#E1F5EC;
  --g:#0F9D6E; --g-soft:#E7F6EF; --y:#B07A06; --y-soft:#FBF3DF; --r:#C93434; --r-soft:#FCEBEB;
  --legal:#4A30A8; --legal-soft:#EFEAFD; color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button{font:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.app>aside{background:var(--panel);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.wordmark{font-family:var(--mark);font-weight:700;font-size:20px;direction:ltr;text-align:right;letter-spacing:-.3px;padding:0 6px}
.wordmark span{color:var(--mist);font-weight:400}
.product{font-size:13.5px;color:var(--aurora);font-weight:600;padding:0 6px;margin-top:-10px}
.product .clmtag{font-family:var(--mark);font-size:11px;font-weight:600;color:var(--mist);margin-inline-start:2px}
.co{font-size:13px;color:var(--mist);padding:0 6px;margin-top:-12px}
.switch{display:grid;grid-template-columns:1fr 1fr;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.switch a,.switch b{display:block;text-align:center;border-radius:9px;padding:6px 4px;font-size:14px;text-decoration:none}
.switch a{color:var(--mist)}.switch a:hover{color:var(--ink)}
.switch b{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.2)}
nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-inline-start:3px solid transparent;border-radius:10px;padding:9px 10px;color:var(--mist);font-size:15px;cursor:pointer}
.nv:hover{background:var(--raised);color:var(--ink)}
.nv[aria-current="page"]{background:var(--aurora-soft);color:var(--aurora);font-weight:600;border-inline-start-color:var(--aurora)}
.nv .cnt{margin-inline-start:auto;font-size:12px;font-weight:700;background:var(--raised);color:var(--mist);border-radius:999px;padding:0 8px;line-height:20px;font-variant-numeric:tabular-nums}
.nv .cnt.w{background:var(--legal-soft);color:var(--legal)}.nv .cnt.r{background:var(--r-soft);color:var(--r)}
.xlink{margin-top:auto;display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none}
.xlink:hover{border-color:var(--aurora)}.xlink b{display:block;font-size:14.5px}.xlink small{display:block;font-size:12.5px;color:var(--mist)}
.xlink svg{width:17px;height:17px;color:var(--mist);flex:0 0 auto}
.asidefoot{font-size:12.5px;color:var(--faint);padding:0 6px;display:flex;flex-direction:column;gap:2px}
main{padding:18px 22px 60px;min-width:0}
.col{max-width:1160px;display:flex;flex-direction:column;gap:16px}
.bar0{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{font-size:13.5px;color:var(--mist)}
.tools{display:flex;gap:8px;align-items:center}
.iconbtn{height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);cursor:pointer;font-size:14px}
.iconbtn svg{width:17px;height:17px}
.find{display:flex;align-items:center;gap:8px;height:38px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:0 12px;min-width:260px}
.find:focus-within{border-color:var(--aurora)}
.find input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:14.5px}
.find svg{width:16px;height:16px;color:var(--mist)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:26px;font-weight:700}h2{font-size:19px;font-weight:600}h3{font-size:16px;font-weight:600}
.lead{margin:0;color:var(--mist);max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cardh small{color:var(--mist);font-size:13px}
.ledger{display:flex;flex-wrap:wrap;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line)}
.ledger button{flex:1 1 120px;text-align:start;background:none;border:0;border-inline-start:1px solid var(--line);padding:12px 16px 10px;color:var(--ink);cursor:pointer}
.ledger button:first-child{border-inline-start:0;padding-inline-start:2px}
.ledger button:hover b{color:var(--aurora)}
.ledger b{display:block;font-family:var(--display);font-size:32px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.ledger b.r{color:var(--r)}.ledger b.w{color:var(--legal)}
.ledger span{font-size:13px;color:var(--mist)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap}
.pill.g{background:var(--g-soft);color:var(--g)}.pill.y{background:var(--y-soft);color:var(--y)}.pill.r{background:var(--r-soft);color:var(--r)}
.pill.w{background:var(--legal-soft);color:var(--legal)}.pill.n{background:var(--raised);color:var(--mist)}
.btn{border:0;border-radius:11px;padding:9px 16px;font-size:14.5px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--aurora);color:var(--aurora-ink)}
.btn.soft{background:var(--raised);color:var(--ink);border:1px solid var(--line-strong)}
.btn.small{padding:6px 12px;font-size:13.5px}
.linkbtn{background:none;border:0;color:var(--aurora);font-size:14px;font-weight:600;cursor:pointer;padding:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:transparent;color:var(--ink);border-radius:999px;padding:5px 13px;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--aurora-soft);border-color:var(--aurora);color:var(--aurora);font-weight:600}
.chip small{color:var(--mist);font-weight:400;margin-inline-start:2px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:720px}
th,td{text-align:start;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mist);font-weight:600;font-size:13px;background:var(--raised);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover td{background:var(--raised)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;font-size:13px;color:var(--mist)}
tr.child td:first-child{padding-inline-start:30px}
tr.child td:first-child::before{content:"";display:inline-block;width:10px;height:10px;border-inline-start:1.5px solid var(--line-strong);border-bottom:1.5px solid var(--line-strong);margin-inline-end:6px;transform:translateY(-3px)}
.muted{color:var(--mist)}.faint{color:var(--faint)}
/* Tasks */
.grp{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--mist);margin:6px 2px 0}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grp.r{color:var(--r)}
.task{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.task.crit{border-inline-start:3px solid var(--y)}.task.late{border-inline-start:3px solid var(--r)}
.task.done{opacity:.6}
.when{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--raised);border-radius:10px;padding:6px 4px;text-align:center;line-height:1.2}
.when b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.when small{font-size:12px;color:var(--mist)}
.when.r b{color:var(--r)}
.tmain{min-width:0;display:flex;flex-direction:column;gap:3px}
.tmain .t{font-weight:700;font-size:15.5px}
.tmain .a{font-size:13.5px;color:var(--mist)}
.tmain .act{font-size:14.5px}
.tside{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:170px}
.ddb{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:5px 10px;color:var(--ink);font-size:13.5px;cursor:pointer;text-align:start}
.ddb:hover,.ddb[aria-expanded=true]{border-color:var(--aurora)}
.ddb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ddb small{color:var(--mist);font-size:12px}
.av{flex:0 0 24px;height:24px;border-radius:50%;background:var(--aurora-soft);color:var(--aurora);font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--display)}
.av.b{background:var(--legal-soft);color:var(--legal)}
.sd{flex:0 0 9px;height:9px;border-radius:50%;background:var(--faint)}
.sd.c2{background:#4b86d8}.sd.y{background:var(--y)}.sd.g{background:var(--g)}.sd.r{background:var(--r)}.sd.w{background:var(--legal)}
.field .ddb{min-height:42px;font-size:14.5px}
.mail{width:230px;max-width:45%;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;color:var(--ink);font:inherit;font-size:13.5px;text-align:left}
.mail:focus{border-color:var(--aurora);outline:none}
.rd .av{flex:0 0 28px;height:28px}
.pop{position:fixed;z-index:80;min-width:240px;max-width:min(360px,92vw);max-height:min(360px,60vh);overflow:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.08);padding:6px}
.pop .it{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-radius:9px;padding:8px 10px;color:var(--ink);text-align:start;cursor:pointer;font-size:14px}
.pop .it:hover,.pop .it:focus-visible{background:var(--raised);outline:none}
.pop .it .tx{flex:1;min-width:0}.pop .it .tx small{display:block;color:var(--mist);font-size:12px;line-height:1.3}
.pop .it[aria-selected=true]{font-weight:700}
.pop .ck{color:var(--aurora);font-weight:700;width:14px;text-align:center}
.pop .sep{font-size:12px;color:var(--faint);font-weight:700;padding:8px 10px 3px}
.pop .sep:first-child{padding-top:4px}
.tmeta{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mist)}
.more{font-size:13.5px}
.more summary{cursor:pointer;color:var(--aurora);font-weight:600;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more .in{margin-top:8px;display:flex;flex-direction:column;gap:6px}
q.quote,.quote{display:block;border-inline-start:2px solid var(--line-strong);padding-inline-start:10px;color:var(--ink);font-size:14px;quotes:none}
.quote small{display:block;color:var(--mist);font-size:12.5px}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{background:none;border:0;border-radius:7px;padding:5px 12px;color:var(--mist);cursor:pointer;font-size:14px}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.18)}
/* Renewal timeline */
.tl{display:flex;flex-direction:column;gap:10px}
.tlh,.tlr{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center}
.tlh .ax{display:grid;grid-template-columns:repeat(12,1fr);font-size:12px;color:var(--mist)}
.tlr .nm{font-size:14px;line-height:1.3}.tlr .nm small{display:block;color:var(--mist);font-size:12.5px}
.track{position:relative;height:26px;background:var(--raised);border-radius:7px}
.track .run{position:absolute;top:8px;height:10px;border-radius:5px;background:color-mix(in srgb,var(--aurora) 35%,transparent)}
.track .win{position:absolute;top:4px;height:18px;border-radius:5px;background:var(--y-soft);border:1.5px solid var(--y)}
.track .dl{position:absolute;top:0;bottom:0;width:2px;background:var(--r)}
.track .now{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink);opacity:.5}
.tlkey{display:flex;gap:16px;font-size:12.5px;color:var(--mist);flex-wrap:wrap}
.tlkey i{display:inline-block;width:14px;height:9px;border-radius:3px;margin-inline-end:6px;vertical-align:0}
/* Policy */
.pt{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(70px,.5fr));gap:8px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 6px;color:var(--ink);text-align:start;cursor:pointer}
.pt:hover{background:var(--raised)}
.pt.h{cursor:default;font-size:13px;color:var(--mist);font-weight:600;border-bottom-color:var(--line-strong)}
.pt.h:hover{background:none}
.pt .c{text-align:center;font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.pt .c.zero{color:var(--faint);font-family:var(--body);font-size:14px}
.pt .c.r{color:var(--r)}.pt .c.g{color:var(--g)}
.pt .nm small{display:block;font-size:12.5px;color:var(--mist)}
.dev{border:1px solid var(--line);border-inline-start:3px solid var(--r);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.dev .vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dev .vs small{display:block;font-size:12px;font-weight:700;color:var(--mist)}
@media (max-width:640px){.dev .vs{grid-template-columns:1fr}}
/* Approve */
.rv{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rv.ok{opacity:.62}
.rv .opts{display:flex;gap:8px;flex-wrap:wrap}
.rv .done{font-size:13.5px;color:var(--g);font-weight:600}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--raised);border-radius:12px;padding:10px 14px;font-size:14px}
.who input{background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:6px 10px;color:var(--ink);font:inherit;font-size:14px}
/* Readiness */
.rd{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.rd:last-child{border-bottom:0}
.rd i{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12.5px;font-weight:700}
.rd i.ok{background:var(--g-soft);color:var(--g)}.rd i.no{background:var(--y-soft);color:var(--y)}
.rd .x{flex:1;min-width:0}.rd b{display:block;font-size:14.5px}.rd span{font-size:13px;color:var(--mist)}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(640px,100%);background:var(--night);border-inline-start:1px solid var(--line-strong);z-index:51;display:flex;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.35)}
.dh{padding:16px 20px 0;display:flex;flex-direction:column;gap:8px;background:var(--panel);border-bottom:1px solid var(--line)}
.dh .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.backlink{align-self:flex-start;background:none;border:0;color:var(--aurora);font-size:14px;font-weight:600;cursor:pointer;padding:0}
.dh .x{background:var(--raised);border:1px solid var(--line-strong);color:var(--ink);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px;flex:0 0 auto}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:9px 12px;color:var(--mist);cursor:pointer;font-size:14.5px;white-space:nowrap}
.tabs button[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--aurora)}
.db{flex:1;overflow:auto;padding:18px 20px 30px;display:flex;flex-direction:column;gap:12px}
.db>*{flex-shrink:0}
.db{overscroll-behavior:contain}
html.locked,html.locked body{overflow:hidden}
.scrim{overscroll-behavior:contain;touch-action:none}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--mist)}.kv dd{margin:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:14px}
.field input,.field textarea{background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit;font-size:14.5px}
.field textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.field{font-weight:600}.field input,.field textarea,.field .ddb{font-weight:400}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--night);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.saved{font-size:12.5px;color:var(--g);font-weight:600}
.hero{border-radius:20px;border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(110% 140% at 100% 0%,var(--aurora-soft) 0%,transparent 55%),var(--panel)}
.hero .eb{font-size:12.5px;font-weight:700;color:var(--aurora)}
.hero h1{font-size:27px}
.next{display:flex;flex-direction:column}
.nx{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;color:var(--ink);text-align:start;cursor:pointer;width:100%}
.nx:last-child{border-bottom:0}.nx:hover{background:var(--raised)}
.nx .d{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;text-align:center}
.nx .d small{display:block;font-family:var(--body);font-size:12px;color:var(--mist)}
.nx .d.r{color:var(--r)}
.nx b{display:block;font-size:14.5px}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:760px){.pf{grid-template-columns:1fr}}
.kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}

<script>
document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','he');
/* The client's data is placed here by lib/app/clm_view.py, from Areo-נתונים/clm-data.json. Every field may be missing:
   the page fills the gaps with empty values and never shows a sample. */
function areoData(x){
  x=(x&&typeof x==='object')?x:{};
  const arr=v=>Array.isArray(v)?v:[],obj=v=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
  const m=obj(x.meta);
  return {files:obj(x.files),texts:obj(x.texts),docAccess:Object.assign({mode:'local',baseUrl:''},obj(x.docAccess)),flags:arr(x.flags),
    negotiations:arr(x.negotiations),cpinfo:obj(x.cpinfo),emails:obj(x.emails),
    meta:{company:m.company||'',built:m.built||'',files:m.files||0,folders:arr(m.folders)},
    types:arr(x.types).map(t=>Object.assign({code:'',label:'',playbook:null},t,{owner:obj(t&&t.owner)})),
    agreements:arr(x.agreements).filter(a=>a&&a.id).map(a=>Object.assign({title:'',cp:'',type:'',docs:[],kc:[],not_found:[],flags:[]},a,
      {docs:arr(a.docs),kc:arr(a.kc),not_found:arr(a.not_found),flags:arr(a.flags)})),
    tasks:arr(x.tasks).filter(t=>t&&t.id),review:arr(x.review).filter(r=>r&&r.id).map(r=>Object.assign({},r,{options:arr(r.options)})),
    readiness:arr(x.readiness),lead:arr(x.lead),topics:obj(x.topics),playbook_name:x.playbook_name||''};
}
const D=areoData(/*__AREO_CLM__*/null);
const EMPTY=!D.agreements.length&&!D.negotiations.length;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY=(()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())})();
const pd=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const days=s=>s?Math.round((pd(s)-TODAY)/864e5):null;
const ISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAYS=ISO(TODAY);
const nn=(n,one,many)=>n===1?one:n+' '+many;
const fmt=s=>{if(!s)return '';const d=pd(s);return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()};
const AG=Object.fromEntries(D.agreements.map(a=>[a.id,a]));
const TY=Object.fromEntries(D.types.map(t=>[t.code,t]));
function ty(code){return TY[code]||{code:code||'',label:code||'',playbook:null,owner:{}}}
const STATUSES=['חדש','בטיפול','ממתין לגורם אחר','נדחה עד מועד','הוסלם','הושלם','בוטל'];
/* State: in the page store when there is one (shared, with name and time), otherwise in this browser */
const KEY='areo-clm:'+(D.meta.company||'');
let S={status:{},owner:{},decided:{},manual:[],who:'',view:'overview',mine:false,tview:'list',people:[],emails:{},typeOwner:{},aowner:{},astate:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
let DB=null;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mark(kind,id,value){
  const rec={value,by:S.who||'',at:new Date().toISOString()};
  S[kind][id]=rec;persist();
  if(DB){try{DB.collection('marks').doc(kind+'__'+id).set(Object.assign({kind,id},rec))}catch(e){}}
}
(async()=>{try{if(window.claude&&claude.use){DB=await claude.use('db');if(DB){try{DB.collection('settings').onSnapshot(sn=>{(sn.docs||[]).forEach(d=>{const x=d.data?d.data():d;if(x&&x.people){S.people=x.people;S.emails=x.emails||{};S.typeOwner=x.typeOwner||{};S.aowner=x.aowner||{};if(x.docBase!=null)S.docBase=x.docBase}});persist();render()},()=>{})}catch(e){}DB.collection('marks').onSnapshot(sn=>{(sn.docs||[]).forEach(d=>{const x=d.data?d.data():d;if(x&&S[x.kind])S[x.kind][x.id]={value:x.value,by:x.by,at:x.at}});persist();render()},()=>{})}}}catch(e){}})();

/* People and owners: the default comes from the agreement type (set in setup), the page can change it per item */
function owner(a){const t=ty(a.type)||{};return Object.assign({},t.owner||{},S.typeOwner[a.type]||{},(a.id&&S.aowner&&S.aowner[a.id])||{})}
const ASTATES=['בתוקף','הסתיים','בוטל בהסכמה','הוחלף בהסכם חדש'];
/* The repository's own state (agreement_state) is the default; a mark made on the page wins */
const DSTATE={ended:'הסתיים',ended_early:'הסתיים',replaced:'הוחלף בהסכם חדש'};
function aState(a){const m=S.astate&&S.astate[a.id];return m?m.value:(DSTATE[a.state]||'בתוקף')}
function ended(a){return aState(a)!=='בתוקף'}
/* The team is just the people named as owners, with an email for reminders. No accounts: names and emails stay in the folder */
function people(){return [...new Set(D.types.flatMap(t=>{const o=owner({type:t.code});return [o.lawyer,o.business,o.backup]}).concat(Object.keys(D.emails||{}),S.people||[]).filter(Boolean))]}
function emailOf(p){return (S.emails&&p in S.emails)?S.emails[p]:((D.emails||{})[p]||'')}
const okMail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||'');
function saveTeam(){persist();if(DB){try{DB.collection('settings').doc('team').set({people:S.people,emails:S.emails,typeOwner:S.typeOwner,aowner:S.aowner,docBase:S.docBase||'',by:S.who||'',at:new Date().toISOString()})}catch(e){}}}
/* Opening the source document (the playbook's four docAccess modes): a cloud folder address opens it in Word;
   the file from the folder opens by relative path; a shared page cannot reach the computer, so it shows the path */
function docBase(){return (S.docBase!=null&&S.docBase!=='')?S.docBase:((D.docAccess||{}).baseUrl||'')}
function docLinks(path){const base=docBase(),isWord=/\.docx?$/i.test(path);
  if(base){const web=base.replace(/ /g,'%20').replace(/\/?$/,'/')+path.split('/').map(encodeURIComponent).join('/');return {word:isWord?'ms-word:ofe|u|'+web:'',web}}
  if(location.protocol==='file:')return {local:'../'+path.split('/').map(encodeURIComponent).join('/')};
  return {}}
function fileIcon(p){const pdf=/\.pdf$/i.test(p),ext=pdf?'PDF':'DOCX';
  return '<svg class="ficon '+(pdf?'pdf':'doc')+'" viewBox="0 0 32 40" aria-hidden="true"><path class="pg" d="M4 2h16l8 8v26a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path class="fold" d="M20 2v6a2 2 0 0 0 2 2h6"/><text x="15" y="30">'+ext+'</text></svg>'}
function docBtns(path){const L=docLinks(path);
  if(L.web)return (L.word?'<a class="btn primary small" href="'+esc(L.word)+'">פתיחה ב-Word</a>':'')+'<a class="btn '+(L.word?'soft':'primary')+' small" href="'+esc(L.web)+'" target="_blank" rel="noopener">'+(L.word?'בדפדפן':'פתיחה')+'</a>';
  if(L.local)return '<a class="btn primary small" href="'+esc(L.local)+'">פתיחה</a>';
  return '<button class="btn soft small" data-copypath="'+esc(path)+'">העתקת הנתיב</button>'}
function readerDrawer(id,q){showD('read:'+id,'להסכם המלא',()=>_reader(id,q))}
/* The page never carries the agreement itself. Without the full text, the reader shows the passages quoted from it */
function quotesOf(id){const seen={},out=[];const add=(t,c)=>{t=String(t||'').trim();if(!t||seen[t])return;seen[t]=1;out.push({t,c:c||''})};
  ((AG[id]||{}).kc||[]).forEach(k=>add(k.quote,k.clause));allTasks().filter(t=>t.agr===id).forEach(t=>add(t.quote,t.clause));
  D.review.filter(r=>r.agr===id).forEach(r=>add(r.quote,r.clause));return out}
function _reader(id,q){
  const a=AG[id];if(!a)return;const full=(D.texts||{})[id]||[],P=full.length?full:quotesOf(id),doc=(a.docs||[])[0]||{};let hi=-1;
  if(!full.length&&q&&!P.some(p=>p.t===q))P.unshift({t:q,c:''});
  if(q){const key=q.replace(/\s+/g,' ').slice(0,36);hi=P.findIndex(p=>p.t.replace(/\s+/g,' ').indexOf(key)>=0)}
  const L=docLinks(doc.path||'');
  drawer('<div class="dh"><div class="top"><div><span class="muted" style="font-size:13px">'+esc(a.number)+' · '+esc(doc.file||'')+'</span><h2>'+esc(a.title)+'</h2></div><button class="x" data-close aria-label="סגירה">×</button></div>'+
   '<div class="rbar">'+(doc.orig?'<button class="btn soft small" data-dl="'+esc(doc.orig)+'" data-fn="'+esc(doc.file)+'">הורדת הקובץ המקורי</button>':'')+(L.word?'<a class="btn soft small" href="'+esc(L.word)+'">לפתוח ב-Word</a>':'')+(hi>=0?'<button class="linkbtn" data-jumphl>חזרה לסעיף המסומן</button>':'')+'</div></div>'+
   '<div class="db">'+(!full.length?'<div class="note2">כאן מוצגים רק הסעיפים שצוטטו מההסכם. ההסכם המלא נשאר בתיקייה שלכם'+(doc.path?': <bdi>'+esc(doc.path)+'</bdi>':'')+'.</div>'+(doc.path?'<div class="rbar">'+docBtns(doc.path)+'</div>':''):'')+
   (P.length?'':'<p class="muted">לא צוטטו סעיפים מההסכם הזה.</p>')+
   '<article class="paper" dir="rtl" lang="he">'+P.map((p,i)=>'<p'+(i===hi?' class="hl" id="hl"':'')+(i===0&&full.length?' class="ttl"':'')+'>'+(p.c&&p.t.indexOf(p.c)!==0?'<span class="pc">'+esc(p.c)+'</span> ':'')+esc(p.t)+'</p>').join('')+'</article></div>');
  const h=$('#hl');if(h)setTimeout(()=>h.scrollIntoView({block:'center'}),30);
}
function personOf(p){p=String(p||'');const i=p.indexOf(', ');const lawyer=p.indexOf('עו"ד')===0;const name=(i>0?p.slice(0,i):p).replace(/^עו"ד\s*/,'');return {full:p,name:name,role:lawyer?'עורך דין':(i>0?p.slice(i+2):''),lawyer:lawyer,ini:name.split(/\s+/).map(w=>w[0]).join('').slice(0,2)}}

/* Calendar file: works in Outlook, Google and Apple, with or without Claude */
function ics(list){
  const p=n=>String(n).padStart(2,'0'),dt=s=>s.replace(/-/g,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Areo//Contracts//HE','CALSCALE:GREGORIAN'];
  list.forEach(t=>{const d=t.act_by||t.date;if(!d)return;const a=AG[t.agr]||{};const end=pd(d);end.setDate(end.getDate()+1);
    L.push('BEGIN:VEVENT','UID:'+t.id+'@areo','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;VALUE=DATE:'+dt(d),
      'DTEND;VALUE=DATE:'+end.getFullYear()+p(end.getMonth()+1)+p(end.getDate()),'SUMMARY:'+(t.label+' · '+(a.cp||'')).replace(/[,;]/g,' '),
      'DESCRIPTION:'+(t.action||'').replace(/[,;]/g,' ').replace(/\n/g,' '),'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:תזכורת','END:VALARM','END:VEVENT')});
  L.push('END:VCALENDAR');return L.join('\r\n');
}

/* The portfolio at a glance: how soon each agreement needs a decision, and how much of what was signed matches the policy */
function arc(cx,cy,r,a0,a1){const p=a=>[cx+r*Math.sin(a),cy-r*Math.cos(a)],[x0,y0]=p(a0),[x1,y1]=p(a1);return 'M'+x0.toFixed(2)+' '+y0.toFixed(2)+' A'+r+' '+r+' 0 '+(a1-a0>Math.PI?1:0)+' 1 '+x1.toFixed(2)+' '+y1.toFixed(2)}
const PB=[['late','באיחור','var(--r)'],['m1','עד 30 יום','#3f7bd0'],['m3','31 עד 90 יום','#9dbde9'],['far','מעל 90 יום','var(--g)'],['none','בלי מועד פתוח','var(--line-strong)']];
function aBucket(a){const n=nextTask(a),d=n?days(n.act_by||n.date):null;return d==null?'none':d<0?'late':d<=30?'m1':d<=90?'m3':'far'}
function portfolio(){
  const top=D.agreements.filter(a=>!a.parent);
  const B=PB;
  const cnt=Object.fromEntries(B.map(b=>[b[0],[]]));
  top.forEach(a=>cnt[aBucket(a)].push(a));
  const tot=top.length,C=2*Math.PI,gap=tot>1?.035:0;let a0=0;
  const segs=B.filter(b=>cnt[b[0]].length).map(b=>{const n=cnt[b[0]].length,a1=a0+C*n/tot,p='<path class="seg" d="'+arc(60,60,46,a0+gap/2,a1-gap/2)+'" stroke="'+b[2]+'" data-seg="'+b[0]+'" tabindex="0" role="button"><title>'+b[1]+': '+n+' · '+cnt[b[0]].map(a=>a.cp).join(', ')+'</title></path>';a0=a1;return p}).join('');
  const kc=D.agreements.flatMap(a=>(a.kc||[]).filter(k=>k.rule&&k.policy!=='not_compared'));
  const ok=kc.filter(k=>k.policy==='match').length,dv=kc.length-ok,pct=kc.length?ok/kc.length:0;
  const ring='<path d="'+arc(60,60,46,0,C*.9999)+'" stroke="var(--raised)" class="trk"/>'+(dv?'<path d="'+arc(60,60,46,C*pct+.03,C*.9999-.03)+'" stroke="var(--r)" class="seg" data-go="policy" tabindex="0" role="button"><title>'+dv+' סעיפים סוטים מהמדיניות</title></path>':'')+'<path d="'+arc(60,60,46,.0001,Math.max(.001,C*pct-.03))+'" stroke="var(--g)" class="seg" data-go="policy" tabindex="0" role="button"><title>'+ok+' סעיפים תואמים למדיניות</title></path>';
  return '<section class="card"><div class="cardh"><h2>תמונת התיק</h2><button class="linkbtn" data-act="timeline">לציר החידושים</button></div><div class="pf">'+
   '<div class="pfb"><svg viewBox="0 0 120 120" role="img" aria-label="ההסכמים לפי מועד ההחלטה הבא">'+segs+'<text x="60" y="58" class="big">'+tot+'</text><text x="60" y="76" class="cap">הסכמים</text></svg>'+
    '<div class="pfl"><b class="pft">מתי צריך להחליט</b>'+B.map(b=>cnt[b[0]].length?'<button type="button" class="pli" data-seg="'+b[0]+'"><i style="background:'+b[2]+'"></i><span>'+b[1]+'</span><b>'+cnt[b[0]].length+'</b></button>':'<div class="pli zero"><i style="background:'+b[2]+'"></i><span>'+b[1]+'</span><b>0</b></div>').join('')+'<small>לפי המשימה הבאה בכל הסכם</small></div></div>'+
   '<div class="pfb"><svg viewBox="0 0 120 120" role="img" aria-label="סעיפים מול המדיניות">'+ring+'<text x="60" y="60" class="big">'+Math.round(pct*100)+'%</text><text x="60" y="77" class="cap">תואם למדיניות</text></svg>'+
    '<div class="pfl"><b class="pft">מה נחתם מול הפלייבוק</b><button type="button" class="pli" data-go="policy"><i style="background:var(--g)"></i><span>סעיפים תואמים</span><b>'+ok+'</b></button><button type="button" class="pli" data-go="policy"><i style="background:var(--r)"></i><span>סעיפים סוטים</span><b>'+dv+'</b></button>'+
    '<small>'+D.agreements.filter(a=>!ty(a.type).playbook&&!a.parent).length+' הסכמים בלי פלייבוק לא נספרים</small><button class="linkbtn" data-go="policy" style="align-self:flex-start;margin-top:4px">למסך מול המדיניות</button></div></div>'+
  '</div></section>';
}

function policyOf(a){const k=a.kc||[];if(!ty(a.type).playbook)return ['n','אין פלייבוק'];if(!k.length)return ['n','לא הושווה'];const d=k.filter(x=>x.policy==='differs').length;return d?['r',d+' סטיות']:['g','תואם']}

function timeline(){
  const start=new Date(TODAY.getFullYear(),TODAY.getMonth(),1),end=new Date(start);end.setMonth(end.getMonth()+12);
  const span=end-start,pos=d=>Math.max(0,Math.min(100,(pd(d)-start)/span*100));
  const months=[...Array(12)].map((_,i)=>{const d=new Date(start);d.setMonth(d.getMonth()+i);return (d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)});
  const rows=D.agreements.filter(a=>!a.parent&&a.end).map(a=>{
    const ts=D.tasks.filter(t=>t.agr===a.id&&t.renewal&&t.date&&days(t.date)>=0);
    const s=a.signed&&pd(a.signed)>start?pos(a.signed):0,e=pos(a.end);
    return '<div class="tlr"><span class="nm">'+esc(a.cp)+'<small>'+esc(ty(a.type).label)+' · עד '+fmt(a.end)+'</small></span><div class="track"><span class="run" style="inset-inline-start:'+s+'%;width:'+Math.max(1,e-s)+'%"></span>'+
     ts.map(t=>'<span class="win" title="'+esc(t.label)+'" style="inset-inline-start:'+pos(t.act_by||t.date)+'%;width:'+Math.max(1.2,pos(t.date)-pos(t.act_by||t.date))+'%"></span><span class="dl" title="'+esc(t.label+' '+fmt(t.date))+'" style="inset-inline-start:'+pos(t.date)+'%"></span>').join('')+
     '<span class="now" style="inset-inline-start:'+pos(TODAYS)+'%"></span></div></div>'}).join('');
  return '<section class="card"><div class="tl"><div class="tlh"><span></span><div class="ax">'+months.map(m=>'<span>'+m+'</span>').join('')+'</div></div>'+rows+'</div>'+
   '<div class="tlkey"><span><i style="background:color-mix(in srgb,var(--aurora) 35%,transparent)"></i>תקופת ההסכם</span><span><i style="background:var(--y-soft);border:1.5px solid var(--y)"></i>חלון להחלטה</span><span><i style="background:var(--r);width:3px"></i>המועד האחרון בהסכם</span></div></section>';
}

/* While a drawer is open the page behind it stays still: only the drawer scrolls */

let DSTACK=[],DCUR=null,DBACK=false;
function showD(key,label,fn){
  const open=!!$('#layer .drawer');
  if(!open)DSTACK=[];

  DBACK=false;DCUR={key,label,fn};fn();
}
function goBack(){const p=DSTACK.pop();if(!p){closeDrawer();return}DBACK=true;showD(p.key,p.label,p.fn)}

   '<div class="row2"><label class="field">תאריך יעד<input id="nt-d" type="date" lang="he" value="'+esc(NT.d||'')+'"></label>'+
   '<div class="field">אחראי'+(NT.owner?ownerBtn('ntowner','',NT.owner):'<button type="button" class="ddb" data-dd="ntowner" aria-haspopup="listbox" aria-expanded="false"><span class="nm muted">בחירת אחראי</span></button>')+'</div></div>'+
   '<label class="field"><span>תיאור <span class="muted" style="font-size:13px;font-weight:400">(רשות)</span></span><textarea id="nt-x" placeholder="פרטים נוספים, הפניה לסעיף, או למי לפנות">'+esc(NT.x||'')+'</textarea></label>'+
   '<p class="muted" style="font-size:13.5px;margin:0">האחראי יקבל תזכורת ביומן לפי תאריך היעד.</p>'+
   '<div><button class="btn primary" data-act="addtask">יצירת משימה</button></div></div>');
}


/* ---------- Render and events ---------- */
function render(){
  $('#co').textContent=D.meta.company;
  $('#nav').innerHTML=navHtml();
  $('#foot').innerHTML='<span>'+(D.meta.built?'עודכן '+fmt(D.meta.built)+' · ':'')+nn(D.meta.files||0,'קובץ אחד','קבצים')+'</span><span>'+(DB?'נשמר לכל הצוות':'נשמר בדפדפן הזה')+'</span>';
  const V={overview:vOverview,agreements:vAgreements,nego:vNego,cps:vCps,tasks:vTasks,policy:vPolicy,approve:vApprove}[S.view]||vOverview;
  $('#view').innerHTML=EMPTY?'<section class="hero" id="empty"><span class="eb">ניהול חוזים</span><h1>עוד אין הסכמים במאגר.</h1><p class="lead">כתבו בשיחה: ניהול חוזים</p></section>':V();
}
document.addEventListener('click',e=>{
  const cpth=e.target.closest('[data-copypath]');if(cpth){const p=cpth.dataset.copypath;try{navigator.clipboard.writeText(p).then(()=>toast('הנתיב הועתק: '+p),()=>toast(p))}catch(x){toast(p)}return}
  const pk=e.target.closest('[data-pick]');if(pk){pick(pk.dataset.pick);return}
  const ap=e.target.closest('[data-addperson]');if(ap){closePop();const k=ap.dataset.addperson.split('|')[0];
    if(k==='ntowner'){NT.l=($('#nt-l')||{}).value||'';NT.d=($('#nt-d')||{}).value||'';NT.x=($('#nt-x')||{}).value||''}
    NT.back=k==='ntowner'?'nt':(k==='owner'?'close':(k[0]==='a'?'agr:'+ap.dataset.addperson.split('|')[1]:'settings'));personDrawer(ap.dataset.addperson);return}
  if(e.target.closest('[data-back]')){goBack();return}
  const dlb=e.target.closest('[data-dl]');if(dlb){const b64=(D.files||{})[dlb.dataset.dl];if(!b64){toast('הקובץ לא זמין');return}const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);save(dlb.dataset.fn,u,'application/vnd.openxmlformats-officedocument.wordprocessingml.document');return}
  const rd=e.target.closest('[data-read]');if(rd){closePop();readerDrawer(rd.dataset.read,rd.dataset.q||'');return}
  if(e.target.closest('[data-jumphl]')){const h=$('#hl');h&&h.scrollIntoView({block:'center',behavior:'smooth'});return}
  const pkb=e.target.closest('[data-pk]');if(pkb){NT.pk=pkb.dataset.pk;pkb.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===pkb));$('#np-dw').hidden=NT.pk!=='business';return}
  const dd=e.target.closest('[data-dd]');if(dd){if(openPop.btn===dd){closePop()}else openPop(dd);return}
  if($('#pop')&&!e.target.closest('#pop'))closePop();
  const sg=e.target.closest('[data-seg]');if(sg){S.abucket=sg.dataset.seg;S.af='all';S.view='agreements';persist();render();scrollTo(0,0);return}
  const ab=e.target.closest('[data-abucket]');if(ab){S.abucket='';persist();render();return}
  const t=e.target.closest('[data-go],[data-aflag],[data-cp],[data-nego],[data-agr],[data-task],[data-af],[data-mine],[data-tv],[data-prule],[data-dec],[data-undo],[data-atab],[data-close],[data-act],[data-ics],[data-newtask]');if(!t)return;
  const ds=t.dataset;
  if('close' in ds){closeDrawer();return}
  if(ds.go){S.view=ds.go;S.abucket='';persist();closeDrawer();render();scrollTo(0,0);return}
  if(ds.newtask!==undefined){newTaskDrawer(ds.newtask,ds.topic);return}
  if(ds.agr){agrDrawer(ds.agr);return}
  if(ds.atab){agrDrawer(ds.id,ds.atab);return}
  if(ds.task){S.view='tasks';S.tview='list';persist();render();const el=$('#t-'+ds.task);if(el){el.scrollIntoView({block:'center'});el.style.outline='2px solid var(--aurora)';setTimeout(()=>el.style.outline='',1600)}return}
  if(ds.af){S.af=ds.af;render();return}
  if(ds.aflag){S.aflag=S.aflag===ds.aflag?'':ds.aflag;render();return}
  if(ds.cp){cpDrawer(ds.cp);return}
  if(ds.nego){toast('העסקה נמצאת בלשונית משא ומתן');return}
  if(ds.mine!==undefined){S.mine=ds.mine==='1';persist();render();return}
  if(ds.tv){S.tview=ds.tv;persist();render();return}
  if(ds.prule!==undefined){S.prule=ds.prule;render();return}
  if(ds.dec){if(!S.who.trim()||S.who.trim().split(/\s+/).length<2){toast('כתבו קודם מי מאשר: שם מלא.');$('#who')&&$('#who').focus();return}mark('decided',ds.dec,ds.val);toast('נשמר');render();return}
  if(ds.undo){delete S.decided[ds.undo];persist();if(DB){try{DB.collection('marks').doc('decided__'+ds.undo).delete()}catch(x){}}render();return}
  if(ds.ics){const tk=allTasks().find(x=>x.id===ds.ics);save('areo-'+ds.ics+'.ics',ics([tk]),'text/calendar');return}
  const act=ds.act;
  if(act==='settings')settingsDrawer();
  else if(act==='theme'){const r=document.documentElement,cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');r.dataset.theme=cur==='light'?'dark':'light';try{localStorage.setItem('areo_theme',r.dataset.theme)}catch(x){}}
  else if(act==='export'){const rows=[['צד שכנגד','הסכם','סוג','בתוקף עד','המועד הבא','אחראי']].concat(D.agreements.map(a=>{const n=nextTask(a);return [a.cp,a.title,ty(a.type).label,fmt(a.end),n?fmt(n.act_by||n.date)+' '+n.label:'',owner(a).lawyer]}));save('הסכמים.csv','﻿'+rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
  else if(act==='icsall'){const L=allTasks().filter(x=>x.date&&!closed(x)&&(!S.mine||taskOwner(x)===people()[0]));save('areo-מועדים.ics',ics(L),'text/calendar')}
  else if(act==='newtask')newTaskDrawer('');
  else if(act==='addtask'){const l=$('#nt-l').value.trim();if(!l){toast('חסר נושא למשימה.');$('#nt-l').focus();return}
    if(!NT.agr){toast('חסר הסכם.');return}if(!NT.owner){toast('חסר אחראי.');return}const d=$('#nt-d').value;
    const tk={id:'m-'+Date.now(),agr:NT.agr,label:l,date:d||null,act_by:d||null,action:$('#nt-x').value.trim(),manual:true,obligor:'us',critical:false};
    S.manual=(S.manual||[]).concat([tk]);S.owner[tk.id]={value:NT.owner,by:S.who,at:new Date().toISOString()};persist();
    if(DB){try{DB.collection('manual').doc(tk.id).set(Object.assign({by:S.who,at:new Date().toISOString()},tk))}catch(x){}}
    closeDrawer();S.view='tasks';render();toast('המשימה נוצרה')}
  else if(act==='addperson'){
    const n=$('#np-n').value.trim().replace(/^עו"ד\s*/,''),em=$('#np-e').value.trim(),dep=($('#np-d')||{}).value||'';
    if(n.split(/\s+/).length<2){toast('כתבו שם מלא, פרטי ומשפחה.');$('#np-n').focus();return}
    if(em&&!okMail(em)){toast('המייל לא תקין.');$('#np-e').focus();return}
    const full=NT.pk==='lawyer'?'עו"ד '+n:n+(dep.trim()?', '+dep.trim():'');
    if(!people().includes(full))S.people=(S.people||[]).concat([full]);S.emails[full]=em;
    const [k,id]=NT.ctx.split('|');
    if(k==='owner'&&id)mark('owner',id,full);
    else if(['tlaw','tbiz','tbak'].includes(k)){const f={tlaw:'lawyer',tbiz:'business',tbak:'backup'}[k];S.typeOwner[id]=Object.assign({},S.typeOwner[id]||{},{[f]:full})}
    else if(['alaw','abiz','abak'].includes(k)){const f={alaw:'lawyer',abiz:'business',abak:'backup'}[k];S.aowner[id]=Object.assign({},S.aowner[id]||{},{[f]:full})}
    else if(k==='ntowner')NT.owner=full;
    saveTeam();toast(em?'נוסף':'נוסף, בלי מייל: לא יקבל תזכורות');
    goBack();render()}
  else if(act==='addagr'){drawer('<div class="dh"><div class="top"><h2>הוספת הסכם</h2><button class="x" data-close aria-label="סגירה">×</button></div><div style="height:12px"></div></div><div class="db">'+
     '<p style="margin:0">הסכמים נכנסים ללוח מהתיקיות שלכם. כדי להוסיף הסכם, שמרו את הקובץ החתום באחת מהן:</p><div class="flagrow">'+D.meta.folders.map(f=>'<span class="pill n">'+esc(f)+'</span>').join('')+'</div>'+
     '<p class="muted" style="font-size:14px;margin:0">אחר כך כתבו בשיחה: ניהול חוזים, לעדכן את המאגר. ההסכם ייקרא, יקבל משימות ויושווה לפלייבוק.</p>'+
     '<div style="display:flex;gap:10px"><button class="btn soft" data-close>סגירה</button></div></div>')}
  else if(act==='timeline'){S.view='tasks';S.tview='tl';persist();render()}
  else if(act==='ready')toast('כתבו בשיחה: לבנות פלייבוק');
});
document.addEventListener('change',e=>{
  const t=e.target;
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;if(S.view==='overview')S.view='agreements';render();const i=$('#q');i.focus();i.setSelectionRange(pos,pos)}
  if(e.target.id==='who'){S.who=e.target.value;persist()}
  if(e.target.dataset&&e.target.dataset.docbase!==undefined){S.docBase=e.target.value.trim();clearTimeout(saveTeam.h);saveTeam.h=setTimeout(saveTeam,500)}
  if(e.target.dataset&&e.target.dataset.email!==undefined){S.emails[e.target.dataset.email]=e.target.value.trim();clearTimeout(saveTeam.h);saveTeam.h=setTimeout(saveTeam,500)}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('path[role=button]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));return}
  const p=$('#pop');
  if(p){const its=[...p.querySelectorAll('.it')],k=its.indexOf(document.activeElement);
    if(e.key==='Escape'){const b=openPop.btn;closePop();b&&b.focus();e.preventDefault();return}
    if(e.key==='ArrowDown'){(its[k+1]||its[0]).focus();e.preventDefault();return}
    if(e.key==='ArrowUp'){(its[k-1]||its[its.length-1]).focus();e.preventDefault();return}
    if(e.key==='Tab'){closePop();return}}
  if(e.key==='Escape')closeDrawer()});
window.addEventListener('scroll',e=>{const t=e.target;if(t&&t.closest&&t.closest('#pop'))return;closePop()},true);window.addEventListener('resize',()=>closePop());
try{const th=localStorage.getItem('areo_theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
render();
</script>

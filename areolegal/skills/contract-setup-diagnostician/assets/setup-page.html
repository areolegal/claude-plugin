<title>הקמת Areo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=Assistant:wght@400;500;600;700&family=Poppins:wght@400;700&display=swap">
<style>
/* Layout: one centred card per step, a slim progress rail above it, the next action always in the same place */
:root{
  --night:#0d0f14; --panel:#14171f; --raised:#1b1f29; --line:#272d3a; --line-strong:#353c4c;
  --ink:#eef1f5; --mist:#9aa3b2; --faint:#6b7486;
  --aurora:#2fe6a6; --aurora-ink:#06231a; --aurora-soft:rgba(47,230,166,.12);
  --warn:#f2b45c; --warn-soft:rgba(242,180,92,.12);
  --display:'Rubik','Assistant',system-ui,sans-serif;
  --body:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mark:'Poppins','Assistant',sans-serif;
  color-scheme:dark;
}
/* light mode, from the sun button (or the viewer's explicit light choice) */
:root[data-areo="light"],:root[data-theme="light"]:not([data-areo="dark"]){
  --night:#F4F7F5; --panel:#FFFFFF; --raised:#F0F3F6; --line:#DBE4E0; --line-strong:#C6D3CD;
  --ink:#10221C; --mist:#4F615A; --faint:#7A8A84;
  --aurora:#0B8C66; --aurora-ink:#FFFFFF; --aurora-soft:#E1F5EC;
  --warn:#8A5B06; --warn-soft:#FBF0D6;
  color-scheme:light;
}
:root[data-areo="light"] .chip[aria-pressed=true],:root[data-theme="light"]:not([data-areo="dark"]) .chip[aria-pressed=true]{color:#0B6B4F}
:root[data-areo="light"] .tag.legal,:root[data-theme="light"]:not([data-areo="dark"]) .tag.legal{background:#EFEAFD;color:#4A30A8}
:root[data-areo="light"] .tag.crit,:root[data-theme="light"]:not([data-areo="dark"]) .tag.crit{background:#FCE6E6;color:#9E2723}
.themebtn{width:36px;height:36px;border-radius:4px;border:1px solid var(--line-strong);background:var(--raised);color:var(--mist);cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1}
.themebtn:hover{color:var(--ink)}
.topright{display:flex;align-items:center;gap:12px}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.shell{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wordmark{font-family:var(--mark);font-weight:700;font-size:20px;direction:ltr;letter-spacing:-.3px}
.wordmark span{color:var(--mist);font-weight:400}.wordmark b{color:var(--aurora)}
.stepcount{color:var(--mist);font-size:14px;font-variant-numeric:tabular-nums}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rail i{display:block;height:4px;border-radius:4px;background:var(--line)}
.rail i.done{background:var(--aurora)}
.rail i.now{background:linear-gradient(90deg,var(--aurora),var(--aurora) 50%,var(--line) 50%)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:28px 26px;display:flex;flex-direction:column;gap:20px}
@media (max-width:480px){.card{padding:22px 18px}}
.eyebrow{font-size:13px;color:var(--aurora);font-weight:600;letter-spacing:.02em}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:30px;font-weight:700}
h2{font-size:24px;font-weight:600}
.lead{margin:0;color:var(--mist);max-width:62ch}
.facts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.facts li{display:flex;gap:12px;align-items:flex-start}
.facts li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--aurora);margin-top:9px}
.field{display:flex;flex-direction:column;gap:6px}
[hidden]{display:none!important}
/* the JSON a page sends is for support, never shown to the client */
.payload{display:none!important}
.field label,.legend{font-weight:600;font-size:15px}
.hint{font-size:13.5px;color:var(--mist)}
.optional{font-weight:400;color:var(--faint);font-size:13px;margin-inline-start:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
input[type=text],input[type=url],input[type=number],textarea,select{width:100%;background:var(--raised);border:1px solid var(--line-strong);color:var(--ink);
  border-radius:4px;padding:12px 14px;font:inherit;font-size:16px;outline:none;transition:border-color .15s}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--aurora);box-shadow:0 0 0 3px var(--aurora-soft)}
input.ltr{direction:ltr;text-align:right}
.note{font-size:13.5px;border-radius:4px;padding:8px 12px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--aurora-soft);color:var(--aurora)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips[data-multi] .chip[aria-pressed=true]::before{content:"\2713";margin-inline-end:6px;font-weight:700}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.agent{border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.agent b{font-size:15px}.agent span{color:var(--mist);font-size:13.5px;line-height:1.5}.agent .say{color:var(--aurora);font-size:13px;font-weight:600}
.typegroup{font-size:13px;color:var(--mist);margin:2px 0 -2px}
.chip{border:1px solid var(--line-strong);background:transparent;color:var(--ink);border-radius:4px;padding:8px 15px;font:inherit;font-size:15px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--mist)}
.chip[aria-pressed=true]{background:var(--aurora-soft);border-color:var(--aurora);color:var(--aurora);font-weight:600}
.chip:focus-visible,.btn:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--aurora);outline-offset:2px}
.signer{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center}
@media (max-width:480px){.signer{grid-template-columns:1fr 1fr}.signer .linkbtn{grid-column:1/-1;justify-self:start}}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:4px;padding:13px 26px;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--aurora);color:var(--aurora-ink);display:inline-block}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--mist);padding-inline:6px}
.btn.ghost:hover{color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--aurora);font:inherit;font-size:14.5px;cursor:pointer;padding:4px 0}
.sum{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sum .grp{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.sum .grp:last-child{border-bottom:0}
.sum .k{font-size:13px;color:var(--mist);margin-bottom:2px}
.sum .v{font-weight:600;min-width:0;overflow-wrap:anywhere}
.regs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.regs li{display:flex;flex-direction:column;gap:2px;padding:10px 14px;background:var(--raised);border-radius:4px}
.regs li b{font-weight:600;font-size:14.5px}.regs li span{font-size:13.5px;color:var(--mist)}
.privacy.prev{border:1px solid var(--line-strong);background:var(--warn-soft);color:var(--ink)}.privacy.prev b{color:var(--warn)}
.tag{font-size:12px;border-radius:4px;padding:2px 10px;white-space:nowrap}
.tag.c{background:var(--aurora-soft);color:var(--aurora)}
.tag.l{background:var(--warn-soft);color:var(--warn)}
.privacy{font-size:13.5px;color:var(--mist);background:var(--raised);border-radius:4px;padding:12px 14px}
.privacy b{color:var(--ink)}
details.payload{font-size:13px;color:var(--mist)}
details.payload pre{direction:ltr;text-align:left;background:var(--raised);border-radius:4px;padding:12px;overflow-x:auto;color:var(--ink);font-size:12px}
.done-mark{width:56px;height:56px;border-radius:50%;background:var(--aurora-soft);display:grid;place-items:center;color:var(--aurora);font-size:28px;font-weight:700}
.next{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line-strong);border-radius:6px}
.next .t{flex:1 1 220px;min-width:0}
.next .t b{display:block}
.conf{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}.conf input{margin-top:4px}.faintx{color:var(--mist)}
.next .t span{font-size:14px;color:var(--mist)}
.next.col{flex-direction:column;align-items:stretch}
.agents3{display:flex;flex-direction:column;gap:8px}
.ag3{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0}
.ic3{flex:none;width:32px;height:32px;border-radius:4px;background:var(--raised);color:var(--ink);display:flex;align-items:center;justify-content:center}
.t3{display:flex;flex-direction:column;gap:2px;min-width:0}.t3 b{font-size:14.5px}.t3 span{font-size:13px;color:var(--mist);line-height:1.5}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--raised);border:1px solid var(--line-strong);
  color:var(--ink);padding:10px 16px;border-radius:4px;font-size:14px;max-width:calc(100% - 32px)}
.proto{font-size:12.5px;color:var(--faint);text-align:center}
.phase{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mist)}
.phase b{color:var(--ink);font-weight:600}
.paths{display:grid;gap:12px}
.path{display:flex;gap:14px;align-items:flex-start;text-align:start;width:100%;background:var(--raised);border:1px solid var(--line-strong);border-radius:6px;padding:16px;color:var(--ink);font:inherit;cursor:pointer}
.path:hover{border-color:var(--aurora)}
.path .ic{flex:0 0 40px;height:40px;border-radius:4px;background:var(--aurora-soft);color:var(--aurora);display:grid;place-items:center;font-weight:700;font-family:var(--mark)}
.path b{display:block;font-size:16.5px;margin-bottom:2px}
.path span{font-size:14px;color:var(--mist)}
.demo{display:inline-block;font-size:11.5px;border:1px dashed var(--faint);color:var(--faint);border-radius:4px;padding:1px 9px;margin-inline-start:8px;vertical-align:middle}
.types{display:grid;gap:10px}
.type{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:start;width:100%;background:var(--raised);border:1px solid var(--line-strong);border-radius:4px;padding:14px 16px;color:var(--ink);font:inherit;cursor:pointer}
.type[aria-pressed=true]{border-color:var(--aurora);background:var(--aurora-soft)}
.type .meta{font-size:13.5px;color:var(--mist);display:block}
.type .nm{cursor:pointer}
.pathrow{display:flex;gap:10px;align-items:stretch}.pathrow input{flex:1;min-width:0}
.num{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;color:var(--faint)}
.steps li i{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-style:normal;font-size:12px}
.steps li.on{color:var(--ink)}.steps li.on i{border-color:var(--aurora);border-top-color:transparent;animation:spin 1s linear infinite}
.steps li.ok{color:var(--mist)}.steps li.ok i{border-color:var(--aurora);background:var(--aurora);color:var(--aurora-ink)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.on i{animation:none}}
.pos{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--raised)}
.pos.decided{border-color:var(--line-strong)}
.pos .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pos .hd b{font-size:16px}
.lane{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14.5px;align-items:baseline}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-top:6px}
.dot.g{background:#38d39f}.dot.y{background:var(--warn)}.dot.r{background:#f2676c}
.lane .yl,.lane .rl{color:var(--mist)}
.basis{font-size:13px;color:var(--mist)}
.decide{display:flex;gap:8px;flex-wrap:wrap}
.decide .chip{font-size:14px;padding:6px 13px}
.tag.legal{background:rgba(124,92,230,.16);color:#b6a3ff}
.tag.crit{background:rgba(242,103,108,.14);color:#f59a9d}
.counter{font-size:14px;color:var(--mist);font-variant-numeric:tabular-nums}
.deliver{display:grid;gap:10px}
.deliver .next{background:var(--raised)}

@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
/* follow-up questions open in place, under the answer that opened them, as in the setup form in the chat */
.fu{border-inline-start:2px solid var(--aurora);padding:4px 14px 6px;margin-top:10px;display:flex;flex-direction:column;gap:8px;animation:unfold .2s ease-out}
@keyframes unfold{from{opacity:0;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.fu{animation:none}}
.futag{font-size:12px;color:var(--aurora);font-weight:600}
.otherin{margin-top:8px}
.btn.small{padding:7px 14px;font-size:14px}
.whobar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--raised);border-radius:4px;padding:10px 14px;font-size:14.5px}
.whobar.ask{background:var(--aurora-soft)}
.whobar input{flex:1 1 160px;min-width:140px}
.aph3{font-family:var(--display);font-size:17px;margin:6px 0 -6px;display:flex;gap:10px;align-items:baseline}
.aph3 small{font-family:var(--body);font-size:13px;color:var(--mist);font-weight:400}
.strong{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,2.4fr) auto;gap:12px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow.chg{background:var(--warn-soft)}
.srow textarea{grid-column:1/-1}
.st b{display:block;font-size:15px}
.slanes{display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.slanes span{display:flex;gap:7px;align-items:baseline}
.d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;transform:translateY(-1px)}
.d.g{background:#38d39f}.d.y{background:#f2b45c}.d.r{background:#f2676c}
.sact{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.okt{font-size:13px;color:var(--aurora);font-weight:700;white-space:nowrap}
.apc{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--raised)}
.apc.decided{border-color:var(--line-strong)}
.aph{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.aph b{font-size:16px}
.aptag{font-size:12px;font-weight:700;color:#b6a3ff;background:rgba(167,139,250,.14);border-radius:4px;padding:2px 9px}
.apq{background:var(--warn-soft);border-radius:4px;padding:10px 12px}
.apq small{display:block;font-size:12px;font-weight:700;color:var(--mist)}
.apq p{margin:2px 0 0;font-size:15px}
.apdone{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.apres{font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 10px;white-space:nowrap}
.apres.g{background:var(--aurora-soft);color:var(--aurora)}.apres.y,.apres.l{background:var(--warn-soft);color:var(--warn)}.apres.r{background:rgba(242,103,108,.12);color:#f2676c}
.apin{flex:1;min-width:180px}
@media (max-width:640px){.srow{grid-template-columns:1fr}.sact{flex-direction:row;align-items:center;justify-content:space-between}}
.path.on{border-color:var(--aurora);background:var(--aurora-soft)}
/* inside the Areo system: the system already shows the name and the theme button */
.howconn{margin:0 0 12px;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.emb .top .wordmark,.emb #themebtn{display:none}.emb .top{justify-content:flex-end}
</style>

<div class="shell" dir="rtl" lang="he">
  <header class="top">
    <div class="wordmark">Areo<span>Contracts</span><b>.</b></div>
    <div class="topright"><div class="stepcount" id="count"></div><button type="button" class="themebtn" id="themebtn" aria-label="מצב בהיר או כהה">☀</button></div>
  </header>
  <div class="rail" id="rail" aria-hidden="true"></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var INIT=/*__AREO_INIT__*/null;
/* building "by what is common in the market" and the market comparison search the web. They stay in the page, off,
   until a version turns them on (lib/config.json features.playbook_market_research, passed in INIT.features) */
var MARKET_ON=!!(INIT&&INIT.features&&INIT.features.playbook_market_research);
var KEY='areo-onboarding-draft';
var STEPS=['welcome','company','incorp','sector','brand','summary','done'];
var QSTEPS=['company','incorp','sector','brand','summary'];
var FEN={'שולחן העבודה':'Desktop','מסמכים':'Documents','הורדות':'Downloads'};
var POS=(INIT&&INIT.positions)||[];
var S={pb:{path:'',family:'',side:'',deps:[],depsFree:'',market:false,concern:'',dec:{},page:0,tpl:false,conf:false,seg:'',segBy:[],segFree:'',dbk:[]},step:'welcome',name:'',reg:'',nameEn:'',multi:false,entities:'',country:'ישראל',type:'',listed:[],dual:[],sectors:[],fin:[],desc:'',markets:['ישראל'],mcs:'',
  dataFolder:null,other:{country:'',type:'',sectors:'',markets:'',fin:''},tradable:'',xreg:'',signers:[{name:'',role:''}],approver:{name:'',role:''},logo:'',brand:'',website:'',lang:'he',sent:false};
try{var saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object'){Object.assign(S,saved);S.sent=false;if(S.step==='pb_scan')S.step='pb_types';if(S.step==='pb_folder')S.step='pb_connect';if(S.step==='pb_build')S.step='pb_approve';if(!S.pb||!S.pb.dec)S.pb={path:'',family:'',side:'',deps:[],depsFree:'',market:false,concern:'',dec:{},page:0};['segBy','dbk'].forEach(function(k){if(!Array.isArray(S.pb[k]))S.pb[k]=[]});if(!Array.isArray(S.listed))S.listed=[];['dual','fin'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});if(!S.other)S.other={country:'',type:'',sectors:'',markets:'',fin:''};if(!S.approver)S.approver={name:'',role:''};}}catch(e){}
/* drafts from before 1.31: the renamed financial activities, and an insurer is now the sector, not an activity */
try{if(S.other.fin==null)S.other.fin='';if(S.xreg==null)S.xreg='';if(S.tradable==null)S.tradable='';S.fin=S.fin.map(function(x){return x==='מנהל קרנות נאמנות'?'מנהל קרנות נאמנות או השקעה':(x==='נותן שירות בנכס פיננסי'?'נותן שירות בנכס פיננסי (כולל נכסים דיגיטליים)':x)});var mbx=S.fin.indexOf('מבטח');if(mbx>=0){S.fin.splice(mbx,1);if(S.sectors.indexOf('ביטוח')<0)S.sectors.push('ביטוח')}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
if(INIT&&INIT.mode==='playbook'&&S.step.indexOf('pb_')!==0){S.step='pb_home'}
var EMB=!!(INIT&&INIT.embedded);
if(EMB)document.documentElement.classList.add('emb');
if(EMB&&['pb_done','pb_approve'].indexOf(S.step)>=0){S.step='pb_home'}
/* a new build of the system (a new conversation): a flow that was finished or sent before starts over, the answers stay */
if(EMB&&INIT.run&&S.run!==INIT.run){
  /* onboarding (mode setup) always starts at the company: recognised, or the questions */
  if(INIT.mode==='setup')S.step=INIT.has_profile?'ob_who':'welcome';
  else if(['pb_wait','pb_done','pb_approve','done'].indexOf(S.step)>=0)S.step='pb_home';
  S.run=INIT.run;S.sent=false;
}
if(EMB&&INIT.mode==='setup'&&INIT.has_profile&&S.step==='welcome'&&!S.newCompany)S.step='ob_who';
/* inside the Areo system: back to the policy screen, not to the setup steps */

function clmClick(t){
  if(t.dataset.chip&&t.dataset.chip.indexOf('cl')===0){var c=clmS(),k=t.dataset.chip,v=t.dataset.val;
    if(k==='cl_all')c.all=v;else if(k==='cl_channel')c.channel=v;else if(k==='cl_day')c.day=v;else if(k.indexOf('clx_')===0)c.excl[k.slice(4)]=v;
    save();var y=window.scrollY;render(true);window.scrollTo(0,y);return true}
  if(t.hasAttribute('data-clpick')){var p=$('#clpick');if(p){p.value='';p.click()}return true}
  if(t.dataset.clrm){clmS().folders.splice(+t.dataset.clrm,1);save();render(true);return true}
  if(t.hasAttribute('data-clsame')){var c2=clmS(),f=c2.owners[CLMI.types[0].code];CLMI.types.forEach(function(x){c2.owners[x.code]={lawyer:f.lawyer,business:f.business,backup:f.backup}});save();render(true);return true}
  if(t.hasAttribute('data-clstart')){send(clmPayload(),'',function(){S.step='clm_done';save();render();window.scrollTo(0,0)});return true}
  return false;
}

  if(t.hasAttribute('data-okall')){if(t.disabled)return;POS.forEach(function(p){if(!p.legal&&(S.pb.dec[p.id]||{}).st!=='change')S.pb.dec[p.id]={st:'ok'}});save();render(true);return}
  if(t.dataset.undo){delete S.pb.dec[t.dataset.undo];save();render(true);return}
  if(t.hasAttribute('data-later')){POS.forEach(function(p){if(p.legal&&!(S.pb.dec[p.id]||{}).st)S.pb.dec[p.id]={st:'later'}});save();savePb();return}
  if(t.hasAttribute('data-pbsave')){savePb();return}
  if(t.hasAttribute('data-dirpick2')){var d2=$('#dirpick2');if(d2){d2.value='';d2.click()}return}
  if(t.dataset.root){var ra=t.dataset.root.split(':');if(ra[0]==='data'&&S.dataFolder)S.dataFolder.root=ra[1];else if(ra[0]==='ag'&&S.pb.picked)S.pb.picked.root=ra[1];save();render(true);return}
  if(t.hasAttribute('data-dfconn')){S.dataFolder={mode:'connected'};save();render(true);return}
  if(t.hasAttribute('data-agconn')){var an=$('#agname');S.pb.agName=an?clean(an.value):'';S.pb.agConnected=true;S.pb.picked=null;S.pb.fpick='__connected';S.step='pb_side';save();render();window.scrollTo(0,0);return}
  if(t.dataset.pbwhere){if(t.disabled)return;S.pb.where=t.dataset.pbwhere;save();if(t.dataset.pbwhere==='same'){S.step='pb_side';save()}render();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-pbstart')){send(pbPayload(),'',function(){onboardDone();try{localStorage.setItem('areo-pb-building',JSON.stringify({family:clean(S.pb.family)||'',at:Date.now()}))}catch(e){}S.step='pb_wait';save();render();window.scrollTo(0,0)});return}
  if(t.hasAttribute('data-send')){send(payload(),'',function(){S.sent=true;S.step='done';save();render()});return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(clmInput(t))return;
  if(t.id==='name'||t.id==='nameEn'){S[t.id]=t.value}
  else if(t.id==='website'){S.website=t.value}
  else if(t.id==='xreg'){S.xreg=t.value}
  else if(t.id==='reg'){S.reg=t.value;var n=$('#regnote');if(n)n.innerHTML=regNote()}
  else if(t.id==='mtype'){S.pb.family=t.value;S.pb.side='';document.querySelectorAll('[data-chip=mtype]').forEach(function(c){c.setAttribute('aria-pressed','false')});var nb3=$('[data-need]');if(nb3)nb3.disabled=!clean(t.value)}
  else if(t.id==='segFree'){S.pb.segFree=t.value}
  else if(t.id==='sideFree'){S.pb.side=t.value;document.querySelectorAll('[data-chip=side]').forEach(function(c){c.setAttribute('aria-pressed','false')})}
  else if(t.id==='depsFree'){S.pb.depsFree=t.value}
  else if(t.id==='kindFree'){S.pb.family=t.value;S.pb.side='';S.pb.kindAuto=false;document.querySelectorAll('[data-chip=kind]').forEach(function(c){c.setAttribute('aria-pressed','false')});var ka2=$('[data-kindauto]');if(ka2)ka2.setAttribute('aria-pressed','false');var nb2=$('[data-needkind]');if(nb2)nb2.disabled=!clean(t.value)}
  else if(t.id==='fcustom'){S.pb.fcustom=t.value;var fb=$('[data-fcustom]');if(fb)fb.disabled=!clean(t.value)}
  else if(t.id==='concern'){S.pb.concern=t.value}
  else if(t.dataset.note){(S.pb.dec[t.dataset.note]=S.pb.dec[t.dataset.note]||{st:'change'}).note=t.value}
  else if(t.dataset.sn!=null){S.signers[+t.dataset.sn].name=t.value}
  else if(t.id==='entities'){S.entities=t.value}
  else if(t.id==='mcs'){S.mcs=t.value}
  else if(t.dataset.other){S.other[t.dataset.other]=t.value}
  else if(t.dataset.sr!=null){S.signers[+t.dataset.sr].role=t.value}
  save();refreshNext();pbNext();
});
document.addEventListener('change',function(e){
  if(e.target.id==='polpick'){var pfl=(e.target.files||[])[0];if(pfl){S.pb.policyFile={name:pfl.name.slice(0,140),size:pfl.size};save();render(true)}return}
  if(e.target.id==='dirpick2'){
    var f2=Array.prototype.slice.call(e.target.files||[]);if(!f2.length){toast('לא נבחרה תיקייה, או שהיא ריקה.');return}
    var top2=(f2[0].webkitRelativePath||f2[0].name).split('/')[0],nm2=f2.map(function(x){return x.name}).filter(function(n){return n.charAt(0)!=='.'});
    S.dataFolder={mode:'picked',name:top2,count:nm2.length,docs:nm2.filter(function(n){return /\.(docx?|pdf)$/i.test(n)}).length,sample:nm2.slice(0,8).map(function(n){return n.slice(0,80)}),books:[],reading:true};save();render(true);
    var rel=function(x){return String(x.webkitRelativePath||x.name)};
    var models=f2.filter(function(x){return /(^|\/)Areo-נתונים\/playbooks\/[^\/]+\/playbook-model\.json$/.test(rel(x))}).map(function(x){return rel(x).split('/').slice(-2)[0]});
    var legacy=f2.some(function(x){return /Areo Workspace - פלייבוק\.html$/.test(rel(x))});
    var idxf=f2.filter(function(x){return /(^|\/)Areo-נתונים\/playbooks\/index\.json$/.test(rel(x))})[0];
    var finish=function(names){var df0=S.dataFolder;if(!df0)return;var u=[];names.forEach(function(n){n=clean(n);if(n&&u.indexOf(n)<0)u.push(n)});if(!u.length&&legacy)u.push('פלייבוק קיים');df0.books=u.slice(0,10);df0.reading=false;save();render(true)};
    if(idxf&&idxf.text){idxf.text().then(function(s){var names=[];try{var j=JSON.parse(s),en=Array.isArray(j)?j:(j.playbooks||[]);en.forEach(function(e){if(e&&typeof e==='object')names.push(e.label||e.family_label||e.contract_family_name||e.family_name||e.family_id||'')})}catch(e){}finish(names.length?names:models)},function(){finish(models)})}
    else finish(models);
    return;
  }
  if(e.target.id==='dirpick'){
    var fl=Array.prototype.slice.call(e.target.files||[]);if(!fl.length){toast('לא נבחרה תיקייה, או שהיא ריקה.');return}
    var top=(fl[0].webkitRelativePath||fl[0].name).split('/')[0];
    var nm=fl.map(function(x){return x.name}).filter(function(n){return n.charAt(0)!=='.'});
    var w=nm.filter(function(n){return /\.docx?$/i.test(n)}).length,p=nm.filter(function(n){return /\.pdf$/i.test(n)}).length;
    S.pb.picked={name:top,count:nm.length,word:w,pdf:p,other:nm.length-w-p,sample:nm.slice(0,12).map(function(n){return n.slice(0,80)})};
    save();render();return;
  }if(e.target.id==='country'){S.country=e.target.value;save()}});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&canNext()){e.preventDefault();go('next')}
});

applyTheme();render();
try{
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('room').then(function(r){
      if(!r||typeof r.sendToClaudeSession!=='function')return;
      room=r;return Promise.resolve(r.canSendToClaudeSession()).then(function(m){roomMode=m},function(){roomMode='off'});
    }).catch(function(){});
  }
}catch(e){}
})();

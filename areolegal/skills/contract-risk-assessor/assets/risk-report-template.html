(function(){
 const SV=M.source_version||{};
 const RESP=/^our_(unsent|sent)_response$/.test(SV.text_status||'');
 const VERW=RESP?DX.verResp:DX.verGen;
 const still=()=>{try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};
 let VIEW='law', VER=1;
 const FX={cell:null,lens:null,k:''};
 const SEVN={crit:4,high:3,med:2,low:1};
 const sl=(r,v)=>{const R=r.residual||{},I=r.inherent||{};const x=(v===1&&R.severity!=null)?R:(I.severity!=null?I:R);const s=+x.severity||0,l=+x.likelihood||0;return {s,l,score:x.score!=null?+x.score:s*l};};
 const lvOf=(r,v)=>v===1?sevOf(r):lvlOf(sl(r,0).score);
 const lowered=r=>{const a=sl(r,0).score,b=sl(r,1).score;return (r.inherent&&r.residual&&b<a);};
 const ranked=RISKS.slice().sort((a,b)=>(SEVN[sevOf(b)]-SEVN[sevOf(a)])||(scoreOf(b)-scoreOf(a))||(a._no-b._no));
 const clauseOf=r=>{const a=(r.anchors||[])[0]||{};return a.clause||'';};
 const nfmt=n=>Number(n).toLocaleString(LANG==='en'?'en-US':'he-IL');

 /* ----- hero: kicker, title and the answer first ----- */
 const cp=(M.counterparty||{}).name||'';
 document.getElementById('rkKicker').textContent=DX.kicker+(cp?' · '+cp:'');
 document.getElementById('rkTitle').innerHTML=esc(DX.title)+'<em>'+esc(M.document_title||M.scope_label||'')+'</em>';
 function signTxt(){const k=S.sign_as_is;return k&&DX.sign[k]?DX.sign[k]+'. ':'';}
 function findHtml(){
  const n=RISKS.length; if(!n) return esc(L.emptyRisks);
  const cr=RISKS.filter(r=>sevOf(r)==='crit').length, hi=RISKS.filter(r=>sevOf(r)==='high').length, dn=RISKS.filter(lowered).length;
  const top=ranked[0], cl=clauseOf(top);
  if(VIEW==='law'){
   let h=esc(signTxt())+esc(DX.found)+'<b>'+n+'</b> '+esc(DX.risks);
   if(cr||hi) h+=': '+(cr?'<b>'+cr+'</b> '+esc(DX.crit):'')+(cr&&hi?esc(DX.and):'')+(hi?'<b>'+hi+'</b> '+esc(DX.high):'');
   h+='. ';
   if(dn) h+=esc(RESP?DX.downResp:DX.downGen)+'<b>'+dn+'</b>'+esc(DX.ofThem)+' ';
   return h+esc(DX.top)+esc(top.name||'')+(cl?' ('+esc(cl)+')':'')+'.';
  }
  const ser=cr+hi;
  return esc(signTxt())+(ser?esc(DX.outOf)+'<b>'+n+'</b> '+esc(DX.risks)+', <b>'+ser+'</b>'+esc(DX.serious)+' ':'')+esc(DX.topB)+esc(top.name||'')+'.'+(plainOf(top)?' '+esc(plainOf(top))+'.':'');
 }
 /* ----- the two numbers: the largest exposure and the deal value, each with its source ----- */
 const MP=S.money_picture||null, DV=M.deal_value||{};
 function srcChip(a){if(!a||!a.source||!DX.src[a.source])return '';const k=(a.source==='contract'&&a.calc&&a.calc!=='כלשון הסעיף')?'calc':a.source;return `<span class="calc">${esc(DX.src[k])}</span>`;}
 function topExposure(){
  const ex=(MP&&MP.exposures)||[];
  for(const x of ex){const am=x.amount||{},rg=x.range||{};
   if(am.value!=null) return {w:x.what,v:am.value,cur:am.currency,a:am,txt:null,how:[am.source_ref,am.calc].filter(Boolean).join('; ')};
   if((rg.low&&rg.low.value!=null)||(rg.high&&rg.high.value!=null)||rg.high_unlimited){
    const hi=rg.high_unlimited?DX.unl:(rg.high&&rg.high.value!=null?money(rg.high.value,rg.high.currency):'');
    const txt=(rg.low&&rg.low.value!=null)?money(rg.low.value,rg.low.currency)+(hi?DX.to+hi:''):(rg.high_unlimited?DX.unl:DX.upto+hi);
    const a=(rg.high&&rg.high.source)?rg.high:(rg.low||{});
    return {w:x.what,v:null,txt,a,how:[(rg.low||{}).source_ref,(rg.low||{}).calc,(rg.high||{}).source_ref,(rg.high||{}).calc].filter(Boolean).join('; ')};}
  }
  if(!ex.length){const r=RISKS.filter(r=>(((r.exposure||{}).amount)||{}).value!=null&&['contract','client'].includes(r.exposure.amount.source)).sort((a,b)=>b.exposure.amount.value-a.exposure.amount.value)[0];
   if(r){const am=r.exposure.amount;return {w:r.name,v:am.value,cur:am.currency,a:am,how:[am.source_ref,am.calc].filter(Boolean).join('; ')};}}
  return {w:(ex[0]||{}).what||'',none:true,reason:(ex[0]||{}).reason||''};
 }
 function drawNums(){
  const t=topExposure();
  const dvOk=DV.amount!=null;
  const box1=`<div class="rk-num max"><div class="lb">${esc(DX.maxL[VIEW])} ${t.none?'':srcChip(t.a)}</div>`+
   (t.none?`<div class="v none">${esc(DX.noAmt)}</div><div class="was">${esc(t.w)}${t.reason?': '+esc(t.reason):''}</div>`:
    `<div class="v"><bdi${t.v!=null?` data-cnt="${t.v}" data-cur="${att(t.cur||'')}"`:''}>${esc(t.v!=null?money(t.v,t.cur):t.txt)}</bdi></div><div class="was">${esc(t.w)}</div>`+
    (t.how?`<details><summary>${esc(DX.how)}</summary><p>${esc(t.how)}</p></details>`:''))+`</div>`;
  const box2=`<div class="rk-num val"><div class="lb">${esc(DX.valL[VIEW])} ${dvOk?srcChip(DV):''}</div>`+
   (dvOk?`<div class="v"><bdi data-cnt="${DV.amount}" data-cur="${att(DV.currency||'')}">${esc(money(DV.amount,DV.currency))}</bdi></div><div class="was">${esc([DX.per[DV.basis],DV.term].filter(Boolean).join(', '))}</div>`+(DV.source_ref?`<details><summary>${esc(DX.how)}</summary><p>${esc(DV.source_ref)}</p></details>`:''):
    `<div class="v none">${esc(DX.noDv)}</div>`)+`</div>`;
  const el=document.getElementById('rkNums');
  el.innerHTML=box1+box2+`<div class="legend" style="grid-column:1/-1;margin-top:0">${esc(DX.sideBy)}</div>`;
  el.querySelectorAll('[data-cnt]').forEach(b=>countUp(b,+b.dataset.cnt,b.dataset.cur));
 }
 function countUp(el,to,cur){
  if(still()||!isFinite(to)){el.textContent=money(to,cur);return;}
  const t0=performance.now(),d=1200;
  const f=t=>{const p=Math.min(1,(t-t0)/d);el.textContent=money(Math.round(to*(1-Math.pow(1-p,4))),cur);if(p<1&&el.isConnected)requestAnimationFrame(f);};
  requestAnimationFrame(f);setTimeout(()=>{if(el.isConnected)el.textContent=money(to,cur);},d+200);
 }
 /* ----- segmented controls: lawyer or management view, and which version ----- */
 function seg(id,items,cur,aria,on){
  const g=document.getElementById(id); if(!g) return;
  g.setAttribute('aria-label',aria); g.innerHTML='';
  items.forEach(([k,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',String(cur===k));b.addEventListener('click',()=>on(k));g.appendChild(b);});
 }
 function drawSegs(){
  const vi=[['law',DX.view.law],['biz',DX.view.biz]];
  const setV=k=>{VIEW=k;document.documentElement.setAttribute('data-view',k);drawSegs();document.getElementById('rkFind').innerHTML=findHtml();drawNums();};
  seg('rkView',vi,VIEW,DX.viewA,setV); seg('rkView2',vi,VIEW,DX.viewA,setV);
  const hasInh=RISKS.some(r=>r.inherent&&r.inherent.severity!=null);
  const vg=document.getElementById('rkVer'); if(vg) vg.hidden=!hasInh;
  if(hasInh) seg('rkVer',[[0,VERW[0]],[1,VERW[1]]],VER,DX.verA,k=>{VER=k;FX.cell=null;drawSegs();drawAll();});
 }
 /* ----- radar: the highest rating in each of the eight lenses, with the other version as a ghost ----- */
 function drawRadar(){
  const host=document.getElementById('rkRadar'); if(!host) return;
  const S0=340,cx=170,cy=165,R=104,n=LENS8.length,sg=LANG==='en'?1:-1;
  const ang=i=>-Math.PI/2+sg*i*2*Math.PI/n;
  const val=(k,v)=>{const rs=RISKS.filter(r=>lensOf(r)===k);return rs.length?Math.max(...rs.map(r=>sl(r,v).score))/25:0.05;};
  const pt=(i,f)=>[cx+R*f*Math.cos(ang(i)),cy+R*f*Math.sin(ang(i))];
  const pts=v=>LENS8.map((k,i)=>pt(i,Math.max(0.06,Math.min(1,val(k,v)))));
  const poly=v=>pts(v).map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ');
  const plen=v=>{const p=pts(v);return p.reduce((a,q,i)=>{const r=p[(i+1)%p.length];return a+Math.hypot(r[0]-q[0],r[1]-q[1]);},0);};
  let s=`<svg viewBox="-46 4 ${S0+92} ${S0-14}" role="img" aria-label="${att(DX.radarA)}">`;
  [0.2,0.4,0.6,0.8,1].forEach(f=>{s+=`<polygon class="grid" points="${LENS8.map((k,i)=>pt(i,f).map(x=>x.toFixed(1)).join(',')).join(' ')}"/>`;});
  LENS8.forEach((k,i)=>{const [x,y]=pt(i,1);s+=`<line class="ax" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;});
  const other=VER===1?0:1, hasInh=RISKS.some(r=>r.inherent&&r.inherent.severity!=null);
  if(hasInh) s+=`<polygon class="ghost fade" points="${poly(other)}"><title>${att(VERW[other])}</title></polygon>`;
  s+=`<polygon class="now draw" points="${poly(VER)}" style="--len:${Math.ceil(plen(VER))}"/>`;
  pts(VER).forEach(([x,y])=>{s+=`<circle class="pt fade" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6"/>`;});
  LENS8.forEach((k,i)=>{const [x,y]=pt(i,1.24),a=Math.cos(ang(i));const cov=COVER.find(c=>(OLDLENS[c.lens]||c.lens)===k)||{};
   const anchor=Math.abs(a)<0.2?'middle':((a>0)===(LANG==='en')?'start':'end');
   const words=String(LN[k]).split(' ');let lines=[LN[k]];
   if(LN[k].length>13&&words.length>1){let best=1,bd=1e9;for(let j=1;j<words.length;j++){const d=Math.abs(words.slice(0,j).join(' ').length-words.slice(j).join(' ').length);if(d<bd){bd=d;best=j;}}lines=[words.slice(0,best).join(' '),words.slice(best).join(' ')];}
   const y0=y+4-(lines.length-1)*6.5;
   s+=`<text class="lab${cov.status==='not_checked'?' nc':''}" data-lens="${k}" tabindex="0" role="button" aria-label="${att(LN[k])}" x="${x.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anchor}" direction="${LANG==='en'?'ltr':'rtl'}">${lines.map((t,j)=>`<tspan x="${x.toFixed(1)}" dy="${j?13:0}">${att(t)}</tspan>`).join('')}</text>`;});
  s+='</svg>';
  host.innerHTML=s+(hasInh?`<div class="lg"><span><i style="background:var(--brand)"></i>${esc(VERW[VER])}</span><span><i style="background:none;border-top:2px dashed var(--muted);height:0"></i>${esc(VERW[other])}</span></div>`:'')+`<div style="text-align:center;margin-top:6px"><button class="linkbtn" type="button" id="rkAll">${esc(DX.allRisks)}</button></div>`;
  host.querySelectorAll('.lab').forEach(t=>{const g=()=>{FX.lens=t.dataset.lens;FX.cell=null;applyFx();go('register');};t.addEventListener('click',g);t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g();}});});
  document.getElementById('rkAll').addEventListener('click',()=>{FX.cell=null;FX.lens=null;FX.k='';applyFx();go('register');});
 }
 /* ----- tiles: each count is a filter ----- */
 function drawTiles(){
  const el=document.getElementById('rkTiles'); if(!el) return;
  const c=f=>RISKS.filter(f).length;
  const items=[['crit',`<span class="mk crit"></span>`,DX.tiles.crit,c(r=>lvOf(r,VER)==='crit'),'crit'],
   ['high',`<span class="mk high"></span>`,DX.tiles.high,c(r=>lvOf(r,VER)==='high'),'high'],
   ['med',`<span class="mk med"></span>`,DX.tiles.med,c(r=>lvOf(r,VER)==='med'),''],
   ['low',`<span class="mk low"></span>`,DX.tiles.low,c(r=>lvOf(r,VER)==='low'),'']];
  const dn=c(lowered); if(dn) items.push(['down',`<span class="mv dn">&#9660;</span>`,RESP?DX.tiles.down:DX.tiles.downG,dn,'']);
  const dt=c(r=>favOf(r)==='done'); if(dt) items.push(['done',`<span class="fav done"></span>`,DX.tiles.done,dt,'']);
  el.innerHTML=items.map(([k,ic,l,v,tone])=>`<button type="button" class="tile" data-k="${k}" data-tone="${tone}" aria-pressed="${FX.k===k}"><div class="v">${ic}${v}</div><div class="l">${esc(l)}</div></button>`).join('');
  el.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>{FX.k=FX.k===b.dataset.k?'':b.dataset.k;applyFx();}));
 }
 /* ----- heat map: severity × likelihood, five by five. A cell filters chapter 1 ----- */
 function drawHeat(){
  const h=document.getElementById('rkHeat'); if(!h) return;
  let s='';
  for(let sv=5;sv>=1;sv--){
   s+=`<div class="yl">${esc(L.sevL[sv])}</div>`;
   for(let lk=1;lk<=5;lk++){
    const rs=RISKS.filter(r=>{const x=sl(r,VER);return x.s===sv&&x.l===lk;});
    const on=FX.cell&&FX.cell[0]===sv&&FX.cell[1]===lk;
    s+=`<button type="button" class="rk-cell${rs.length?' has':''}" data-s="${sv}" data-l="${lk}" data-z="${lvlOf(sv*lk)}" aria-pressed="${!!on}" aria-label="${att(DX.sevW+L.sevL[sv]+DX.likW+L.likL[lk]+': '+rs.length)}" style="--n:${Math.min(rs.length,4)}">`+
     (rs.length?`<span><b>${rs.length}</b><span class="dots">${rs.map(r=>`<span class="fav ${favOf(r)}" title="${att(r._no+'. '+(r.name||'')+' · '+DX.favS[favOf(r)])}"></span>`).join('')}</span></span>`:'')+`</button>`;
   }
  }
  s+='<div></div>'; for(let lk=1;lk<=5;lk++) s+=`<div class="xl">${esc(L.likL[lk])}</div>`;
  s+=`<div></div><div class="ax2"><span>${esc(DX.less)}</span><span>${esc(DX.more)}</span></div>`;
  h.innerHTML=s;
  h.querySelectorAll('.rk-cell').forEach(b=>b.addEventListener('click',()=>{const sv=+b.dataset.s,lk=+b.dataset.l;FX.cell=(FX.cell&&FX.cell[0]===sv&&FX.cell[1]===lk)?null:[sv,lk];applyFx();}));
 }
 /* ----- waterfall: how many risks each lens adds, up to the total. Counts, never money ----- */
 function drawWf(){
  const el=document.getElementById('rkWf'); if(!el) return;
  if(!RISKS.length){el.innerHTML=`<div class="empty">${esc(L.emptyRisks)}</div>`;return;}
  const vals=LENS8.map(k=>{const rs=RISKS.filter(r=>lensOf(r)===k);const z=rs.reduce((m,r)=>SEVN[lvOf(r,VER)]>SEVN[m]?lvOf(r,VER):m,'low');return [k,rs.length,z];}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const tot=RISKS.length, top=tot*1.12;
  let acc=0,cols='',labs='';
  vals.forEach(([k,v,z],i)=>{
   cols+=`<div class="col"><span class="bar" data-z="${z}" style="--d:${i*140}ms;inset-block-end:${acc/top*100}%;height:${v/top*100}%" title="${att(LN[k]+': '+v)}"></span><span class="val" style="--d:${i*140}ms;inset-block-end:calc(${(acc+v)/top*100}% + 2px)">${v}</span><span class="con" style="inset-block-end:${(acc+v)/top*100}%"></span></div>`;
   labs+=`<span><button type="button" data-lens="${k}" aria-pressed="${FX.lens===k}">${esc(LN[k])}</button></span>`;
   acc+=v;
  });
  const d=vals.length*140;
  cols+=`<div class="col"><span class="bar tot" style="--d:${d}ms;inset-block-end:0;height:${tot/top*100}%"></span><span class="val" style="--d:${d}ms;inset-block-end:calc(${tot/top*100}% + 2px)">${tot}</span></div>`;
  labs+=`<span><b>${esc(DX.tot)}</b></span>`;
  el.innerHTML=`<div class="rk-wf">${cols}</div><div class="rk-wfl">${labs}</div>`;
  el.querySelectorAll('[data-lens]').forEach(b=>b.addEventListener('click',()=>{FX.lens=FX.lens===b.dataset.lens?null:b.dataset.lens;applyFx();}));
 }
 /* ----- the filter: rows are hidden on screen only; print always shows the full table ----- */
 function match(r){
  if(FX.cell){const x=sl(r,VER);if(x.s!==FX.cell[0]||x.l!==FX.cell[1])return false;}
  if(FX.lens&&lensOf(r)!==FX.lens) return false;
  if(FX.k){if(FX.k==='down'){if(!lowered(r))return false;}else if(FX.k==='done'){if(favOf(r)!=='done')return false;}else if(lvOf(r,VER)!==FX.k)return false;}
  return true;
 }
 function applyFx(){
  let n=0;
  RISKS.forEach(r=>{const tr=document.getElementById('risk-'+r._no);if(!tr)return;const ok=match(r);tr.classList.toggle('fx',!ok);if(ok)n++;});
  const tags=[FX.cell?DX.cell+L.sevL[FX.cell[0]]+' × '+L.likL[FX.cell[1]]:'',FX.lens?LN[FX.lens]:'',FX.k?(DX.tiles[FX.k]||(FX.k==='down'?(RESP?DX.tiles.down:DX.tiles.downG):'')):''].filter(Boolean);
  const fl=document.getElementById('rkFl'); if(fl) fl.textContent=(tags.length?tags.join(' · ')+' · ':'')+DX.fl.replace('{n}',n).replace('{m}',RISKS.length);
  const none=document.getElementById('rkNone'); if(none){none.textContent=DX.none;none.classList.toggle('on',RISKS.length>0&&n===0);}
  const clr=document.getElementById('rkClr'); if(clr){clr.hidden=!(FX.cell||FX.lens||FX.k);}
  drawTiles(); drawHeat(); drawWf();
 }
 document.getElementById('rkHeatT').textContent=DX.heatT;
 document.getElementById('rkHeatLg').textContent=DX.heatLg;
 document.getElementById('rkWfT').textContent=DX.wfT;
 document.getElementById('rkWfLg').textContent=DX.wfLg;
 const clr=document.getElementById('rkClr'); clr.textContent=DX.clr;
 clr.addEventListener('click',()=>{FX.cell=null;FX.lens=null;FX.k='';applyFx();});
 /* chapter 1 is rebuilt by the page-one counters: keep the screen filter after a rebuild */

 drawRegister=function(){drawRegister0();FX.cell=null;FX.lens=null;FX.k='';applyFx();};

 /* ----- the clause drawer ----- */
 const DW=document.getElementById('rkDrawer'), DS=document.getElementById('dwScrim'), DB=document.getElementById('rkDwB');
 let lastFocus=null;
 const X=document.getElementById('rkDwX');
 X.setAttribute('aria-label',DX.close); X.title=DX.close;
 X.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
 function mvHtml(r){const a=sl(r,0).score,b=sl(r,1).score;if(!(r.inherent&&r.residual))return '';
  if(b<a)return `<span class="mv dn">&#9660; ${esc(DX.down.replace('{a}',a).replace('{b}',b))}</span>`;
  if(b>a)return `<span class="mv up">&#9650; ${esc(DX.up.replace('{a}',a).replace('{b}',b))}</span>`;
  return `<span class="mv eq">&#9679; ${esc(DX.eq)}</span>`;}
 function openRisk(r){
  if(!r) return;
  lastFocus=document.activeElement;
  const lv=sevOf(r), x=sl(r,1), cd=r.critical_detail||{}, e=r.exposure||{}, am=e.amount||{};
  const qs=(r.anchors||[]).map((a,i)=>{const n=(r._refs||[])[i];return a.quote?`<blockquote class="quote" dir="auto">${esc(a.quote)}<span class="src">${esc([a.document||a.agreement||'',a.clause||''].filter(Boolean).join(', '))}${n?' · '+esc(DX.qn.replace('{n}',n)):''}</span><button type="button" class="copybtn" data-copy="${i}">${esc(DX.copyQ)}</button></blockquote>`:'';}).join('');
  const SW=LANG==='en'?['conflict','combination']:['סתירה','צירוף'];
  const see=DEFECTS.filter(d=>(d.risk_ids||[]).includes(r.id)).map(d=>SW[0]+' '+d._no).concat(COMBOS.filter(c=>(c.risk_ids||[]).includes(r.id)).map(c=>SW[1]+' '+c._no));
  const ctl=(r.controls||[]).filter(c=>c&&c.description);
  let h=`<div class="legend" style="margin-top:0">${esc(LENSNAME(r))}${clauseOf(r)?' · '+esc(clauseOf(r)):''}</div><div class="ttl" dir="auto">${esc(r.name||'')}</div>`+
   `<div class="chips"><span class="chip ${lv}"><span class="mk ${lv}"></span>${esc(L.lvl[lv])}${x.s?' · '+esc(L.sevL[x.s]||'')+' × '+esc(L.likL[x.l]||''):''}</span><span class="chip gray"><span class="fav ${favOf(r)}"></span> ${esc(DX.favS[favOf(r)])}</span>${mvHtml(r)}</div>`;
  if(qs) h+=`<h4>${esc(DX.says)}</h4>`+qs;
  if(VIEW==='law'){
   if(r.description) h+=`<h4>${esc(DX.analysis)}</h4><p dir="auto">${esc(r.description)}</p>`;
   const hap=cd.what_happens||r.scenario; if(hap) h+=`<h4>${esc(DX.happens)}</h4><p dir="auto">${esc(hap)}</p>`;
   if(cd.why_not_protected) h+=`<p dir="auto" style="margin-top:4px">${esc(cd.why_not_protected)}</p>`;
   h+=`<h4>${esc(DX.ctl)}</h4>`+(ctl.length?`<ul style="padding-inline-start:18px">${ctl.map(c=>`<li dir="auto">${esc(c.description)}</li>`).join('')}</ul>`:`<p class="legend" style="margin-top:0">${esc(DX.noCtl)}</p>`);
  } else {
   const p=plainOf(r); if(p) h+=`<h4>${esc(DX.plain)}</h4><p dir="auto">${esc(p)}</p>`;
  }
  const amt=(am.value!=null&&(am.source==='contract'||am.source==='client'))?`<b>${esc(money(am.value,am.currency))}</b> ${srcChip(am)}${am.text?' '+esc(am.text):''}${am.calc?`<div class="legend" style="margin-top:2px">${esc(am.calc)}</div>`:''}`:'';
  if(amt||e.contractual_cap||(e.cap_exclusions||[]).length||(VIEW==='law'&&e.basis)){
   h+=`<h4>${esc(DX.expo)}</h4><div class="calcbox">`+(amt?`<div>${amt}</div>`:'')+(VIEW==='law'&&e.basis?`<div dir="auto">${esc(e.basis)}</div>`:'')+(e.contractual_cap?`<div><b>${esc(DX.cap)}:</b> ${esc(e.contractual_cap)}</div>`:'')+((e.cap_exclusions||[]).length?`<div><b>${esc(DX.excl)}:</b> ${esc(e.cap_exclusions.join('; '))}</div>`:'')+`</div>`;
  }
  if(r.treatment_direction) h+=`<h4>${esc(DX.dir)}</h4><div class="tier" dir="auto">${esc(r.treatment_direction)}</div>`;
  if(see.length) h+=`<h4>${esc(DX.see)}</h4><p>${esc(see.join(', '))}</p>`;
  h+=`<p class="legend">${esc(L.expert)}.</p>`;
  if((r._refs||[]).length) h+=`<p style="margin-top:10px"><button type="button" class="linkbtn" id="rkToApp">${esc(DX.toApp)}</button></p>`;
  DB.innerHTML=h;
  DB.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{const a=(r.anchors||[])[+b.dataset.copy]||{};copyQ(a.quote||'',b);}));
  const ta=document.getElementById('rkToApp'); if(ta) ta.addEventListener('click',()=>{const n=r._refs[0];closeDw();showRef(n);});
  document.getElementById('rkDwT').textContent=clauseOf(r)||(LANG==='en'?'Risk ':'סיכון ')+r._no;
  DW.classList.add('open'); DW.setAttribute('aria-hidden','false'); DS.classList.add('on');
  DB.scrollTop=0; setTimeout(()=>X.focus(),30);
 }
 function copyQ(txt,btn){
  const done=()=>{const t=btn.textContent;btn.textContent=DX.copied;btn.classList.add('ok');setTimeout(()=>{btn.textContent=t;btn.classList.remove('ok');},1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}else fallbackCopy(txt,done);
 }
 function closeDw(){if(!DW.classList.contains('open'))return;DW.classList.remove('open');DW.setAttribute('aria-hidden','true');DS.classList.remove('on');if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}}
 X.addEventListener('click',closeDw); DS.addEventListener('click',closeDw);
 document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&DW.classList.contains('open')){closeDw();return;}
  if(e.key==='Tab'&&DW.classList.contains('open')){const f=[...DW.querySelectorAll('button,[href],[tabindex]:not([tabindex="-1"]),summary')].filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}}
 });
 const REG=document.getElementById('register');
 REG.addEventListener('click',e=>{if(e.target.closest('sup.ref'))return;const tr=e.target.closest('tr[data-rid]');if(tr)openRisk(RISKS.find(r=>r.id===tr.dataset.rid));});
 REG.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.closest('sup.ref'))return;const tr=e.target.closest('tr[data-rid]');if(tr){e.preventDefault();openRisk(RISKS.find(r=>r.id===tr.dataset.rid));}});
 REG.querySelectorAll('tr[data-rid]').forEach(tr=>tr.setAttribute('aria-label',DX.open+' '+tr.querySelector('td.num').textContent));
 window.addEventListener('beforeprint',closeDw);

 const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6L17 17M7 7L5.4 5.4"/></svg>';
 const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z"/></svg>';
 function paintTB(){const light=document.documentElement.getAttribute('data-theme')==='light';TB.innerHTML=light?MOON:SUN;TB.title=light?DX.toDark:DX.toLight;TB.setAttribute('aria-label',TB.title);}
 TB.addEventListener('click',()=>{const next=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('areo_theme',next);}catch(e){}paintTB();});
 paintTB();

 drawSegs(); drawAll();

/* Client brand colours: applied in the head, by clientTheme(DATA), before the first paint. */

/* Client logo: a data URI carried on the payload, so the page stays
   self-contained and the CSP never sees an external request. */
(function clientLogo(){
  try{
    var src = ((DATA.meta || {}).branding || {}).logo;
    if (!src || !/^data:image\//.test(String(src))) return;   // only an embedded image; a file path is never loaded
    var el = document.getElementById('clientLogo');
    if (!el) return;
    el.src = src;
    el.alt = ((DATA.meta || {}).company) || '';
    el.classList.add('on');
  }catch(e){}
})();

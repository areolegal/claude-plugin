function trackPct(rid,t){
  /* אחוז ההסכמים שבהם נמצאה העמדה הזאת, מתוך ההסכמים הפנימיים שנסרקו.
     בלי ציטוטים מתוייגים אין אחוז, ואין להמציא אותו. */
  const tot=intSources().length;
  if(!tot) return null;
  const seen={}; citesTrack(rid,t).forEach(c=>{ const s=D.sources[c.src]||{}; if(s.kind==='internal'&&s.is_agreement!==false) seen[c.src]=1; });
  const n=Object.keys(seen).length;
  return {n:n, tot:tot, pct:Math.round(n*100/tot)};
}
function fnChips(rid,track){
  /* תגית לכל מקור: שם ההסכם ומספר הסעיף. הנתונים המלאים נפתחים במגירה,
     כדי שגם שלושים מקורות ייכנסו בלי להפוך את הסעיף לטבלה. */
  const cs = track ? citesTrack(rid,track) : citesFor(rid);
  if(!cs.length) return '';
  return '<div class="srcs">'+cs.map(c=>{
    const own = paperOf(c.src)==='ours';
    return `<button class="src ${own?'ours':''}" title="${esc(srcName(c.src)+' '+c.ref)}" onclick="openCite('${c.id}')">${esc(srcShort(c.src))} <b>${esc(String(c.ref||'').replace('סעיף ',''))}</b>${evkMini(c)}</button>`;

/* מה המסלול מטיל על החברה, שורה לכל תפקיד שיש לה בהסכם מהסוג הזה.

   עם תפקיד אחד שורה אחת, עם שניים או יותר שורה לכל אחד. אין כאן ניסוח
   משל עצמנו, רק הנוסח שהמודל כתב (`dashboard_spec.md`, "מפרט הלשוניות"). */

  ).filter(x=>x[1]);

/* ---------- מחלקות אחראיות: לקריאה בלבד (`dashboard_spec.md`, לשונית 8) ----------
   מ-responsible_departments, departments_proposed ו-obligation_assignments שבמודל. אין כאן עריכה,
   ושום דבר אינו נשמר מהלשונית. בלי השדות הלשונית אינה מוצגת. סוג החיוב הוא אחד מ-17 הסוגים של
   מרשם ההתחייבויות, והתווית שלו עוברת ב-T. */
const OBL_TYPES={payment:'תשלום', milestone:'אבן דרך', deliverable:'מסירה', insurance:'ביטוח', guarantee:'ערבות',
  reporting:'דיווח', notice:'הודעה', renewal_notice:'הודעת אי חידוש', term_end:'תום תקופה', option:'אופציה',
  audit:'ביקורת', consent_approval:'הסכמה או אישור', data_return_deletion:'החזרה ומחיקה של מידע',
  confidentiality:'סודיות', compliance:'ציות', price_adjustment:'עדכון מחיר', other:'אחר'};
function deptData(){
  const x=D.departments;
  return (x&&((x.responsible||[]).length||(x.proposed||[]).length||(x.assignments||[]).length))?x:null;
}
function deptSrc(s){
  if(!s) return '';
  if(typeof s==='string') return citeById(s)?`<button class="btn ghost sm" onclick="openCite('${esc(s)}')">${esc(s)}</button>`:esc(s);
  const txt=[s.agreement||'', s.clause?T('סעיף ')+s.clause:''].filter(Boolean).join(', ');
  const cid=s.citation_id;
  return cid&&citeById(cid)?`<button class="btn ghost sm" onclick="openCite('${esc(cid)}')">${esc(txt||cid)}</button>`:esc(txt);
}
function deptRows(list){
  return `<table class="tbl"><thead><tr><th>${T("סוג החיוב")}</th><th>${T("תמצית")}</th><th>${T("מקור")}</th></tr></thead>
    <tbody>${list.map(a=>`<tr><td>${esc(OBL_TYPES[a.type]?T(OBL_TYPES[a.type]):a.type)}${a.needs_verification?` <span class="tag y">${T("טעון אימות")}</span>`:''}</td>
      <td>${esc(a.summary||'')}</td><td>${deptSrc(a.source)}</td></tr>`).join('')}</tbody></table>`;
}
function vDepartments(){
  const x=deptData()||{};
  const resp=x.responsible||[], asg=x.assignments||[], prop=x.proposed||[];
  const by={}; asg.forEach(a=>{ const k=a.department||''; (by[k]=by[k]||[]).push(a); });
  const order=resp.concat(Object.keys(by).filter(k=>k&&resp.indexOf(k)<0));
  return `<div class="card pad" style="margin-bottom:14px">
    <h3 style="margin:0 0 5px">${T("מחלקות אחראיות")}</h3>
    <p class="mut" style="margin:0">${T("המחלקות שהחברה קבעה, וחלוקת החיובים שההסכמים מטילים ביניהן. הלשונית לקריאה בלבד: שינוי נעשה בשיחה, והלשונית מתעדכנת בבנייה הבאה.")}</p>
  </div>
  ${order.map(dep=>`<div class="card pad" style="margin-bottom:14px">
    <h3 style="margin:0 0 9px">${esc(dep)}${resp.indexOf(dep)<0?` <span class="tag y">${T("מוצע")}</span>`:''}</h3>
    ${(by[dep]||[]).length?deptRows(by[dep]):`<div class="mut">${T("לא שויכו חיובים למחלקה הזאת.")}</div>`}
  </div>`).join('')}
  ${(by['']||[]).length?`<div class="card pad" style="margin-bottom:14px"><h3 style="margin:0 0 9px">${T("חיובים בלי מחלקה שנקבעה")}</h3>${deptRows(by[''])}</div>`:''}
  ${prop.length?`<div class="card pad">
    <h3 style="margin:0 0 9px">${T("מחלקות שהוצעו מתוך ההסכמים, ועוד לא נקבעו")}</h3>
    ${prop.map(p=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <span class="tag y">${T("מוצע")}</span> <b style="font-size:12.5px">${esc(p.name||'')}</b>
      ${p.quote?`<div class="quote" dir="auto" style="margin-top:6px">${esc(p.quote)}</div>`:''}
      <div class="mut" style="margin-top:5px;font-size:11.5px">${deptSrc(p.source)}</div></div>`).join('')}
  </div>`:''}`;
}
function kpi(v,l,s,cls){ return `<div class="card kpi"><div class="big" ${cls==='danger'?'style="color:var(--red)"':''}>${esc(v)}</div>
  <div style="font-size:12.5px;font-weight:600;margin-top:2px">${esc(l)}</div><div class="mut" style="font-size:11px">${esc(s)}</div></div>`; }

function setProp(rid,color,v){ S.props[rid]=S.props[rid]||{}; S.props[rid][color]=v; save(); dbWrite(rid); }
function dropProp(rid,color){ if(S.props[rid]){ delete S.props[rid][color]; save(); dbWrite(rid); render(); toast(T('ההצעה נמחקה')); } }
function setNote(rid,v){ S.notes[rid]=v; save(); dbWrite(rid); }
/* מה שמוצג כמדיניות הוא מה שבפלייבוק, תמיד. הצעת נוסח של קורא אינה מחליפה

function effLight(r,color){

/* ---------- השוואת סעיפים ---------- */
function cmpState(){ S.cmp = S.cmp || {rule:'', seg:'', scope:'all'}; return S.cmp; }
function cmpSet(f,v){ cmpState()[f]=v; save(); render(); }
function cmpFind(q){
  if(q==null){ const el=document.getElementById('cmpq'); q=el?el.value:''; }
  q=String(q||'').trim().toLowerCase();
  if(!q){ const el=document.getElementById('cmpq'); if(el) el.focus(); toast(T('לא נמצא נושא מתאים. נסו שם נושא או מספר סעיף.')); return; }
  q=(q||'').trim().toLowerCase(); if(!q) return;
  const byNum=q.match(/^\d{1,2}$/);
  const r = byNum ? rulesOf().find(x=>rnum(x.id)===q)
                  : rulesOf().find(x=>(x.topic+' '+x.issue).toLowerCase().includes(q));
  if(r){ cmpSet('rule',r.id); } else { toast(T('לא נמצא נושא מתאים. נסו שם נושא או מספר סעיף.')); }
}
function cmpRows(r, scope){
  return citesFor(r.id).filter(c=>{
    const s=D.sources[c.src]||{};
    if(s.kind!=='internal'||!isAgreement(c.src)) return false;
    if(scope && scope!=='all' && scope!=='internal' && scope!=='external') return c.src===scope;
    return true;
  });
}
function vCompare(){
  const st=cmpState();
  const r = st.rule ? byId(st.rule) : null;
  const segs = effSegs();
  const head = `<div class="card pad" style="margin-bottom:14px">
    <h3 style="margin:0 0 5px">${T("השוואת סעיפים בין הסכמים")}</h3>
    <p class="mut" style="margin:0;max-width:760px">${T("בוחרים נושא לפי שם או לפי מספר סעיף, ומקבלים זה לצד זה את העמדה המועדפת ואת מה שנקבע בפועל בכל אחד מהסכמי החברה שמהם נבנה הפלייבוק. ההשוואה מוצגת מול ההסכמים הפנימיים בלבד. אפשר לצמצם לסגמנט מסוים או להסכם בודד.")}</p>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;align-items:center">
      <input class="search" id="cmpq" style="max-width:250px" placeholder="${T("נושא או מספר סעיף, למשל: שיפוי או 6")}"
        onkeydown="if(event.key==='Enter')cmpFind(this.value)">
      <button class="btn ghost sm" onclick="cmpFind()">${T("איתור")}</button>
      <select class="cmpsel" onchange="cmpSet('rule',this.value)">
        <option value="">${T("בחירת נושא מהרשימה")}</option>
        ${rulesOf().map(x=>`<option value="${x.id}" ${st.rule===x.id?'selected':''}>${esc(disp(x.id)+' · '+x.topic)}</option>`).join('')}
      </select>
      ${segs.length?`<select class="cmpsel" onchange="cmpSet('seg',this.value)">
        <option value="">${T("כל הסגמנטים")}</option>
        ${segs.map(s=>`<option value="${s.segment_id}" ${st.seg===s.segment_id?'selected':''}>${esc(s.label)}</option>`).join('')}
      </select>`:''}
      <select class="cmpsel" onchange="cmpSet('scope',this.value)">
        <option value="all" ${st.scope==='all'?'selected':''}>${T("כל הסכמי החברה")}</option>
        ${srcKeys().filter(k=>D.sources[k].kind==='internal'&&isAgreement(k)).map(k=>`<option value="${k}" ${st.scope===k?'selected':''}>${esc(srcName(k))}</option>`).join('')}
      </select>
    </div>
  </div>`;
  if(!r){
    return head + cmpMatrix() + `<div class="card pad">
      <div class="lbl">${T("או בבחירה מהירה לפי נושא")}</div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px">
        ${rulesOf().map(x=>`<button class="topicchip" onclick="cmpSet('rule','${x.id}')">${esc(disp(x.id)+' · '+x.topic)}</button>`).join('')}
      </div></div>`;
  }
  const rows = cmpRows(r, st.scope);
  const seg = st.seg ? segs.find(s=>s.segment_id===st.seg) : null;
  const bv = seg ? (r.variants||[]).find(v=>v.seg===seg.segment_id) : null;
  const uv = seg ? S.userVariants[r.id+'|'+seg.segment_id] : null;
  const pro=rows.filter(c=>c.side==='pro').length, con=rows.filter(c=>c.side==='con').length;
  const hasInternal=rows.some(c=>(D.sources[c.src]||{}).kind==='internal');
  const segBlockHtml = !seg ? '' : `<div class="card pad" style="margin-bottom:14px">
      <b style="font-size:13px">${T("המדיניות בסגמנט:")} ${esc(seg.label)}</b>
      ${bv?`<div class="mut" style="margin:5px 0 8px">${esc(firstSent((bv.rat||{}).executive_segment_rationale||''))}</div>
        ${isImposed(bv) ? imposedLayers(bv) : `<div class="grid g3">
          <div class="lightcard g" style="margin:0"><h4>${T("ירוק")}</h4><div style="font-size:12px">${esc((bv.tl.green||{}).pos||'')}</div></div>
          <div class="lightcard y" style="margin:0"><h4>${T("צהוב")}</h4><div style="font-size:12px">${esc((bv.tl.yellow||{}).pos||'')}</div></div>
          <div class="lightcard r" style="margin:0"><h4>${T("אדום")}</h4><div style="font-size:12px">${esc((bv.tl.red||{}).pos||'')}</div></div>
        </div>`}`
      : uv?`<div class="grid g3" style="margin-top:8px">
          <div class="lightcard g" style="margin:0"><h4>${T("ירוק")}</h4><div style="font-size:12px">${esc(uv.green.pos)}</div></div>
          <div class="lightcard y" style="margin:0"><h4>${T("צהוב")}</h4><div style="font-size:12px">${esc(uv.yellow.pos)}</div></div>

}

/* ---------- מדיניות לפי סגמנטים ---------- */
function effSegs(){
  const changed=(S.segEdits&&S.segEdits.changed)||{};
  const removed=(S.segEdits&&S.segEdits.removed)||[];
  return D.segments.filter(s=>!removed.includes(s.segment_id))
    .map(s=>Object.assign({},s,changed[s.segment_id]||{}))
    .concat((S.segEdits&&S.segEdits.added)||[]);
}
function segAdd(){ S.segEdits.added=S.segEdits.added||[];
  S.segEdits.added.push({segment_id:'SEG-U'+(Date.now()%100000),label:T('סגמנט חדש'),criteria:T('[להשלים]'),user:true});
  save(); render(); toast(T('נוסף סגמנט. ערכי את שמו ואת התנאים.')); }
function segSet(id,f,v){ const a=(S.segEdits.added||[]).find(s=>s.segment_id===id);
  if(a){a[f]=v;} else { S.segEdits.changed=S.segEdits.changed||{}; S.segEdits.changed[id]=S.segEdits.changed[id]||{}; S.segEdits.changed[id][f]=v; } save(); }
function segDel(id){ const a=S.segEdits.added||[]; const i=a.findIndex(s=>s.segment_id===id);
  if(i>=0){a.splice(i,1);} else {(S.segEdits.removed=S.segEdits.removed||[]).push(id);} save(); render(); toast(T('נרשמה הצעה להסרת הסגמנט')); }
function addUserVariant(rid,segId){ const r=byId(rid);
  S.userVariants[rid+'|'+segId]={
    green:{pos:effLight(r,'green').pos,clause:effLight(r,'green').clause},
    yellow:{pos:effLight(r,'yellow').pos,clause:effLight(r,'yellow').clause,comments:effLight(r,'yellow').comments||''},
    red:{pos:effLight(r,'red').pos,clause:effLight(r,'red').clause}};
  save(); render(); toast(T('נוצרה הצעת חריג: ')+disp(rid)+T('. היא אינה מדיניות')); }
function delUserVariant(rid,segId){ delete S.userVariants[rid+'|'+segId]; save(); render(); }
function setUV(rid,segId,color,f,v){ const k=rid+'|'+segId; if(S.userVariants[k]){ S.userVariants[k][color][f]=v; save(); } }
/* סגמנט שאין בו משא ומתן אינו רמזור: הוא בנוי משלוש שכבות שאינן
   מתערבבות (`segmentation.md`, §12). הצגה שלו כירוק, צהוב ואדום רגילים
   אומרת ללקוח שיש לו עמדה במקום שבו אין לו. */
function imposedLayers(v){
  const L=[];
  const reg=v.imposed_regime, cl=v.clarification_positions, bid=v.bid_conditions;
  if(reg) L.push(`<div class="lightcard r" style="margin:0 0 9px">
    <h4>${T("משטר כפוי, לא עמדת החברה")}</h4>
    ${(Array.isArray(reg)?reg:[reg]).map(x=>`<div style="font-size:12px;margin-top:5px">
      <b>${esc(x.topic||'')}</b> ${esc(x.imposed||x.text||'')}
      ${x.effect?`<div class="mut">${esc(x.effect)}</div>`:''}
      ${x.refs&&x.refs.length?`<div class="mut" style="font-size:11px">${esc(x.refs.join(', '))}</div>`:''}
    </div>`).join('')}</div>`);
  if(cl) L.push(`<div class="lightcard y" style="margin:0 0 9px">
    <h4>${T("מה מבקשים לפני החתימה (בהליך תחרותי: בשאלות ההבהרה)")}</h4>
    ${cl.green?`<div style="font-size:12px"><b>${T("הבקשה שלנו:")}</b> ${esc(cl.green.pos||cl.green)}</div>`:''}
    ${cl.yellow?`<div style="font-size:12px;margin-top:5px"><b>${T("בקשה מצומצמת:")}</b> ${esc(cl.yellow.pos||cl.yellow)}
      ${cl.yellow.label?`<span class="tag y">${esc(cl.yellow.label)}</span>`:''}</div>`:''}</div>`);
  if(bid) L.push(`<div class="lightcard g" style="margin:0">
    <h4>${T("חותמים, חותמים בתנאי, או לא חותמים (בהליך תחרותי: ניגשים או לא)")}</h4>
    ${(Array.isArray(bid)?bid:[bid]).map(x=>`<div style="font-size:12px;margin-top:5px">
      <b>${esc(x.recommendation||x.rec||'')}</b>
      ${x.combination?`<div class="mut">${esc(x.combination)}</div>`:''}
      ${x.why?`<div class="mut">${esc(x.why)}</div>`:''}</div>`).join('')}</div>`);
  return L.length ? `<div style="margin-top:8px">${L.join('')}</div>` : '';
}
function isImposed(v){ return !!v && (v.mode==='imposed' || v.negotiation_mode==='imposed'); }
function segFullView(s){

    <div class="mut" style="margin-top:6px">${T("מוצגים כל")} ${rulesOf().length} ${T("נושאי המדיניות של סוג ההסכם שנבחר. בנושאים המסומנים, לסגמנט זה עמדה ייחודית הגוברת על המדיניות הכללית; בשאר חלה המדיניות הכללית כלשונה.")}</div>

      <b style="font-size:13px">${disp(r.id)} · ${esc(r.topic)}</b> <span class="tag y">${T("עמדה ייחודית לסגמנט זה")}</span>${v?'':T(' <span class="tag y">הצעה, לא מדיניות</span>')}${isImposed(v)?T(' <span class="tag r">אין משא ומתן בסגמנט הזה</span>'):''}
      ${v&&v.rat?`<div class="mut" style="margin:6px 0"><b>${T("מדוע שונה:")}</b> ${esc(v.rat.executive_segment_rationale||'')}</div>`:''}
      ${isImposed(v) ? imposedLayers(v)
        : `<div class="grid g3" style="margin-top:8px">${['green','yellow','red'].map(k=>`<div class="lightcard ${k[0]==='g'?'g':k[0]==='y'?'y':'r'}" style="margin:0"><h4>${{green:T('ירוק'),yellow:T('צהוב'),red:T('אדום')}[k]}</h4><div style="font-size:12px">${esc((tl[k]||{}).pos||'')}</div>${(tl[k]||{}).clause?`<div class="quote" dir="auto" style="margin-top:7px">${esc(tl[k].clause)}</div>`:''}</div>`).join('')}</div>`}
      <button class="btn ghost sm" style="margin-top:9px" onclick="go('rules');setTimeout(()=>openRule('${r.id}'),60)">${T("לנושא המלא")}</button></div>`;
    }
    return `<div class="rrow"><span class="dotico" style="background:#8B93A3"></span>
      <div class="rl"><b style="font-size:12.5px">${disp(r.id)} · ${esc(r.topic)}</b>
      <div class="mut" style="font-size:11.5px;margin-top:2px">${T("חלה המדיניות הכללית:")} ${esc(firstSent(r.tl.green.pos))}</div></div>
      <button class="btn ghost sm" onclick="go('rules');setTimeout(()=>openRule('${r.id}'),60)">${T("פתיחה")}</button></div>`;
  }).join('')}`;
}
function vSegPolicy(){
  const segs=effSegs();
  if(S.segFull){ const sf=segs.find(x=>x.segment_id===S.segFull); if(sf) return segFullView(sf); S.segFull=null; }
  if(!segs.length) return `<div class="card pad"><b style="font-size:13px">${T("לא מצאנו סגמנטים בהסכמים האלה.")}</b>
    <div class="mut" style="margin-top:6px">${T("סגמנט נוצר רק כשנתוני ההסכמים מלמדים על שונות אמיתית בין תרחישי התקשרות, למשל מדיניות שונה מול בנקים לעומת קניונים. כשאין שונות כזו, המדיניות הכללית חלה על הכול. סגמנט חדש מבקשים בצ'אט, בבנייה מחדש של הפלייבוק.")}</div></div>`;

  const cnt=id=>ex.filter(x=>x.seg===id).length;
  const sel=S.segSel&&segs.some(s=>s.segment_id===S.segSel)?S.segSel:'';
  const rows=ex.filter(x=>!sel||x.seg===sel)
    .sort((a,b)=>(pbLabel(a.r)+a.r.id).localeCompare(pbLabel(b.r)+b.r.id,'he'));
  return `<div class="card pad" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h3 style="margin:0">${T("חריגים לפי סגמנט")}</h3>
      <span class="mut" style="font-size:12px">${T("המדיניות הכללית חלה תמיד. סגמנט מחריג סעיפים מסוימים בתוך סוג ההסכם שנבחר, וכאן רואים אילו.")}</span>
    </div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:11px">
      <button class="fbtn ${sel?'':'on'}" onclick="S.segSel='';render()">${T("הכול (")}${ex.length})</button>
      ${segs.map(s=>`<button class="fbtn ${sel===s.segment_id?'on':''}" onclick="S.segSel='${s.segment_id}';render()">${esc(s.label)} (${cnt(s.segment_id)})</button>`).join('')}
    </div>
    ${sel?`<div class="mut" style="font-size:12px;margin-top:9px"><b>${T("מתי הסגמנט חל:")}</b> ${esc((segs.find(x=>x.segment_id===sel)||{}).criteria||'')}
      <button class="btn ghost sm" style="margin-inline-start:8px" onclick="S.segFull='${sel}';render()">${T("המדיניות המלאה לסגמנט")}</button></div>`:''}
  </div>

  ${rows.length?`<div class="card pad"><table class="tbl">
    <thead><tr><th>${T("סוג ההסכם")}</th><th>${T("סעיף")}</th><th>${T("נושא")}</th><th>${T("סגמנט")}</th><th>${T("מה משתנה מול הכלל הכללי")}</th><th></th></tr></thead>
    <tbody>${rows.map(x=>`<tr>
      <td>${esc(pbLabel(x.r))}${x.r.pb&&x.r.pb===S.pb?T(' <span class="tag b">נבחר</span>'):''}</td>
      <td><b>${esc(rnum(x.r.id))}</b></td>
      <td>${esc(x.r.topic)}</td>
      <td><span class="tag y">${esc(segName(x.seg))}</span></td>
      <td>${x.diff.length? x.diff.map(d=>`<div style="margin-bottom:3px"><span class="tag ${TCL[d.t]}">${TRK[d.t]}</span>
            <span class="mut">${esc(firstSent(d.from.pos||''))}</span> ← <b>${esc(firstSent(d.to.pos||''))}</b></div>`).join('')
          : T('<span class="mut">אין הבדל מהכלל הכללי</span>')}</td>
      <td><button class="btn ghost sm" onclick="openSegEx('${x.r.id}')">${T("פתיחה בסעיף")}</button>
          <button class="btn ghost sm" onclick="openSegEx('${x.r.id}',1)">${T("עריכה")}</button></td>
    </tr>`).join('')}</tbody></table>
    <div class="mut" style="font-size:11.5px;margin-top:9px">${T("העריכה נעשית בתוך הסעיף, ליד הכלל שממנו חורגים ולצד הדוגמאות. כך אין שני מקומות שמחזיקים את אותו נוסח.")}</div>
  </div>`:`<div class="card pad"><b style="font-size:13px">${T("אין חריגים")} ${sel?T('בסגמנט הזה'):T('בפלייבוק הזה')}.</b>
    <div class="mut" style="margin-top:6px">${T("המדיניות הכללית חלה על כל הסעיפים. הוספת חריג נעשית בתוך הסעיף עצמו.")}</div></div>`}

  ${S.editMode?`<div class="card pad" style="margin-top:14px"><h3>${T("הגדרות הסגמנטים")}</h3>
    ${segs.map(s=>segDefRow(s)).join('')}</div>`:''}`;

function addPrec(){
  const g=id=>(document.getElementById(id)||{}).value||'';
  if(!g('pCp').trim()||!g('pDev').trim()){ toast(T('נדרשים לפחות הצד שכנגד ותיאור הסטייה')); return; }
  S.precedents.push({cp:g('pCp'),date:g('pDate'),rule:g('pRule'),dev:g('pDev'),why:g('pWhy'),appr:g('pAppr')});
  save(); render(); toast(T('החריג תועד'));
}
function delPrec(i){ S.precedents.splice(i,1); save(); render(); }

/* ---------- מומחיות משפטית ---------- */
function personaFor(){
  /* אין מיפוי של סוג הסכם למומחיות: הפרסונה היא עורך דין מסחרי בכיר, והתחומים נקראים מהפלייבוק ומההסכם */

/* ---------- rules ---------- */
function pbList(){ return (D.playbooks||[]).filter(p=>p.id); }
function pbCur(){
  /* הפלייבוק שנבחר. ברירת המחדל היא זה שממנו נבנתה הסביבה. */
  const ps=pbList();
  if(!ps.length) return null;
  const has = ps.some(p=>p.id===S.pb);
  if(!has) S.pb = (ps.find(p=>p.current)||ps[0]).id;
  return ps.find(p=>p.id===S.pb);
}
function rulesOf(){
  /* סעיף בלי שיוך שייך לפלייבוק היחיד שבקובץ: כך מטענים ישנים ממשיכים לעבוד. */
  const ps=pbList();
  if(ps.length<2) return D.rules;
  const cur=pbCur();
  return D.rules.filter(r=>!r.pb || !cur || r.pb===cur.id);
}
function setPb(id){
  if(!BOOKS){ S.pb=id; save(); render(); return; }
  if(!BOOKS[id]) return;
  if(id===S.pb){ render(); return; }
  save();                                   /* ההערות של הסוג היוצא, במפתח שלו */
  applyBook(id); S.pb=id;
  try{ localStorage.setItem(LS_PB, id); }catch(e){}
  LS = bookLS(id);
  Object.assign(S, JSON.parse(JSON.stringify(S_BOOK0)), {editOpen:{}, collapsed:{}, q:''});
  try{ const raw=localStorage.getItem(LS); if(raw) Object.assign(S, JSON.parse(raw)); }catch(e){}
  S.editMode=false;
  FAM=(D.scope&&D.scope.contract_families&&D.scope.contract_families[0])||{};
  FRIENDLY=D.friendly||{}; SHORTX=D.shortx||{};
  if(LASTSNAP){ dbApply(LASTSNAP); } else { render(); }
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){}
}

/* ---------- כיסוי הסעיפים ---------- */
/* ההוכחה שאף סעיף לא נשר: כמה נמצאו, לכמה יש מדיניות, וכמה טכניים.
   לכל סעיף טכני השם והנימוק (`dashboard_spec.md`, "כיסוי הסעיפים").
   בלי `coverage` במטען אין פאנל, ואין המצאה של מספרים. */
const TECH_HE = {signature_block:T('בלוק חתימה'), party_identification:T('זיהוי הצדדים'),
  notice_addresses:T('כתובות להודעות'), counterparts_esignature:T('עותקים וחתימה אלקטרונית'),
  headings:T('כותרות לנוחות'), interpretation_grammar:T('כללי לשון'),
  recitals_descriptive:T('מבוא תיאורי'), neutral_definition:T('הגדרה שאינה משנה היקף'),
  bank_details:T('פרטי חשבון בנק'), delivery_points_list:T('רשימת נקודות אספקה'),
  admin_form_fields:T('שדות מנהליים בטופס'),
  statutory_admin_restatement:T('חזרה על חובה מנהלית שבחוק')};
/* שורת הכיסוי, מבלוק coverage בלבד (playbook-schema.md, "שורת הכיסוי"), באותו נוסח כמו ב-Word
   (build_playbook_docx.coverage_line). השמות החלופיים נקראים כמו בסכמה */
function covLine(c){
  const num=(...ks)=>{ for(const k of ks) if(typeof c[k]==='number') return c[k]; return null; };
  const u=num('units','units_total'); if(u==null) return '';
  return T('כוסו ')+(u-(num('unmapped_units','units_unmapped')||0))+T(' מתוך ')+u+T(' סעיפים; ')
    +(num('topics_new')||0)+T(' נושאים חדשים; ')+(num('unique_units','units_unique')||0)+T(' סעיפים ייחודיים לבדיקתכם');
}
/* "S01#p3" הוא מזהה פנימי: בדף מוצגים שם ההסכם ומספר הפסקה, עד ארבעה, ואחריהם "ועוד" */
function refNames(refs){
  const out=[];
  refs.forEach(x=>{ const [sid,anc]=String(x).split('#'); const pm=/^p(\d+)$/.exec(anc||'');
    const t=srcName(sid)+(pm?' ('+T('פסקה ')+pm[1]+')':''); if(out.indexOf(t)<0) out.push(t); });
  return out.slice(0,4).join(', ')+(out.length>4?' '+TF('ועוד {n}',{n:out.length-4}):'');
}
function covPanel(){
  const c=D.coverage; if(!c || typeof c.units!=='number') return '';
  const items=Array.isArray(c.technical_items)?c.technical_items:[];
  const miss=(typeof c.topics==='number'&&typeof c.topics_with_rule==='number')
    ? c.topics-c.topics_with_rule : 0;
  return `<div class="card pad" style="margin-bottom:16px">
    <h3>${T("כיסוי הסעיפים")}</h3>
    <p class="mut" style="margin:2px 0 12px">${T("כל סעיף בהסכמים קיבל מדיניות, או סווג כטכני עם נימוק.")}</p>
    <p class="covline" style="margin:0 0 12px">${esc(covLine(c))}</p>
    <div class="statrow">
      <div class="stat"><div class="statn">${c.units}</div><div class="statl">${T("סעיפים נמצאו בהסכמים")}</div></div>
      <div class="stat"><div class="statn">${c.topic_units!=null?c.topic_units:'&ndash;'}</div><div class="statl">${T("קיבלו מדיניות")}</div></div>
      <div class="stat"><div class="statn">${c.technical_units!=null?c.technical_units:'&ndash;'}</div><div class="statl">${T("טכניים לחלוטין")}</div></div>
      ${miss>0?`<div class="stat"><div class="statn" style="color:var(--red)">${miss}</div>
        <div class="statl">${T("חסרה מדיניות")}</div></div>`:''}
    </div>
    ${items.length?`<div class="lbl" style="margin:14px 0 6px">${T("הסעיפים הטכניים, ולמה אין להם משמעות")}</div>
    <div class="covlist">${items.map(it=>`<div class="covrow">
      <span class="tag">${esc(TECH_HE[it.code]||it.code||'')}</span>
      <span>${esc(it.reason||'')}</span>
      ${Array.isArray(it.refs)&&it.refs.length?`<span class="mut">${esc(refNames(it.refs))}</span>`:''}
    </div>`).join('')}</div>`:''}
  </div>`;
}

/* ---------- פס הבסיס ---------- */
/* על כמה הסכמים הפלייבוק נשען, ובאיזה מסלול נבנה. הנוסח קבוע
   (`dashboard_spec.md`, "פס הבסיס"), ומודפס גם בשער ה-Word, ולכן אינו
   מנוסח כאן מחדש אלא נגזר מ-`meta.build_path` שהסקריפט העביר. */
function basisPath(){
  const b=(D.meta&&D.meta.build_path)||null;
  if(!b || typeof b.n!=='number') return null;
  return {n:b.n, path:b.path||(b.n?'own':'market_built')};
}
/* מעמד המאגר (`scope_summary.corpus_status`, playbook-schema.md) קובע איך המסמכים נקראים בשורה, באותו
   נוסח כמו basis_line.py (DOCS) וכמו basis_line_en ב-Word. "הסכמים של החברה" רק כשהם הסכמים חתומים שלה */
const BASIS_DOCS={signed:'הסכמים של החברה',
  mostly_drafts:'מסמכים של החברה, רובם טיוטות ולא הסכמים חתומים',
  company_forms:'נוסחים שהחברה מציגה לצד שכנגד, ולא הסכמים חתומים',
  third_party_forms:'נוסחים שאינם הסכמים חתומים של החברה',
  unknown:'נוסחים שאינם הסכמים חתומים של החברה',
  /* מאגר חתום שרובו נייר של הצד שכנגד (basis_line.py, docs_status; playbook/status.theirs_paper). אותו נוסח
     כמו בשער ה-Word, כדי שהשורה תאמר בדיוק מה נסרק. הדף קורא את הערך מ-meta.corpus_status */
  theirs_paper:'נוסחים של הצד שכנגד שהחברה חתמה עליהם'};
function corpusStatus(){
  const m=D.meta||{}, sc=D.scope||{};
  const v=m.corpus_status||sc.corpus_status||(m.build_path&&m.build_path.status);
  return Object.prototype.hasOwnProperty.call(BASIS_DOCS,v)?v:'signed';
}
function basisText(){
  const b=basisPath(); if(!b) return '';
  if(b.n===0 || b.path==='market_built')
    return T('נבנה לפי השוק, מותאם לפוזיציה של החברה, עם בדיקה רגולטורית מעמיקה. אין בו עמדה שנגזרה מהסכמי החברה, וכל עמדה בו מסומנת "הצעת Areo (לא מבוסס על מסמכי הלקוח)".');
  const st=corpusStatus();
  if(st!=='signed'){
    const d=' '+T(BASIS_DOCS[st]);
    if(b.path==='own_plus_market')
      return T('נבנה מ-')+b.n+d+T(', בשילוב מחקר שוק. עמדה שמקורה בשוק מסומנת "הצעת Areo (לא מבוסס על מסמכי הלקוח)".');
    if(b.n>=20) return T('נבנה מ-')+b.n+d+'.';
    if(b.n>=7)  return T('נבנה מ-')+b.n+d+T('. זה פחות מהמומלץ (כ-20), ולכן חלק מהעמדות נשענות על מעט משאים ומתנים.');
    return T('נבנה מ-')+b.n+d+T(' בלבד. לא מומלץ לבנות פלייבוק מפחות מ-20 הסכמים, והחברה בחרה שלא לשלב מחקר שוק.');
  }
  if(b.path==='own_plus_market')
    return T('נבנה מ-')+b.n+T(' הסכמים של החברה, בשילוב מחקר שוק. עמדה שמקורה בשוק מסומנת "הצעת Areo (לא מבוסס על מסמכי הלקוח)".');
  if(b.n>=20) return T('נבנה מ-')+b.n+T(' הסכמים של החברה.');
  if(b.n>=7)  return T('נבנה מ-')+b.n+T(' הסכמים של החברה. זה פחות מהמומלץ (כ-20), ולכן חלק מהעמדות נשענות על מעט משאים ומתנים.');
  return T('נבנה מ-')+b.n+T(' הסכמים של החברה בלבד. לא מומלץ לבנות פלייבוק מפחות מ-20 הסכמים, והחברה בחרה שלא לשלב מחקר שוק.');
}
/* פלייבוק שנבנה לפי השוק אינו מכיל הסכמים פנימיים */
function marketBuilt(){ const b=basisPath(); return !!b && (b.n===0 || b.path==='market_built'); }
/* התווית כפי שהמודל גזר אותה, מילה במילה. כשרק חלק מהעמדות אושרו,
   אחרי התווית בא המונה, באותו נוסח שב-Word (`market-research.md`,
   "שקיפות"). הדף אינו גוזר תווית בעצמו ואינו ממציא אותה. */
function statusLabel(){
  /* התווית נגזרת בבנייה מאותם תאים שהמונה סופר (status.derive_status), בשפת הדף, וכשרק חלק אושר היא כבר
     כוללת את המונה. מונה נוסף מוצג רק כשהתווית אינה כוללת אותו, ורק כשחלק מהעמדות אושרו: קודם הוצגו
     "6 מתוך 147" ו-"0 of 147" זה לצד זה, ו-"0 מתוך 261" שאינו עוזר להחליט */
  const m=D.meta||{}, lbl=m.status_label||m.label_now;
  if(!lbl) return '';
  const a=m.approved_count, p=m.positions_count;
  const partial = typeof a==='number' && typeof p==='number' && a>0 && a<p;
  const has = partial && String(lbl).indexOf(String(p))>=0 && String(lbl).indexOf(String(a))>=0;
  return esc(lbl)+(partial&&!has?' · '+a+T(' מתוך ')+p+T(' עמדות מאושרות'):'');
}
/* המקורות שהמסך מציג: מקורות השוק, וכל מקור חיצוני אחר שנעשה בו שימוש */
function hasExtSources(){
  return ((D.market||[]).length>0) || ((D.external_sources||[]).length>0)
    || !!D.external_sources_table;
}
function basisBar(){
  const t=basisText(); if(!t) return '';
  const b=basisPath();
  const tone = b.n>=20 ? 'ok' : (b.n>=7 ? 'warn' : 'bad');
  const lbl=statusLabel(), date=(D.meta&&D.meta.market_research_date)||'';
  return `<div class="card pad basisbar"><span class="dot ${tone}"></span><span>${esc(t)}</span>
    ${lbl?`<span class="tag b">${lbl}</span>`:''}
    ${date?`<span class="mut" style="font-size:11.5px">${T("תאריך המחקר:")} ${esc(heDate(date))}</span>`:''}
    ${hasExtSources()?`<button class="btn ghost sm" style="margin-inline-start:auto" onclick="go('sources')">${T("המקורות")}</button>`:''}
  </div>`;
}
function pbSwitch(){
  /* הבחירה קובעת מה מוצג בכל המסכים, ולכן היא יושבת מעליהם ולא בתוך אחד מהם.
     מדיניות של משפחה אחת אינה מדיניות של משפחה אחרת. */
  const ps=pbList();
  if(ps.length<2) return '';
  const cur=pbCur();
  return `<div class="card pad pbbar">
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <span class="lbl" style="margin:0">${T("סוג ההסכם")}</span>
      ${ps.map(p=>{const n=pbRuleCount(p.id);
        return `<button class="fbtn ${cur&&p.id===cur.id?'on':''} ${n?'':'nofile'}" onclick="setPb('${p.id}')"
          title="${n?'':T('הפלייבוק הזה לא נכלל בקובץ')}">
        ${esc(p.family||'')}${p.role?` · ${esc(p.role)}`:''}
        <span class="mut">${n?'('+n+')':T('(לא בקובץ)')}</span></button>`;}).join('')}
      <div style="flex:1"></div>
      <span class="mut" style="font-size:11.5px">${T("כל המסכים מציגים את סוג ההסכם שנבחר בלבד")}</span>
    </div>
  </div>`;
}

function attnUseful(){ const n=attnCount(), t=rulesOf().length; return n>0 && n<t; }
function clearQ(){ S.q=''; const el=document.getElementById('gq'); if(el){ el.value=''; el.focus(); } renderList(); }

/* הדגשת מילת החיפוש בתוצאות: רק בצמתי טקסט, בלי לגעת בתגיות */
function hilite(root,q){
  if(!root||!q||q.length<2) return;
  const lq=q.toLowerCase(), w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const p=n.parentNode&&n.parentNode.nodeName; if(!p||/^(SCRIPT|STYLE|TEXTAREA|INPUT|SELECT|OPTION|MARK)$/.test(p)) return NodeFilter.FILTER_REJECT;
    return n.nodeValue.toLowerCase().indexOf(lq)>=0?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP; }});
  const hits=[]; while(w.nextNode()) hits.push(w.currentNode);
  hits.forEach(n=>{ const t=n.nodeValue, lt=t.toLowerCase(); if(lt.length!==t.length) return;
    const fr=document.createDocumentFragment(); let i=0, j;
    while((j=lt.indexOf(lq,i))>=0){ fr.appendChild(document.createTextNode(t.slice(i,j))); const m=document.createElement('mark'); m.className='hl'; m.textContent=t.slice(j,j+lq.length); fr.appendChild(m); i=j+lq.length; }
    fr.appendChild(document.createTextNode(t.slice(i))); n.parentNode.replaceChild(fr,n); });
}
function renderList(){
  const q=(S.q||'').toLowerCase();
  if(S.filter==='attn'&&!attnUseful()) S.filter='all';
  const rs=rulesOf().filter(r=>{
    if(!q) return true;
    const scope=S.qScope||'all';
    if(scope==='topic') return (r.topic+' '+r.issue).toLowerCase().includes(q);
    if(scope==='agreement'){
      const srcs=Object.keys(D.sources).filter(k=>{const s=D.sources[k];
        return ((s.label||'')+' '+(s.title||'')+' '+srcName(k)).toLowerCase().includes(q);});
      return citesFor(r.id).some(c=>srcs.includes(c.src));
    }
    const blob=(r.topic+r.issue+r.why+JSON.stringify(r.tl)+JSON.stringify(r.rat)+JSON.stringify(r.trig)+' '+citesFor(r.id).map(c=>srcName(c.src)).join(' ')).toLowerCase();
    return blob.includes(q);
  });
  const pf=S.pf||'all', df=S.df||'all', xf=S.xf||'all';
  const rs2=rs.filter(r=>{
    if(pf!=='all' && r.presence.requirement!==pf) return false;
    if(df==='commented' && !hasInput(r.id)) return false;
    if(df==='clean' && hasInput(r.id)) return false;
    if(xf==='weak' && citesFor(r.id).length>2) return false;
    if(xf==='strong' && citesFor(r.id).length<4) return false;
    if(xf==='areo' && !areoTracks(r).length) return false;
    if(xf==='variant' && !((r.variants||[]).length||Object.keys(S.userVariants||{}).some(k=>k.indexOf(r.id+'|')===0))) return false;
    if(xf==='edited' && !hasInput(r.id)) return false;
    if(xf==='reg' && r.reg!=='Researched') return false;
    if(xf==='lowconf' && r.conf!=='Low') return false;
    if(S.kf && (r.kind||'')!==S.kf) return false;
    return true;
  });
  /* מוני המסננים נגזרים מהתוצאה המוצגת (אחרי החיפוש), ולא מכל הסעיפים */
  const base=rs2.length, baseAttn=rs2.filter(needsAttn).length;
  [['n-all',base],['n-attn',baseAttn],['n-attn2',baseAttn]].forEach(([id,v])=>{ const e=document.getElementById(id); if(e) e.textContent=v; });
  const rs3=S.filter==='attn'?rs2.filter(needsAttn):rs2;

       <div class="mut" style="margin-top:6px">${cur.rules?`${T("בתיקייה יש לפלייבוק הזה")} ${cur.rules} ${T("סעיפי מדיניות, אך")} `:T('הפלייבוק קיים בתיקייה, אך ')}${T("סביבת העבודה הזאת נבנתה בלעדיו.")}
       ${T("בקשו בנייה מחדש של ה-Workspace כדי לכלול אותו.")}</div></div>`
    : `<div class="card pad"><div class="mut">${T('אין תוצאות. יש לנקות את החיפוש או את המסננים.')}</div>
       <div style="margin-top:10px"><button class="btn ghost sm" onclick="clearFilters()">${T('ניקוי החיפוש והמסננים')}</button></div></div>`;
  _rl.innerHTML = (S.rulesMode==='table' ? rulesTable(rs3) : rs3.map(ruleCard).join('')) || empty;
  if(q) hilite(_rl,q);
  const _rr=document.getElementById('rrail'); if(_rr) _rr.innerHTML=railHtml(rs3);
  syncRuleBar();
  const cn=document.getElementById('cnt');
  const tot=rulesOf().length;
  if(cn) cn.textContent = (rs3.length===tot)
    ? (T('מוצגים כל ') + tot + T(' סעיפי המדיניות'))
    : (T('מוצגים ') + rs3.length + T(' מתוך ') + tot);
}

/* שורת אימות: שני המקורות המאמתים, או הסיבה שהעובדה לא אומתה */
function takenCheck(x){
  if((x.verification||'')==='verified'){
    const by=(x.corroborated_by||[]).map(c=>{const u=srcUrl(c);
      return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(c.ref||T('מקור'))}</a>`:esc(c.ref||T('מקור'));});
    return by.length?by.join('; '):T('אומת');
  }
  const n=typeof x.sources_found==='number'?x.sources_found:0;
  return T('לא אומת, נמצאו ')+n+T(' מקורות')+(x.reason?': '+esc(x.reason):'');
}
function extRows(){
  const out=[];
  (D.external_sources||[]).forEach(s=>{
    const u=srcUrl(s), link=u?`<a href="${esc(u)}" target="_blank" rel="noopener">${T("פתיחה")}</a>`:T('אין קישור');
    const taken=(s.taken||[]).length?s.taken:[{fact:'',verification:'',sources_found:0}];
    taken.forEach(x=>out.push({ref:s.ref||'',src:[s.body,s.title].filter(Boolean).join(', '),
      fact:x.fact||'',link:link,check:takenCheck(x),date:s.retrieved_at||'',
      bad:(x.verification||'')!=='verified',reason:x.reason||'',found:x.sources_found}));
  });
  return out;
}

  const mk=D.market||[], rows=extRows(), bad=rows.filter(r=>r.bad);

/* ייצוא לוח הסטיות: שורה לכל סעיף, שלוש העמדות, סטייה, אישור, מספר דוגמאות. CSV עם BOM כדי שייפתח נכון בעברית. */
function csvCell(v){ v=String(v==null?'':v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function dlBoardCsv(){
  const hd=[T('מס׳'),T('נושא'),T('נוכחות'),T('ירוק'),T('צהוב'),T('אדום'),T('סטייה'),T('מאושר'),T('דוגמאות')];
  const rows=rulesOf().map(r=>[rnum(r.id),r.topic,prsn(r.presence.requirement),effLight(r,'green').pos||'',effLight(r,'yellow').pos||'',effLight(r,'red').pos||'',
    needsAttn(r)?T('כן'):'',['green','yellow','red'].filter(k=>((r.tl||{})[k]||{}).approved).map(k=>T({green:'ירוק',yellow:'צהוב',red:'אדום'}[k])).join(' '),citesFor(r.id).length]);
  const txt='\ufeff'+[hd,...rows].map(x=>x.map(csvCell).join(',')).join('\r\n');
  if(PUBLISHED){ copyTxt(txt); toast(T('לוח הסטיות הועתק. הדביקו לקובץ ושמרו בתיקיית Areo-נתונים')); return; }
  const b=new Blob([txt],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=T('לוח-הסטיות-')+(D.meta.slug||'playbook')+'.csv'; a.click(); URL.revokeObjectURL(a.href); toast(T('לוח הסטיות הורד'));
}
/* יומן ההחלטות: מי אישר מה ומתי, לפי העמדה, ועמו ההערות וההצעות של הקורא. נושא את זהות הפלייבוק וגרסתו. */
function dlDecisionLog(){
  const items=[];
  rulesOf().forEach(r=>['green','yellow','red'].forEach(k=>{ const t=(r.tl||{})[k]||{}; if(t.approved) items.push({rule_id:r.id,num:rnum(r.id),topic:r.topic,track:k,approved_by:t.approved_by||'',approved_at:t.approved_at||''}); }));
  const pack=Object.assign(commentsPack(),{kind:'decision_log_and_comments',decisions:items});
  saveText(JSON.stringify(pack,null,2),T('יומן-החלטות-')+(D.meta.slug||'playbook')+'.json',T('יומן ההחלטות'));
}
/* ייבוא: קובץ הערות והצעות שיוצא מכאן. נבדק שהוא שייך לפלייבוק הזה; מתמזג עם מה שיש ואינו דורס. */
function importComments(file){
  const msg=document.getElementById('ioMsg'); if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const j=JSON.parse(String(rd.result||''));
      if(!j||!/^(comments_and_proposals|decision_log_and_comments)$/.test(j.kind||'')) throw new Error('kind');
      if(j.playbook&&j.playbook.id&&D.meta.id&&j.playbook.id!==D.meta.id) throw new Error('other');
      let n=0;
      (j.items||[]).forEach(it=>{ if(!it||!it.rule_id) return;
        if(it.comment&&!S.notes[it.rule_id]){ S.notes[it.rule_id]=it.comment; n++; }
        if(it.wording_proposals&&Object.keys(it.wording_proposals).length&&!S.props[it.rule_id]){ S.props[it.rule_id]=it.wording_proposals; n++; } });
      if(j.variant_proposals) S.varEdits=Object.assign({},j.variant_proposals,S.varEdits||{});
      if(j.user_variants) S.userVariants=Object.assign({},j.user_variants,S.userVariants||{});
      save(); render();
      const m2=document.getElementById('ioMsg'); if(m2) m2.textContent=T('הייבוא הושלם. פריטים שנוספו: ')+n;
    }catch(e){ if(msg) msg.textContent = e.message==='other'?T('הקובץ שייך לפלייבוק אחר, ולכן לא יובא.'):T('הקובץ אינו קובץ הערות של סביבת העבודה.'); } };
  rd.readAsText(file);
}
function commentsPack(){
  /* קובץ ההערות הוא מסר בדרך אל השיחה, ולכן הוא נושא את זהות הפלייבוק:
     בלעדיה אי אפשר לדעת לאיזה פלייבוק הוא שייך ואם המודל השתנה מאז.
     אין בו הכרעות: האישור נעשה באשף, לא בדף הזה. */
  const items=rulesOf().filter(r=>hasInput(r.id)).map(r=>({
    rule_id:r.id, num:(r.num||''), topic:(r.topic||''),
    comment:(S.notes[r.id]||''), wording_proposals:(S.props[r.id]||{}),
    by:nameOf((DBWHO[r.id]||{}).by||''), by_id:((DBWHO[r.id]||{}).by||''), at:((DBWHO[r.id]||{}).at||'')}));
  return {kind:'comments_and_proposals',
    playbook:{id:(D.meta.id||''),version:(D.meta.version||''),slug:(D.meta.slug||''),
      model_updated:(D.meta.model_updated||D.meta.updated||''),company:(D.meta.company||'')},
    note:T('הערות והצעות של קורא. אינן מדיניות, ואינן נכתבות לפלייבוק או לגרעין.'),
    items:items, variant_proposals:S.varEdits,
    segment_proposals:S.segEdits, user_variants:S.userVariants,
    exported:new Date().toISOString()};
}
/* שמירת קובץ. בעמוד משותף השמירה חסומה, ולכן התוכן מועתק ללוח */
function saveText(txt,name,label){
  if(PUBLISHED){ copyTxt(txt); toast(label+T(' הועתקו. הדביקו לקובץ ושמרו בתיקיית Areo-נתונים')); return; }
  const b=new Blob([txt],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  URL.revokeObjectURL(a.href); toast(label+T(' הורדו'));
}
/* הורדת ההערות וההצעות */
function dlComments(){
  const txt=JSON.stringify(commentsPack(),null,2);
  const name=T('הערות-והצעות-')+((D.meta.slug||'playbook'))+'.json';
  saveText(txt,name,T('ההערות וההצעות'));
}
/* ---------- שיתוף עם הצוות ---------- */
function shareTeam(){
  const seed={notes:S.notes,props:S.props,deal:S.deal,
    segEdits:S.segEdits,userVariants:S.userVariants,precedents:S.precedents};
  if(PUBLISHED){ toast(T('בעמוד משותף אין צורך בקובץ שיתוף, די בהעברת הקישור')); return; }
  let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const inj='<scr'+'ipt>try{localStorage.setItem('+JSON.stringify(LS)+','+
    JSON.stringify(JSON.stringify(seed)).replace(/</g,'\\u003c')+');}catch(e){}<\/scr'+'ipt>';
  html=html.replace('<body>','<body>'+inj);
  const b=new Blob([html],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  a.download=T('מדיניות_חוזית_לשיתוף.html'); a.click(); URL.revokeObjectURL(a.href);
  toast(T('קובץ השיתוף הורד, כולל ההערות וההצעות שלך'));
}

/* ---------- התאמה אישית ---------- */
function drawTune(){
  const host=document.getElementById('tuneViews'); if(!host) return;
  const t=tune();
  const avail=VIEWS.filter(v=>(v.id!=='segpolicy'||effSegs().length||S.editMode)&&(v.id!=='commercial'||ctData())&&(v.id!=='departments'||deptData())&&(v.id!=='findings'||(D.templateFindings||[]).length));
  host.innerHTML=avail.map(v=>{
    const on=t.views.indexOf(v.id)>=0, home=v.id===t.home;
    return `<label class="tunechk${on?' on':''}${home?' home':''}" title="${home?T('מסך הפתיחה תמיד מוצג'):''}">
      <input type="checkbox" data-v="${v.id}" ${on?'checked':''} ${home?'disabled aria-describedby="tuneNote"':''}>
      <span>${esc(v.t)}${home?' · '+T('מסך הפתיחה'):''}</span></label>`;
  }).join('');
  const nt=document.getElementById('tuneNote'); if(nt) nt.textContent=T('מסך הפתיחה מסומן במסגרת מקווקוות ואי אפשר לכבות אותו: כדי להסתירו, בוחרים קודם מסך פתיחה אחר.');
  host.querySelectorAll('input[data-v]').forEach(chk=>chk.addEventListener('change',()=>{
    const id=chk.dataset.v; const tt=tune();
    const i=tt.views.indexOf(id);
    if(chk.checked){ if(i<0) tt.views.push(id); } else if(i>=0){ tt.views.splice(i,1); }
    save(); render();
  }));
  const hs=document.getElementById('tuneHome');
  if(hs){
    hs.innerHTML=avail.filter(v=>t.views.indexOf(v.id)>=0).map(v=>`<option value="${v.id}" ${v.id===t.home?'selected':''}>${esc(v.t)}</option>`).join('');
    hs.onchange=()=>{ tune().home=hs.value; save(); render(); };
  }
}
function tuneCopy(){
  const t=tune();
  const payload={meta:{tuning:{views:t.views, home:t.home, blocks:t.blocks, filter:t.filter, known:VIEWS.map(v=>v.id)}}};
  const txt=JSON.stringify(payload,null,2);
  const box=document.getElementById('tuneOut'), pre=document.getElementById('tuneOutTxt');
  if(box&&pre){ box.style.display='block'; pre.textContent=txt; }
  copyTxt(txt);
  toast(T("קובץ ההתאמה הועתק. העלו אותו לצ'אט, וההתאמה תיכנס בבנייה הבאה"));
}
function tuneReset(){ S.tune=TUNE_DEFAULT(); save(); render(); toast(T('ההתאמה אופסה')); }

/* ---------- גרפים ---------- */
/* מספרים כטקסט: גוון הדיו של הצבע, כדי שהניגודיות תחזיק גם בתצוגת יום (הגרפים עצמם נשארים בצבע המלא) */
const PRES_INK={"#2FE6A6":"var(--tr-green-ink)","#8B93A3":"var(--ink-3)","#FFC44D":"var(--tr-yellow-ink)","#FF7A7A":"var(--tr-red-ink)"};
function presenceStats(){
  const c={Required:0,Optional:0,Conditional:0,Prohibited:0};
  rulesOf().forEach(r=>{c[r.presence.requirement]=(c[r.presence.requirement]||0)+1;});
  return [
    {label:T('סעיפי חובה'), n:c.Required, color:'#2FE6A6'},
    {label:T('סעיפי רשות'), n:c.Optional, color:'#8B93A3'},
    {label:T('סעיפים מותנים'), n:c.Conditional, color:'#FFC44D'},
    {label:T('אסורים בהסכם'), n:c.Prohibited, color:'#FF7A7A'},
  ].filter(x=>x.n>0);
}
function scanLine(){
  const c={Required:0,Optional:0,Conditional:0,Prohibited:0};
  rulesOf().forEach(r=>{c[r.presence.requirement]=(c[r.presence.requirement]||0)+1;});
  const n=agrKeys().length;
  const parts=[];
  const w=(n,one,many)=>n===1?(LANG==='en'?one:T('סעיף ')+one):(n+' '+many);
  if(c.Required) parts.push(w(c.Required,T('חובה אחד'),T('סעיפי חובה')));
  if(c.Optional) parts.push(w(c.Optional,T('רשות אחד'),T('סעיפי רשות')));
  if(c.Conditional) parts.push(w(c.Conditional,T('מותנה אחד'),T('סעיפים מותנים')));
  if(c.Prohibited) parts.push(w(c.Prohibited,T('אחד האסור בהסכם מסוג זה'),T('סעיפים אסורים בהסכם מסוג זה')));
  return T('מתוך ') + n + T(' חוזים שנסרקו נמצאו: ') + parts.join(', ') + '.';
}
function corpusStats(){
  const src=agrKeys().map(k=>D.sources[k]); const total=src.length||1;
  return [
    {label:T('הסכמי החברה'), n:src.filter(s=>s.kind==='internal').length, total},
    {label:T('מקורות חיצוניים'), n:src.filter(s=>s.kind==='external').length, total},
    {label:T('הסכמים חתומים'), n:src.filter(s=>s.status==='חתום'||/Executed/i.test(s.status||'')).length, total},
    {label:T('מקורות שאינם הסכמים חתומים'), n:src.filter(s=>!(s.status==='חתום'||/Executed/i.test(s.status||''))).length, total},
  ];
}
let CH={};

  if(typeof Chart==='undefined') return;
  Object.values(CH).forEach(c=>{try{c.destroy()}catch(e){}}); CH={};
  const purple='#2FE6A6', mint='#8B93A3', amber='#FFC44D', red='#FF7A7A';

    CH.pie=new Chart(pe,{type:'doughnut',
      data:{labels:[T('סעיפי חובה'),T('סעיפי רשות'),T('סעיפים מותנים'),T('אסורים בהסכם')],

          backgroundColor:[purple,mint,amber,red],borderWidth:2,borderColor:'#fff'}]},

  }
  const be=document.getElementById('chBar');
  if(be){ const labels=D.rules.map(r=>r.id.replace('R-',''));
    CH.bar=new Chart(be,{type:'bar',
      data:{labels,datasets:[{data:D.rules.map(r=>citesFor(r.id).length),
        backgroundColor:D.rules.map((_,i)=>i%2?mint:purple),borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{rtl:true,textDirection:'rtl',
          callbacks:{title:x=>{const r=D.rules[x[0].dataIndex];return r?r.id+' · '+r.topic:'';}}}},
        scales:{y:{beginAtZero:true,ticks:{stepSize:1,font:{size:10}}},x:{ticks:{font:{size:10}}}}}});
  }
}

/* ============ רכיבי העיצוב של Areo (אב הטיפוס המאושר, workspace.js ו-builder.js) ============
   שמש המדיניות, משפט ממצא, מד דו-גוני, באנר רעננות, מסילת נושאים, סולם מואר, מגירת דוגמאות,
   "שאלו את המדיניות" ומפת ההסכמים מול הנושאים. כולם לקריאה ולסינון בלבד: אין כאן פעולה שמשנה
   מעמד מדיניות. אישור נעשה באשף ההערות (wizard_spec.md). */
function TF(s,o){ return T(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]==null?'':String(o[k])); }
/* מזהה בתוך תכונה: בלי ההחלפות של esc() (R-01 הופך שם ל"סעיף 1") */
const ea = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk=(k,extra)=>`<span class="mk ${k}${extra?' '+extra:''}" aria-hidden="true"></span>`;
const RUNG_SUB={green:T('נקודת הפתיחה שלנו'),yellow:T('עד כאן אפשר לוותר'),red:T('כאן עוצרים')};
const KW={green:T('מקובל עלינו'),yellow:T('אפשר להתגמש'),red:T('לא מסכימים')};
const DOCROLE={draft:'טיוטה',amendment:'תיקון להסכם',template:'תבנית',form:'נוסח לא חתום'};
/* כלל שנפתח או הודגש בגלל חשש שהלקוח ציין בקליטה (`rules[].client_concern`, ps3-rule-and-evidence.md) */
function concernChip(r){
  return r&&r.client_concern===true
    ? `<span class="chip call" title="${T('הנושא נפתח או הודגש בגלל חשש שציינתם בתחילת העבודה')}">${mk('call')}${T('חשש שציינתם')}</span>` : ''; }
function walkChip(r){ return r&&r.walk_away===true?`<span class="chip red">${mk('red')}${T('שובר עסקה')}</span>`:''; }
function allApproved(r){ return ['green','yellow','red'].every(k=>((r.tl||{})[k]||{}).approved===true); }
/* מאיפה העמדה המועדפת: ברוב ההסכמים, במיעוטם, או המלצה של Areo בלי דוגמה אצלכם */
function greenEv(r){
  const n=citesTrack(r.id,'green').length, st=trackPct(r.id,'green');
  if(!n) return {k:'n',areo:true,st:null};
  return {k:(st&&st.pct>=50)?'g':'y',areo:false,st:st};
}
function citeSpread(r){
  const g=citesTrack(r.id,'green').length, y=citesTrack(r.id,'yellow').length, rd=citesTrack(r.id,'red').length, t=g+y+rd;
  if(!t) return '<div class="spread" aria-hidden="true"></div>';
  const w=n=>(n*100/t).toFixed(1)+'%';
  return `<div class="spread" role="img" aria-label="${esc(TF('דוגמאות לפי עמדה: {g} מקובל עלינו, {y} אפשר להתגמש, {r} לא מסכימים',{g:g,y:y,r:rd}))}">`
    +`<span class="g" style="width:${w(g)}"></span><span class="y" style="width:${w(y)}"></span><span class="r" style="width:${w(rd)}"></span></div>`;
}

/* ---------- שמש המדיניות: טבעת פנימית = סוג הסעיף, חיצונית = נושא בצבע מקור העמדה המועדפת,
   קשת דקה = כל שלוש העמדות מאושרות. לחיצה על נושא פותחת אותו, ועל סוג מסננת את הסעיפים ---------- */
function sunburst(){
  const rs=rulesOf(), nT=rs.length; if(!nT) return '';
  const kinds=[...new Set(rs.map(r=>r.kind||''))];
  const ordered=[].concat(...kinds.map(k=>rs.filter(r=>(r.kind||'')===k)));
  const SZ=380, cx=190, cy=190, dirS=LANG==='en'?1:-1;
  const P=(r,a)=>[cx+r*Math.sin(a)*dirS, cy-r*Math.cos(a)], f=x=>x.toFixed(2);
  const arc=(r0,r1,a0,a1)=>{ const L=a1-a0>Math.PI?1:0, sw=dirS>0?1:0;
    const [x0,y0]=P(r1,a0),[x1,y1]=P(r1,a1),[x2,y2]=P(r0,a1),[x3,y3]=P(r0,a0);
    return `M${f(x0)} ${f(y0)} A${r1} ${r1} 0 ${L} ${sw} ${f(x1)} ${f(y1)} L${f(x2)} ${f(y2)} A${r0} ${r0} 0 ${L} ${1-sw} ${f(x3)} ${f(y3)} Z`; };
  const line=(r,a0,a1)=>{ const [x0,y0]=P(r,a0),[x1,y1]=P(r,a1);
    return `M${f(x0)} ${f(y0)} A${r} ${r} 0 0 ${dirS>0?1:0} ${f(x1)} ${f(y1)}`; };
  const step=Math.PI*2/nT, pad=Math.min(0.006,step/6), full=nT===1;
  const inC=['var(--tr-call)','var(--tr-na)','var(--tr-yellow)','var(--brand)'];
  let svg=`<svg viewBox="0 0 ${SZ} ${SZ}" role="group" aria-label="${esc(T('שמש המדיניות: סוגי הסעיפים, הנושאים, ומאיפה כל עמדה'))}">`, a=0, anyOk=false;
  kinds.forEach((k,i)=>{
    const g=ordered.filter(r=>(r.kind||'')===k), a1=a+g.length*step, mid=(a+a1)/2, [lx,ly]=P(77,mid), lab=k?T(k):T('אחר');
    const d=kinds.length===1?arc(56,98,0,Math.PI*2-0.0001):arc(56,98,a+pad,a1-pad);
    svg+=`<path class="sg in${S.kf&&S.kf!==k?' off':''}" data-kind="${ea(k)}" tabindex="0" role="button" aria-label="${esc(TF('{k}: {n} נושאים. לחיצה מסננת את הסעיפים',{k:lab,n:g.length}))}" style="fill:color-mix(in srgb,${inC[i%inC.length]} 42%,var(--surface))" d="${d}"><title>${esc(lab+' · '+g.length)}</title></path>`;
    if(g.length/nT>0.09) svg+=`<text class="lb" x="${f(lx)}" y="${f(ly+4)}" text-anchor="middle">${esc(lab)}</text>`;
    a=a1; });
  ordered.forEach((r,i)=>{
    const a0=i*step+pad, a1=(i+1)*step-pad, ev=greenEv(r);
    const fill=ev.k==='g'?'var(--tr-green)':ev.k==='y'?'var(--tr-yellow)':'var(--tr-na)';
    const cls='sg out'+(ev.areo?' areo':'')+(r.walk_away===true?' walk':'')+(S.kf&&S.kf!==(r.kind||'')?' off':'');
    const lbl=rnum(r.id)+' · '+r.topic+': '+(ev.areo?T('המלצה של Areo. לא נמצאה אצלכם דוגמה')
      :TF('העמדה המועדפת מופיעה ב-{n} מתוך {t} ההסכמים שלכם',{n:ev.st?ev.st.n:0,t:ev.st?ev.st.tot:0}))
      +(r.walk_away===true?' · '+T('שובר עסקה'):'')+(r.client_concern===true?' · '+T('חשש שציינתם'):'');
    svg+=`<path class="${cls}" data-rule="${ea(r.id)}" tabindex="-1" role="button" aria-label="${esc(lbl)}" style="fill:${fill}" d="${full?arc(104,160,0,Math.PI*2-0.0001):arc(104,160,a0,a1)}"><title>${esc(lbl)}</title></path>`;
    if(allApproved(r)){ anyOk=true; svg+=`<path class="okarc" d="${line(170,a0,a1)}"/>`; }
  });
  svg+='</svg>';
  const m=D.meta||{}, p=m.positions_count, ap=m.approved_count;
  const mid=(typeof p==='number'&&typeof ap==='number'&&p>0)
    ? `<b class="num">${ap}/${p}</b><small>${T('עמדות מאושרות')}</small>`
    : `<b class="num">${nT}</b><small>${T('נושאים')}</small>`;
  const has=k=>ordered.some(r=>greenEv(r).k===k);
  return `<div class="sb" onclick="sbClick(event)" onkeydown="sbKey(event)">${svg}<div class="mid"><span>${mid}</span></div></div>
    <div class="sblg">${has('g')?`<span>${mk('green')}${T('ברוב ההסכמים שלכם')}</span>`:''}${has('y')?`<span>${mk('yellow')}${T('במיעוט ההסכמים שלכם')}</span>`:''}${has('n')?`<span>${mk('missing','areo')}${T('המלצה של Areo')}</span>`:''}${ordered.some(r=>r.walk_away===true)?`<span>${mk('red')}${T('שובר עסקה')}</span>`:''}${anyOk?`<span>${mk('green')}${T('קשת: כל העמדות בנושא מאושרות')}</span>`:''}</div>`;
}
function sbAct(t){
  if(!t) return;
  if(t.dataset.rule){ const id=t.dataset.rule; if(S.collapsed) delete S.collapsed[id]; S.view='rules'; render(); setTimeout(()=>openRule(id),60); return; }
  if(t.dataset.kind!==undefined){ S.kf=(S.kf===t.dataset.kind?'':t.dataset.kind); S.view='rules'; render(); }
}
function sbClick(e){ sbAct(e.target&&e.target.closest&&e.target.closest('[data-rule],[data-kind]')); }
function sbKey(e){ if(e.key!=='Enter'&&e.key!==' ') return; e.preventDefault(); sbAct(e.target&&e.target.closest&&e.target.closest('[data-rule],[data-kind]')); }

/* ---------- משפט ממצא ומד דו-גוני: מה בטיוטה, ומה כבר אושר (מידע בלבד, מ-meta) ---------- */
function findingHtml(){
  const rs=rulesOf(), m=D.meta||{}, p=m.positions_count, a=m.approved_count, parts=[];
  if(typeof p==='number'&&typeof a==='number'&&p>0){
    const pend=p-a;
    parts.push(pend<=0?TF('<b>כל {p} העמדות</b> מאושרות.',{p:p})
      :pend===1?T('<b>עמדה אחת</b> מחכה לאישור שלכם.')
      :TF('<b>{n} עמדות</b> מחכות לאישור שלכם.',{n:pend}));
  } else parts.push(TF('במדיניות <b>{n} נושאים</b>.',{n:rs.length}));
  const areo=rs.filter(r=>!citesTrack(r.id,'green').length).length;
  if(areo) parts.push(areo===1?T('בנושא <b>אחד</b> לא נמצאה אצלכם דוגמה לעמדה המועדפת, ולכן היא המלצה של Areo&rlm;.')
    :TF('ב-<b>{n}</b> נושאים לא נמצאה אצלכם דוגמה לעמדה המועדפת, ולכן היא המלצה של Areo&rlm;.',{n:areo}));
  const wa=rs.filter(r=>r.walk_away===true).length;
  if(wa) parts.push(wa===1?T('נושא <b>אחד</b> הוא שובר עסקה.'):TF('<b>{n}</b> נושאים הם שוברי עסקה.',{n:wa}));
  const cc=rs.filter(r=>r.client_concern===true).length;
  if(cc) parts.push(cc===1?T('נושא <b>אחד</b> נפתח בגלל חשש שציינתם.'):TF('<b>{n}</b> נושאים נפתחו בגלל חששות שציינתם.',{n:cc}));
  if(D.meta.wizard_href&&(typeof p!=='number'||p>a)) parts.push(T('את האישור עושים באשף ההערות, סעיף אחרי סעיף.'));
  return parts.join(' ');
}
function ttMeter(){
  const m=D.meta||{}, p=m.positions_count, a=m.approved_count;
  if(typeof p!=='number'||typeof a!=='number'||p<=0) return '';
  const w=Math.max(0,Math.min(100,Math.round(a*100/p)));
  return `<div class="ttm"><div class="bar" role="img" aria-label="${esc(TF('{p} עמדות בטיוטה, {a} מהן מאושרות',{p:p,a:a}))}"><span class="a" style="width:100%"></span><span class="b" style="width:${w}%"></span></div>
    <div class="lg"><span><i class="a"></i>${T('עמדות בטיוטת המדיניות')} · <b class="num">${p}</b></span><span><i class="b"></i>${T('עמדות מאושרות')} · <b class="num">${a}</b></span></div>
    <div class="mut" style="font-size:12px;margin-top:4px">${TF('היחידה כאן היא עמדה, לא סעיף: {r} סעיפי מדיניות, {p} עמדות. סעיף נחשב מאושר רק כשכל העמדות בו אושרו.',{r:rulesOf().length,p:p})}</div></div>`;
}

function freshHtml(){
  const iso=String(D.meta.updated||D.meta.created||''), mm=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); if(!mm) return '';
  let x=''; try{ x=localStorage.getItem(LS_FRESH)||''; }catch(e){}
  if(x===(S.pb||'')+'|'+iso) return '';
  const d=new Date(+mm[1],+mm[2]-1,+mm[3]), days=Math.max(0,Math.floor((Date.now()-d.getTime())/864e5)), months=Math.floor(days/30);
  const age=months>=1?(months===1?T('עודכן לפני חודש'):TF('עודכן לפני {n} חודשים',{n:months}))
    :days>1?TF('עודכן לפני {n} ימים',{n:days}):days===1?T('עודכן אתמול'):T('עודכן היום');
  const st=corpusStatus(), drafts=st!=='signed'&&st!=='theirs_paper', stale=months>=3;
  if(!stale) return '';   // אזהרת הטיוטות כבר מוצגת פעם אחת בראש הדף, ובתיבה הזאת היא הייתה כפולה
  const why=stale?T('כדאי לעדכן'):drafts?T('כדאי לעדכן כשיהיו לכם הסכמים חתומים'):T('מעודכן');
  const reason=stale?T('אם הוספתם הסכמים מאז, המדיניות עוד לא למדה מהם.')
    :drafts?T('המדיניות נבנתה מנוסחים ולא מהסכמים חתומים. הסכמים חתומים יחזקו אותה.')
    :T('המדיניות נבנתה מההסכמים שהיו בתיקייה ביום הבנייה.');
  return `<div class="fresh${stale||drafts?'':' ok'}" role="status">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2"/></svg>
    <div class="tx"><b>${age} · ${why}</b><br><span>${reason}</span></div>
    ${stale||drafts?`<span class="mut" style="font-size:12px">${T('בקשת העדכון נמצאת בכפתור בראש הדף.')}</span>`:''}
    <button class="btn ghost sm" onclick="freshX()">${T('לא עכשיו')}</button></div>`;
}

/* ---------- שאלו את המדיניות: חיפוש בטקסט של המדיניות, בלי מודל שפה ובלי רשת.
   התשובה פותחת בכן או לא כשאפשר להכריע (כמות בשאלה מול הגבולות שבעמדות), ותמיד מציגה את שלוש העמדות:
   המועדפת, מה שאפשר לוותר עליו, והקו האדום. כשאין עמדה בנושא היא אומרת זאת במפורש ---------- */
const ASK={q:'',html:'',cp:''};
const HEBRE=/[֐-׿]/;
/* מילון קטן של מושגי חוזים בשתי השפות: כל שורה היא מושג אחד. שאלה באנגלית מוצאת עמדה שנכתבה בעברית, ולהפך.
   הוא כללי לכל סוג הסכם ואינו מניח ענף. מילים נטויות (פינוי, לפנות, פונה) מגיעות מהגזעים שנגזרים מכל מילה */
const ASK_LEX=[
  ['liability','liable','unlimited','cap','caps','damages','אחריות','חבות','תקרה','תקרת','נזק','נזקים'],
  ['indemnity','indemnify','indemnification','שיפוי','לשפות'],

  ['discount','rebate','refund','credit','הנחה','החזר','זיכוי','הנחות'],
  ['interest','late','overdue','ריבית','פיגור','פיגורים','איחור'],
  ['privacy','personal','פרטיות','אישי','אישיים'],
  ['data','information','מידע','נתונים','נתוני'],
  ['breach','incident','leak','הפרה','הפרת','אירוע','דליפה'],
  ['notice','notify','notification','הודעה','להודיע','דיווח','התראה'],
  ['security','secure','אבטחה','אבטחת'],
  ['subprocessor','subprocessors','subcontractor','subcontractors','subcontract','מעבד','מעבדי','קבלן','קבלני','משנה'],
  ['abroad','cross-border','international','outside','לחו"ל','מחוץ','חוץ'],
  ['assignment','assign','transfer','transferring','המחאה','להמחות','העברת','העברה','להעביר'],
  ['insurance','insure','insured','ביטוח','פוליסה'],
  ['guarantee','deposit','bond','collateral','ערבות','ערבויות','פיקדון','בטוחה','בטחונות'],
  ['law','governing','jurisdiction','court','courts','venue','arbitration','דין','סמכות','שיפוט','בוררות','משפט'],
  ['intellectual','ip','ownership','owns','קניין','רוחני','בעלות'],
  ['availability','uptime','sla','זמינות','רמת','רמות'],
  ['support','maintenance','repairs','repair','תמיכה','תחזוקה','תיקונים','תיקון'],
  ['competition','non-compete','exclusivity','exclusive','תחרות','בלעדיות','בלעדי'],
  ['ai','artificial','training','train','בינה','מלאכותית','אימון'],
  ['deletion','delete','return','מחיקה','מחיקת','למחוק','החזרה'],
  ['majeure','force','כוח','עליון'],
  ['indexation','index','indexed','cpi','linkage','increase','raise','raised','escalation','הצמדה','הצמדת','מדד','העלאה','העלאת','להעלות'],
  ['entry','enter','access','כניסה','כניסת','גישה','להיכנס'],
  ['penalty','liquidated','פיצוי','פיצויים','מוסכם','קנס'],
  ['warranty','warranties','representations','representation','מצגים','הצהרות'],
  ['term','duration','period','תקופה','תקופת','משך'],
  ['unilateral','unilaterally','חד-צדדי','בלעדית'],
  ['change','amend','amendment','modify','modification','שינוי','לשנות','עדכון','לעדכן']];
/* מילים שאינן נושא: הן מופיעות בכל שאלה ובכל עמדה, ולכן אינן מעידות על התאמה */
const ASK_STOP=new Set(('the a an and or to of in on for with at by from our we us they their them is are be can may '
  +'want wants allowed allow does do what how much many other side customer supplier vendor provider party parties '
  +'agreement contract clause that this it if will would should there any about ask asks need needs our ours your '
  +'accept agree agreed require requires required asking could must have has get got '
  +'הצד השני רוצה רוצים מותר אפשר האם שלנו אנחנו אנו לנו הם של את על עם זה זו זאת הסכם ההסכם סעיף לקוח ספק '
  +'another new without within permitted possible position policy '
  +'מה איך כמה יכול יכולים מבקש מבקשים לבצע צריך צריכים או גם כל אם יש אין אחר אחרת אחרים חדש בלי '
  +'עמדה עמדתנו מדיניות אותנו אותי לפני אחרי כך כמו לקבל דורשים דורש לדרוש מסכימים להסכים לאשר מבקשת מבקשות').split(' '));
/* צורות של מילה: כמו שהיא, בלי תחילית (ו, ה, ב, ל, מ, ש, כ, וגם שתיים ברצף), בלי סיומת (ים, ות, ית, ה, ת, י, ו, ן),
   ובאנגלית בלי s, es, ed, ing, ion. גזעים של פחות משלוש אותיות נזרקים */
const ASK_PRE=/^(?:וה|שה|כש|מה|ול|וב|ומ|לה|בה|שנ|שי|שת|[והבלמשכנ])(?=[֐-׿]{3,})/;
const ASK_SUF=['יות','ים','ות','ין','ית','יה','ה','ת','י','ו','ן','ך'];
function askVariants(w){
  const out=new Set([w]);
  if(HEBRE.test(w)){
    const m=ASK_PRE.exec(w); if(m) out.add(w.slice(m[0].length));   /* תחילית אחת (או צירוף כמו וה, כש, מה): שתי אותיות בודדות ברצף חותכות שורש */
    [...out].forEach(x=>ASK_SUF.forEach(sf=>{ if(x.length-sf.length>=3&&x.endsWith(sf)) out.add(x.slice(0,-sf.length)); }));
  } else {
    ['ies','ing','ed','es','s','ions','ion','ly'].forEach(sf=>{ if(w.length-sf.length>=4&&w.endsWith(sf)) out.add(sf==='ies'?w.slice(0,-3)+'y':w.slice(0,-sf.length)); });
  }
  return [...out];
}
function askWords(s){ const out=[];
  (String(s||'').toLowerCase().match(/[֐-׿a-z0-9"'״׳\-]+/g)||[]).forEach(w0=>{
    const w=w0.replace(/["'״׳]/g,'').replace(/^-+|-+$/g,'');
    if(w.length<2||ASK_STOP.has(w)||/^\d+$/.test(w)) return;
    const g=askVariants(w).filter(v=>!ASK_STOP.has(v)); if(g.length) out.push(g); });
  return out; }
function askToks(s){ return [].concat(...askWords(s)); }
/* שתי מילים תואמות כשהן זהות, או כשאחת היא תחילתה של השנייה ושתיהן בנות 4 אותיות לפחות (liabilit / liability) */
function askSame(a,b){ return a===b || (a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a))); }
/* התאמה ישירה של מילה: 4 אותיות לפחות, או גזע עברי בן שלוש אותיות שזהה בדיוק. מונחים קצרים (SLA, AI) נתפסים דרך המילון */
function askHit(w,toks){ return (w.length>=4||(w.length===3&&HEBRE.test(w))) && toks.some(t=>askSame(w,t)); }
const ASK_LEXV=ASK_LEX.map(row=>[].concat(...row.map(w=>askToks(w))));
function askConcepts(toks){ const out=new Set();
  ASK_LEXV.forEach((row,i)=>{ if(toks.some(t=>row.some(w=>askSame(t,w)))) out.add(i); });
  return out; }
/* האינדקס של סעיף: שם הנושא (המשקל הגבוה), הסוגיה, ושאר הטקסט בשתי השפות: הנימוק, הצד שכנגד, העמדות והנוסח */
function askIndex(r){
  const top=askToks([r.topic,r.topic_en].join(' ')), head=askToks([r.topic,r.topic_en,r.issue].join(' '));
  const body=askToks([r.why,r.they,r.clause,r.clause_en].concat(['green','yellow','red'].map(k=>{ const t=(r.tl||{})[k]||{};
    return (t.pos||'')+' '+(t.clause||''); })).join(' '));
  return {top:top, head:head, body:body, tc:askConcepts(top), hc:askConcepts(head), bc:askConcepts(body)};
}
/* ---- כמויות: "12 חודשים", "10%", "פי 2", "עד 3%". כל כמות היא {n, unit, cmp}; cmp הוא eq, le, ge, lt או gt ---- */
const ASK_UNITS=[['month',/^(months?|חודש|חודשים|חודשי|חודשיים)$/],['day',/^(days?|ימים|יום|ימי|business)$/],
  ['hour',/^(hours?|שעות|שעה|שעתיים)$/],['year',/^(years?|שנים|שנה|שנתי|שנות)$/],['pct',/^(%|percent|percentage|אחוז|אחוזים)$/],
  ['x',/^(x|×|times|פי)$/],['usd',/^(\$|usd|dollars?|דולר|דולרים)$/],['ils',/^(₪|ils|nis|שקל|שקלים|שח)$/],['week',/^(weeks?|שבועות|שבוע)$/]];
const ASK_CMP=[['lt',/(?:less than|lower than|below|under|shorter than|fewer than|פחות מ|מתחת ל|נמוכ\S* מ|קצר\S* מ|קטנ\S* מ)\s*$/],
  ['gt',/(?:more than|greater than|higher than|longer than|over|above|exceed\S*|יותר מ|מעל|גבוה\S* מ|ארוכ\S* מ|גדול\S* מ|חורג\S* מ)\s*$/],
  ['le',/(?:up to|at most|no more than|maximum|max|capped at|not more than|עד|לכל היותר|לא יותר מ|מקסימום|תקרה של|תקרת)\s*$/],
  ['ge',/(?:at least|no less than|minimum|min|not less than|לפחות|לא פחות מ|מינימום|החל מ)\s*$/]];
/* מספרים במילים ("שלושה חודשים", "six months") הופכים לספרות לפני הניתוח */
const ASK_NUMW={'אחד':1,'אחת':1,'שני':2,'שתי':2,'שתיים':2,'שניים':2,'שלוש':3,'שלושה':3,'ארבע':4,'ארבעה':4,'חמש':5,'חמישה':5,'שש':6,'שישה':6,'שבע':7,'שבעה':7,'שמונה':8,'תשע':9,'תשעה':9,'עשר':10,'עשרה':10,
  'one':1,'two':2,'three':3,'four':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10,'twelve':12};
function askDigits(t){ return t.replace(/(?<![֐-׿a-z])([֐-׿]+|[a-z]+)(?=\s+(?:months?|days?|weeks?|years?|hours?|חודש|ימים|יום|שבוע|שנה|שנים|שעות|פי|אחוז))/g,(m,w)=>ASK_NUMW[w]!=null?String(ASK_NUMW[w])
    :(/^[מלבוהכש]/.test(w)&&ASK_NUMW[w.slice(1)]!=null&&/[֐-׿]/.test(w))?w[0]+' '+ASK_NUMW[w.slice(1)]:m); }
function askNums(text){
  const t=askDigits(String(text||'').toLowerCase()).replace(/(\d),(?=\d{3}\b)/g,'$1'), out=[];
  const re=/(\d+(?:\.\d+)?)\s*(%|₪|\$|[a-z֐-׿×]+)?/g; let m;
  while((m=re.exec(t))){
    const n=parseFloat(m[1]), after=(m[2]||'').replace(/['"׳״]/g,''), before=t.slice(Math.max(0,m.index-28),m.index);
    let unit='';
    for(const [u,rx] of ASK_UNITS){ if(rx.test(after)){ unit=u; break; } }
    const pre=(/(פי|x|×|\$|₪)\s*$/.exec(before)||[])[1];
    if(!unit&&pre) unit=pre==='$'?'usd':pre==='₪'?'ils':'x';
    const bare=before.replace(/(פי|x|×|\$|₪)\s*$/,'');
    let cmp='eq'; for(const [c,rx] of ASK_CMP){ if(rx.test(bare)){ cmp=c; break; } }
    /* עוגן: המילים שליד הכמות. כמות בשאלה תואמת כמות בעמדה רק כשהן עוסקות באותו דבר ("הודעה של 6 חודשים" אינה "יציאה אחרי 6 חודשים") */
    const endI=m.index+m[0].length;
    const ctx=askToks(t.slice(Math.max(0,m.index-34),m.index)+' '+t.slice(endI,endI+26))
      .filter(x=>x.length>=3&&!ASK_NOANCHOR.has(x)&&!ASK_UNITS.some(u=>u[1].test(x)));
    out.push({n:n,unit:unit,cmp:cmp,ctx:ctx,ctxc:askConcepts(ctx)});
  }

}
const ASK_NOANCHOR=new Set('עד לפחות מינימום מקסימום מעל פחות יותר לכל היותר least most than less more over under below above max min after before within אחרי לפני תוך'.split(' '));
function askFits(q,p){ if(q.unit!==p.unit) return false;
  /* אותו דבר: מילה משותפת, או מושג משותף במילון (ערבות / guarantee) */
  if(!(q.ctx.some(a=>p.ctx.some(b=>askSame(a,b)))||[...q.ctxc].some(c=>p.ctxc.has(c)))) return false;
  return p.cmp==='eq'?q.n===p.n:p.cmp==='le'?q.n<=p.n:p.cmp==='ge'?q.n>=p.n:p.cmp==='lt'?q.n<p.n:q.n>p.n; }
/* פסק דין: האדום קודם (אם הכמות בשאלה בטווח שהאדום אוסר, התשובה היא לא), אחריו הצהוב (כן, כפשרה), אחריו הירוק (כן).
   בלי כמות בשאלה, או כשאף עמדה אינה מזכירה אותה ביחידה הזאת: אין פסק דין, ולא מנחשים */
function askVerdict(r,q,qw,qc){
  const qs=askNums(q).filter(x=>x.unit); if(!qs.length) return null;
  /* כמות בעמדה נספרת רק במשפט שעוסק בנושא השאלה (מילה או מושג משותפים), כדי ש-10% של דמי ניהול לא יענה על שאלה על העלאת שכר דירה */
  const about=t=>{ const w=askWords(t), tk=[].concat(...w); return qw.some(g=>askHit(g[0],tk)||g.some(v=>askHit(v,tk))) || [...askConcepts(tk)].some(c=>qc.has(c)); };
  const nums=k=>String(((r.tl||{})[k]||{}).pos||'').split(/(?<=[.;:!?])\s+|\n/).filter(about).reduce((a,t)=>a.concat(askNums(t)),[]);
  const fits=k=>nums(k).some(p=>qs.some(x=>askFits(x,p)));
  const has=k=>nums(k).some(p=>qs.some(x=>x.unit===p.unit));
  if(!['red','yellow','green'].some(has)) return null;
  if(fits('red')) return 'no'; if(fits('yellow')) return 'fallback'; if(fits('green')) return 'yes';
  return null;
}
/* ביטויים שפירושם מושג אחד ("לפני הזמן" = מוקדם) */
const ASK_PHRASES=[[/לפני הזמן|לפני תום|לפני סוף|לפני תקופת|לפני המועד|before the end|ahead of time|before expiry|before it expires|before the term/gi,' מוקדם early '],
  [/סיום ההסכם|לסיים את ההסכם|end the agreement|end of the agreement/gi,' סיום termination ']];
function askPhrases(q){ let t=String(q||''); ASK_PHRASES.forEach(([rx,to])=>{ t=t.replace(rx,to); }); return t; }
function askAnswer(q){
  /* כל מילה בשאלה נספרת פעם אחת, גם כשהיא נמצאה בכמה צורות */
  q=askPhrases(q);
  const qw=askWords(q), qt=[].concat(...qw), qc=askConcepts(qt), rs=rulesOf();
  if(!qt.length) return [];
  const ix=rs.map(askIndex);
  /* מילה או מושג שמופיעים בשמות של הרבה נושאים (מילה שמופיעה בשם הסוג עצמו) אינם
     מבחינים בין סעיפים, ולכן משקלם נמוך */
  const many=Math.max(2,rs.length*0.2);
  const common=new Set([...qc].filter(c=>ix.filter(x=>x.tc.has(c)).length>many));
  const hitG=(g,toks)=>g.some(w=>askHit(w,toks));
  const weak=new Set(qw.filter(g=>ix.filter(x=>hitG(g,x.top)).length>=Math.max(3,rs.length*0.1)));
  const sc=rs.map((r,i)=>{ const x=ix[i]; let head=0, body=0;
    qw.forEach(g=>{ const wk=weak.has(g);
      if(hitG(g,x.top)) head+=wk?1:4; else if(hitG(g,x.head)) head+=wk?1:2; else if(hitG(g,x.body)) body+=1; });
    qc.forEach(c=>{ const wgt=common.has(c)?1:2; if(x.tc.has(c)) head+=2*wgt; else if(x.hc.has(c)) head+=wgt;
      else if(x.bc.has(c)) body+=1; });
    return {r:r, head:head, s:head+body}; })
    /* שער רלוונטיות: התאמה בנושא או בסוגיה של הסעיף עצמו, ולא רק מילה בטקסט שלו */
    .filter(x=>x.head>=4).sort((a,b)=>b.s-a.s);
  const best=sc.length?sc[0].s:0;
  return sc.filter(x=>x.s>=Math.max(4,best*.6)).slice(0,3).map(({r},i)=>{
    const tl=r.tl||{}, ks=['green','yellow','red'];
    const appr=ks.filter(k=>tl[k]&&tl[k].pos&&tl[k].approved===true).length, have=ks.filter(k=>tl[k]&&tl[k].pos).length;
    return {r:r, verdict:i===0?askVerdict(r,q,qw,qc):null, approved:appr, have:have, all:have>0&&appr===have};
  });
}
/* בדף באנגלית, טקסט שנכתב בעברית ואין לו גרסה באנגלית מסומן "Hebrew source" */
function srcTag(s){ return (LANG==='en'&&HEBRE.test(String(s||'')))?` <span class="hsrc" title="${ea(T('הטקסט נכתב בעברית. אין לו גרסה באנגלית בפלייבוק.'))}">${T('מקור בעברית')}</span>`:''; }
function askTier(r,k){
  const l=(r.tl||{})[k]||{}, lab={green:T('העמדה שלנו'),yellow:T('אפשר להתגמש'),red:T('כאן עוצרים')}[k];
  const sub={green:T('נקודת הפתיחה שלנו'),yellow:T('עד כאן אפשר לוותר'),red:T('הקו האדום')}[k];
  const posD=k==='red'&&l.pos_dup;
  const body=l.pos&&!posD?`<span dir="auto">${esc(l.pos)}</span>${srcTag(l.pos)}`:`<span class="mut">${k==='red'?T('בפלייבוק אין קו אדום נפרד בנושא הזה.'):T('בפלייבוק אין עמדה מוגדרת כאן.')}</span>`;
  const note=k==='yellow'&&l.comments?`<div class="mut" style="margin-top:3px;font-size:13px" dir="auto">${esc(l.comments)}</div>`:'';
  const st=l.pos&&l.approved!==true?` <span class="chip line">${T('טיוטה')}</span>`:'';

}

function askSet(q){ const el=document.getElementById('askq'); if(el) el.value=q; ASK.q=q; askRun(); }
function askRun(){
  const el=document.getElementById('askq'), q=String((el&&el.value)||'').trim(), out=document.getElementById('askout');
  ASK.q=q; if(!out) return;
  if(!q){ if(el) el.focus(); return; }
  const res=askAnswer(q);
  if(!res.length){
    /* אין עמדה בנושא: אומרים זאת בפשטות, ולא מציגים עמדות לא קשורות */
    ASK.html=`<p class="finding">${T('אין במדיניות <b>עמדה בנושא הזה</b>.')}</p><p class="mut" style="margin:0 0 8px">${T("אין כאן תשובה, ולכן אין להסתמך על המדיניות בנושא הזה. אפשר לנסח את השאלה במילים אחרות, או להעתיק אותה לצ'אט ולבקש עמדה מעורך הדין.")}</p>`;
    out.innerHTML=ASK.html; return; }

  const head=res.length===1?T('מצאנו <b>נושא אחד</b> שקשור לשאלה.'):TF('מצאנו <b>{n}</b> נושאים שקשורים לשאלה.',{n:res.length});

    <div class="ans">${res.map(x=>{ const v=x.verdict?VW[x.verdict]:null, r=x.r;
      const vtxt=!v?T('אין כן או לא פשוט: התשובה תלויה במה בדיוק מבקשים. אלה הגבולות במדיניות.')
        :x.verdict==='yes'?T('הכמות שבשאלה היא העמדה המועדפת שלנו.')
        :x.verdict==='fallback'?T('זה מעבר לעמדה המועדפת. מסכימים רק כפשרה, במסגרת מה שמופיע באפשר להתגמש.')
        :T('זה בתוך הקו האדום. לא מסכימים.');
      const draft=!x.all?`<p class="mut" style="margin:8px 0 0">${x.approved?TF('{a} מתוך {h} העמדות בנושא אושרו.',{a:x.approved,h:x.have}):T('העמדות בנושא הזה עוד לא אושרו.')} ${T('לפני שמתחייבים, בדקו עם המחלקה המשפטית.')}</p>`:'';
      return `<div class="card"><div class="hd"><b><bdi>${esc(rnum(r.id))} · ${esc(r.topic)}</bdi></b>${srcTag(r.topic)}
        ${walkChip(r)}${concernChip(r)}</div>
        <p style="margin:8px 0 10px;font-size:15px">${v?`<span class="chip ${v[1]}">${mk(v[1])}${v[0]}</span> `:''}<span>${vtxt}</span></p>
        ${['green','yellow','red'].map(k=>askTier(r,k)).join('')}
        ${draft}
        <div style="margin-top:8px"><button class="btn ghost sm" onclick="askOpen('${ea(r.id)}')">${T('לפתיחת הסעיף')}</button></div></div>`; }).join('')}</div>`;
  out.innerHTML=ASK.html;
}

  const head=`<div></div>`+rs.map(r=>`<button class="ch" title="${ea(rnum(r.id)+' · '+r.topic)}" onclick="cmpSet('rule','${r.id}')"><bdi>${esc(String(rnum(r.id)).slice(0,3))}</bdi></button>`).join('');

    <div class="mxwrap"><div class="mx" style="grid-template-columns:minmax(90px,150px) repeat(${rs.length},16px)" onclick="mxClick(event)">${head}${rows}</div></div>
    <div class="mxlg">${['g','y','r','u','m'].map(k=>`<span><span class="mx" style="display:inline"><span class="c ${k}"><i></i></span></span>${word[k]}</span>`).join('')}</div>
    <p class="mut" style="margin:8px 0 0;font-size:12px">${T('לחיצה על נקודה או על מספר נושא פותחת את ההשוואה בנושא הזה.')}</p></div>`;
}
function mxClick(e){ const t=e.target&&e.target.closest&&e.target.closest('[data-r]'); if(t) cmpSet('rule',t.dataset.r); }

/* ============ boot ============ */
function boot(){
  if(!S.initCollapsed){ S.collapsed={};
    (D.rules||[]).forEach(function(r){ S.collapsed[r.id]=1; });
    S.initCollapsed=1; }

  const comp=D.meta.company||'';
  document.getElementById('brandDot').textContent='A';
  document.getElementById('brandName').textContent='Areo';
  document.getElementById('brandSub').textContent=(comp?comp+' · ':'')+T('מדיניות חוזית · עדכון אחרון ')+heDate(D.meta.updated||D.meta.created);
  document.getElementById('sidefoot').innerHTML=T('מבוסס על ')+srcKeys().length+T(' מסמכים ו-')+D.cites.length+
    T(' ציטוטים.<br>')+(regState()==='Completed'?T('בוצע מחקר רגולטורי מעמיק.'):regState()==='Partial'?T('מחקר רגולטורי חלקי.'):T('לא בוצע מחקר רגולטורי מעמיק.'))+'';
  render();
}
const _r=render; render=function(){ _r();
  /* תמונת מצב היא מסך של כל החברה, ולכן אין מעליה בורר של סוג הסכם אחד.
     ההחלפה שם נעשית בתוך כרטיס סוג ההסכם. */
  const pbb=document.getElementById('pbbar');
  if(pbb){ pbb.innerHTML = (S.view==='overview' ? '' : pbSwitch()) + hebBanner() + basisBar(); } if(S.view==='rules') renderList(); if(S.view==='overview') setTimeout(drawCharts,40);
  if(S.view==='export'){ drawTune(); }
  if(S.view==='approve'){ const f=document.getElementById('wizFrame'); if(f&&D.meta.wizard_doc&&!f.srcdoc) f.srcdoc=D.meta.wizard_doc; }
  drawTopActs(); };
/* מכאן לשינוי: האשף של הסוג שנבחר, או בקשת עדכון לצ'אט. הדף עצמו אינו
   משנה דבר (wizard_spec.md, "כניסה ויציאה"). דף אינו יכול להפעיל את
   הצ'אט, ולכן בקשת העדכון היא משפט שמועתק ומודבק שם. */
/* דף באנגלית שהתוכן שלו נכתב בעברית: אומרים זאת פעם אחת בראש הדף, וליד כל נושא ועמדה יש תווית "מקור בעברית" */
function hebBanner(){
  if(LANG!=='en') return '';
  const rs=rulesOf(), n=rs.filter(r=>HEBRE.test(String(r.topic||'')+String((r.tl&&r.tl.green&&r.tl.green.pos)||''))).length;
  if(!n) return '';
  return `<div class="card pad hsbanner" role="note"><span class="hsrc" style="margin:0">${T('מקור בעברית')}</span> <span>${T('נושאי המדיניות, העמדות והנימוקים נכתבו בעברית, ואין להם גרסה באנגלית בפלייבוק. כל השאר בדף באנגלית.')}</span></div>`;
}
function drawTopActs(){
  const el=document.getElementById('topActs'); if(!el) return;
  const ask=updAsk();
  const wiz=D.meta.wizard_href, word=D.meta.word_href;
  el.innerHTML=(wiz?`<button class="btn acc sm" type="button" onclick="goApprove()">${T("הכרעה ואישור")}</button>`:'')
    +(word?`<a class="btn ghost sm" style="text-decoration:none" href="${esc(word)}" target="_blank" rel="noopener" title="${T("מסמך הפלייבוק המלא, לצד סביבת העבודה")}">${T("מסמך הפלייבוק (Word)")}</a>`:'')
    +`<button class="btn ghost sm" data-c="${esc(ask)}" onclick="copyAsk(this.dataset.c)" title="${T("מעתיק הנחיה מלאה להדבקה בצ'אט, לבנייה מחדש של הסוג הזה")}">${T("העתקת בקשת עדכון לצ'אט")}</button>`
    +`<div id="askBox" class="mut" style="display:none;flex-basis:100%;margin-top:6px"></div>`;
}
/* הדף אינו יכול להפעיל את הצ'אט: הבקשה מועתקת ומוצגת גם כטקסט, כדי שאפשר יהיה לסמן ולהעתיק אותה כשהלוח חסום */
function copyAsk(t){
  const box=document.getElementById('askBox');
  const show=ok=>{ if(!box) return; box.style.display='block';
    box.innerHTML=(ok?T("הבקשה הועתקה. הדביקו אותה בצ'אט:"):T("ההעתקה נחסמה. סמנו את הבקשה, העתיקו והדביקו בצ'אט:"))
      +` <b style="user-select:all">${esc(t)}</b>`; };
  try{ navigator.clipboard.writeText(t).then(()=>{ toast(T('הבקשה הועתקה')); show(true); }).catch(()=>show(false)); }
  catch(e){ show(false); }
}
clientTheme(D);   /* before the first paint, so the page never shows the default colours first */
clientBrand(D);
boot();
/* המאגר נדלק אחרי שהדף כבר מצויר: אם אין מאגר, לא קרה דבר והדף עובד כרגיל. */
initDB();

/* Client brand colours: tokens checked by the setup script (contrast 4.5:1), carried on the payload.
   Anything that is not a plain #RRGGBB value leaves the standard design in place. */
function clientTheme(X){
  try{
    var t = ((X && X.meta) || {}).branding, ok = /^#[0-9A-Fa-f]{6}$/;
    t = t && t.theme;
    if (!t) return;
    var m = {'--cb-l':t.primary_light, '--cb-l2':t.secondary_light, '--cb-lsoft':t.soft_light, '--cb-on-l':t.on_light,
             '--cb-d':t.primary_dark, '--cb-d2':t.secondary_dark, '--cb-dsoft':t.soft_dark, '--cb-on-d':t.on_dark};
    for (var k in m) { if (!ok.test(m[k] || '')) return; }
    var r = document.documentElement;
    for (var k2 in m) r.style.setProperty(k2, m[k2]);
    r.setAttribute('data-brand', 'client');
  }catch(e){}
}

/* Closed brand-token override (lib/common/brand_tokens.py): applied only when the payload carries it; otherwise nothing changes */
function clientBrand(X){
  try{
    var c=(((X&&X.meta)||{}).branding||{}).css;
    if(typeof c!=="string"||!c.replace(/\s/g,"")) return;
    if(document.getElementById("client-brand")) return;
    var st=document.createElement("style"); st.id="client-brand"; st.textContent=c;
    document.head.appendChild(st);
    var n=(((X&&X.meta)||{}).branding||{}).notice, bar=document.getElementById("pbbar");
    if(n&&bar&&!document.getElementById("brandNotice")){ var p=document.createElement("div"); p.id="brandNotice"; p.className="wrap"; p.style.paddingBottom="0"; p.innerHTML='<div class="alert y" role="status"></div>'; p.firstChild.textContent=String(n); bar.parentNode.insertBefore(p,bar); }
  }catch(e){}
}

/* Client logo: a data URI carried on the payload, so the page stays
   self-contained and the CSP never sees an external request. */
(function clientLogo(){
  try{
    var src = ((D.meta || {}).branding || {}).logo;
    if (!src) return;                        // skipped at setup: render as before
    var el = document.getElementById('clientLogo');
    if (!el) return;
    el.src = src;
    el.alt = ((D.meta || {}).company) || '';
    el.classList.add('on');
  }catch(e){}
})();
</script>
<script>
/* AREO-FX:BEGIN מנוע האפקטים של Areo: זהה בייט לבייט בכל התבניות. מפעיל את האפקטים שה-KIT מגדיר:
   אורורה מאחורי כל .hero, כניסה מדורגת לכרטיסים, מונים מתגלגלים, הקלדה, אדווה בלחיצה, זרקור, כפתור מגנטי.
   שקט לגמרי כשהמשתמש ביקש פחות תנועה, ולעולם לא משאיר תוכן שקוף (גיבוי בטיימר). */
